<!DOCTYPE HTML>
<html>
	<head>
		<title>bioCultura - Observatório da Energia</title>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale, user-scalable=no" />
		<link rel="stylesheet" href="/assets/css/main.css" />
		<style>
            /* --- ESTRUTURA GLOBAL --- */
            body, input, select, textarea { font-family: 'Source Sans Pro', sans-serif !important; color: #444; }
			section, #header, hr, .major { border: none !important; box-shadow: none !important; padding: 0 !important; }
            section { min-height: 100vh; display: flex; flex-direction: column; }
            #sidebar { position: fixed !important; top: 0; left: 0; height: 100vh !important; width: 18em !important; overflow: hidden !important; z-index: 10000; background: #fff; border-right: 1px solid #f2f2f2 !important; }
            #wrapper { padding-left: 18em !important; }
            .inner { padding: 2.2em 4em 0 4em !important; max-width: 1600px !important; margin: 0 auto; width: 100%; }

            /* HERO & TITULOS */
            .category-label { font-size: 0.65em; font-weight: 900; text-transform: uppercase; letter-spacing: 4px; color: #bbb; margin-bottom: 15px; display: block; }
            .hero-split { display: flex; align-items: flex-start; justify-content: space-between; gap: 4em; margin-bottom: 2em; }
            .hero-text { flex: 1.5; text-align: left; padding-top: 5px; } 
            .hero-text h1 { font-size: 4em; font-weight: 900; color: #1a1a1a; letter-spacing: -2.5px; line-height: 0.95; margin: 0; }
            
            .region-header { font-size: 0.7em; font-weight: 900; text-transform: uppercase; letter-spacing: 2px; color: #2e7d32; margin: 30px 0 5px 0; display: block; }
            .national-link { color: #bbb; cursor: pointer; font-weight: 400; font-size: 0.85em; display: block; text-transform: lowercase; letter-spacing: 1px; width: fit-content; border-bottom: 1px solid transparent; }
            .national-link:hover { color: #2e7d32; border-bottom-color: #eee; }

            /* CAROUSEL SMOOTH */
            .hero-visual { flex: 1; display: flex; justify-content: flex-end; }
            .hero-globe { position: relative; width: 480px; height: 480px; border-radius: 50%; overflow: hidden; box-shadow: 0 40px 100px rgba(0,0,0,0.12); background: #1a1a1a; }
            .hero-globe img { position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; transition: opacity 2s ease-in-out; opacity: 0; }
            .hero-globe img.active { opacity: 1; }

            /* MIX ENERGÉTICO COMPACTO */
            .energy-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 20px 40px; margin-bottom: 40px; }
            .energy-item { margin-bottom: 5px; }
            .energy-info { display: flex; justify-content: space-between; align-items: flex-end; margin-bottom: 6px; }
            .energy-info b { font-size: 0.8em; color: #1a1a1a; text-transform: uppercase; letter-spacing: 1px; }
            .energy-bar-bg { height: 4px; width: 100%; background: #eee; border-radius: 10px; position: relative; overflow: hidden; }
            .energy-bar-fill { height: 100%; position: absolute; left: 0; top: 0; border-radius: 10px; transition: width 1.5s ease-in-out; }

            /* SECÇÕES DINÂMICAS */
            .data-row { display: block; padding: 2.5em 0; border-bottom: 1px solid #f2f2f2; }
            .data-row h4 { font-size: 0.7em; font-weight: 900; text-transform: uppercase; letter-spacing: 2px; color: #2e7d32; margin: 0 0 25px 0; display: block; }
            
            /* CENTRAIS */
            .plant-item { display: flex; justify-content: space-between; align-items: center; padding: 15px 0; }
            .plant-main { display: flex; flex-direction: column; gap: 3px; }
            .plant-name { font-weight: 700; color: #1a1a1a; font-size: 1em; }
            .plant-power-inline { font-size: 0.85em; color: #2e7d32; font-weight: 800; margin-left: 10px; }
            .plant-coords { font-family: 'Courier New', Courier, monospace; font-size: 0.75em; color: #888; background: #f5f5f5; padding: 2px 8px; border-radius: 4px; width: fit-content; }
            .plant-type-tag { font-size: 0.65em; font-weight: 800; color: #bbb; text-transform: uppercase; letter-spacing: 1px; }
            
            .btn-toggle-detail { color: #2e7d32; cursor: pointer; font-weight: 800; margin-left: 10px; font-size: 0.9em; }
            .plant-detail-content { display: none; background: #fcfcfc; border-left: 2px solid #2e7d32; padding: 25px; margin: 15px 0; font-size: 0.85em; color: #555; line-height: 1.6; }

            /* RELATÓRIOS */
            .report-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 40px; }
            .report-item { border-top: 1px solid #f9f9f9; padding-top: 20px; }
            .report-item h5 { font-size: 0.75em; font-weight: 900; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 12px; color: #2e7d32; }
            .report-item p { font-size: 0.95em; line-height: 1.7; color: #666; margin-bottom: 15px; text-align: justify; }

            /* NOTÍCIAS */
            .news-header { margin-top: 4em; display: block; font-size: 0.65em; font-weight: 900; text-transform: uppercase; letter-spacing: 4px; color: #bbb; margin-bottom: 20px; }
            .news-list { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 30px; }
            .news-item { text-decoration: none; color: inherit; display: block; padding: 30px; background: #fdfdfd; border: 1px solid #f2f2f2; border-radius: 16px; transition: all 0.3s; }
            .news-item:hover { transform: translateY(-5px); border-color: #ddd; box-shadow: 0 10px 30px rgba(0,0,0,0.05); }
            .news-item h3 { font-size: 1.15em; font-weight: 700; color: #1a1a1a; margin-bottom: 15px; line-height: 1.3; }
            .news-item p { font-size: 0.9em; color: #666; line-height: 1.6; margin-bottom: 20px; }
            .news-meta { display: flex; align-items: center; gap: 12px; border-top: 1px solid #f2f2f2; padding-top: 15px; }
            .source-logo { width: 20px !important; height: 20px !important; min-width: 20px !important; object-fit: contain !important; filter: grayscale(100%); opacity: 0.6; }
            .news-meta span { font-size: 0.65em; font-weight: 800; color: #bbb; text-transform: uppercase; letter-spacing: 1px; }

            /* BOTÕES */
            .btn-pagination { background: none !important; border: none !important; box-shadow: none !important; color: #bbb !important; font-size: 0.8em; letter-spacing: 3px; cursor: pointer; text-transform: lowercase; margin-top: 2em; padding: 0 !important; }
            .btn-pagination:hover { color: #2e7d32 !important; }

            /* RODAPÉ ALINHADO (PADRÃO OBSERVATÓRIO) */
            .page-footer { margin-top: auto; padding: 4em 0 2.5em 0; border-top: 1px solid #f2f2f2; text-align: right; }
            .footer-logo { display: block; font-size: 0.85em; font-weight: 900; color: #bbb; margin-bottom: 2px; }
            .footer-sub { display: block; font-size: 0.5em; font-weight: 700; text-transform: uppercase; letter-spacing: 1px; color: #bbb; opacity: 0.7; }

            /* SEARCH DROPDOWN */
            .bio-res-item { padding: 12px 18px; font-size: 0.9em; color: #666; cursor: pointer; border-bottom: 1px solid #f9f9f9 !important; }
            .bio-res-item:hover { background: #f9f9f9; }

            @media screen and (max-width: 1280px) {
                #sidebar { position: relative !important; width: 100% !important; height: auto !important; }
                #wrapper { padding-left: 0 !important; }
                .hero-split, .report-grid, .energy-grid { grid-template-columns: 1fr; }
                .hero-globe { width: 350px; height: 350px; margin: 0 auto; }
            }
		</style>
	</head>
	<body class="is-preload">
		<div id="wrapper">
			<div id="main">
                <div class="inner">
                    <section>
                        <!-- 1. HERO -->
                        <div class="hero-split">
                            <div class="hero-text">
                                <span class="category-label">Justiça Climática</span>
                                <h1>Energia: O Motor da Regeneração</h1>
                                
                                <h4 class="region-header">MIX ENERGÉTICO REGIONAL: <span id="reg-name-caps">PORTUGAL</span></h4>
                                <span class="national-link" onclick="resetToNational()">(ver ambito nacional)</span>

                                <div id="energy-dashboard" style="display:block; margin-top:40px;">
                                    <div class="tech-content">
                                        <div id="impact-container" class="energy-grid"></div>
                                    </div>
                                </div>
                            </div>
                            <div class="hero-visual">
                                <div class="hero-globe" id="globe-container"></div>
                            </div>
                        </div>

                        <!-- 2. INFRAESTRUTURA -->
                        <div class="data-row">
                            <h4>Centrais em Proximidade (Ordenadas por GPS)</h4>
                            <div id="plants-list-main"></div>
                            <div style="display: flex; gap: 30px;">
                                <button id="btn-load-more-plants" class="btn-pagination">+ ver mais centrais</button>
                                <button id="btn-collapse-plants" class="btn-pagination" style="display:none;">- fechar lista</button>
                            </div>
                        </div>

                        <!-- 3. EVOLUÇÃO -->
                        <div class="data-row">
                            <h4>Evolução da Matriz Renovável</h4>
                            <div id="report-grid-energy" class="report-grid"></div>
                        </div>

                        <!-- 4. NOTÍCIAS -->
                        <span class="news-header">noticias</span>
                        <div id="noticias-energy-dinamico" class="news-list"></div>
                        <div style="text-align: left; margin-bottom: 4em;">
                            <button id="btn-load-more-energy" class="btn-pagination">ver mais</button>
                        </div>

                        <footer class="page-footer">
                            <span class="footer-logo">bioCultura</span>
                            <span class="footer-sub">Global Regeneration</span>
                        </footer>
					</section>
				</div>
            </div>
			<div id="sidebar"></div>
		</div>

		<script src="/assets/js/jquery.min.js"></script>
        <script>
            let locationsDB = [], noticiasEnergy = [], allPlants = [], visiveisEnergy = 4, visiveisPlants = 3;
            let userCoords = JSON.parse(localStorage.getItem('user_last_coords')) || null;

            const heroImages = [
                "https://images.unsplash.com/photo-1509391366360-2e959784a276?auto=format&fit=crop&w=1024",
                "https://images.unsplash.com/photo-1466611653911-95282fc365d5?auto=format&fit=crop&w=1024",
                "https://images.unsplash.com/photo-1473341304170-971dccb5ac1e?auto=format&fit=crop&w=1024",
                "https://images.unsplash.com/photo-1508514177221-188b1cf16e9d?auto=format&fit=crop&w=1024"
            ];

            const relatoriosEnergiaPositiva = [
                { titulo: "Independência Energética 2030", texto: "Portugal acelera para atingir 85% de energia renovável na matriz total. O foco na eletrificação do consumo industrial e residencial é a chave para a regeneração económica.", fonte: "PNEC 2030 / DGEG" },
                { titulo: "Crescimento do Autoconsumo", texto: "As Unidades de Produção para Autoconsumo (UPAC) cresceram 40% este ano. Cidadãos e empresas tornam-se produtores ativos, reduzindo a pressão sobre a rede nacional.", fonte: "APREN / Portal Energia" },
                { titulo: "O Potencial do Hidrogénio Verde", texto: "A infraestrutura de Sines posiciona Portugal como exportador líquido de energia limpa para a Europa, utilizando excedentes renováveis e água residual tratada.", fonte: "H2 Sines / REN" },
                { titulo: "Regeneração de Ecossistemas", texto: "Novos projetos solares integram agora pastoreio e apicultura (agrivoltaico), provando que a produção de energia pode coexistir e potenciar a biodiversidade local.", fonte: "bioCultura / LNEG" }
            ];

            function getDistance(lat1, lon1, lat2, lon2) {
                if(!lat1 || !lon1 || !lat2 || !lon2) return 9999;
                const R = 6371; 
                const dLat = (lat2 - lat1) * Math.PI / 180;
                const dLon = (lon2 - lon1) * Math.PI / 180;
                const a = Math.sin(dLat/2) * Math.sin(dLat/2) + Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) * Math.sin(dLon/2) * Math.sin(dLon/2);
                return R * (2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a)));
            }

            async function inicializarPagina() {
                try {
                    const [rLoc, rNews] = await Promise.all([
                        fetch('/data/bioregioes.json').then(r => r.json()),
                        fetch('/data/noticias.json').then(r => r.json())
                    ]);
                    locationsDB = rLoc;
                    
                    noticiasEnergy = rNews.filter(n => {
                        const keywords = ['energia', 'solar', 'eolica', 'renovavel', 'transição', 'climatica', 'pszaer'];
                        const text = ((n.categoria || "") + (n.titulo || "")).toLowerCase();
                        return keywords.some(k => text.includes(k));
                    });
                    
                    const savedID = localStorage.getItem('biocultura_region');
                    const info = savedID ? locationsDB.find(i => i.id === savedID) : null;
                    
                    renderDashboard(info);
                    renderizarCardsEnergy();
                    renderRelatorios();
                    initCarousel();
                    setupLocationLogic();
                } catch(e) { console.error("Erro no carregamento:", e); }
            }

            function setupLocationLogic() {
                $(document).on('input', '#loc-search-input', function() {
                    const val = $(this).val().toLowerCase(), dropdown = $('#loc-dropdown').empty();
                    if(val.length < 2) return dropdown.hide();
                    locationsDB.filter(i => i.titulo.toLowerCase().includes(val)).slice(0,5).forEach(m => {
                        $('<div class="bio-res-item"></div>').text(m.titulo).on('click', () => {
                            localStorage.setItem('biocultura_region', m.id);
                            location.reload(); 
                        }).appendTo(dropdown);
                    });
                    dropdown.show();
                });

                $(document).on('click', '#btn-gps-trigger', function() {
                    navigator.geolocation.getCurrentPosition(pos => {
                        userCoords = { lat: pos.coords.latitude, lon: pos.coords.longitude };
                        localStorage.setItem('user_last_coords', JSON.stringify(userCoords));
                        let closest = locationsDB[0], minD = Infinity;
                        locationsDB.forEach(c => {
                            let d = getDistance(userCoords.lat, userCoords.lon, c.lat, c.lon);
                            if(d < minD) { minD = d; closest = c; }
                        });
                        localStorage.setItem('biocultura_region', closest.id);
                        location.reload();
                    });
                });
            }

            function resetToNational() {
                localStorage.removeItem('biocultura_region');
                location.reload();
            }

            function initCarousel() {
                const container = document.getElementById('globe-container');
                heroImages.forEach((src, idx) => {
                    const img = document.createElement('img');
                    img.src = src;
                    if(idx === 0) img.className = 'active';
                    container.appendChild(img);
                });
                let current = 0;
                setInterval(() => {
                    const imgs = container.getElementsByTagName('img');
                    if(!imgs.length) return;
                    imgs[current].classList.remove('active');
                    current = (current + 1) % imgs.length;
                    imgs[current].classList.add('active');
                }, 5000);
            }

            function renderDashboard(info) {
                const container = document.getElementById('impact-container');
                const titleCaps = document.getElementById('reg-name-caps');
                
                const seed = info ? info.id.length : 10;
                const data = info ? info : { titulo: "PORTUGAL" };
                titleCaps.innerText = data.titulo.toUpperCase();

                const mix = [
                    { label: "Solar", val: 25 + (seed % 15), color: "#f1c40f" },
                    { label: "Eólica", val: 35 + (seed % 10), color: "#3498db" },
                    { label: "Hídrica", val: 15 + (seed % 5), color: "#2980b9" },
                    { label: "Biomassa", val: 8 + (seed % 4), color: "#27ae60" },
                    { label: "Hidrogénio", val: 4 + (seed % 3), color: "#9b59b6" },
                    { label: "Outros", val: 10, color: "#95a5a6" }
                ];

                container.innerHTML = mix.map(m => `
                    <div class="energy-item">
                        <div class="energy-info"><b>${m.label}</b> <span>${m.val}%</span></div>
                        <div class="energy-bar-bg"><div class="energy-bar-fill" style="width:${m.val}%; background:${m.color}"></div></div>
                    </div>`).join('');

                // Lógica de Centrais Dinâmicas
                let tempPlants = [];
                const targetLat = info ? info.lat : (userCoords ? userCoords.lat : 39.5);
                const targetLon = info ? info.lon : (userCoords ? userCoords.lon : -8.0);

                locationsDB.forEach(loc => {
                    if(loc.energia?.centrais) {
                        loc.energia.centrais.forEach(p => {
                            p.dist = getDistance(targetLat, targetLon, p.lat, p.lon);
                            tempPlants.push(p);
                        });
                    }
                });

                tempPlants.sort((a, b) => a.dist - b.dist);
                allPlants = tempPlants;
                renderPlants();
            }

            function renderPlants() {
                const list = document.getElementById('plants-list-main');
                if(!list) return;
                const show = allPlants.slice(0, visiveisPlants);
                list.innerHTML = show.map(p => `
                    <div style="border-bottom: 1px solid #f9f9f9; padding: 15px 0;">
                        <div class="plant-item">
                            <div class="plant-main">
                                <span class="plant-name">${p.nome} <span class="plant-power-inline">${p.potencia}</span> <span class="btn-toggle-detail" onclick="toggleDetail('${p.id}')">+</span></span>
                                <span class="plant-coords">${p.local} — ${p.dist.toFixed(1)} km de distância</span>
                            </div>
                            <span class="plant-type-tag">${p.tipo}</span>
                        </div>
                        <div id="detail-${p.id}" class="plant-detail-content">
                            <h5>Informação Técnica</h5>
                            <p>${p.detalhe}</p>
                            <div class="source-list">
                                <a href="https://geoportal.lneg.pt" target="_blank">LNEG Geoportal</a>
                                <a href="https://datahub.ren.pt" target="_blank">REN Datahub</a>
                            </div>
                            <div style="margin-top:15px;"><span class="btn-toggle-detail" onclick="toggleDetail('${p.id}')">[ fechar ]</span></div>
                        </div>
                    </div>`).join('');
                
                document.getElementById('btn-load-more-plants').style.display = allPlants.length > visiveisPlants ? 'block' : 'none';
                document.getElementById('btn-collapse-plants').style.display = visiveisPlants > 3 ? 'block' : 'none';
            }

            function toggleDetail(id) { $(`#detail-${id}`).slideToggle(); }

            document.getElementById('btn-load-more-plants').onclick = () => { visiveisPlants += 10; renderPlants(); };
            document.getElementById('btn-collapse-plants').onclick = () => { visiveisPlants = 3; renderPlants(); };

            function renderRelatorios() {
                document.getElementById('report-grid-energy').innerHTML = relatoriosEnergiaPositiva.map(r => `
                    <div class="report-item">
                        <h5>${r.titulo}</h5>
                        <p>${r.texto}</p>
                        <span style="font-size:0.65em; color:#bbb; text-transform:uppercase;">Fonte: ${r.fonte}</span>
                    </div>`).join('');
            }

            function renderizarCardsEnergy() {
                const container = document.getElementById('noticias-energy-dinamico');
                if (!noticiasEnergy.length) return;
                container.innerHTML = noticiasEnergy.map((n, i) => `
                    <a href="/observatorio/noticia-detalhe.html?id=${n.id}" class="news-item" style="${i >= visiveisEnergy ? 'display:none' : ''}">
                        <h3>${n.titulo}</h3>
                        <p>${(n.resumo_biocultura || n.resumo || "").substring(0, 120)}...</p>
                        <div class="news-meta">
                            <img src="${n.logo || '/assets/img/logo.png'}" class="source-logo">
                            <span>${n.data}</span>
                        </div>
                    </a>`).join('');
                document.getElementById('btn-load-more-energy').style.display = noticiasEnergy.length > visiveisEnergy ? 'inline-block' : 'none';
            }

            document.getElementById('btn-load-more-energy').onclick = () => { visiveisEnergy += 4; renderizarCardsEnergy(); };

            fetch('/sidebar-content.html').then(r => r.text()).then(html => {
                document.getElementById('sidebar').innerHTML = html;
                inicializarPagina();
            });
        </script>
	</body>
</html>
