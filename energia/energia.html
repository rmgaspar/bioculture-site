<!DOCTYPE HTML>
<html>
	<head>
		<title>bioCultura - Observatório da Energia</title>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
		<link rel="stylesheet" href="/assets/css/main.css" />
		<style>
            /* --- ESTRUTURA GLOBAL (PARIDADE INDEX) --- */
            body, input, select, textarea { font-family: 'Source Sans Pro', sans-serif !important; color: #444; }
			section, #header, hr, .major { border: none !important; box-shadow: none !important; padding: 0 !important; }
            section { padding-top: 3em !important; min-height: 100vh; display: flex; flex-direction: column; }

            #sidebar { position: fixed !important; top: 0; left: 0; height: 100vh !important; width: 18em !important; overflow: hidden !important; z-index: 10000; background: #fff; border-right: 1px solid #f2f2f2 !important; }
            #wrapper { padding-left: 18em !important; }

            .inner { padding: 2.2em 4em 0 4em !important; max-width: 1600px !important; margin: 0 auto; width: 100%; }
            .category-label { font-size: 0.65em; font-weight: 900; text-transform: uppercase; letter-spacing: 4px; color: #bbb; margin-bottom: 15px; display: block; }

            /* HERO SPLIT */
            .hero-split { display: flex; align-items: flex-start; justify-content: space-between; gap: 4em; margin-bottom: 2em; }
            .hero-text { flex: 1.5; text-align: left; padding-top: 5px; } 
            .hero-text h1 { font-size: 4em; font-weight: 900; color: #1a1a1a; letter-spacing: -2.5px; line-height: 0.95; margin: 0 0 20px 0; }
            
            .hero-visual { flex: 1; display: flex; justify-content: flex-end; }
            .hero-globe { 
                position: relative; 
                width: 480px; height: 480px; 
                border-radius: 50%; overflow: hidden; 
                box-shadow: 0 40px 100px rgba(0,0,0,0.12); 
                background: #1a1a1a;
            }
            .hero-globe img { width: 100%; height: 100%; object-fit: cover; }

            /* REFORMULAÇÃO DO ALINHAMENTO (VERTICAL) */
            .data-row { display: block; padding: 2.5em 0; border-bottom: 1px solid #f2f2f2; }
            .data-row h4 { font-size: 0.7em; font-weight: 900; text-transform: uppercase; letter-spacing: 2px; color: #bbb; margin: 0 0 25px 0; display: block; }

            /* MIX ENERGÉTICO */
            .energy-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 30px; margin-bottom: 20px; }
            .energy-item { margin-bottom: 15px; }
            .energy-info { display: flex; justify-content: space-between; align-items: flex-end; margin-bottom: 6px; }
            .energy-info b { font-size: 1.1em; color: #1a1a1a; }
            .energy-info span { font-size: 0.9em; font-weight: 900; }
            
            .c-solar { color: #f1c40f !important; }
            .c-wind { color: #3498db !important; }
            .c-hydro { color: #2980b9 !important; }
            .c-gas { color: #95a5a6 !important; }
            .c-biomass { color: #27ae60 !important; }

            .energy-bar-bg { height: 6px; width: 100%; background: #eee; border-radius: 10px; position: relative; overflow: hidden; }
            .energy-bar-fill { height: 100%; position: absolute; left: 0; top: 0; border-radius: 10px; transition: width 1.5s ease-in-out; }
            .fill-solar { background: #f1c40f; }
            .fill-wind { background: #3498db; }
            .fill-hydro { background: #2980b9; }
            .fill-gas { background: #95a5a6; }
            .fill-biomass { background: #27ae60; }

            /* INFRAESTRUTURA */
            .plant-item { padding: 15px 0; border-bottom: 1px solid #f9f9f9; display: flex; justify-content: space-between; align-items: flex-start; }
            .plant-main { display: flex; flex-direction: column; }
            .plant-name { font-weight: 700; color: #333; font-size: 1em; }
            .plant-power { font-size: 0.8em; color: #666; font-weight: 600; margin-top: 2px; }
            .plant-coords { font-family: monospace; font-size: 0.7em; color: #bbb; margin-top: 4px; }
            .plant-type { font-size: 0.65em; font-weight: 800; color: #bbb; text-transform: uppercase; letter-spacing: 1px; }
            .btn-toggle { cursor: pointer; color: #bbb; font-size: 1.5em; font-weight: 300; transition: color 0.2s; user-select: none; }

            /* RELATÓRIOS */
            .report-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 40px; margin-top: 10px; }
            .report-item { border-top: 1px solid #f9f9f9; padding-top: 20px; }
            .report-item h5 { font-size: 0.75em; font-weight: 900; text-transform: uppercase; letter-spacing: 1px; color: #ef6c00; margin-bottom: 12px; }
            .report-item p { font-size: 0.95em; line-height: 1.7; color: #666; margin-bottom: 15px; text-align: justify; }
            .report-source { font-size: 0.65em; font-weight: 400; color: #bbb; text-transform: uppercase; letter-spacing: 1px; display: block; border-top: 1px solid #eee; padding-top: 8px; }

            /* NOTÍCIAS (ESTILO INDEX) */
            .news-header { font-size: 0.8em; font-weight: 400; text-transform: lowercase; letter-spacing: 3px; color: #bbb; margin-bottom: 2.5em; display: block; margin-top: 4em; }
            .news-list { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 30px; }
            .news-item { 
                text-decoration: none; color: inherit; display: block; 
                padding: 25px; background: #fdfdfd; border: 1px solid #f2f2f2; 
                border-radius: 12px; transition: all 0.3s; 
            }
            .news-item:hover { transform: translateY(-5px); border-color: #ddd; }
            .news-item h3 { font-size: 1.15em; font-weight: 700; color: #1a1a1a; margin-bottom: 12px; line-height: 1.3; min-height: 2.6em; }
            .news-item p { font-size: 0.9em; color: #777; line-height: 1.5; margin-bottom: 15px; }
            .news-meta { display: flex; align-items: center; gap: 10px; border-top: 1px solid #f9f9f9; padding-top: 12px; }
            .source-logo { width: 16px; height: 16px; object-fit: contain; filter: grayscale(100%); opacity: 0.6; }
            .news-meta span { font-size: 0.65em; font-weight: 800; color: #bbb; text-transform: uppercase; letter-spacing: 1px; }

            /* BOTÃO VER MAIS (RETIFICADO) */
            .btn-pagination { 
                background: none !important; border: none !important; box-shadow: none !important; 
                color: #bbb !important; font-size: 0.8em; font-weight: 400 !important; 
                letter-spacing: 3px; cursor: pointer; text-transform: lowercase; 
                display: block; text-align: left; padding: 0 !important; margin-top: 2em;
            }

            .bio-res-item { padding: 12px 18px; font-size: 0.9em; color: #666; cursor: pointer; border-bottom: 1px solid #f9f9f9 !important; }

            /* RODAPÉ ALINHADO */
            .page-footer { margin-top: auto; padding: 2em 0 2.5em 0; border-top: 1px solid #f2f2f2; opacity: 0.3; text-align: right; }

            @media screen and (max-width: 1280px) {
                #sidebar { position: relative !important; width: 100% !important; height: auto !important; }
                #wrapper { padding-left: 0 !important; }
                .hero-split { flex-direction: column-reverse; }
                .hero-globe { width: 350px; height: 350px; }
                .report-grid { grid-template-columns: 1fr; }
            }
		</style>
	</head>
	<body class="is-preload">
		<div id="wrapper">
			<div id="main">
                <div class="inner">
                    <section>
                        <!-- 1. HERO & MIX ENERGÉTICO -->
                        <div class="hero-split">
                            <div class="hero-text">
                                <span class="category-label">Recursos Energéticos</span>
                                <h1>Energia: O Motor da Regeneração</h1>
                                <p style="font-size: 0.9em; font-style: italic; color: #bbb; margin-bottom: 30px;">Análise regional: <strong id="reg-name" style="color:#888">...</strong></p>

                                <div id="energy-dashboard" style="display:none;">
                                    <h4 style="font-size: 0.7em; font-weight: 900; text-transform: uppercase; letter-spacing: 2px; color: #bbb; margin-bottom: 20px;">Recursos e Mix Energético</h4>
                                    <div class="tech-content">
                                        <div id="mix-container" class="energy-grid"></div>
                                        <p class="tech-detail" id="energy-status-text" style="color:#bbb; font-style:italic"></p>
                                    </div>
                                </div>
                            </div>
                            <div class="hero-visual">
                                <div class="hero-globe">
                                    <img src="https://images.unsplash.com/photo-1466611653911-95081537e5b7?q=80&w=2070&auto=format&fit=crop" alt="Energias Renováveis">
                                </div>
                            </div>
                        </div>

                        <!-- 2. INFRAESTRUTURA -->
                        <div class="data-row">
                            <h4>Centrais em Proximidade</h4>
                            <div class="tech-content">
                                <div id="plants-list-main"></div>
                                <div style="display: flex; gap: 20px; margin-top: 15px;">
                                    <span id="btn-expand-plants" class="btn-toggle">+</span>
                                    <span id="btn-collapse-plants" class="btn-toggle" style="display:none;">-</span>
                                </div>
                            </div>
                        </div>

                        <!-- 3. RELATÓRIOS (APROFUNDADOS) -->
                        <div class="data-row">
                            <h4>Relatório Global de Energia</h4>
                            <div class="tech-content">
                                <h3 style="margin: 0 0 10px 0; font-weight: 300; font-size: 2em;">Balanço Energético e Metas 2025/2026</h3>
                                <div id="report-grid-energy" class="report-grid"></div>
                            </div>
                        </div>

                        <!-- 4. NOTÍCIAS -->
                        <span class="news-header">noticias</span>
                        <div id="noticias-energy-dinamico" class="news-list"></div>
                        <div style="text-align: left;">
                            <button id="btn-load-more-energy" class="btn-pagination">ver mais</button>
                        </div>

                        <footer class="page-footer">
                            <span style="display: block; font-size: 0.85em; font-weight: 900; color: #333;">bioCultura</span>
                            <span style="display: block; font-size: 0.5em; font-weight: 700; text-transform: uppercase; letter-spacing: 1px;">Global Regeneration</span>
                        </footer>
					</section>
				</div>
            </div>
			<div id="sidebar"></div>
		</div>

		<script src="/assets/js/jquery.min.js"></script>
        <script>
            let locationsDB = [], noticiasEnergy = [], allPlants = [], visiveisEnergy = 4;

            const relatoriosEnergy = [
                { 
                    titulo: "Matriz Elétrica Nacional", 
                    texto: "Em 2025, Portugal atingiu um recorde histórico de 82% de incorporação renovável no consumo elétrico. A estabilidade da rede nacional (Smart Grids) é assegurada pelo equilíbrio estratégico entre a energia hídrica e eólica, permitindo ao país exportar excedentes limpos para a rede europeia.", 
                    fonte: "REN Datahub / DGEG 2025", cor: "#3498db" 
                },
                { 
                    titulo: "Aceleração Solar e Autoconsumo", 
                    texto: "A meta de 5.6 GW de capacidade solar instalada para 2026 está em fase avançada de execução. O crescimento é impulsionado por Unidades de Produção para Autoconsumo (UPAC) e Comunidades de Energia Renovável, que democratizam a produção e reduzem a pegada de carbono urbana.", 
                    fonte: "DGEG - Energia em Números / Portal Energia", cor: "#f1c40f" 
                },
                { 
                    titulo: "Descarbonização e Backup Estratégico", 
                    texto: "Após o encerramento das centrais a carvão, o Gás Natural funciona apenas como reserva estratégica de ponta. Portugal acelera agora a infraestrutura de Hidrogénio Verde em Sines e Aveiro, visando substituir o gás fóssil em processos industriais de alta temperatura até 2030.", 
                    fonte: "APA REA / Pordata Energia", cor: "#95a5a6" 
                },
                { 
                    titulo: "Eólica Offshore e Investimento PRR", 
                    texto: "O leilão de eólica offshore de 10GW marca a nova fronteira energética atlântica. Com o apoio do PRR, o investimento foca-se na reabilitação energética de edifícios e na eletrificação massiva de frotas industriais, visando uma redução de 35% na intensidade energética nacional.", 
                    fonte: "Portugal Global / Pordata", cor: "#27ae60" 
                }
            ];

            function calcularDistancia(lat1, lon1, lat2, lon2) {
                const R = 6371;
                const dLat = (lat2 - lat1) * Math.PI / 180;
                const dLon = (lon2 - lon1) * Math.PI / 180;
                const a = Math.sin(dLat/2) * Math.sin(dLat/2) + Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) * Math.sin(dLon/2) * Math.sin(dLon/2);
                return R * (2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a)));
            }

            async function inicializarPagina() {
                try {
                    const [rLoc, rNews] = await Promise.all([
                        fetch('/data/bioregioes.json').then(r => r.json()),
                        fetch('/data/noticias.json').then(r => r.json())
                    ]);
                    locationsDB = rLoc;
                    noticiasEnergy = rNews.filter(n => (n.categoria || "").toLowerCase().includes('energia'));
                    const info = locationsDB.find(i => i.id === (localStorage.getItem('biocultura_region') || "proenca-a-nova"));
                    
                    renderDashboard(info);
                    renderizarCardsEnergy();
                    renderRelatorios();
                    setupLocationLogic();
                } catch(e) { console.error("Erro no carregamento:", e); }
            }

            function setupLocationLogic() {
                $(document).on('input', '#loc-search-input', function() {
                    const val = $(this).val().toLowerCase(), dropdown = $('#loc-dropdown').empty();
                    if(val.length < 2) return dropdown.hide();
                    locationsDB.filter(i => i.titulo.toLowerCase().includes(val)).slice(0,5).forEach(m => {
                        $('<div class="bio-res-item"></div>').text(m.titulo).on('click', () => {
                            localStorage.setItem('biocultura_region', m.id);
                            location.reload();
                        }).appendTo(dropdown);
                    });
                    dropdown.show();
                });
                $(document).on('click', '#btn-gps-trigger', function() {
                    navigator.geolocation.getCurrentPosition(pos => {
                        let closest = locationsDB[0], minD = Infinity;
                        locationsDB.forEach(c => {
                            let d = calcularDistancia(pos.coords.latitude, pos.coords.longitude, c.lat, c.lon);
                            if(d < minD) { minD = d; closest = c; }
                        });
                        localStorage.setItem('biocultura_region', closest.id);
                        location.reload();
                    });
                });
            }

            function renderDashboard(info) {
                if(!info) return;
                document.getElementById('energy-dashboard').style.display = 'block';
                document.getElementById('reg-name').innerText = info.titulo;

                const mix = info.energia?.mix || [
                    { label: "Solar", val: 25, class: "fill-solar", textClass: "c-solar" },
                    { label: "Eólica", val: 35, class: "fill-wind", textClass: "c-wind" },
                    { label: "Hídrica", val: 15, class: "fill-hydro", textClass: "c-hydro" },
                    { label: "Biomassa", val: 10, class: "fill-biomass", textClass: "c-biomass" },
                    { label: "Outros", val: 15, class: "fill-gas", textClass: "c-gas" }
                ];

                document.getElementById('mix-container').innerHTML = mix.map(m => `
                    <div class="energy-item">
                        <div class="energy-info"><b>${m.label}</b> <span class="${m.textClass}">${m.val}%</span></div>
                        <div class="energy-bar-bg"><div class="energy-bar-fill ${m.class}" style="width: ${m.val}%"></div></div>
                    </div>`).join('');
                document.getElementById('energy-status-text').innerText = `Mix energético regional baseado na capacidade instalada em ${info.titulo}.`;

                allPlants = info.energia?.centrais || [
                    { nome: "Parque Eólico Regional", tipo: "Eólica", potencia: "18.4 MW", local: "Malhadancha", coords: "LAT 39.8123 | LONG -8.1022" },
                    { nome: "Central Fotovoltaica Local", tipo: "Solar", potencia: "4.2 MW", local: "Sobreira Formosa", coords: "LAT 39.7541 | LONG -7.9812" },
                    { nome: "Mini-hídrica de Proximidade", tipo: "Hídrica", potencia: "2.1 MW", local: "Rio Ocreza", coords: "LAT 39.8455 | LONG -8.0511" },
                    { nome: "Unidade de Valorização de Biomassa", tipo: "Biomassa", potencia: "1.5 MW", local: "Proença-a-Nova", coords: "LAT 39.7512 | LONG -7.9234" }
                ];
                renderPlants(false);
            }

            function renderPlants(expand) {
                const show = expand ? allPlants : allPlants.slice(0, 3);
                document.getElementById('plants-list-main').innerHTML = show.map(p => `
                    <div class="plant-item">
                        <div class="plant-main">
                            <span class="plant-name">${p.nome}</span>
                            <span class="plant-power">${p.potencia} — ${p.local}</span>
                            <span class="plant-coords">${p.coords}</span>
                        </div>
                        <span class="plant-type">${p.tipo}</span>
                    </div>`).join('');
                document.getElementById('btn-expand-plants').style.display = (!expand && allPlants.length > 3) ? 'block' : 'none';
                document.getElementById('btn-collapse-plants').style.display = expand ? 'block' : 'none';
            }

            function renderRelatorios() {
                document.getElementById('report-grid-energy').innerHTML = relatoriosEnergy.map(r => `
                    <div class="report-item">
                        <h5>${r.titulo}</h5>
                        <p>${r.texto}</p>
                        <span class="report-source">Fonte: ${r.fonte}</span>
                    </div>`).join('');
            }

            function renderizarCardsEnergy() {
                const container = document.getElementById('noticias-energy-dinamico');
                container.innerHTML = noticiasEnergy.map((n, i) => `
                    <a href="/observatorio/noticia-detalhe.html?id=${n.id}" class="news-item ${i >= visiveisEnergy ? 'hidden-card' : ''}" style="${i >= visiveisEnergy ? 'display:none' : ''}">
                        <h3>${n.titulo}</h3>
                        <p>${(n.resumo_biocultura || n.resumo || "").substring(0, 110)}...</p>
                        <div class="news-meta">
                            <img src="${n.logo}" class="source-logo">
                            <span>${n.data}</span>
                        </div>
                    </a>`).join('');
                document.getElementById('btn-load-more-energy').style.display = noticiasEnergy.length > visiveisEnergy ? 'inline-block' : 'none';
            }

            document.getElementById('btn-expand-plants').onclick = () => renderPlants(true);
            document.getElementById('btn-collapse-plants').onclick = () => renderPlants(false);
            document.getElementById('btn-load-more-energy').onclick = () => { visiveisEnergy += 4; renderizarCardsEnergy(); };

            fetch('/sidebar-content.html').then(r => r.text()).then(html => {
                document.getElementById('sidebar').innerHTML = html;
                inicializarPagina();
            });
        </script>
	</body>
</html>
