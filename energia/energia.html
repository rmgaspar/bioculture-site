<!DOCTYPE HTML>
<html>
	<head>
		<title>bioCultura - Observatório da Energia</title>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale, user-scalable=no" />
		<link rel="stylesheet" href="/assets/css/main.css" />
		<style>
            /* --- ESTRUTURA GLOBAL --- */
            body, input, select, textarea { font-family: 'Source Sans Pro', sans-serif !important; color: #444; }
			section, #header, hr, .major { border: none !important; box-shadow: none !important; padding: 0 !important; }
            section { min-height: 100vh; display: flex; flex-direction: column; }
            #sidebar { position: fixed !important; top: 0; left: 0; height: 100vh !important; width: 18em !important; overflow: hidden !important; z-index: 10000; background: #fff; border-right: 1px solid #f2f2f2 !important; }
            #wrapper { padding-left: 18em !important; }
            .inner { padding: 2.2em 4em 0 4em !important; max-width: 1600px !important; margin: 0 auto; width: 100%; }

            /* HERO & TITULOS */
            .category-label { font-size: 0.65em; font-weight: 900; text-transform: uppercase; letter-spacing: 4px; color: #bbb; margin-bottom: 15px; display: block; }
            .hero-split { display: flex; align-items: flex-start; justify-content: space-between; gap: 4em; margin-bottom: 2em; }
            .hero-text { flex: 1.5; text-align: left; padding-top: 5px; } 
            .hero-text h1 { font-size: 4em; font-weight: 900; color: #1a1a1a; letter-spacing: -2.5px; line-height: 0.95; margin: 0; }
            
            .region-header { font-size: 0.7em; font-weight: 900; text-transform: uppercase; letter-spacing: 2px; color: #c62828; margin: 40px 0 5px 0; display: block; }
            .national-link { color: #bbb; cursor: pointer; font-weight: 400; font-size: 0.85em; display: block; text-transform: lowercase; letter-spacing: 1px; width: fit-content; border-bottom: 1px solid transparent; }
            .national-link:hover { color: #2e7d32; border-bottom-color: #eee; }

            /* CAROUSEL SMOOTH */
            .hero-visual { flex: 1; display: flex; justify-content: flex-end; }
            .hero-globe { position: relative; width: 480px; height: 480px; border-radius: 50%; overflow: hidden; box-shadow: 0 40px 100px rgba(0,0,0,0.12); background: #1a1a1a; }
            .hero-globe img { position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; transition: opacity 2s ease-in-out; opacity: 0; }
            .hero-globe img.active { opacity: 1; }

            /* DASHBOARD GAUGES */
            .impact-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 40px 30px; margin-bottom: 40px; }
            .impact-item { margin-bottom: 10px; }
            .impact-info { display: flex; justify-content: space-between; align-items: flex-end; margin-bottom: 8px; }
            .impact-info b { font-size: 0.85em; color: #1a1a1a; text-transform: uppercase; letter-spacing: 1px; }
            .impact-bar-bg { height: 4px; width: 100%; background: #eee; border-radius: 10px; position: relative; overflow: hidden; margin-bottom: 12px; }
            .impact-bar-fill { height: 100%; position: absolute; left: 0; top: 0; border-radius: 10px; transition: width 1.5s ease-in-out; }
            .impact-desc { font-size: 0.85em; line-height: 1.5; color: #777; text-align: justify; margin: 0; }

            /* PROJETOS / CENTRAIS */
            .data-row { display: block; padding: 2.5em 0; border-bottom: 1px solid #f2f2f2; }
            .data-row h4 { font-size: 0.7em; font-weight: 900; text-transform: uppercase; letter-spacing: 2px; color: #c62828; margin: 0 0 25px 0; display: block; }
            
            .plant-item { display: flex; justify-content: flex-start; align-items: center; gap: 60px; padding: 15px 0; }
            .plant-main { display: flex; flex-direction: column; gap: 3px; min-width: 350px; }
            .plant-name { font-weight: 700; color: #1a1a1a; font-size: 1em; }
            .plant-coords { font-family: 'Courier New', Courier, monospace; font-size: 0.75em; color: #888; background: #f5f5f5; padding: 2px 8px; border-radius: 4px; width: fit-content; }
            .plant-status { font-size: 0.65em; font-weight: 800; color: #bbb; text-transform: uppercase; letter-spacing: 1px; }
            
            .btn-toggle-detail { color: #2e7d32; cursor: pointer; font-weight: 800; margin-left: 10px; font-size: 0.9em; }
            .plant-detail-content { display: none; background: #fcfcfc; border-left: 2px solid #2e7d32; padding: 25px; margin: 15px 0; font-size: 0.85em; color: #555; line-height: 1.6; }
            .plant-detail-content h5 { font-size: 1em; color: #1a1a1a; margin-bottom: 10px; text-transform: uppercase; font-weight: 900; }
            
            .source-list { margin-top: 20px; padding-top: 15px; border-top: 1px solid #eee; }
            .source-list a { display: block; color: #bbb; font-size: 0.85em; text-decoration: none; margin-bottom: 5px; text-transform: lowercase; }

            /* NOTÍCIAS */
            .news-header { margin-top: 4em; display: block; font-size: 0.65em; font-weight: 900; text-transform: uppercase; letter-spacing: 4px; color: #bbb; margin-bottom: 20px; }
            .news-list { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 30px; }
            .news-item { text-decoration: none; color: inherit; display: block; padding: 25px; background: #fdfdfd; border-radius: 12px; transition: all 0.3s; }
            .news-item:hover { transform: translateY(-5px); background: #f9f9f9; }
            .source-logo { width: 20px !important; height: 20px !important; object-fit: contain !important; filter: grayscale(100%); opacity: 0.6; }

            /* BOTÃO PAGINAÇÃO LIMPO */
            .btn-pagination { background: none !important; border: none !important; box-shadow: none !important; color: #bbb !important; font-size: 0.8em; letter-spacing: 3px; cursor: pointer; text-transform: lowercase; margin-top: 2em; padding: 0 !important; }
            .page-footer { margin-top: auto; padding: 2em 0 2.5em 0; border-top: 1px solid #f2f2f2; opacity: 0.3; text-align: right; }

            /* SEARCH DROPDOWN */
            .bio-res-item { padding: 12px 18px; font-size: 0.9em; color: #666; cursor: pointer; border-bottom: 1px solid #f9f9f9 !important; }
            .bio-res-item:hover { background: #f9f9f9; }

            @media screen and (max-width: 1280px) {
                #sidebar { position: relative !important; width: 100% !important; height: auto !important; }
                #wrapper { padding-left: 0 !important; }
                .hero-split, .impact-grid { grid-template-columns: 1fr; }
                .hero-globe { width: 350px; height: 350px; margin: 0 auto; }
            }
		</style>
	</head>
	<body class="is-preload">
		<div id="wrapper">
			<div id="main">
                <div class="inner">
                    <section>
                        <!-- 1. HERO & MIX ENERGÉTICO -->
                        <div class="hero-split">
                            <div class="hero-text">
                                <span class="category-label">Justiça Climática</span>
                                <h1>Energia: O Motor da Regeneração</h1>
                                
                                <h4 class="region-header">INDICADORES DE MIX ENERGÉTICO PARA A REGIÃO DE: <span id="reg-name-caps">PORTUGAL</span></h4>
                                <span class="national-link" onclick="resetToNational()">(ver ambito nacional)</span>

                                <div id="energy-dashboard" style="display:block; margin-top:40px;">
                                    <div class="tech-content">
                                        <div id="impact-container" class="impact-grid"></div>
                                    </div>
                                </div>
                            </div>
                            <div class="hero-visual">
                                <div class="hero-globe" id="globe-container">
                                    <img src="https://images.unsplash.com/photo-1509391366360-2e959784a276?auto=format&fit=crop&w=1024" class="active">
                                    <img src="https://images.unsplash.com/photo-1466611653911-95282fc365d5?auto=format&fit=crop&w=1024">
                                    <img src="https://images.unsplash.com/photo-1473341304170-971dccb5ac1e?auto=format&fit=crop&w=1024">
                                    <img src="https://images.unsplash.com/photo-1508514177221-188b1cf16e9d?auto=format&fit=crop&w=1024">
                                </div>
                            </div>
                        </div>

                        <!-- 2. INFRAESTRUTURA -->
                        <div class="data-row">
                            <h4>Centrais em Proximidade</h4>
                            <div id="plants-list-main"></div>
                            <button id="btn-load-more-plants" class="btn-pagination" style="display:none">+ ver mais centrais</button>
                        </div>

                        <!-- 3. RELATÓRIOS -->
                        <div class="data-row">
                            <h4>Análise de Aceleração e Conflito</h4>
                            <div id="report-grid-energy" style="display:grid; grid-template-columns: 1fr 1fr; gap:40px;"></div>
                        </div>

                        <!-- 4. NOTÍCIAS -->
                        <span class="news-header">noticias</span>
                        <div id="noticias-energy-dinamico" class="news-list"></div>
                        <div style="text-align: left; margin-bottom: 4em;">
                            <button id="btn-load-more-energy" class="btn-pagination">ver mais</button>
                        </div>

                        <footer class="page-footer">
                            <span style="display: block; font-size: 0.85em; font-weight: 900; color: #333;">bioCultura</span>
                        </footer>
					</section>
				</div>
            </div>
			<div id="sidebar"></div>
		</div>

		<script src="/assets/js/jquery.min.js"></script>
        <script>
            let locationsDB = [], noticiasEnergy = [], allPlants = [], visiveisEnergy = 4, visiveisPlants = 3;
            let userCoords = null;

            const relatoriosEnergy = [
                { titulo: "Matriz Elétrica Nacional", texto: "Em 2025, Portugal atingiu 82% de incorporação renovável. A estabilidade é assegurada pelo equilíbrio hídrico-eólico.", fonte: "REN Datahub / DGEG 2025" },
                { titulo: "Aceleração Solar", texto: "A meta de 5.6 GW solar para 2026 está em fase avançada, impulsionada pelo autoconsumo e comunidades de energia.", fonte: "DGEG - Energia em Números" },
                { titulo: "Descarbonização Estratégica", texto: "O Gás Natural funciona como reserva de ponta enquanto a infraestrutura de Hidrogénio entra em fase operacional.", fonte: "APA REA / Pordata" },
                { titulo: "Eólica Offshore", texto: "O leilão de 10GW marca a nova fronteira energética. O foco está na eletrificação industrial via PRR.", fonte: "Portugal Global / Pordata" }
            ];

            function getDistance(lat1, lon1, lat2, lon2) {
                const R = 6371; 
                const dLat = (lat2 - lat1) * Math.PI / 180;
                const dLon = (lon2 - lon1) * Math.PI / 180;
                const a = Math.sin(dLat/2) * Math.sin(dLat/2) + Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) * Math.sin(dLon/2) * Math.sin(dLon/2);
                return R * (2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a)));
            }

            async function inicializarPagina() {
                try {
                    const [rLoc, rNews] = await Promise.all([
                        fetch('/data/bioregioes.json').then(r => r.json()).catch(() => []),
                        fetch('/data/noticias.json').then(r => r.json()).catch(() => [])
                    ]);
                    locationsDB = rLoc;
                    noticiasEnergy = rNews.filter(n => (n.categoria || "").toLowerCase().includes('energia'));
                    
                    const savedID = localStorage.getItem('biocultura_region');
                    const info = savedID ? locationsDB.find(i => i.id === savedID) : null;
                    
                    renderDashboard(info);
                    renderizarCardsEnergy();
                    renderRelatorios();
                    initCarousel();
                    setupLocationLogic();
                } catch(e) { console.error("Erro na inicialização:", e); }
            }

            function setupLocationLogic() {
                $(document).on('input', '#loc-search-input', function() {
                    const val = $(this).val().toLowerCase(), dropdown = $('#loc-dropdown').empty();
                    if(val.length < 2) return dropdown.hide();
                    locationsDB.filter(i => i.titulo.toLowerCase().includes(val)).slice(0,5).forEach(m => {
                        $('<div class="bio-res-item"></div>').text(m.titulo).on('click', () => {
                            localStorage.setItem('biocultura_region', m.id);
                            location.reload(); 
                        }).appendTo(dropdown);
                    });
                    dropdown.show();
                });

                $(document).on('click', '#btn-gps-trigger', function() {
                    navigator.geolocation.getCurrentPosition(pos => {
                        userCoords = { lat: pos.coords.latitude, lon: pos.coords.longitude };
                        let closest = locationsDB[0], minD = Infinity;
                        locationsDB.forEach(c => {
                            let d = getDistance(userCoords.lat, userCoords.lon, c.lat, c.lon);
                            if(d < minD) { minD = d; closest = c; }
                        });
                        localStorage.setItem('biocultura_region', closest.id);
                        location.reload();
                    }, () => alert("Ative o GPS para ordenar por proximidade."));
                });
            }

            function resetToNational() {
                localStorage.removeItem('biocultura_region');
                location.reload();
            }

            function initCarousel() {
                let current = 0;
                const imgs = document.querySelectorAll('#globe-container img');
                if(!imgs.length) return;
                setInterval(() => {
                    imgs[current].classList.remove('active');
                    current = (current + 1) % imgs.length;
                    imgs[current].classList.add('active');
                }, 5000);
            }

            function renderDashboard(info) {
                const container = document.getElementById('impact-container');
                const titleCaps = document.getElementById('reg-name-caps');
                if(!container) return;

                const seed = info ? info.id.length : 10;
                const data = info ? info : { titulo: "PORTUGAL (MÉDIA NACIONAL)" };
                titleCaps.innerText = data.titulo.toUpperCase();

                const mix = (info && info.energia?.mix) ? info.energia.mix : [
                    { label: "Solar", val: 25 + (seed % 10), color: "#f1c40f", desc: "Produção fotovoltaica regional. Fontes: LNEG / DGEG." },
                    { label: "Eólica", val: 35 + (seed % 5), color: "#3498db", desc: "Aproveitamento do recurso vento. Fonte: REN Datahub." },
                    { label: "Hídrica", val: 15, color: "#2980b9", desc: "Capacidade de regulação em barragens." },
                    { label: "Biomassa", val: 10, color: "#27ae60", desc: "Valorização de resíduos florestais." }
                ];

                container.innerHTML = mix.map(m => `
                    <div class="impact-item">
                        <div class="impact-info"><b>${m.label}</b> <span style="color:${m.color}; font-weight:900;">${m.val}%</span></div>
                        <div class="impact-bar-bg"><div class="impact-bar-fill" style="width:${m.val}%; background:${m.color}"></div></div>
                        <p class="impact-desc">${m.desc}</p>
                    </div>`).join('');

                allPlants = (info && info.energia?.centrais) ? info.energia.centrais : [
                    { id: "eol-1", nome: "Parque Eólico do Coentral", tipo: "Eólica", potencia: "22 MW", local: "Castanheira de Pera", coords: "LAT 40.01 | LONG -8.12", lat: 40.01, lon: -8.12, detalhe: "Ligação à RNT. Fonte: REN." },
                    { id: "sol-1", nome: "Central Solar de Proença", tipo: "Solar", potencia: "12 MW", local: "Proença-a-Nova", coords: "LAT 39.75 | LONG -7.92", lat: 39.75, lon: -7.92, detalhe: "Painéis de alta eficiência. Fonte: DGEG." }
                ];

                renderPlants();
            }

            function renderPlants() {
                const list = document.getElementById('plants-list-main');
                if(!list) return;
                const show = allPlants.slice(0, visiveisPlants);
                list.innerHTML = show.map(p => `
                    <div style="border-bottom: 1px solid #f9f9f9; padding: 15px 0;">
                        <div class="plant-item">
                            <div class="plant-main">
                                <span class="project-name">${p.nome} — ${p.local} <span class="btn-toggle-detail" onclick="toggleDetail('${p.id}')">+</span></span>
                                <span class="plant-coords">${p.coords}</span>
                            </div>
                            <span class="project-status">${p.potencia} / ${p.tipo}</span>
                        </div>
                        <div id="detail-${p.id}" class="plant-detail-content">
                            <h5>Dados Técnicos (LNEG / DGEG / REN)</h5>
                            <p>${p.detalhe}</p>
                            <div class="source-list">
                                <a href="https://geoportal.lneg.pt" target="_blank">LNEG Geoportal</a>
                                <a href="https://datahub.ren.pt" target="_blank">REN Datahub</a>
                            </div>
                            <div style="margin-top:15px;"><span class="btn-toggle-detail" onclick="toggleDetail('${p.id}')">[ fechar ]</span></div>
                        </div>
                    </div>`).join('');
                document.getElementById('btn-load-more-plants').style.display = allPlants.length > visiveisPlants ? 'block' : 'none';
            }

            function toggleDetail(id) { $(`#detail-${id}`).slideToggle(); }

            function renderRelatorios() {
                const grid = document.getElementById('report-grid-energy');
                if(!grid) return;
                grid.innerHTML = relatoriosEnergy.map(r => `
                    <div class="report-item">
                        <h5>${r.titulo}</h5>
                        <p>${r.texto}</p>
                        <span class="report-source">Fonte: ${r.fonte}</span>
                    </div>`).join('');
            }

            function renderizarCardsEnergy() {
                const container = document.getElementById('noticias-energy-dinamico');
                if (!container) return;
                if (!noticiasEnergy.length) { container.innerHTML = "<p style='font-size:0.8em; color:#bbb;'>Sem notícias recentes.</p>"; return; }
                container.innerHTML = noticiasEnergy.map((n, i) => `
                    <a href="/observatorio/noticia-detalhe.html?id=${n.id}" class="news-item" style="${i >= visiveisEnergy ? 'display:none' : ''}">
                        <h3>${n.titulo}</h3>
                        <div class="news-meta">
                            <img src="${n.logo || '/assets/img/logo.png'}" class="source-logo">
                            <span>${n.data}</span>
                        </div>
                    </a>`).join('');
            }

            document.getElementById('btn-load-more-plants').onclick = () => { visiveisPlants += 5; renderPlants(); };
            document.getElementById('btn-load-more-energy').onclick = () => { visiveisEnergy += 4; renderizarCardsEnergy(); };

            fetch('/sidebar-content.html').then(r => r.text()).then(html => {
                document.getElementById('sidebar').innerHTML = html;
                inicializarPagina();
            });
        </script>
	</body>
</html>
