<!DOCTYPE HTML>
<html>
	<head>
		<title>bioCultura - Observatório da Transição Ética</title>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale, user-scalable=no" />
		<link rel="stylesheet" href="/assets/css/main.css" />
		<style>
            body, input, select, textarea { font-family: 'Source Sans Pro', sans-serif !important; color: #444; }
			section, #header, hr, .major { border: none !important; box-shadow: none !important; padding: 0 !important; }
            section { min-height: 100vh; display: flex; flex-direction: column; }
            #sidebar { position: fixed !important; top: 0; left: 0; height: 100vh !important; width: 18em !important; overflow: hidden !important; z-index: 10000; background: #fff; border-right: 1px solid #f2f2f2 !important; }
            #wrapper { padding-left: 18em !important; }
            .inner { padding: 2.2em 4em 0 4em !important; max-width: 1600px !important; margin: 0 auto; width: 100%; }
            
            /* TITULOS */
            .category-label { font-size: 0.65em; font-weight: 900; text-transform: uppercase; letter-spacing: 4px; color: #bbb; margin-bottom: 15px; display: block; }
            .main-impact-title { font-size: 2.5em; font-weight: 900; color: #1a1a1a; letter-spacing: -1.5px; line-height: 1.1; margin: 0 0 30px 0; }
            .national-link { font-size: 0.35em; vertical-align: middle; color: #2e7d32; text-decoration: none; letter-spacing: 1px; margin-left: 10px; font-weight: 700; text-transform: uppercase; }

            /* HERO VISUAL */
            .hero-split { display: flex; align-items: flex-start; justify-content: space-between; gap: 4em; margin-bottom: 2em; }
            .hero-text { flex: 1.5; text-align: left; } 
            .hero-visual { flex: 1; display: flex; justify-content: flex-end; }
            .hero-globe { position: relative; width: 480px; height: 480px; border-radius: 50%; overflow: hidden; box-shadow: 0 40px 100px rgba(0,0,0,0.12); background: #1a1a1a; }
            .hero-globe img { width: 100%; height: 100%; object-fit: cover; transition: opacity 0.8s ease-in-out; }

            /* GAUGES */
            .impact-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 30px; margin-bottom: 30px; }
            .impact-item { margin-bottom: 10px; }
            .impact-info { display: flex; justify-content: space-between; align-items: flex-end; margin-bottom: 6px; }
            .impact-info b { font-size: 0.8em; text-transform: uppercase; letter-spacing: 1px; color: #1a1a1a; }
            .impact-bar-bg { height: 4px; width: 100%; background: #eee; border-radius: 10px; position: relative; overflow: hidden; margin-bottom: 8px; }
            .impact-bar-fill { height: 100%; position: absolute; left: 0; top: 0; transition: width 1.5s ease-in-out; }
            .impact-desc { font-size: 0.85em; color: #777; line-height: 1.5; margin: 0; text-align: justify; }

            /* PROJETOS EXPANDIVEIS */
            .project-item { display: flex; justify-content: flex-start; align-items: center; gap: 60px; padding: 15px 0; }
            .project-main { display: flex; flex-direction: column; gap: 3px; min-width: 350px; }
            .project-name { font-weight: 700; color: #1a1a1a; }
            .btn-ver-mais { color: #2e7d32; cursor: pointer; font-weight: 800; margin-left: 10px; font-size: 0.9em; }
            .project-detail-content { display: none; background: #f9f9f9; border-left: 3px solid #2e7d32; padding: 30px; margin: 10px 0 20px 0; font-size: 0.9em; line-height: 1.7; color: #444; }
            .project-detail-content h5 { font-weight: 900; text-transform: uppercase; margin-bottom: 15px; color: #1a1a1a; }
            .project-detail-content ul { padding-left: 15px; margin-bottom: 20px; }
            .detail-footer { display: flex; justify-content: space-between; align-items: center; border-top: 1px solid #eee; padding-top: 15px; margin-top: 15px; }
            .source-link { color: #bbb; text-transform: lowercase; font-size: 0.8em; text-decoration: none; }
            .btn-fechar { cursor: pointer; color: #2e7d32; font-weight: 800; text-transform: uppercase; font-size: 0.75em; }

            /* NOTICIAS */
            .news-header { margin-top: 4em; display: block; font-size: 0.65em; font-weight: 900; text-transform: uppercase; letter-spacing: 4px; color: #bbb; margin-bottom: 20px; }
            .news-list { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 30px; }
            .news-item { text-decoration: none; color: inherit; display: block; padding: 25px; background: #fdfdfd; border-radius: 12px; transition: all 0.3s; }
            .news-item:hover { transform: translateY(-5px); background: #f9f9f9; }
            .news-item h3 { font-size: 1.15em; font-weight: 700; color: #1a1a1a; margin-bottom: 12px; line-height: 1.3; }
            .news-meta { display: flex; align-items: center; gap: 10px; border-top: 1px solid #f2f2f2; padding-top: 12px; font-size: 0.65em; font-weight: 800; color: #bbb; text-transform: uppercase; }

            .page-footer { margin-top: auto; padding: 2em 0 2.5em 0; border-top: 1px solid #f2f2f2; opacity: 0.3; text-align: right; }

            @media screen and (max-width: 1280px) {
                #sidebar { position: relative !important; width: 100% !important; height: auto !important; }
                #wrapper { padding-left: 0 !important; }
                .hero-split, .impact-grid { grid-template-columns: 1fr; }
                .hero-globe { width: 320px; height: 320px; margin: 0 auto; }
            }
		</style>
	</head>
	<body class="is-preload">
		<div id="wrapper">
			<div id="main">
                <div class="inner">
                    <section>
                        <div class="hero-split">
                            <div class="hero-text">
                                <span class="category-label">Justiça Climática</span>
                                <h1 class="main-impact-title">
                                    Indicadores de Impacto Negativo para a zona de <span id="reg-name" style="color:#2e7d32">...</span>
                                    <a href="javascript:void(0)" onclick="loadNationalData()" class="national-link">(âmbito nacional)</a>
                                </h1>

                                <div id="ethics-dashboard" style="display:none;">
                                    <div id="impact-container" class="impact-grid"></div>
                                </div>
                            </div>
                            <div class="hero-visual">
                                <div class="hero-globe">
                                    <img id="hero-carousel" src="https://img.iol.pt/image/id/11983815/1024.jpg" alt="Impacto Territorial">
                                </div>
                            </div>
                        </div>

                        <div class="data-row">
                            <h4 style="font-size: 0.7em; font-weight: 900; text-transform: uppercase; letter-spacing: 2px; color: #1a1a1a; margin-bottom: 25px;">Projetos e Zonas de Pressão</h4>
                            <div id="projects-list-main"></div>
                            <div style="display: flex; gap: 20px; margin-top: 15px;">
                                <span id="btn-expand-projects" class="btn-toggle" style="cursor:pointer; color:#bbb">+ ver mais projetos</span>
                            </div>
                        </div>

                        <span class="news-header">noticias</span>
                        <div id="noticias-ethics-dinamico" class="news-list"></div>
                        <div style="margin-bottom: 4em;">
                            <button id="btn-load-more-ethics" style="background:none; border:none; color:#bbb; cursor:pointer; letter-spacing:2px; text-transform:lowercase;">ver mais</button>
                        </div>

                        <footer class="page-footer">
                            <span style="display: block; font-size: 0.85em; font-weight: 900; color: #333;">bioCultura</span>
                            <span style="display: block; font-size: 0.5em; font-weight: 700; text-transform: uppercase; letter-spacing: 1px;">Global Regeneration</span>
                        </footer>
					</section>
				</div>
            </div>
			<div id="sidebar"></div>
		</div>

		<script src="/assets/js/jquery.min.js"></script>
        <script>
            let locationsDB = [], noticiasEthics = [], allProjects = [], visiveisEthics = 4;
            
            const heroImages = [
                "https://img.iol.pt/image/id/11983815/1024.jpg",
                "https://images.unsplash.com/photo-1473341304170-971dccb5ac1e?auto=format&fit=crop&w=1024",
                "https://images.unsplash.com/photo-1466611653911-95282fc365d5?auto=format&fit=crop&w=1024",
                "https://images.unsplash.com/photo-1508514177221-188b1cf16e9d?auto=format&fit=crop&w=1024"
            ];
            let imgIdx = 0;

            function startCarousel() {
                setInterval(() => {
                    imgIdx = (imgIdx + 1) % heroImages.length;
                    $('#hero-carousel').css('opacity', 0);
                    setTimeout(() => {
                        $('#hero-carousel').attr('src', heroImages[imgIdx]).css('opacity', 1);
                    }, 800);
                }, 5000);
            }

            async function inicializarPagina() {
                try {
                    const [rLoc, rNews] = await Promise.all([
                        fetch('/data/bioregioes.json').then(r => r.json()),
                        fetch('/data/noticias.json').then(r => r.json())
                    ]);
                    locationsDB = rLoc;
                    noticiasEthics = rNews.filter(n => (n.categoria || "").toLowerCase().includes('etica'));
                    const info = locationsDB.find(i => i.id === (localStorage.getItem('biocultura_region') || "proenca-a-nova"));
                    
                    renderDashboard(info);
                    renderizarCardsEthics();
                    startCarousel();
                } catch(e) { console.error(e); }
            }

            function renderDashboard(info) {
                if(!info) return;
                document.getElementById('ethics-dashboard').style.display = 'block';
                document.getElementById('reg-name').innerText = info.titulo;

                const impacts = info.etica?.indicadores || [
                    { label: "Ocupação de Solo RAN", val: 42, color: "#8d6e63", desc: "Conversão de solos de Reserva Agrícola Nacional para uso industrial." },
                    { label: "Fragmentação de Habitat", val: 28, color: "#2e7d32", desc: "Interrupção de corredores ecológicos por vedações de mega-parques." },
                    { label: "Stress Hídrico (IA)", val: 65, color: "#0288d1", desc: "Pressão sobre aquíferos para o arrefecimento de centros de dados." },
                    { label: "Oposição Social", val: 85, color: "#7b1fa2", desc: "Nível de contestação face ao licenciamento de mega-projetos." }
                ];

                document.getElementById('impact-container').innerHTML = impacts.map(m => `
                    <div class="impact-item">
                        <div class="impact-info"><b>${m.label}</b> <span style="color:${m.color}; font-weight:900;">${m.val}%</span></div>
                        <div class="impact-bar-bg"><div class="impact-bar-fill" style="width:${m.val}%; background:${m.color}"></div></div>
                        <p class="impact-desc">${m.desc}</p>
                    </div>`).join('');

                allProjects = [
                    { 
                        id: "pszaer", 
                        nome: "Plano Setorial PSZAER", 
                        local: "Nacional / Zonas de Aceleração", 
                        coords: "MAPA ESTRATÉGICO 2026", 
                        status: "Discussão Pública",
                        detalhe: `
                            <h5>Proposta de Programa Setorial (PSZAER)</h5>
                            <p>Instrumento de planeamento estratégico destinado a identificar as áreas do território nacional mais aptas para projetos solares e eólicos, garantindo licenciamento acelerado.</p>
                            <ul>
                                <li><strong>Base Legal:</strong> Diretiva RED III (2023/2413) para criação de "vias verdes" administrativas.</li>
                                <li><strong>Metas PNEC 2030:</strong> Portugal visa atingir 20,8 GW de capacidade solar e 10,4 GW de eólica onshore.</li>
                                <li><strong>Hotspots Territoriais:</strong> Sertã (4% nacional), Proença-a-Nova, Mortágua e Castelo Branco lideram as áreas identificadas.</li>
                                <li><strong>Condicionantes:</strong> Exclusão total da Rede Natura 2000 e buffers de 1km de habitações para eólicas.</li>
                                <li><strong>Justiça Energética:</strong> Institucionalização de Planos de Benefícios Locais e Comunidades de Energia.</li>
                            </ul>
                            <p>O mapeamento prioriza solos degradados, minas abandonadas (199 identificadas) e áreas a menos de 10km de subestações.</p>
                        `,
                        fonte: "https://participa.pt"
                    },
                    ...(info.etica?.projetos_criticos || [
                        { id: "litio", nome: "Mineração de Lítio", local: "Boticas / Barroso", coords: "LAT 41.69 | LONG -7.66", status: "Contestado", detalhe: "Projeto de exploração a céu aberto com forte impacto no ciclo hidrológico local.", fonte: "https://participa.pt" }
                    ])
                ];
                renderProjects(false);
            }

            function renderProjects(expand) {
                const show = expand ? allProjects : allProjects.slice(0, 3);
                document.getElementById('projects-list-main').innerHTML = show.map(p => `
                    <div style="border-bottom: 1px solid #f9f9f9;">
                        <div class="project-item">
                            <div class="project-main">
                                <span class="project-name">${p.nome} — ${p.local} <span class="btn-ver-mais" onclick="toggleDetail('${p.id}')">+</span></span>
                                <span class="project-coords">${p.coords}</span>
                            </div>
                            <span class="project-status">${p.status}</span>
                        </div>
                        <div id="detail-${p.id}" class="project-detail-content">
                            ${p.detalhe}
                            <div class="detail-footer">
                                <a href="${p.fonte}" target="_blank" class="source-link">fonte: ${p.fonte}</a>
                                <span class="btn-fechar" onclick="toggleDetail('${p.id}')">fechar</span>
                            </div>
                        </div>
                    </div>`).join('');
            }

            function toggleDetail(id) {
                $(`#detail-${id}`).slideToggle();
            }

            function renderizarCardsEthics() {
                const container = document.getElementById('noticias-ethics-dinamico');
                container.innerHTML = noticiasEthics.map((n, i) => `
                    <a href="/observatorio/noticia-detalhe.html?id=${n.id}" class="news-item" style="${i >= visiveisEthics ? 'display:none' : ''}">
                        <h3>${n.titulo}</h3>
                        <div class="news-meta"><span>${n.data}</span></div>
                    </a>`).join('');
            }

            document.getElementById('btn-expand-projects').onclick = function() {
                renderProjects(true);
                $(this).hide();
            };

            fetch('/sidebar-content.html').then(r => r.text()).then(html => {
                document.getElementById('sidebar').innerHTML = html;
                inicializarPagina();
            });
        </script>
	</body>
</html>
