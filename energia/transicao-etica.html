<!DOCTYPE HTML>
<html>
	<head>
		<title>bioCultura - Observatório da Transição Ética</title>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale, user-scalable=no" />
		<link rel="stylesheet" href="/assets/css/main.css" />
		<style>
            /* --- ESTRUTURA GLOBAL --- */
            body, input, select, textarea { font-family: 'Source Sans Pro', sans-serif !important; color: #444; }
			section, #header, hr, .major { border: none !important; box-shadow: none !important; padding: 0 !important; }
            section { min-height: 100vh; display: flex; flex-direction: column; }
            #sidebar { position: fixed !important; top: 0; left: 0; height: 100vh !important; width: 18em !important; overflow: hidden !important; z-index: 10000; background: #fff; border-right: 1px solid #f2f2f2 !important; }
            #wrapper { padding-left: 18em !important; }
            .inner { padding: 2.2em 4em 0 4em !important; max-width: 1600px !important; margin: 0 auto; width: 100%; }

            /* HERO & TITULOS */
            .category-label { font-size: 0.65em; font-weight: 900; text-transform: uppercase; letter-spacing: 4px; color: #bbb; margin-bottom: 15px; display: block; }
            .hero-split { display: flex; align-items: flex-start; justify-content: space-between; gap: 4em; margin-bottom: 2em; }
            .hero-text { flex: 1.5; text-align: left; padding-top: 5px; } 
            .hero-text h1 { font-size: 4em; font-weight: 900; color: #1a1a1a; letter-spacing: -2.5px; line-height: 0.95; margin: 0; }
            
            .region-header { font-size: 0.7em; font-weight: 900; text-transform: uppercase; letter-spacing: 2px; color: #c62828; margin: 45px 0 5px 0; display: block; }
            .national-link { color: #bbb; cursor: pointer; font-weight: 400; font-size: 0.85em; display: block; text-transform: lowercase; letter-spacing: 1px; width: fit-content; border-bottom: 1px solid transparent; }
            .national-link:hover { color: #2e7d32; border-bottom-color: #eee; }

            /* CAROUSEL SMOOTH */
            .hero-visual { flex: 1; display: flex; justify-content: flex-end; }
            .hero-globe { position: relative; width: 480px; height: 480px; border-radius: 50%; overflow: hidden; box-shadow: 0 40px 100px rgba(0,0,0,0.12); background: #1a1a1a; }
            .hero-globe img { position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; transition: opacity 2s ease-in-out; opacity: 0; }
            .hero-globe img.active { opacity: 1; }

            /* DASHBOARD GAUGES */
            .impact-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 40px 30px; margin-bottom: 40px; }
            .impact-item { margin-bottom: 10px; }
            .impact-info { display: flex; justify-content: space-between; align-items: flex-end; margin-bottom: 8px; }
            .impact-info b { font-size: 0.85em; color: #1a1a1a; text-transform: uppercase; letter-spacing: 1px; }
            .impact-bar-bg { height: 4px; width: 100%; background: #eee; border-radius: 10px; position: relative; overflow: hidden; margin-bottom: 12px; }
            .impact-bar-fill { height: 100%; position: absolute; left: 0; top: 0; border-radius: 10px; transition: width 1.5s ease-in-out; }
            .impact-desc { font-size: 0.85em; line-height: 1.5; color: #777; text-align: justify; margin: 0; }

            /* PROJETOS */
            .data-row { display: block; padding: 2.5em 0; border-bottom: 1px solid #f2f2f2; }
            .data-row h4 { font-size: 0.7em; font-weight: 900; text-transform: uppercase; letter-spacing: 2px; color: #c62828; margin: 0 0 25px 0; display: block; }
            .project-item { display: flex; justify-content: flex-start; align-items: center; gap: 60px; }
            .project-main { display: flex; flex-direction: column; gap: 3px; min-width: 350px; }
            .project-name { font-weight: 700; color: #1a1a1a; font-size: 1em; }
            .project-coords { font-family: 'Courier New', Courier, monospace; font-size: 0.75em; color: #888; background: #f5f5f5; padding: 2px 8px; border-radius: 4px; width: fit-content; }
            .project-status { font-size: 0.65em; font-weight: 800; color: #bbb; text-transform: uppercase; letter-spacing: 1px; }
            .btn-toggle-detail { color: #2e7d32; cursor: pointer; font-weight: 800; margin-left: 10px; font-size: 0.9em; }
            .project-summary-text { font-size: 0.9em; line-height: 1.6; color: #666; margin: 10px 0; text-align: justify; }
            .project-detail-content { display: none; background: #fcfcfc; border-left: 2px solid #2e7d32; padding: 25px; margin: 15px 0; font-size: 0.85em; color: #555; line-height: 1.6; }
            .project-detail-content h5 { font-size: 1em; color: #1a1a1a; margin-bottom: 10px; text-transform: uppercase; font-weight: 900; }
            .source-list { margin-top: 20px; padding-top: 15px; border-top: 1px solid #eee; }
            .source-list a { display: block; color: #bbb; font-size: 0.85em; text-decoration: none; margin-bottom: 5px; text-transform: lowercase; }

            /* RELATÓRIOS */
            .report-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 40px; }
            .report-item { border-top: 1px solid #f9f9f9; padding-top: 20px; }
            .report-item h5 { font-size: 0.75em; font-weight: 900; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 12px; color: #0288d1; }
            .report-item p { font-size: 0.95em; line-height: 1.7; color: #666; margin-bottom: 15px; text-align: justify; }
            .report-source { font-size: 0.65em; font-weight: 400; color: #bbb; text-transform: uppercase; letter-spacing: 1px; display: block; border-top: 1px solid #eee; padding-top: 8px; }

            /* NOTÍCIAS */
            .news-header { margin-top: 4em; display: block; font-size: 0.65em; font-weight: 900; text-transform: uppercase; letter-spacing: 4px; color: #bbb; margin-bottom: 20px; }
            .news-list { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 30px; }
            .news-item { text-decoration: none; color: inherit; display: block; padding: 25px; background: #fdfdfd; border-radius: 12px; transition: all 0.3s; }
            .news-item:hover { transform: translateY(-5px); background: #f9f9f9; }
            .news-item h3 { font-size: 1.15em; font-weight: 700; color: #1a1a1a; margin-bottom: 12px; line-height: 1.3; }

            .btn-pagination { background: none !important; border: none !important; box-shadow: none !important; color: #bbb !important; font-size: 0.8em; letter-spacing: 3px; cursor: pointer; text-transform: lowercase; margin-top: 2em; padding: 0 !important; }
            .page-footer { margin-top: auto; padding: 2em 0 2.5em 0; border-top: 1px solid #f2f2f2; opacity: 0.3; text-align: right; }

            @media screen and (max-width: 1280px) {
                #sidebar { position: relative !important; width: 100% !important; height: auto !important; }
                #wrapper { padding-left: 0 !important; }
                .hero-split, .report-grid, .impact-grid { grid-template-columns: 1fr; }
                .hero-globe { width: 350px; height: 350px; margin: 0 auto; }
            }
		</style>
	</head>
	<body class="is-preload">
		<div id="wrapper">
			<div id="main">
                <div class="inner">
                    <section>
                        <!-- 1. HERO -->
                        <div class="hero-split">
                            <div class="hero-text">
                                <span class="category-label">Justiça Climática</span>
                                <h1>Transição Ética: O Custo do Progresso</h1>
                                
                                <h4 class="region-header">INDICADORES DE IMPACTO NEGATIVO PARA A REGIÃO DE: <span id="reg-name-caps">PORTUGAL (MÉDIA NACIONAL)</span></h4>
                                <span class="national-link" onclick="resetToNational()">(ver ambito nacional)</span>

                                <div id="ethics-dashboard" style="display:none; margin-top:40px;">
                                    <div class="tech-content">
                                        <div id="impact-container" class="impact-grid"></div>
                                    </div>
                                </div>
                            </div>
                            <div class="hero-visual">
                                <div class="hero-globe" id="globe-container"></div>
                            </div>
                        </div>

                        <!-- 2. PROJETOS -->
                        <div class="data-row">
                            <h4>Projetos e Zonas de Pressão</h4>
                            <div id="projects-list-main"></div>
                        </div>

                        <!-- 3. RELATÓRIOS -->
                        <div class="data-row">
                            <h4>Análise de Aceleração e Conflito</h4>
                            <div id="report-grid-ethics" class="report-grid"></div>
                        </div>

                        <!-- 4. NOTÍCIAS -->
                        <span class="news-header">noticias</span>
                        <div id="noticias-ethics-dinamico" class="news-list"></div>
                        <div style="text-align: left; margin-bottom: 4em;">
                            <button id="btn-load-more-ethics" class="btn-pagination">ver mais</button>
                        </div>

                        <footer class="page-footer">
                            <span style="display: block; font-size: 0.85em; font-weight: 900; color: #333;">bioCultura</span>
                        </footer>
					</section>
				</div>
            </div>
			<div id="sidebar"></div>
		</div>

		<script src="/assets/js/jquery.min.js"></script>
        <script>
            let locationsDB = [], noticiasEthics = [], allProjects = [], visiveisEthics = 4;
            
            const heroImages = [
                "https://img.iol.pt/image/id/11983815/1024.jpg",
                "https://images.unsplash.com/photo-1473341304170-971dccb5ac1e?auto=format&fit=crop&w=1024",
                "https://images.unsplash.com/photo-1466611653911-95282fc365d5?auto=format&fit=crop&w=1024",
                "https://images.unsplash.com/photo-1508514177221-188b1cf16e9d?auto=format&fit=crop&w=1024"
            ];

            const relatoriosEthics = [
                { titulo: "PFZAER: Licenciamento e Silêncio Positivo", texto: "As Zonas de Aceleração (PFZAER) introduzem o 'silêncio positivo' no licenciamento ambiental, permitindo que projetos avancem sem AIA detalhada se prazos administrativos forem excedidos.", fonte: "DGEG / APA REA 2025" },
                { titulo: "Mineração de Lítio e o Ciclo Hidrológico", texto: "A exploração de lítio exige o rebaixamento do nível freático, secando nascentes ancestrais e contaminando aquíferos com metais pesados.", fonte: "IAmbiente / IPMA 2025" },
                { titulo: "IA e a Drenagem de Recursos Hídricos", texto: "Um centro de dados de IA consome água equivalente ao abastecimento de uma cidade média, criando stress hídrico severo.", fonte: "REN Datahub / Pordata" },
                { titulo: "Impacto Social e 'Green Grabbing'", texto: "Expropriação de baldios e terras comunitárias para fins industriais energéticos sem benefício direto para as populações.", fonte: "Observatório da Coesão Territorial" }
            ];

            async function inicializarPagina() {
                try {
                    const [rLoc, rNews] = await Promise.all([
                        fetch('/data/bioregioes.json').then(r => r.json()),
                        fetch('/data/noticias.json').then(r => r.json())
                    ]);
                    locationsDB = rLoc;
                    noticiasEthics = rNews.filter(n => {
                        const keywords = ['etica', 'ética', 'justiça', 'climatica', 'contra'];
                        const text = ((n.categoria || "") + (n.titulo || "")).toLowerCase();
                        return keywords.some(k => text.includes(k));
                    });
                    
                    const savedID = localStorage.getItem('biocultura_region');
                    const info = savedID ? locationsDB.find(i => i.id === savedID) : null;
                    
                    renderDashboard(info);
                    renderizarCardsEthics();
                    renderRelatorios();
                    initCarousel();
                    setupLocationLogic();
                } catch(e) { console.error("Erro fetch:", e); }
            }

            function setupLocationLogic() {
                $(document).on('input', '#loc-search-input', function() {
                    const val = $(this).val().toLowerCase(), dropdown = $('#loc-dropdown').empty();
                    if(val.length < 2) return dropdown.hide();
                    locationsDB.filter(i => i.titulo.toLowerCase().includes(val)).slice(0,5).forEach(m => {
                        $('<div class="bio-res-item"></div>').text(m.titulo).on('click', () => {
                            localStorage.setItem('biocultura_region', m.id);
                            location.reload(); 
                        }).appendTo(dropdown);
                    });
                    dropdown.show();
                });

                $(document).on('click', '#btn-gps-trigger', function() {
                    navigator.geolocation.getCurrentPosition(pos => {
                        let closest = locationsDB[0], minD = Infinity;
                        locationsDB.forEach(c => {
                            let d = Math.sqrt(Math.pow(pos.coords.latitude - c.lat, 2) + Math.pow(pos.coords.longitude - c.lon, 2));
                            if(d < minD) { minD = d; closest = c; }
                        });
                        localStorage.setItem('biocultura_region', closest.id);
                        location.reload();
                    }, () => alert("Erro no GPS."));
                });
            }

            function resetToNational() {
                localStorage.removeItem('biocultura_region');
                location.reload();
            }

            function initCarousel() {
                const container = document.getElementById('globe-container');
                heroImages.forEach((src, idx) => {
                    const img = document.createElement('img');
                    img.src = src;
                    if(idx === 0) img.className = 'active';
                    container.appendChild(img);
                });
                let current = 0;
                setInterval(() => {
                    const imgs = container.getElementsByTagName('img');
                    imgs[current].classList.remove('active');
                    current = (current + 1) % imgs.length;
                    imgs[current].classList.add('active');
                }, 5000);
            }

            function renderDashboard(info) {
                const container = document.getElementById('impact-container');
                const titleCaps = document.getElementById('reg-name-caps');
                document.getElementById('ethics-dashboard').style.display = 'block';

                const seed = info ? info.id.length : 10;
                const data = info ? info : { titulo: "PORTUGAL (MÉDIA NACIONAL)" };
                titleCaps.innerText = data.titulo.toUpperCase();

                const impacts = (info && info.etica?.indicadores) ? info.etica.indicadores : [
                    { label: "Ocupação de Solo RAN", val: 30 + (seed % 20), color: "#8d6e63", desc: "Mede a conversão de solos de Reserva Agrícola Nacional para uso industrial." },
                    { label: "Fragmentação de Habitat", val: 20 + (seed % 15), color: "#2e7d32", desc: "Impacto em corredores ecológicos por infraestruturas energéticas." },
                    { label: "Stress Hídrico (IA)", val: 40 + (seed % 30), color: "#0288d1", desc: "Pressão hídrica para o arrefecimento de centros de dados." },
                    { label: "Oposição Social", val: 50 + (seed % 40), color: "#7b1fa2", desc: "Nível de contestação local a mega-projetos na região." }
                ];

                container.innerHTML = impacts.map(m => `
                    <div class="impact-item">
                        <div class="impact-info"><b>${m.label}</b> <span style="color:${m.color}; font-weight:900;">${m.val}%</span></div>
                        <div class="impact-bar-bg"><div class="impact-bar-fill" style="width:${m.val}%; background:${m.color}"></div></div>
                        <p class="impact-desc">${m.desc}</p>
                    </div>`).join('');

                allProjects = [
                    { 
                        id: "pszaer", nome: "Plano Setorial PSZAER", local: "Nacional / ZAER", coords: "MAPA ESTRATÉGICO 2026", status: "Consulta Encerrada (15/07/2026)",
                        resumo1: "O PSZAER identifica as áreas aptas para a instalação acelerada de projetos solares e eólicos em Portugal, garantindo um licenciamento simplificado.",
                        detalhe: "<h5>Programa Setorial das ZAER</h5><p>Nota: O prazo de discussão pública terminou ontem, 15 de Julho de 2026.</p><ul><li>RED III: Licenciamento acelerado.</li><li>Salvaguardas: Exclusão de Rede Natura 2000.</li></ul>"
                    },
                    ...(info?.etica?.projetos_criticos || [
                        { id: "litio-barroso", nome: "Mineração de Lítio", local: "Barroso (Boticas/Montalegre)", coords: "LAT 41.69 | LONG -7.66", status: "Contestado", resumo1: "Projeto de exploração mineira a céu aberto com impacto crítico no ciclo hidrológico local.", detalhe: "A exploração exige o rebaixamento do nível freático e contaminação de aquíferos." }
                    ])
                ];
                renderProjects();
            }

            function renderProjects() {
                document.getElementById('projects-list-main').innerHTML = allProjects.map(p => `
                    <div style="border-bottom: 1px solid #f9f9f9; padding: 15px 0;">
                        <div class="project-item">
                            <div class="project-main">
                                <span class="project-name">${p.nome} — ${p.local} <span class="btn-toggle-detail" onclick="toggleDetail('${p.id}')">+</span></span>
                                <span class="project-coords">${p.coords}</span>
                            </div>
                            <span class="project-status">${p.status}</span>
                        </div>
                        <p class="project-summary-text">${p.resumo1}</p>
                        <div id="detail-${p.id}" class="project-detail-content">
                            ${p.detalhe}
                            <div class="source-list">
                                <strong>Fontes Oficiais:</strong>
                                <a href="https://participa.pt" target="_blank">Participa.pt</a>
                                <a href="https://renovaveisparticipa.pt" target="_blank">Renováveis Participa</a>
                                <a href="https://www.dgeg.gov.pt" target="_blank">DGEG - Áreas de Geologia e Minas</a>
                            </div>
                            <div style="margin-top:15px;"><span class="btn-toggle-detail" onclick="toggleDetail('${p.id}')">[ fechar ]</span></div>
                        </div>
                    </div>`).join('');
            }

            function toggleDetail(id) { $(`#detail-${id}`).slideToggle(); }

            function renderRelatorios() {
                document.getElementById('report-grid-ethics').innerHTML = relatoriosEthics.map(r => `
                    <div class="report-item">
                        <h5>${r.titulo}</h5>
                        <p>${r.texto}</p>
                        <span class="report-source">Fonte: ${r.fonte}</span>
                    </div>`).join('');
            }

            function renderizarCardsEthics() {
                const container = document.getElementById('noticias-ethics-dinamico');
                if (!noticiasEthics.length) { container.innerHTML = "<p style='font-size:0.8em; color:#bbb;'>Sem notícias recentes.</p>"; return; }
                container.innerHTML = noticiasEthics.map((n, i) => `
                    <a href="/observatorio/noticia-detalhe.html?id=${n.id}" class="news-item" style="${i >= visiveisEthics ? 'display:none' : ''}">
                        <h3>${n.titulo}</h3>
                        <p>${(n.resumo_biocultura || n.resumo || "").substring(0, 110)}...</p>
                        <div class="news-meta">
                            <img src="${n.logo || '/assets/img/logo.png'}" class="source-logo">
                            <span>${n.data}</span>
                        </div>
                    </a>`).join('');
                document.getElementById('btn-load-more-ethics').style.display = noticiasEthics.length > visiveisEthics ? 'inline-block' : 'none';
            }

            document.getElementById('btn-load-more-ethics').onclick = () => { visiveisEthics += 4; renderizarCardsEthics(); };

            fetch('/sidebar-content.html').then(r => r.text()).then(html => {
                document.getElementById('sidebar').innerHTML = html;
                inicializarPagina();
            });
        </script>
	</body>
</html>
