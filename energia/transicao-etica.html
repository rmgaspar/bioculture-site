<!DOCTYPE HTML>
<html>
	<head>
		<title>bioCultura - Observatório da Transição Ética</title>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale, user-scalable=no" />
		<link rel="stylesheet" href="/assets/css/main.css" />
		<style>
            /* --- ESTRUTURA GLOBAL (PARIDADE INDEX) --- */
            body, input, select, textarea { font-family: 'Source Sans Pro', sans-serif !important; color: #444; }
			section, #header, hr, .major { border: none !important; box-shadow: none !important; padding: 0 !important; }
            section { padding-top: 3em !important; min-height: 100vh; display: flex; flex-direction: column; }

            #sidebar { position: fixed !important; top: 0; left: 0; height: 100vh !important; width: 18em !important; overflow: hidden !important; z-index: 10000; background: #fff; border-right: 1px solid #f2f2f2 !important; }
            #wrapper { padding-left: 18em !important; }

            .inner { padding: 0 4em !important; max-width: 1400px; margin: 0 auto; width: 100%; }

            .category-label { font-size: 0.65em; font-weight: 900; text-transform: uppercase; letter-spacing: 3px; color: #bbb; margin-bottom: 8px; display: block; text-align: center; }
            
            .data-row { display: block; padding: 2.5em 0; border-bottom: 1px solid #f2f2f2; }
            .data-row h4 { font-size: 0.65em; font-weight: 900; text-transform: uppercase; letter-spacing: 2px; color: #bbb; margin: 0 0 25px 0; display: block; }

            /* VETORES DE PRESSÃO (GAUGES) */
            .impact-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 30px; margin-bottom: 20px; }
            .impact-item { margin-bottom: 15px; }
            .impact-info { display: flex; justify-content: space-between; align-items: flex-end; margin-bottom: 6px; }
            .impact-info b { font-size: 1.1em; color: #1a1a1a; }
            .impact-info span { font-size: 0.95em; font-weight: 900; }
            
            /* Cores de Alerta */
            .c-soil { color: #8d6e63 !important; }
            .c-habitat { color: #2e7d32 !important; }
            .c-mining { color: #c62828 !important; }
            .c-social { color: #7b1fa2 !important; }
            .c-water-ia { color: #0288d1 !important; }

            .impact-bar-bg { height: 6px; width: 100%; background: #eee; border-radius: 10px; position: relative; overflow: hidden; }
            .impact-bar-fill { height: 100%; position: absolute; left: 0; top: 0; border-radius: 10px; transition: width 1.5s ease-in-out; }
            .fill-soil { background: #8d6e63; }
            .fill-habitat { background: #2e7d32; }
            .fill-mining { background: #c62828; }
            .fill-social { background: #7b1fa2; }

            /* INFRAESTRUTURA CRÍTICA */
            .project-item { padding: 12px 0; border-bottom: 1px solid #f9f9f9; display: flex; justify-content: space-between; align-items: center; }
            .project-main { display: flex; flex-direction: column; }
            .project-name { font-weight: 700; color: #333; font-size: 0.95em; }
            .project-scale { font-size: 0.75em; color: #777; font-weight: 600; margin-top: 2px; }
            .project-status { font-size: 0.65em; font-weight: 800; color: #bbb; text-transform: uppercase; letter-spacing: 1px; }
            .btn-toggle { cursor: pointer; color: #bbb; font-size: 1.5em; font-weight: 300; transition: color 0.2s; user-select: none; }

            /* RELATÓRIOS (DETALHADOS) */
            .report-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 40px; }
            .report-item { border-top: 1px solid #f9f9f9; padding-top: 20px; }
            .report-item h5 { font-size: 0.75em; font-weight: 900; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 12px; }
            .report-item p { font-size: 0.95em; line-height: 1.7; color: #666; margin-bottom: 15px; text-align: justify; }
            .report-source { font-size: 0.65em; font-weight: 400; color: #bbb; text-transform: uppercase; letter-spacing: 1px; display: block; border-top: 1px solid #eee; padding-top: 8px; }

            /* NOTÍCIAS (ESTILO INDEX) */
            .news-list { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 30px; margin-bottom: 4em; }
            .news-item { 
                text-decoration: none; color: inherit; display: block; 
                padding: 25px; background: #fdfdfd; border: 1px solid #f2f2f2; 
                border-radius: 12px; transition: all 0.3s; 
            }
            .news-item:hover { transform: translateY(-5px); border-color: #ddd; }
            .news-item h3 { font-size: 1.15em; font-weight: 700; color: #1a1a1a; margin-bottom: 12px; line-height: 1.3; min-height: 2.6em; }
            .news-item p { font-size: 0.9em; color: #777; line-height: 1.5; margin-bottom: 15px; }
            .news-meta { display: flex; align-items: center; gap: 10px; border-top: 1px solid #f9f9f9; padding-top: 12px; }
            .source-logo { width: 16px; height: 16px; object-fit: contain; filter: grayscale(100%); opacity: 0.6; }
            .news-meta span { font-size: 0.65em; font-weight: 800; color: #bbb; text-transform: uppercase; letter-spacing: 1px; }

            /* BOTÃO SEM BORDAS */
            .btn-pagination { background: none !important; border: none !important; box-shadow: none !important; color: #bbb !important; font-size: 0.75em; font-weight: 900; letter-spacing: 3px; cursor: pointer; text-transform: lowercase; }

            .bio-res-item { padding: 12px 18px; font-size: 0.9em; color: #666; cursor: pointer; border-bottom: 1px solid #f9f9f9 !important; }

            @media screen and (max-width: 1280px) {
                #sidebar { position: relative !important; width: 100% !important; height: auto !important; }
                #wrapper { padding-left: 0 !important; }
                .report-grid { grid-template-columns: 1fr; }
            }
		</style>
	</head>
	<body class="is-preload">
		<div id="wrapper">
			<div id="main">
                <div class="inner">
                    <section>
                        <div style="text-align: center; margin-bottom: 3em;">
                            <span class="category-label">Justiça Climática</span>
                            <h1 style="font-size: 3.5em; font-weight: 300; color: #1a1a1a; letter-spacing: -2px; margin: 0;">Transição Ética: O Custo do Progresso</h1>
                            <p style="font-size: 0.9em; font-style: italic; color: #bbb;">Impacto territorial: <strong id="reg-name" style="color:#888">...</strong></p>
                        </div>

                        <!-- 1. VETORES DE PRESSÃO TERRITORIAL -->
                        <div id="ethics-dashboard" class="data-row" style="display:none;">
                            <h4>Indicadores de Impacto Negativo</h4>
                            <div class="tech-content">
                                <div id="impact-container" class="impact-grid"></div>
                            </div>
                        </div>

                        <!-- 2. PROJETOS CRÍTICOS / PFZAER -->
                        <div class="data-row">
                            <h4>Projetos e Zonas de Pressão</h4>
                            <div class="tech-content">
                                <div id="projects-list-main"></div>
                                <div style="display: flex; gap: 20px; margin-top: 15px;">
                                    <span id="btn-expand-projects" class="btn-toggle">+</span>
                                    <span id="btn-collapse-projects" class="btn-toggle" style="display:none;">-</span>
                                </div>
                            </div>
                        </div>

                        <!-- 3. RELATÓRIOS CRÍTICOS -->
                        <div class="data-row">
                            <h4>Relatório de Transição Crítica</h4>
                            <div class="tech-content">
                                <h3 style="margin: 0 0 10px 0; font-weight: 300; font-size: 2em;">Análise de Aceleração e Conflito 2025/2026</h3>
                                <div id="report-grid-ethics" class="report-grid"></div>
                            </div>
                        </div>

                        <!-- 4. NOTÍCIAS -->
                        <div class="data-row" style="border-bottom: none;">
                            <h4>Notícias e Conflitos Locais</h4>
                            <div class="tech-content">
                                <div id="noticias-ethics-dinamico" class="news-list"></div>
                                <div style="text-align: center; margin-top: 3em;">
                                    <button id="btn-load-more-ethics" class="btn-pagination">ver mais</button>
                                </div>
                            </div>
                        </div>

                        <footer class="page-footer" style="margin-top:4em; padding-top:2em; border-top:1px solid #f2f2f2; opacity:0.3; text-align:right;">
                            <span style="display: block; font-size: 0.85em; font-weight: 900; color: #333;">bioCultura</span>
                            <span style="display: block; font-size: 0.5em; font-weight: 700; text-transform: uppercase; letter-spacing: 1px;">Global Regeneration</span>
                        </footer>
					</section>
				</div>
            </div>
			<div id="sidebar"></div>
		</div>

		<script src="/assets/js/jquery.min.js"></script>
        <script>
            let locationsDB = [], noticiasEthics = [], allProjects = [], visiveisEthics = 4;

            const relatoriosEthics = [
                { 
                    titulo: "PFZAER e a Perda de Solo Fértil", 
                    texto: "As Zonas de Aceleração de Energias Renováveis (PFZAER) permitem a instalação de gigaparques solares com processos de licenciamento simplificados. A APA e a DGEG admitem que isto coloca em risco áreas de Reserva Agrícola Nacional (RAN), onde a impermeabilização do solo por painéis impede a regeneração natural e destrói ecossistemas de pastoreio.", 
                    fonte: "DGEG / APA REA 2025", cor: "#8d6e63" 
                },
                { 
                    titulo: "Mineração de Lítio e Água", 
                    texto: "A estratégia nacional para o Lítio em zonas como Boticas e Montalegre enfrenta forte oposição. Os relatórios técnicos apontam para um consumo massivo de água doce no processamento mineiro e riscos de contaminação de aquíferos por metais pesados, afetando diretamente a biodiversidade e a agricultura local.", 
                    fonte: "Portal Energia / IAmbiente", cor: "#c62828" 
                },
                { 
                    titulo: "Data Centers e Drenagem Energética", 
                    texto: "A expansão de mega Data Centers de IA em Sines e arredores de Lisboa consome energia equivalente a cidades inteiras. Este 'roubo' de carga renovável da rede nacional obriga à manutenção de centrais a gás como backup, anulando parte do esforço de descarbonização e pressionando os preços para o consumidor doméstico.", 
                    fonte: "REN Datahub / Pordata", cor: "#0288d1" 
                },
                { 
                    titulo: "Impacto Social e Despovoamento", 
                    texto: "A instalação de infraestruturas industriais em zonas rurais raramente gera emprego local qualificado após a fase de construção. Pelo contrário, o impacto visual e a desvalorização de terrenos agrícolas aceleram o abandono do interior, criando 'desertos verdes' de painéis solares onde antes existia vida comunitária.", 
                    fonte: "Pordata / Portugal Global", cor: "#7b1fa2" 
                }
            ];

            async function inicializarPagina() {
                try {
                    const [rLoc, rNews] = await Promise.all([
                        fetch('/data/bioregioes.json').then(r => r.json()),
                        fetch('/data/noticias.json').then(r => r.json())
                    ]);
                    locationsDB = rLoc;
                    // Filtra notícias por 'etica' ou termos relacionados a conflitos energéticos
                    noticiasEthics = rNews.filter(n => 
                        (n.categoria || "").toLowerCase().includes('etica') || 
                        (n.titulo || "").toLowerCase().includes('contra') ||
                        (n.titulo || "").toLowerCase().includes('conflito')
                    );
                    
                    const savedId = localStorage.getItem('biocultura_region') || "proenca-a-nova";
                    const info = locationsDB.find(i => i.id === savedId);
                    
                    renderDashboard(info);
                    renderRelatorios();
                    renderizarCardsEthics();
                    setupLocationLogic();
                } catch(e) { console.error("Erro no carregamento:", e); }
            }

            function setupLocationLogic() {
                $(document).on('input', '#loc-search-input', function() {
                    const val = $(this).val().toLowerCase(), dropdown = $('#loc-dropdown').empty();
                    if(val.length < 2) return dropdown.hide();
                    locationsDB.filter(i => i.titulo.toLowerCase().includes(val)).slice(0,5).forEach(m => {
                        $('<div class="bio-res-item"></div>').text(m.titulo).on('click', () => { localStorage.setItem('biocultura_region', m.id); location.reload(); }).appendTo(dropdown);
                    });
                    dropdown.show();
                });
            }

            function renderDashboard(info) {
                if(!info) return;
                document.getElementById('ethics-dashboard').style.display = 'block';
                document.getElementById('reg-name').innerText = info.titulo;

                // Indicadores de Pressão (Simulados para a região)
                const impacts = info.etica?.indicadores || [
                    { label: "Ocupação de Solo RAN", val: 42, class: "fill-soil", textClass: "c-soil" },
                    { label: "Fragmentação de Habitat", val: 28, class: "fill-habitat", textClass: "c-habitat" },
                    { label: "Risco de Stress Hídrico (IA)", val: 65, class: "fill-mining", textClass: "c-mining" },
                    { label: "Oposição Social Local", val: 85, class: "fill-social", textClass: "c-social" }
                ];

                document.getElementById('impact-container').innerHTML = impacts.map(m => `
                    <div class="impact-item">
                        <div class="impact-info"><b>${m.label}</b> <span class="${m.textClass}">${m.val}%</span></div>
                        <div class="impact-bar-bg"><div class="impact-bar-fill ${m.class}" style="width: ${m.val}%"></div></div>
                    </div>`).join('');

                allProjects = info.etica?.projetos_criticos || [
                    { nome: "Central Fotovoltaica de Grande Escala", escala: "150 Hectares", status: "Em Licenciamento" },
                    { nome: "Zona de Aceleração PFZAER Norte", escala: "Área Estratégica", status: "Planeado" },
                    { nome: "Projeto de Mineração em Proximidade", escala: "Impacto Local", status: "Contestado" },
                    { nome: "Infraestrutura de Transporte AT", escala: "40km de Linhas", status: "Em Estudo" }
                ];
                renderProjects(false);
            }

            function renderProjects(expand) {
                const show = expand ? allProjects : allProjects.slice(0, 3);
                document.getElementById('projects-list-main').innerHTML = show.map(p => `
                    <div class="project-item">
                        <div class="project-main">
                            <span class="project-name">${p.nome}</span>
                            <span class="project-scale">${p.escala}</span>
                        </div>
                        <span class="project-status">${p.status}</span>
                    </div>`).join('');
                document.getElementById('btn-expand-projects').style.display = (!expand && allProjects.length > 3) ? 'block' : 'none';
                document.getElementById('btn-collapse-projects').style.display = expand ? 'block' : 'none';
            }

            function renderRelatorios() {
                document.getElementById('report-grid-ethics').innerHTML = relatoriosEthics.map(r => `
                    <div class="report-item">
                        <h5 style="color: ${r.cor}">${r.titulo}</h5>
                        <p>${r.texto}</p>
                        <span class="report-source">Fonte: ${r.fonte}</span>
                    </div>`).join('');
            }

            function renderizarCardsEthics() {
                document.getElementById('noticias-ethics-dinamico').innerHTML = noticiasEthics.map((n, i) => `
                    <a href="/observatorio/noticia-detalhe.html?id=${n.id}" class="news-item ${i >= visiveisEthics ? 'hidden-card' : ''}" style="${i >= visiveisEthics ? 'display:none' : ''}">
                        <h3>${n.titulo}</h3>
                        <p>${(n.resumo_biocultura || n.resumo || "").substring(0, 110)}...</p>
                        <div class="news-meta">
                            <img src="${n.logo}" class="source-logo">
                            <span>${n.data}</span>
                        </div>
                    </a>`).join('');
                document.getElementById('btn-load-more-ethics').style.display = noticiasEthics.length > visiveisEthics ? 'inline-block' : 'none';
            }

            document.getElementById('btn-expand-projects').onclick = () => renderProjects(true);
            document.getElementById('btn-collapse-projects').onclick = () => renderProjects(false);
            document.getElementById('btn-load-more-ethics').onclick = () => { visiveisEthics += 4; renderizarCardsEthics(); };

            fetch('/sidebar-content.html').then(r => r.text()).then(html => {
                document.getElementById('sidebar').innerHTML = html;
                inicializarPagina();
            });
        </script>
	</body>
</html>
