<!DOCTYPE HTML>
<html>
	<head>
		<title>bioCultura - Observatório da Transição Ética</title>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
		<link rel="stylesheet" href="/assets/css/main.css" />
		<style>
            /* --- ESTRUTURA GLOBAL --- */
            body, input, select, textarea { font-family: 'Source Sans Pro', sans-serif !important; color: #444; }
			section, #header, hr, .major { border: none !important; box-shadow: none !important; padding: 0 !important; }
            section { min-height: 100vh; display: flex; flex-direction: column; }

            #sidebar { position: fixed !important; top: 0; left: 0; height: 100vh !important; width: 18em !important; overflow: hidden !important; z-index: 10000; background: #fff; border-right: 1px solid #f2f2f2 !important; }
            #wrapper { padding-left: 18em !important; }

            .inner { padding: 2.2em 4em 0 4em !important; max-width: 1600px !important; margin: 0 auto; width: 100%; }
            .category-label { font-size: 0.65em; font-weight: 900; text-transform: uppercase; letter-spacing: 4px; color: #bbb; margin-bottom: 15px; display: block; }

            /* HERO SPLIT */
            .hero-split { display: flex; align-items: flex-start; justify-content: space-between; gap: 4em; margin-bottom: 2em; }
            .hero-text { flex: 1.5; text-align: left; padding-top: 5px; } 
            .hero-text h1 { font-size: 4em; font-weight: 900; color: #1a1a1a; letter-spacing: -2.5px; line-height: 0.95; margin: 0 0 20px 0; }
            
            .hero-visual { flex: 1; display: flex; justify-content: flex-end; }
            .hero-globe { 
                position: relative; 
                width: 480px; height: 480px; 
                border-radius: 50%; overflow: hidden; 
                box-shadow: 0 40px 100px rgba(0,0,0,0.12); 
                background: #1a1a1a;
            }
            .hero-globe img { width: 100%; height: 100%; object-fit: cover; }

            .data-row { display: block; padding: 2.5em 0; border-bottom: 1px solid #f2f2f2; }
            .data-row h4 { font-size: 0.7em; font-weight: 900; text-transform: uppercase; letter-spacing: 2px; color: #1a1a1a; margin: 0 0 25px 0; display: block; }

            /* GAUGES DE IMPACTO */
            .impact-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 20px; max-width: 800px; }
            .impact-item { margin-bottom: 10px; }
            .impact-info { display: flex; justify-content: space-between; align-items: flex-end; margin-bottom: 6px; }
            .impact-info b { font-size: 1em; color: #1a1a1a; }
            .impact-info span { font-size: 0.85em; font-weight: 900; }
            
            .c-soil { color: #8d6e63 !important; }
            .c-habitat { color: #2e7d32 !important; }
            .c-water-ia { color: #0288d1 !important; }
            .c-social { color: #7b1fa2 !important; }

            .impact-bar-bg { height: 5px; width: 100%; background: #eee; border-radius: 10px; position: relative; overflow: hidden; }
            .impact-bar-fill { height: 100%; position: absolute; left: 0; top: 0; border-radius: 10px; transition: width 1.5s ease-in-out; }
            .fill-soil { background: #8d6e63; }
            .fill-habitat { background: #2e7d32; }
            .fill-water { background: #0288d1; }
            .fill-social { background: #7b1fa2; }

            /* PROJETOS E ZONAS DE PRESSÃO */
            .project-wrap { margin-bottom: 25px; border-bottom: 1px solid #f9f9f9; padding-bottom: 20px; }
            .project-item { display: flex; justify-content: space-between; align-items: center; gap: 40px; }
            .project-main { display: flex; flex-direction: column; gap: 2px; flex: 1; }
            
            /* Título Chamativo */
            .project-name { font-weight: 900; color: #d32f2f !important; font-size: 1.15em; cursor: pointer; text-transform: uppercase; letter-spacing: -0.5px; }
            .project-loc { font-size: 0.85em; color: #444; font-weight: 600; }
            .project-coords { font-family: monospace; font-size: 0.75em; color: #aaa; }
            .project-status { font-size: 0.65em; font-weight: 800; color: #bbb; text-transform: uppercase; border: 1px solid #eee; padding: 2px 8px; border-radius: 4px; }

            /* Painéis de Informação */
            .info-panel { display: none; background: #fcfcfc; border-left: 3px solid #d32f2f; padding: 20px; margin-top: 15px; border-radius: 0 8px 8px 0; }
            .resumo-simples { font-size: 0.95em; color: #333; font-weight: 600; line-height: 1.5; margin-bottom: 12px; }
            .resumo-completo { display: none; font-size: 0.9em; color: #666; line-height: 1.7; padding-top: 15px; border-top: 1px solid #eee; text-align: justify; }

            .btn-info-toggle, .btn-ver-tudo { 
                font-size: 0.7em; font-weight: 900; text-transform: uppercase; 
                letter-spacing: 1px; cursor: pointer; color: #999; transition: all 0.2s;
            }
            .btn-info-toggle:hover, .btn-ver-tudo:hover { color: #d32f2f; }

            /* RESTANTE ESTILO MANTIDO */
            .report-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 40px; }
            .report-item { border-top: 1px solid #f9f9f9; padding-top: 20px; }
            .report-item h5 { font-size: 0.75em; font-weight: 900; text-transform: uppercase; color: #c62828; margin-bottom: 12px; }
            .report-item p { font-size: 0.95em; line-height: 1.7; color: #666; text-align: justify; }

            .news-list { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 30px; }
            .news-item { text-decoration: none; color: inherit; display: block; padding: 25px; background: #fdfdfd; border-radius: 12px; transition: all 0.3s; }
            .news-item:hover { transform: translateY(-5px); background: #f9f9f9; }
            .btn-pagination { background: none !important; border: none !important; color: #bbb !important; font-size: 0.8em; letter-spacing: 3px; cursor: pointer; text-transform: lowercase; margin-top: 2em; }

            @media screen and (max-width: 1280px) {
                #sidebar { position: relative !important; width: 100% !important; height: auto !important; }
                #wrapper { padding-left: 0 !important; }
                .hero-split, .report-grid { grid-template-columns: 1fr; }
            }
		</style>
	</head>
	<body class="is-preload">
		<div id="wrapper">
			<div id="main">
                <div class="inner">
                    <section>
                        <div class="hero-split">
                            <div class="hero-text">
                                <span class="category-label">Justiça Climática</span>
                                <h1>Transição Ética: O Custo do Progresso</h1>
                                <p style="font-size: 0.9em; font-style: italic; color: #bbb; margin-bottom: 30px;">Impacto territorial: <strong id="reg-name" style="color:#888">...</strong></p>

                                <div id="ethics-dashboard" style="display:none;">
                                    <h4>Indicadores de Impacto Negativo</h4>
                                    <div id="impact-container" class="impact-grid"></div>
                                </div>
                            </div>
                            <div class="hero-visual">
                                <div class="hero-globe">
                                    <img src="https://img.iol.pt/image/id/11983815/1024.jpg" alt="Impacto Territorial">
                                </div>
                            </div>
                        </div>

                        <!-- PROJETOS DINÂMICOS -->
                        <div class="data-row">
                            <h4>Projetos e Zonas de Pressão</h4>
                            <div id="projects-list-main"></div>
                            <button id="btn-expand-projects" class="btn-pagination" style="display:none;">ver todos os projetos</button>
                        </div>

                        <div class="data-row">
                            <h4>Análise de Aceleração e Conflito</h4>
                            <div id="report-grid-ethics" class="report-grid"></div>
                        </div>

                        <span class="news-header" style="margin-top:4em; display:block">noticias</span>
                        <div id="noticias-ethics-dinamico" class="news-list"></div>
                        <button id="btn-load-more-ethics" class="btn-pagination">ver mais noticias</button>

                        <footer class="page-footer" style="padding: 4em 0; opacity: 0.3; text-align: right;">
                            <span style="display: block; font-size: 0.85em; font-weight: 900;">bioCultura</span>
                            <span style="display: block; font-size: 0.5em; font-weight: 700; text-transform: uppercase;">Global Regeneration</span>
                        </footer>
					</section>
				</div>
            </div>
			<div id="sidebar"></div>
		</div>

		<script src="/assets/js/jquery.min.js"></script>
        <script>
            let locationsDB = [], noticiasEthics = [], allProjects = [], visiveisEthics = 4;

            const relatoriosEthics = [
                { titulo: "PSZAER: O Paradoxo da Aceleração", texto: "A proposta de Zonas de Aceleração foca-se em Solar e Eólico Onshore. Embora vise a simplificação, o relatório jurídico alerta para o risco de 'silêncio positivo', onde projetos avançam sem escrutínio se os prazos de 45 dias forem excedidos.", fonte: "Relatório Jurídico AMMC / bioCultura 2026" },
                { titulo: "Impacto no Solo e Paisagem", texto: "O Pinhal do Centro é o maior hotspot, com 34% de potencial solar. As diretrizes exigem agora compartimentação vegetal de 40m para evitar a fragmentação total de habitats de quercíneas.", fonte: "Relatório Paisagem Biodesign 2026" }
            ];

            async function inicializarPagina() {
                try {
                    const [rLoc, rNews] = await Promise.all([
                        fetch('/data/bioregioes.json').then(r => r.json()),
                        fetch('/data/noticias.json').then(r => r.json())
                    ]);
                    locationsDB = rLoc;
                    noticiasEthics = rNews.filter(n => (n.categoria || "").toLowerCase().includes('etica'));
                    const info = locationsDB.find(i => i.id === (localStorage.getItem('biocultura_region') || "proenca-a-nova"));
                    
                    renderDashboard(info);
                    renderizarCardsEthics();
                    renderRelatorios();
                } catch(e) { console.error(e); }
            }

            function renderDashboard(info) {
                if(!info) return;
                document.getElementById('reg-name').innerText = info.titulo;
                document.getElementById('ethics-dashboard').style.display = 'block';

                const impacts = info.etica?.indicadores || [];
                document.getElementById('impact-container').innerHTML = impacts.map(m => `
                    <div class="impact-item">
                        <div class="impact-info"><b>${m.label}</b> <span class="${m.textClass}">${m.val}%</span></div>
                        <div class="impact-bar-bg"><div class="impact-bar-fill ${m.class}" style="width: ${m.val}%"></div></div>
                    </div>`).join('');

                allProjects = info.etica?.projetos_criticos || [];
                renderProjects(false);
            }

            function renderProjects(expand) {
                const show = expand ? allProjects : allProjects.slice(0, 3);
                document.getElementById('projects-list-main').innerHTML = show.map((p, i) => `
                    <div class="project-wrap">
                        <div class="project-item">
                            <div class="project-main">
                                <span class="project-name" onclick="togglePanel(${i})">${p.nome}</span>
                                <span class="project-loc">${p.local}</span>
                                <span class="project-coords">${p.coords}</span>
                            </div>
                            <div style="display:flex; align-items:center; gap:20px;">
                                <span class="project-status">${p.status}</span>
                                <span class="btn-info-toggle" onclick="togglePanel(${i})">+ info</span>
                            </div>
                        </div>
                        <div id="panel-${i}" class="info-panel">
                            <div class="resumo-simples">${p.resumo_simples || 'Análise de impacto em curso para esta zona de pressão.'}</div>
                            <span class="btn-ver-tudo" id="btn-tudo-${i}" onclick="toggleFull(${i})">+ ver relatório completo</span>
                            <div id="full-${i}" class="resumo-completo">${p.resumo_completo || ''}</div>
                        </div>
                    </div>`).join('');
                
                const btn = document.getElementById('btn-expand-projects');
                btn.style.display = allProjects.length > 3 ? 'block' : 'none';
                btn.innerText = expand ? "ver menos" : "ver todos os projetos";
                btn.onclick = () => renderProjects(!expand);
            }

            // Funções de Interação
            window.togglePanel = function(idx) {
                $(`#panel-${idx}`).slideToggle(300);
            };

            window.toggleFull = function(idx) {
                $(`#full-${idx}`).slideToggle(300);
                const btn = document.getElementById(`btn-tudo-${idx}`);
                btn.innerText = btn.innerText.includes("COMPLETO") ? "- fechar detalhes" : "+ ver relatório completo";
            };

            function renderRelatorios() {
                document.getElementById('report-grid-ethics').innerHTML = relatoriosEthics.map(r => `
                    <div class="report-item">
                        <h5>${r.titulo}</h5>
                        <p>${r.texto}</p>
                        <span class="report-source">Fonte: ${r.fonte}</span>
                    </div>`).join('');
            }

            function renderizarCardsEthics() {
                const container = document.getElementById('noticias-ethics-dinamico');
                container.innerHTML = noticiasEthics.slice(0, visiveisEthics).map(n => `
                    <a href="/observatorio/noticia-detalhe.html?id=${n.id}" class="news-item">
                        <h3>${n.titulo}</h3>
                        <p>${(n.resumo_biocultura || n.resumo || "").substring(0, 110)}...</p>
                        <div class="news-meta"><span>${n.data}</span></div>
                    </a>`).join('');
                document.getElementById('btn-load-more-ethics').style.display = noticiasEthics.length > visiveisEthics ? 'inline-block' : 'none';
            }

            document.getElementById('btn-load-more-ethics').onclick = () => { visiveisEthics += 4; renderizarCardsEthics(); };

            fetch('/sidebar-content.html').then(r => r.text()).then(html => {
                document.getElementById('sidebar').innerHTML = html;
                inicializarPagina();
            });
        </script>
	</body>
</html>
