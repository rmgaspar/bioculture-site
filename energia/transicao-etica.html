<!DOCTYPE HTML>
<html>
	<head>
		<title>bioCultura - Transição Ética & Auditoria</title>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale, user-scalable=no" />
		<link rel="stylesheet" href="/assets/css/main.css" />
		<style>
            body, input, select, textarea { font-family: 'Source Sans Pro', sans-serif !important; color: #444; }
			section, #header, hr, .major { border: none !important; box-shadow: none !important; padding: 0 !important; }
            section { padding-top: 4em !important; display: flex; flex-direction: column; }

            #sidebar { position: fixed !important; top: 0; left: 0; height: 100vh !important; width: 18em !important; overflow: hidden !important; z-index: 10000; background: #fff; border-right: 1px solid #f2f2f2 !important; }
            #wrapper { padding-left: 18em !important; }

            /* ÍNDICE DE FRAGILIDADE REGIONAL */
            .fragility-dashboard { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; margin-bottom: 3em; }
            .fragility-card { background: #f9f9f9; padding: 1.5em; border-radius: 20px; border: 1px solid #eee; }
            .fragility-card span { font-size: 0.6em; font-weight: 900; text-transform: uppercase; color: #bbb; display: block; }
            .fragility-card b { font-size: 1.2em; color: #1a1a1a; display: block; margin-top: 5px; }

            /* TABELA DE AUDITORIA ÉTICA */
            .audit-table { width: 100%; border-collapse: collapse; margin-top: 1em; }
            .audit-table th { text-align: left; color: #bbb; text-transform: uppercase; font-size: 0.6em; letter-spacing: 1px; padding: 15px 10px; }
            .audit-table td { padding: 20px 10px; font-size: 0.85em; border-bottom: 1px solid #f9f9f9; vertical-align: top; }
            
            .status-badge { font-size: 0.6em; padding: 3px 8px; border-radius: 4px; font-weight: 900; text-transform: uppercase; }
            .status-monitoring { background: #e3f2fd; color: #1565c0; } /* Azul: Em Monitorização */
            .status-critical { background: #ffebee; color: #c62828; }    /* Vermelho: Impacto Crítico */
            
            .impact-vector { color: #ef5350; font-weight: 600; display: block; margin-top: 4px; font-size: 0.9em; }
            .mitigation-measure { color: #4caf50; font-size: 0.8em; font-style: italic; display: block; margin-top: 4px; }

            .section-break { margin: 3em 0 1em 0; padding: 2em 0; border-top: 2px solid #f2f2f2; text-align: center; }
            .section-break h2 { font-size: 2em; font-weight: 300; color: #1a1a1a; letter-spacing: -1px; margin: 0; }

            @media screen and (max-width: 1280px) {
                #sidebar { position: relative !important; width: 100% !important; }
                #wrapper { padding-left: 0 !important; }
                .fragility-dashboard { grid-template-columns: 1fr; }
            }
		</style>
	</head>
	<body class="is-preload">
		<div id="wrapper">
			<div id="main">
                <div class="inner">
                    <section>
                        <div style="text-align: center; margin-bottom: 4em;">
                            <span class="category-label">Auditoria de Transição</span>
                            <h1 style="font-size: 3.5em; font-weight: 300; color: #1a1a1a; letter-spacing: -2px; margin: 0;">Transição Ética</h1>
                            <p style="font-size: 0.9em; font-style: italic; color: #bbb; margin-top: 5px;">Balanço entre descarbonização industrial e preservação vital em <strong id="reg-name">...</strong></p>
                        </div>

                        <!-- FRAGILIDADE DA BIOREGIÃO -->
                        <div class="fragility-dashboard">
                            <div class="fragility-card"><span>Resiliência do Solo</span><b id="audit-soil">--</b></div>
                            <div class="fragility-card"><span>Saturação Atmosférica</span><b id="audit-air">--</b></div>
                            <div class="fragility-card"><span>Pressão Territorial</span><b id="audit-pressure">--</b></div>
                        </div>

                        <div class="section-break">
                            <span class="sub-label">Auditoria de Infraestruturas</span>
                            <h2>Vetores de Impacto Local</h2>
                        </div>

                        <table class="audit-table">
                            <thead>
                                <tr>
                                    <th>Infraestrutura</th>
                                    <th>Estatuto / Distância</th>
                                    <th>Análise de Impacto Ético</th>
                                </tr>
                            </thead>
                            <tbody id="lista-auditoria">
                                <!-- Dinâmico -->
                            </tbody>
                        </table>
                    </section>
                </div>
            </div>
			<div id="sidebar"></div>
		</div>

		<script src="/assets/js/jquery.min.js"></script>
        <script>
            let locationsDB = [], allPlants = [], airData = [], soilData = [];

            const auditMapping = {
                "Eólica": { vector: "Fragmentação de habitat e impacto em avifauna.", measure: "Medida: Sistemas de deteção e paragem automática.", status: "status-monitoring", statusText: "Monitorizado" },
                "Solar": { vector: "Impermeabilização de solos e perda de biodiversidade terrestre.", measure: "Medida: Implementação de corredores biológicos entre painéis.", status: "status-monitoring", statusText: "Em Auditoria" },
                "Hídrica": { vector: "Barreira física fluvial e alteração de sedimentos.", measure: "Medida: Caudais ecológicos e escadas de peixe.", status: "status-monitoring", statusText: "Regulado" },
                "Gás Natural": { vector: "Emissões térmicas e consumo intensivo de água.", measure: "Medida: Plano de desativação progressiva 2030.", status: "status-critical", statusText: "Crítico" }
            };

            function calcularDistancia(lat1, lon1, lat2, lon2) {
                const R = 6371;
                const dLat = (lat2 - lat1) * Math.PI / 180;
                const dLon = (lon2 - lon1) * Math.PI / 180;
                const a = Math.sin(dLat/2) * Math.sin(dLat/2) + Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) * Math.sin(dLon/2) * Math.sin(dLon/2);
                return R * (2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a)));
            }

            async function inicializar() {
                try {
                    const [rLoc, rPlants, rAir, rSoil] = await Promise.all([
                        fetch('/data/bioregioes.json').then(r => r.json()),
                        fetch('/data/centrais_full.json').then(r => r.json()),
                        fetch('/data/qualidade_ar.json').then(r => r.json()),
                        fetch('/data/solo_stats.json').then(r => r.json())
                    ]);
                    locationsDB = rLoc; allPlants = rPlants; airData = rAir; soilData = rSoil;
                    const savedId = localStorage.getItem('biocultura_region') || "proenca-a-nova";
                    renderDashboard(locationsDB.find(i => i.id === savedId));
                } catch(e) { console.error(e); }
            }

            function renderDashboard(info) {
                if(!info) return;
                document.getElementById('reg-name').innerText = info.titulo;

                // 1. Cruzamento de Dados (Solo e Ar)
                const sLocal = soilData.reduce((prev, curr) => (calcularDistancia(info.lat, info.lon, curr.lat, curr.lon) < calcularDistancia(info.lat, info.lon, prev.lat, prev.lon) ? curr : prev));
                const aLocal = airData.reduce((prev, curr) => (calcularDistancia(info.lat, info.lon, curr.lat, curr.lon) < calcularDistancia(info.lat, info.lon, prev.lat, prev.lon) ? curr : prev));
                
                document.getElementById('audit-soil').innerText = sLocal.erosao + " (MO " + sLocal.materia_organica + "%)";
                document.getElementById('audit-air').innerText = aLocal.indice + " (QualAr)";

                // 2. Auditoria de Centrais (Agrupamento e Foco Ético)
                const clusters = {};
                allPlants.forEach(p => {
                    const d = calcularDistancia(info.lat, info.lon, p.lat, p.lon);
                    if(d < 30) {
                        const base = p.nome.replace(/\s(I|II|III|IV|V|VI|VII|VIII|IX|X)$/, "").trim();
                        if(!clusters[base] || d < clusters[base].dist) clusters[base] = { ...p, dist: d };
                    }
                });

                const sorted = Object.values(clusters).sort((a,b) => a.dist - b.dist).slice(0, 5);
                document.getElementById('audit-pressure').innerText = sorted.length + " Infraestruturas";

                document.getElementById('lista-auditoria').innerHTML = sorted.map(p => {
                    const audit = auditMapping[p.tipo] || { vector: "Impacto sob análise.", measure: "A aguardar parecer técnico.", status: "status-monitoring", statusText: "Pendente" };
                    return `
                        <tr>
                            <td><b>${p.nome}</b><br><small style="color:#bbb">${p.tipo}</small></td>
                            <td><span class="status-badge ${audit.status}">${audit.statusText}</span><br><b>${p.dist.toFixed(1)} KM</b></td>
                            <td>
                                <span class="impact-vector">${audit.vector}</span>
                                <span class="mitigation-measure">${audit.measure}</span>
                            </td>
                        </tr>
                    `;
                }).join('');
            }

            fetch('/sidebar-content.html').then(r => r.text()).then(html => {
                document.getElementById('sidebar').innerHTML = html;
                inicializar();
                const s = document.createElement('script'); s.src = '/assets/js/main.js'; document.body.appendChild(s);
            });
        </script>
	</body>
</html>
