<!DOCTYPE HTML>
<html>
	<head>
		<title>bioCultura - Mineração & Custo Oculto</title>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale, user-scalable=no" />
		<link rel="stylesheet" href="/assets/css/main.css" />
		<style>
            body, input, select, textarea { font-family: 'Source Sans Pro', sans-serif !important; color: #444; }
			section, #header, hr, .major { border: none !important; box-shadow: none !important; padding: 0 !important; }
            section { padding-top: 4em !important; min-height: 100vh; display: flex; flex-direction: column; }

            #sidebar { position: fixed !important; top: 0; left: 0; height: 100vh !important; width: 18em !important; overflow: hidden !important; z-index: 10000; background: #fff; border-right: 1px solid #f2f2f2 !important; }
            #wrapper { padding-left: 18em !important; }

            .category-label { font-size: 0.65em; font-weight: 900; text-transform: uppercase; letter-spacing: 3px; color: #bbb; margin-bottom: 10px; display: block; text-align: center; }
            .data-row { display: grid; grid-template-columns: 180px 1fr; gap: 40px; padding: 2.5em 0; border-bottom: 1px solid #f2f2f2; }
            .data-row h4 { font-size: 0.65em; font-weight: 900; text-transform: uppercase; letter-spacing: 2px; color: #bbb; margin: 0; padding-top: 5px; }

            .alert-critical { background: #ffebee; border-left: 4px solid #ef5350; padding: 1.5em; border-radius: 12px; display: flex; gap: 20px; align-items: center; margin-bottom: 1em; }
            .alert-critical i { font-size: 1.5em; color: #ef5350; }

            .section-break { margin: 4em 0 2em 0; padding: 3em 0; border-top: 2px solid #f2f2f2; text-align: center; }
            .section-break h2 { font-size: 2em; font-weight: 300; color: #ef5350; letter-spacing: -1px; margin: 0; }

            .observatorio-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 40px; margin-top: 2em; }
            .news-card { text-decoration: none; color: inherit; display: flex; flex-direction: column; transition: all 0.3s ease; }
            .card-image-wrap { position: relative; width: 100%; height: 180px; overflow: hidden; border-radius: 12px; background: #f5f5f5; margin-bottom: 15px; }
            .card-image-wrap img { width: 100%; height: 100%; object-fit: cover; }

            @media screen and (max-width: 1280px) {
                #sidebar { position: relative !important; width: 100% !important; }
                #wrapper { padding-left: 0 !important; }
                .data-row { grid-template-columns: 1fr; }
            }
		</style>
	</head>
	<body class="is-preload">
		<div id="wrapper">
			<div id="main">
                <div class="inner">
                    <section>
                        <div style="text-align: center; margin-bottom: 3em;">
                            <span class="category-label">Recursos Finitos</span>
                            <h1 style="font-size: 3.5em; font-weight: 300; color: #1a1a1a; letter-spacing: -2px; margin: 0;">Mineração: O Custo Oculto</h1>
                            <p style="font-size: 0.9em; font-style: italic; color: #bbb; margin-top: 5px;">Análise de concessões e passivos em <strong id="reg-name">...</strong></p>
                        </div>

                        <!-- PROJETOS CRÍTICOS -->
                        <div class="data-row">
                            <h4>Concessões Críticas</h4>
                            <div class="tech-content" id="mining-status">
                                <p style="color:#bbb;">A analisar proximidade de projetos mineiros...</p>
                            </div>
                        </div>

                        <div class="section-break">
                            <span class="sub-label">Panorama Nacional</span>
                            <h2>Alertas e Impactos Territoriais</h2>
                        </div>

                        <!-- NOTÍCIAS -->
                        <div class="data-row" style="border-bottom: none;">
                            <h4>Notícias de Mineração</h4>
                            <div id="noticias-mineracao-dinamico" class="observatorio-grid"></div>
                        </div>
                    </section>
                </div>
            </div>
			<div id="sidebar"></div>
		</div>

		<script src="/assets/js/jquery.min.js"></script>
        <script>
            let locationsDB = [], zaerData = [];

            function calcularDistancia(lat1, lon1, lat2, lon2) {
                const R = 6371;
                const dLat = (lat2 - lat1) * Math.PI / 180;
                const dLon = (lon2 - lon1) * Math.PI / 180;
                const a = Math.sin(dLat/2) * Math.sin(dLat/2) + Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) * Math.sin(dLon/2) * Math.sin(dLon/2);
                return R * (2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a)));
            }

            async function inicializar() {
                try {
                    const [rLoc, rZaer, rNews] = await Promise.all([
                        fetch('/data/bioregioes.json').then(r => r.json()),
                        fetch('/data/zaer_critico.json').then(r => r.json()),
                        fetch('/data/noticias.json').then(r => r.json())
                    ]);
                    locationsDB = rLoc; zaerData = rZaer;
                    const savedId = localStorage.getItem('biocultura_region') || "proenca-a-nova";
                    renderDashboard(locationsDB.find(i => i.id === savedId), rNews);
                } catch(e) { console.error(e); }
            }

            function renderDashboard(info, news) {
                if(!info) return;
                document.getElementById('reg-name').innerText = info.titulo;

                // 1. Projetos de Mineração Próximos
                const minas = zaerData.filter(z => z.tipo === 'Mineração' && calcularDistancia(info.lat, info.lon, z.lat, z.lon) < 50);
                
                document.getElementById('mining-status').innerHTML = minas.length ? minas.map(m => `
                    <div class="alert-critical">
                        <i class="fas fa-mound"></i>
                        <div>
                            <h5 style="margin:0; font-size:0.85em; font-weight:900; text-transform:uppercase;">${m.titulo}</h5>
                            <p style="margin:5px 0 0 0; font-size:0.9em; color:#666;">${m.impacto} (Distância: ${calcularDistancia(info.lat, info.lon, m.lat, m.lon).toFixed(1)} km)</p>
                        </div>
                    </div>
                `).join('') : '<p style="color:#81c784; font-weight:700;"><i class="fas fa-check-circle"></i> Sem projetos de mineração críticos detetados num raio de 50km.</p>';

                // 2. Notícias
                document.getElementById('noticias-mineracao-dinamico').innerHTML = news.filter(n => n.categoria.toLowerCase().includes('mineração')).map(n => `
                    <a href="/observatorio/noticia-detalhe.html?id=${n.id}" class="news-card">
                        <div class="card-image-wrap"><img src="${n.imagem}"></div>
                        <h3 style="font-size:1.1em">${n.titulo}</h3>
                    </a>
                `).join('');
            }

            fetch('/sidebar-content.html').then(r => r.text()).then(html => {
                document.getElementById('sidebar').innerHTML = html;
                inicializar();
                const s = document.createElement('script'); s.src = '/assets/js/main.js'; document.body.appendChild(s);
            });
        </script>
	</body>
</html>
