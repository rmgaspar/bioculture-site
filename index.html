<!DOCTYPE HTML>
<html>
	<head>
		<title>bioCultura - Ecossistema em Comunhão</title>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
		<link rel="stylesheet" href="assets/css/main.css" />
		<style>
			/* 1. ESTRUTURA E LIMPEZA */
			section, #header, hr, .major { border: none !important; box-shadow: none !important; padding: 0 !important; }
			#header .toggle { background: none !important; top: 2em !important; left: 2em !important; border: none !important; text-decoration: none !important; z-index: 10001; }
			#header .toggle:before { content: '\f06c' !important; font-family: "Font Awesome 5 Free" !important; font-weight: 900; color: #2e7d32 !important; font-size: 1.6em !important; }
            #header .toggle:after { display: none !important; }
            section { padding-top: 1em !important; }

            /* 2. MINI-BANNER TOPO */
            .mini-banner {
                width: 100%;
                text-align: center;
                padding: 1.5em 0;
                margin-bottom: 3em;
                background: linear-gradient(to right, transparent, rgba(46, 125, 50, 0.05), transparent);
                border-radius: 50px;
            }
            .mini-banner h1 { 
                font-family: 'Source Sans Pro', sans-serif; 
                font-size: 1.8em !important; 
                font-weight: 300 !important; 
                color: #2e7d32 !important; 
                margin: 0; 
                letter-spacing: 2px; 
                text-transform: none;
            }
            .mini-banner b { font-weight: 700; }

            /* 3. O GLOBO BIOCULTURA (A COMUNHÃO) */
            .globe-wrapper {
                display: flex;
                justify-content: center;
                align-items: center;
                margin-bottom: 6em;
                perspective: 1000px;
            }

            .globe-container {
                position: relative;
                width: 600px;
                height: 600px;
                border-radius: 50%;
                overflow: hidden;
                box-shadow: 0 40px 100px rgba(0,0,0,0.15);
                display: grid;
                grid-template-columns: 1fr 1fr;
                grid-template-rows: 1fr 1fr 1fr;
                transform: rotate(-15deg); /* Inclinação do eixo da terra */
                transition: transform 1s ease-out;
            }

            .globe-container:hover {
                transform: rotate(0deg) scale(1.02);
            }

            /* Segmentos do Globo */
            .globe-slice {
                position: relative;
                overflow: hidden;
                transition: filter 0.5s ease;
                filter: saturate(0.8);
            }
            .globe-slice:hover { filter: saturate(1.2); }
            .globe-slice img {
                width: 100%;
                height: 100%;
                object-fit: cover;
                transform: rotate(15deg); /* Compensa a rotação do container */
            }

            /* Overlay de fusão entre fatias */
            .globe-slice::after {
                content: '';
                position: absolute;
                top: 0; left: 0; width: 100%; height: 100%;
                box-shadow: inset 0 0 50px rgba(0,0,0,0.2);
            }

            /* 4. TEXTO DE TRANSIÇÃO */
            .intro-text-smooth {
                text-align: center;
                padding: 0 10%;
                margin-bottom: 8em;
            }
            .intro-text-smooth h2 { color: #2e7d32; font-size: 2.2em; font-weight: 700; margin-bottom: 0.8em; letter-spacing: -1px; }
            .intro-text-smooth p { font-size: 1.35em; line-height: 1.6; color: #555; max-width: 800px; margin: 0 auto; font-style: italic; }

			.footer-signature-right { text-align: right; padding: 4em 0 2em 0; opacity: 0.9; }

            /* Mobile Adjustments */
            @media screen and (max-width: 736px) {
                .globe-container { width: 320px; height: 320px; }
                .mini-banner h1 { font-size: 1.4em !important; }
            }
		</style>
	</head>
	<body class="is-preload">
		<div id="wrapper">
			<div id="main"><div class="inner">
					<header id="header" style="height: 0; margin: 0; padding: 0; overflow: hidden;"></header>
					
                    <section>
                        <!-- MINI-BANNER NO TOPO -->
                        <div class="mini-banner">
                            <h1><b>b</b>io<b>C</b>ultura</h1>
                        </div>

                        <!-- O GLOBO: Comunhão dos 6 Elementos -->
                        <div class="globe-wrapper">
                            <div class="globe-container">
                                <!-- Ar -->
                                <div class="globe-slice" title="Ar">
                                    <img src="https://images.unsplash.com/photo-1441974231531-c6227db76b6e?q=80&w=2071&auto=format&fit=crop" alt="Ar" />
                                </div>
                                <!-- Fauna -->
                                <div class="globe-slice" title="Fauna">
                                    <img src="https://images.unsplash.com/photo-1470615619213-fdd3985a40e0?q=80&w=2054&auto=format&fit=crop" alt="Fauna" />
                                </div>
                                <!-- Água -->
                                <div class="globe-slice" title="Água">
                                    <img src="https://images.unsplash.com/photo-1535868118629-f37bcd69ff59?q=80&w=2076&auto=format&fit=crop" alt="Água" />
                                </div>
                                <!-- Flora -->
                                <div class="globe-slice" title="Flora">
                                    <img src="https://images.unsplash.com/photo-1466692476868-aef1dfb1e735?q=80&w=2000&auto=format&fit=crop" alt="Flora" />
                                </div>
                                <!-- Energia -->
                                <div class="globe-slice" title="Energia">
                                    <img src="https://images.unsplash.com/photo-1509391366360-2e959784a276?q=80&w=2072&auto=format&fit=crop" alt="Energia" />
                                </div>
                                <!-- Terra -->
                                <div class="globe-slice" title="Terra">
                                    <img src="https://images.unsplash.com/photo-1500651230702-0e2d8a49d4ad?q=80&w=2000&auto=format&fit=crop" alt="Terra" />
                                </div>
                            </div>
                        </div>

                        <!-- MENSAGEM INTEGRADA -->
                        <div class="intro-text-smooth">
                            <h2>Um Ecossistema em Comunhão</h2>
                            <p>"A terra não é um suporte inerte, nem a água um resíduo. Somos parte de um organismo vivo onde cada elemento respira em conjunto."</p>
                            <a href="manifesto.html" class="button primary" style="margin-top: 3.5em; border-radius: 50px; background-color: #2e7d32 !important;">O Nosso Compromisso</a>
                        </div>

					</section>

					<div class="footer-signature-right">
						<a href="index.html" style="border: none; display: inline-block; text-decoration: none;">
							<div style="font-family: 'Source Sans Pro', sans-serif; font-size: 1.4em; line-height: 1; display: flex; align-items: flex-end; justify-content: flex-end;">
                                <b style="font-weight: 700; color: #2e7d32; margin-right: -3px; position: relative; z-index: 2;">b</b>
                                <div style="width: 32px; margin: 0 -7px; position: relative; line-height: 0; transform: translateY(4px); z-index: 1;">
                                    <svg viewBox="0 0 100 120" xmlns="http://www.w3.org/2000/svg" style="width: 100%; height: auto;">
                                        <path d="M-20 110 Q50 102 120 110" stroke="#634832" stroke-width="4" fill="none" opacity="0.3" />
                                        <path d="M50 110 C50 80 35 70 50 45 C65 70 50 80 50 110" fill="#2e7d32" />
                                        <path d="M50 80 C75 75 85 50 65 40 C50 55 50 65 50 80" fill="#4CAF50" />
                                    </svg>
                                </div>
                                <b style="font-weight: 700; color: #2e7d32; margin-left: -3px; position: relative; z-index: 2;">o</b>
                                <span style="font-weight: 300; color: #444; margin-left: 2px;">Cultura</span>
                            </div>
						</a>
					</div>
				</div></div>
			<div id="sidebar"></div>
		</div>
		<script src="assets/js/jquery.min.js"></script>
        <script src="assets/js/browser.min.js"></script>
        <script src="assets/js/breakpoints.min.js"></script>
        <script src="assets/js/util.js"></script>
        <script>
            fetch('sidebar-content.html').then(response => response.text()).then(data => {
                document.getElementById('sidebar').innerHTML = data;
                var script = document.createElement('script');
                script.src = 'assets/js/main.js';
                document.body.appendChild(script);
            });
        </script>
	</body>
</html>
