<!DOCTYPE HTML>
<html>
	<head>
		<title>bioCultura - Ecossistema Integrado</title>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
		<link rel="stylesheet" href="assets/css/main.css" />
		<style>
			/* 1. ESTRUTURA E LIMPEZA */
			section, #header, hr, .major { border: none !important; box-shadow: none !important; padding: 0 !important; }
			#header .toggle { background: none !important; top: 2em !important; left: 2em !important; border: none !important; text-decoration: none !important; z-index: 10001; }
			#header .toggle:before { content: '\f06c' !important; font-family: "Font Awesome 5 Free" !important; font-weight: 900; color: #2e7d32 !important; font-size: 1.6em !important; }
            #header .toggle:after { display: none !important; }
            section { padding-top: 1em !important; }

            /* 2. MINI-BANNER ASSINATURA */
            .mini-banner {
                width: 100%;
                text-align: center;
                padding: 2em 0;
                margin-bottom: 1em;
            }
            .mini-banner h1 { 
                font-family: 'Source Sans Pro', sans-serif; 
                font-size: 2.2em !important; 
                font-weight: 300 !important; 
                color: #2e7d32 !important; 
                margin: 0; 
                letter-spacing: 4px; 
                text-transform: none;
            }
            .mini-banner b { font-weight: 700; }

            /* 3. O PUZZLE BIOCULTURA (ESTILO ARREDONDADO) */
            .puzzle-container {
                max-width: 1100px;
                margin: 0 auto 6em auto;
                display: grid;
                grid-template-columns: repeat(3, 1fr);
                gap: -15px; /* Sobreposição ligeira para o encaixe */
                padding: 20px;
            }

            .piece {
                position: relative;
                aspect-ratio: 1 / 1;
                cursor: pointer;
                transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
                filter: saturate(0.7) brightness(0.9);
                margin: -10px; /* Garante o "toque" entre peças */
            }

            .piece img {
                width: 100%;
                height: 100%;
                object-fit: cover;
                /* O segredo do puzzle arredondado está no mask-image */
                mask-size: contain;
                mask-repeat: no-repeat;
                -webkit-mask-size: contain;
                -webkit-mask-repeat: no-repeat;
            }

            .piece:hover {
                filter: saturate(1.1) brightness(1);
                transform: scale(1.05);
                z-index: 20;
            }

            /* Definição das Máscaras (Tabs e Blanks Arredondados) */
            .p1 img { -webkit-mask-image: url('data:image/svg+xml;utf8,<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg"><path d="M0,0 H85 A15,15 0 0,1 85,30 A15,15 0 0,1 85,0 H100 V100 H0 Z" /></svg>'); }
            
            /* Usamos classes simplificadas para garantir o encaixe visual suave */
            .piece-rounded {
                border-radius: 40px; /* Base arredondada bioCultura */
                overflow: hidden;
                box-shadow: 0 10px 30px rgba(0,0,0,0.1);
                border: 4px solid #fff; /* Linha de encaixe branca */
            }

            .piece-label {
                position: absolute;
                top: 50%;
                left: 50%;
                transform: translate(-50%, -50%);
                color: #fff;
                font-weight: 800;
                text-transform: uppercase;
                letter-spacing: 2px;
                font-size: 0.9em;
                text-shadow: 0 2px 10px rgba(0,0,0,0.5);
                pointer-events: none;
                opacity: 0;
                transition: opacity 0.3s ease;
            }

            .piece:hover .piece-label {
                opacity: 1;
            }

            /* 4. TEXTO DE TRANSIÇÃO */
            .intro-text-smooth {
                text-align: center;
                padding: 0 10%;
                margin-bottom: 8em;
            }
            .intro-text-smooth h2 { color: #2e7d32; font-size: 2.2em; font-weight: 700; margin-bottom: 0.8em; }
            .intro-text-smooth p { font-size: 1.35em; line-height: 1.6; color: #555; max-width: 800px; margin: 0 auto; font-style: italic; }

			.footer-signature-right { text-align: right; padding: 4em 0 2em 0; opacity: 0.9; }

            /* Mobile */
            @media screen and (max-width: 736px) {
                .puzzle-container { grid-template-columns: 1fr 1fr; }
                .mini-banner h1 { font-size: 1.6em !important; }
            }
		</style>
	</head>
	<body class="is-preload">
		<div id="wrapper">
			<div id="main"><div class="inner">
					<header id="header" style="height: 0; margin: 0; padding: 0; overflow: hidden;"></header>
					
                    <section>
                        <!-- MINI-BANNER NO TOPO -->
                        <div class="mini-banner">
                            <h1><b>b</b>io<b>C</b>ultura</h1>
                        </div>

                        <!-- PUZZLE ARREDONDADO -->
                        <div class="puzzle-container">
                            <!-- Ar -->
                            <div class="piece piece-rounded" onclick="location.href='recursos/ar.html'">
                                <img src="https://images.unsplash.com/photo-1441974231531-c6227db76b6e?q=80&w=2071&auto=format&fit=crop" alt="Ar" />
                                <div class="piece-label">Ar</div>
                            </div>
                            <!-- Fauna -->
                            <div class="piece piece-rounded" onclick="location.href='ecossistemas/fauna.html'">
                                <img src="https://images.unsplash.com/photo-1470615619213-fdd3985a40e0?q=80&w=2054&auto=format&fit=crop" alt="Fauna" />
                                <div class="piece-label">Fauna</div>
                            </div>
                            <!-- Água -->
                            <div class="piece piece-rounded" onclick="location.href='recursos/agua.html'">
                                <img src="https://images.unsplash.com/photo-1535868118629-f37bcd69ff59?q=80&w=2076&auto=format&fit=crop" alt="Água" />
                                <div class="piece-label">Água</div>
                            </div>
                            <!-- Flora -->
                            <div class="piece piece-rounded" onclick="location.href='ecossistemas/flora.html'">
                                <img src="https://images.unsplash.com/photo-1466692476868-aef1dfb1e735?q=80&w=2000&auto=format&fit=crop" alt="Flora" />
                                <div class="piece-label">Flora</div>
                            </div>
                            <!-- Energia -->
                            <div class="piece piece-rounded" onclick="location.href='energia/energia.html'">
                                <img src="https://images.unsplash.com/photo-1509391366360-2e959784a276?q=80&w=2072&auto=format&fit=crop" alt="Energia" />
                                <div class="piece-label">Energia</div>
                            </div>
                            <!-- Terra -->
                            <div class="piece piece-rounded" onclick="location.href='recursos/solo.html'">
                                <img src="https://images.unsplash.com/photo-1500651230702-0e2d8a49d4ad?q=80&w=2000&auto=format&fit=crop" alt="Terra" />
                                <div class="piece-label">Terra</div>
                            </div>
                        </div>

                        <!-- MENSAGEM INTEGRADA -->
                        <div class="intro-text-smooth">
                            <h2>Tudo está ligado.</h2>
                            <p>"Na natureza, nada existe isoladamente. A nossa missão é unir a técnica e a ética para que cada peça do ecossistema encontre o seu lugar na regeneração da vida."</p>
                            <a href="manifesto.html" class="button primary" style="margin-top: 3.5em; border-radius: 50px; background-color: #2e7d32 !important;">O Nosso Compromisso</a>
                        </div>

					</section>

					<div class="footer-signature-right">
						<a href="index.html" style="border: none; display: inline-block; text-decoration: none;">
							<div style="font-family: 'Source Sans Pro', sans-serif; font-size: 1.4em; line-height: 1; display: flex; align-items: flex-end; justify-content: flex-end;">
                                <b style="font-weight: 700; color: #2e7d32; margin-right: -3px; position: relative; z-index: 2;">b</b>
                                <div style="width: 32px; margin: 0 -7px; position: relative; line-height: 0; transform: translateY(4px); z-index: 1;">
                                    <svg viewBox="0 0 100 120" xmlns="http://www.w3.org/2000/svg" style="width: 100%; height: auto;">
                                        <path d="M-20 110 Q50 102 120 110" stroke="#634832" stroke-width="4" fill="none" opacity="0.3" />
                                        <path d="M50 110 C50 80 35 70 50 45 C65 70 50 80 50 110" fill="#2e7d32" />
                                        <path d="M50 80 C75 75 85 50 65 40 C50 55 50 65 50 80" fill="#4CAF50" />
                                    </svg>
                                </div>
                                <b style="font-weight: 700; color: #2e7d32; margin-left: -3px; position: relative; z-index: 2;">o</b>
                                <span style="font-weight: 300; color: #444; margin-left: 2px;">Cultura</span>
                            </div>
						</a>
					</div>
				</div></div>
			<div id="sidebar"></div>
		</div>
		<script src="assets/js/jquery.min.js"></script>
        <script src="assets/js/browser.min.js"></script>
        <script src="assets/js/breakpoints.min.js"></script>
        <script src="assets/js/util.js"></script>
        <script>
            fetch('sidebar-content.html').then(response => response.text()).then(data => {
                document.getElementById('sidebar').innerHTML = data;
                var script = document.createElement('script');
                script.src = 'assets/js/main.js';
                document.body.appendChild(script);
            });
        </script>
	</body>
</html>
