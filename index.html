<!DOCTYPE HTML>
<html>
<head>
    <title data-i18n="index.hero_label">bioCultura - Observatório de Regeneração Planetária</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
    <link rel="stylesheet" href="/assets/css/main.css" />
    <style>
        body, input, select, textarea { font-family: 'Source Sans Pro', sans-serif !important; color: #444; }
        section, #header, hr, .major { border: none !important; box-shadow: none !important; padding: 0 !important; }
        #sidebar { position: fixed !important; top: 0; left: 0; height: 100vh !important; width: 18em !important; overflow: hidden !important; z-index: 10000; background: #fff; border-right: 1px solid #f2f2f2 !important; }
        #wrapper { padding-left: 18em !important; }
        .inner { padding: 2.2em 4em 0 4em !important; max-width: 1600px !important; margin: 0 auto; }

        .hero-split { display: flex; align-items: flex-start; justify-content: space-between; gap: 4em; margin-bottom: 2em; }
        .hero-text { flex: 1.5; text-align: left; padding-top: 5px; } 
        .hero-text h1 { font-size: 4em; font-weight: 900; color: #1a1a1a; letter-spacing: -2.5px; line-height: 0.95; margin-bottom: 20px; }
        .hero-visual { flex: 1; display: flex; justify-content: flex-end; }
        .hero-globe { position: relative; width: 480px; height: 480px; border-radius: 50%; overflow: hidden; box-shadow: 0 40px 100px rgba(0,0,0,0.12); background: #1a1a1a; }
        .hero-globe img { position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; transition: opacity 3s ease-in-out, transform 8s ease-in-out; opacity: 0; transform: scale(1.1); }
        .hero-globe img.active { opacity: 1; transform: scale(1); }

        .ia-impact-box { margin-top: 80px; padding-left: 0; position: relative; }
        .ia-impact-subtitle { font-size: 0.85em; font-weight: 900; text-transform: uppercase; letter-spacing: 1px; color: #c62828; margin-bottom: 25px; display: block; }
        .fact-cycler { position: relative; height: 120px; margin-bottom: 100px; }
        .fact-item { position: absolute; top: 0; left: 0; opacity: 0; transition: opacity 1.5s ease-in-out; display: flex; align-items: flex-start; width: 100%; }
        .fact-item.active { opacity: 1; }
        .fact-item b { font-size: 1.6em; color: #1a1a1a; display: block; line-height: 1.1; margin-bottom: 8px; }
        .fact-item span { font-size: 1.15em; color: #666; line-height: 1.4; display: block; max-width: 750px; }

        .critical-summary { margin: 2em 0 4em 0; max-width: 1100px; padding-bottom: 3em; border-bottom: 1px solid #f2f2f2; }
        .critical-summary p { font-size: 1.2em !important; line-height: 1.8 !important; color: #555 !important; margin-bottom: 1.5em; text-align: justify; }
        
        .impact-cards-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 30px; margin: 4em 0; }
        .impact-card { background: #fff; border: 1px solid #f2f2f2; padding: 30px; border-radius: 16px; transition: all 0.3s; }
        .impact-card:hover { border-color: #c62828; transform: translateY(-5px); }
        .impact-card h4 { font-size: 0.8em; font-weight: 900; text-transform: uppercase; letter-spacing: 2px; margin-bottom: 15px; display: flex; align-items: center; gap: 10px; }
        .impact-card p { font-size: 0.95em; line-height: 1.6; color: #666; margin: 0; }
        
        .lnk-bio { font-weight: 700; text-decoration: none; border-bottom: 1px solid #1a1a1a; color: #1a1a1a; }
        .icon-red { color: #c62828; } .icon-green { color: #2e7d32; }

        .news-list { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 30px; margin-bottom: 4em; }
        .news-item { text-decoration: none; color: inherit; display: block; padding: 25px; background: #fdfdfd; border: 1px solid #f2f2f2; border-radius: 12px; transition: all 0.3s; }
        .news-item:hover { transform: translateY(-5px); border-color: #ddd; }
        .news-item h3 { font-size: 1.15em; font-weight: 700; color: #1a1a1a; margin-bottom: 12px; line-height: 1.3; min-height: 2.6em; }
        .news-meta { display: flex; align-items: center; gap: 10px; border-top: 1px solid #f9f9f9; padding-top: 12px; }
        .source-logo { width: 16px; height: 16px; object-fit: contain; filter: grayscale(100%); opacity: 0.6; }
        .news-meta span { font-size: 0.65em; font-weight: 800; color: #bbb; text-transform: uppercase; letter-spacing: 1px; }

        .page-footer { padding: 4em 0 2em 0; border-top: 1px solid #f2f2f2; opacity: 0.3; text-align: right; }
        
        @media screen and (max-width: 1280px) {
            #sidebar { position: relative !important; width: 100% !important; height: auto !important; }
            #wrapper { padding-left: 0 !important; }
            .hero-globe { width: 350px; height: 350px; }
        }
    </style>
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-6PV0FD8PXC"></script>
    <script>
        window.dataLayer = window.dataLayer || [];
        function gtag(){dataLayer.push(arguments);}
        gtag('js', new Date());
        gtag('config', 'G-6PV0FD8PXC');
    </script>
</head>
<body class="is-preload">
    <div id="wrapper">
        <div id="main">
            <div class="inner">
                <header id="header" style="height: 0; margin: 0; padding: 0; overflow: hidden;"></header>
                
                <div class="index-container">
                    <section class="hero-split">
                        <div class="hero-text">
                            <span class="category-label" data-i18n="index.hero_label">Observatório bioCultura</span>
                            <h1 data-i18n="index.hero_title">O progresso consciente é a única via de regeneração.</h1>
                            <div class="ia-impact-box">
                                <span class="ia-impact-subtitle">Global Fact Check 2026</span>
                                <div class="fact-cycler" id="fact-cycler"></div>
                            </div>
                        </div>
                        <div class="hero-visual">
                            <div class="hero-globe" id="hero-cycler">
                                <img src="https://images.unsplash.com/photo-1470240731273-7821a6eeb6bd?q=80&w=2070&auto=format&fit=crop" class="active">
                                <img src="https://images.unsplash.com/photo-1641959166364-6c9b9898e804?q=80&w=2071&auto=format&fit=crop">
                                <img src="https://images.unsplash.com/photo-1586400792375-d6b8f82db2e6?q=80&w=2071&auto=format&fit=crop">
                            </div>
                        </div>
                    </section>

                    <div class="critical-summary">
                        <p data-i18n="index.manifesto_p1"></p>
                        
                        <div class="impact-cards-grid">
                            <div class="impact-card">
                                <h4 class="icon-red"><span>⛏️</span> <span data-i18n="index.cards.mining">Mineração</span></h4>
                                <p data-i18n="index.cards.mining_text"></p>
                            </div>
                            <div class="impact-card">
                                <h4 class="icon-red"><span>🥩</span> <span data-i18n="index.cards.livestock">Produção</span></h4>
                                <p data-i18n="index.cards.livestock_text"></p>
                            </div>
                            <div class="impact-card">
                                <h4 class="icon-red"><span>💻</span> <span data-i18n="index.cards.digital">Digital</span></h4>
                                <p data-i18n="index.cards.digital_text"></p>
                            </div>
                            <div class="impact-card">
                                <h4 class="icon-green"><span>🌱</span> <span data-i18n="index.cards.organic">Solo</span></h4>
                                <p data-i18n="index.cards.organic_text"></p>
                            </div>
                        </div>

                        <p data-i18n="index.manifesto_p2"></p>

                        <p style="font-size: 0.95em !important; font-style: italic; color: #888; border-top: 1px solid #f2f2f2; padding-top: 2em;" data-i18n="index.manifesto_p3">
                        </p>
                    </div>

                    <div id="observatorio-dinamico" class="news-list"></div>
                </div>

                <footer class="page-footer">
                    <span style="display: block; font-size: 0.85em; font-weight: 900; color: #333;">bioCultura</span>
                    <span style="display: block; font-size: 0.5em; font-weight: 700; text-transform: uppercase; letter-spacing: 1px;">Global Regeneration</span>
                </footer>
            </div>
        </div>
        <div id="sidebar"></div>
    </div>

    <script src="/assets/js/jquery.min.js"></script>
    <script>
        let todasNoticias = [];

        async function applyLanguage(lang) {
            if (!lang) lang = localStorage.getItem('selected_lang') || 'pt';
            try {
                const response = await fetch(`/assets/lang/${lang}.json`);
                const t = await response.json();

                document.querySelectorAll('[data-i18n]').forEach(el => {
                    const key = el.getAttribute('data-i18n');
                    const text = key.split('.').reduce((obj, i) => (obj ? obj[i] : null), t);
                    if (text) el.innerHTML = text;
                });

                // Renderiza factos dinâmicos baseados na língua
                const cycler = document.getElementById('fact-cycler');
                if (cycler && t.index.critical_facts) {
                    cycler.innerHTML = t.index.critical_facts.map((f, i) => `
                        <div class="fact-item ${i === 0 ? 'active' : ''}" style="color: ${f.cor}">
                            <div class="fact-content"><b>${f.titulo}</b><span>${f.desc}</span></div>
                        </div>`).join('');
                }

                localStorage.setItem('selected_lang', lang);
                if(document.getElementById('lang-selector')) document.getElementById('lang-selector').value = lang;
            } catch (err) { console.error(err); }
        }

        async function inicializarPagina() {
            try {
                const rNews = await fetch('/data/noticias.json');
                todasNoticias = await rNews.json();
                renderizarLista();
                iniciarCiclos();
            } catch(e) { console.error(e); }
        }

        function iniciarCiclos() {
            // Ciclo de Imagens
            const imgs = document.querySelectorAll('#hero-cycler img');
            let imgP = 0;
            setInterval(() => {
                imgs.forEach(i => i.classList.remove('active'));
                imgP = (imgP + 1) % imgs.length;
                imgs[imgP].classList.add('active');
            }, 6000);

            // Ciclo de Factos
            let factP = 0;
            setInterval(() => {
                const facts = document.querySelectorAll('#fact-cycler .fact-item');
                if(facts.length === 0) return;
                facts.forEach(f => f.classList.remove('active'));
                factP = (factP + 1) % facts.length;
                facts[factP].classList.add('active');
            }, 12000);
        }

        function renderizarLista() {
            const container = document.getElementById('observatorio-dinamico');
            if(!container) return;
            container.innerHTML = todasNoticias.slice(0, 6).map(n => `
                <a href="/observatorio/noticia-detalhe.html?id=${n.id}" class="news-item">
                    <h3>${n.titulo}</h3>
                    <div class="news-meta"><img src="${n.logo}" class="source-logo"><span>${n.data}</span></div>
                </a>`).join('');
        }

        fetch('/sidebar-content.html').then(r => r.text()).then(html => {
            document.getElementById('sidebar').innerHTML = html;
            const savedLang = localStorage.getItem('selected_lang') || 'pt';
            applyLanguage(savedLang).then(() => inicializarPagina());
            
            document.addEventListener('change', (e) => {
                if (e.target.id === 'lang-selector') applyLanguage(e.target.value);
            });
        });
    </script>
</body>
</html>
