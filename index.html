<!DOCTYPE HTML>
<html>
	<head>
		<title>bioCultura - Ecossistema em Comunhão</title>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
		<link rel="stylesheet" href="assets/css/main.css" />
		<style>
			/* 1. ESTRUTURA E LIMPEZA */
			section, #header, hr, .major { border: none !important; box-shadow: none !important; padding: 0 !important; }
			#header .toggle { background: none !important; top: 2em !important; left: 2em !important; border: none !important; text-decoration: none !important; z-index: 10001; }
			#header .toggle:before { content: '\f06c' !important; font-family: "Font Awesome 5 Free" !important; font-weight: 900; color: #2e7d32 !important; font-size: 1.6em !important; }
            #header .toggle:after { display: none !important; }
            section { padding-top: 1em !important; }

            /* 2. MINI-BANNER ASSINATURA */
            .mini-banner { width: 100%; text-align: center; padding: 2em 0; margin-bottom: 2em; }
            .mini-banner h1 { font-family: 'Source Sans Pro', sans-serif; font-size: 2.5em !important; font-weight: 300 !important; color: #2e7d32 !important; margin: 0; letter-spacing: 5px; }
            .mini-banner b { font-weight: 700; }

            /* 3. MOSAICO ORGÂNICO (O "TCHARAN") */
            .mosaic-container {
                display: grid;
                grid-template-columns: repeat(6, 1fr);
                grid-template-rows: repeat(2, 300px);
                gap: 20px;
                max-width: 1200px;
                margin: 0 auto 6em auto;
                padding: 0 20px;
            }

            .cell {
                position: relative;
                overflow: hidden;
                cursor: pointer;
                transition: all 0.6s cubic-bezier(0.23, 1, 0.32, 1);
                box-shadow: 0 15px 40px rgba(0,0,0,0.1);
            }

            .cell img {
                width: 100%;
                height: 100%;
                object-fit: cover;
                transition: transform 1.2s ease;
                filter: brightness(0.9) saturate(0.8);
            }

            .cell:hover {
                transform: translateY(-10px) scale(1.02);
                box-shadow: 0 30px 60px rgba(46, 125, 50, 0.2);
                z-index: 10;
            }

            .cell:hover img {
                transform: scale(1.1);
                filter: brightness(1.1) saturate(1.2);
            }

            /* Formas Assimétricas e Smooth (Estilo bioCultura) */
            .c-ar      { grid-column: span 3; border-radius: 80px 20px 100px 30px; }
            .c-fauna   { grid-column: span 3; border-radius: 20px 100px 30px 120px; }
            .c-agua    { grid-column: span 2; border-radius: 100px 30px 120px 40px; }
            .c-flora   { grid-column: span 2; border-radius: 30px 120px 40px 100px; }
            .c-energia { grid-column: span 1; border-radius: 120px 40px 100px 30px; }
            .c-terra   { grid-column: span 1; border-radius: 40px 100px 30px 120px; }

            /* Labels Vibrantes */
            .cell-label {
                position: absolute;
                bottom: 30px; left: 30px;
                color: #fff; font-weight: 800; text-transform: uppercase;
                letter-spacing: 4px; font-size: 1.2em;
                text-shadow: 0 2px 15px rgba(0,0,0,0.6);
                z-index: 2;
            }

            /* 4. TEXTO DE TRANSIÇÃO */
            .intro-text-smooth { text-align: center; padding: 0 10%; margin-bottom: 8em; }
            .intro-text-smooth h2 { color: #2e7d32; font-size: 2.5em; font-weight: 700; margin-bottom: 1em; letter-spacing: -1px; }
            .intro-text-smooth p { font-size: 1.4em; line-height: 1.6; color: #444; max-width: 900px; margin: 0 auto; font-style: italic; }

			.footer-signature-right { text-align: right; padding: 4em 0 2em 0; opacity: 0.9; }

            /* Responsividade */
            @media screen and (max-width: 980px) {
                .mosaic-container { grid-template-columns: repeat(2, 1fr); grid-template-rows: auto; gap: 15px; }
                .cell { grid-column: span 1 !important; height: 250px; border-radius: 40px !important; }
            }
		</style>
	</head>
	<body class="is-preload">
		<div id="wrapper">
			<div id="main"><div class="inner">
					<header id="header" style="height: 0; margin: 0; padding: 0; overflow: hidden;"></header>
					
                    <section>
                        <!-- ASSINATURA -->
                        <div class="mini-banner">
                            <h1><b>b</b>io<b>C</b>ultura</h1>
                        </div>

                        <!-- MOSAICO DE CÉLULAS EM COMUNHÃO -->
                        <div class="mosaic-container">
                            <!-- Ar -->
                            <div class="cell c-ar" onclick="location.href='recursos/ar.html'">
                                <img src="https://images.unsplash.com/photo-1441974231531-c6227db76b6e?q=80&w=2071&auto=format&fit=crop" alt="Ar" />
                                <div class="cell-label">Ar</div>
                            </div>
                            <!-- Fauna -->
                            <div class="cell c-fauna" onclick="location.href='ecossistemas/fauna.html'">
                                <img src="https://images.unsplash.com/photo-1470615619213-fdd3985a40e0?q=80&w=2054&auto=format&fit=crop" alt="Fauna" />
                                <div class="cell-label">Fauna</div>
                            </div>
                            <!-- Água -->
                            <div class="cell c-agua" onclick="location.href='recursos/agua.html'">
                                <img src="https://images.unsplash.com/photo-1535868118629-f37bcd69ff59?q=80&w=2076&auto=format&fit=crop" alt="Água" />
                                <div class="cell-label">Água</div>
                            </div>
                            <!-- Flora -->
                            <div class="cell c-flora" onclick="location.href='ecossistemas/flora.html'">
                                <img src="https://images.unsplash.com/photo-1466692476868-aef1dfb1e735?q=80&w=2000&auto=format&fit=crop" alt="Flora" />
                                <div class="cell-label">Flora</div>
                            </div>
                            <!-- Energia -->
                            <div class="cell c-energia" onclick="location.href='energia/energia.html'">
                                <img src="https://images.unsplash.com/photo-1509391366360-2e959784a276?q=80&w=2072&auto=format&fit=crop" alt="Energia" />
                                <div class="cell-label">Energia</div>
                            </div>
                            <!-- Terra -->
                            <div class="cell c-terra" onclick="location.href='recursos/solo.html'">
                                <img src="https://images.unsplash.com/photo-1500651230702-0e2d8a49d4ad?q=80&w=2000&auto=format&fit=crop" alt="Terra" />
                                <div class="cell-label">Terra</div>
                            </div>
                        </div>

                        <div class="intro-text-smooth">
                            <h2>O Todo é maior que a soma das partes.</h2>
                            <p>"Na bioCultura, não vemos elementos isolados. Vemos um fluxo constante onde a água nutre a terra, o ar protege a vida e a energia ética sustenta o amanhã. Tudo está em comunhão."</p>
                            <a href="manifesto.html" class="button primary" style="margin-top: 3.5em; border-radius: 50px; background-color: #2e7d32 !important;">O Nosso Compromisso</a>
                        </div>
					</section>

					<div class="footer-signature-right">
						<a href="index.html" style="border: none; display: inline-block; text-decoration: none;">
							<div style="font-family: 'Source Sans Pro', sans-serif; font-size: 1.4em; line-height: 1; display: flex; align-items: flex-end; justify-content: flex-end;">
                                <b style="font-weight: 700; color: #2e7d32; margin-right: -3px; position: relative; z-index: 2;">b</b>
                                <div style="width: 32px; margin: 0 -7px; position: relative; line-height: 0; transform: translateY(4px); z-index: 1;">
                                    <svg viewBox="0 0 100 120" xmlns="http://www.w3.org/2000/svg" style="width: 100%; height: auto;">
                                        <path d="M-20 110 Q50 102 120 110" stroke="#634832" stroke-width="4" fill="none" opacity="0.3" />
                                        <path d="M50 110 C50 80 35 70 50 45 C65 70 50 80 50 110" fill="#2e7d32" />
                                        <path d="M50 80 C75 75 85 50 65 40 C50 55 50 65 50 80" fill="#4CAF50" />
                                    </svg>
                                </div>
                                <b style="font-weight: 700; color: #2e7d32; margin-left: -3px; position: relative; z-index: 2;">o</b>
                                <span style="font-weight: 300; color: #444; margin-left: 2px;">Cultura</span>
                            </div>
						</a>
					</div>
				</div></div>
			<div id="sidebar"></div>
		</div>
		<script src="assets/js/jquery.min.js"></script>
        <script src="assets/js/browser.min.js"></script>
        <script src="assets/js/breakpoints.min.js"></script>
        <script src="assets/js/util.js"></script>
        <script>
            fetch('sidebar-content.html').then(response => response.text()).then(data => {
                document.getElementById('sidebar').innerHTML = data;
                var script = document.createElement('script');
                script.src = 'assets/js/main.js';
                document.body.appendChild(script);
            });
        </script>
	</body>
</html>
