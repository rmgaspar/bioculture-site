<!DOCTYPE HTML>
<html>
	<head>
		<title>bioCultura - Observatório de Regeneração Planetária</title>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale, user-scalable=no" />
		<link rel="stylesheet" href="/assets/css/main.css" />
		<style>
            /* --- ESTRUTURA GLOBAL --- */
            body, input, select, textarea { font-family: 'Source Sans Pro', sans-serif !important; color: #444; }
			section, #header, hr, .major { border: none !important; box-shadow: none !important; padding: 0 !important; }
            
            #sidebar { position: fixed !important; top: 0; left: 0; height: 100vh !important; width: 18em !important; overflow: hidden !important; z-index: 10000; background: #fff; border-right: 1px solid #f2f2f2 !important; }
            #wrapper { padding-left: 18em !important; }

            /* HERO SPLIT */
            .hero-split { padding: 10em 0 6em 0; max-width: 1100px; margin: 0 auto; display: flex; align-items: center; gap: 5em; }
            .hero-text { flex: 1.4; }
            .hero-text h1 { font-size: 3.8em; font-weight: 900; color: #1a1a1a; letter-spacing: -2.5px; line-height: 0.95; margin-bottom: 25px; }
            .hero-text p { font-size: 1.2em; color: #777; line-height: 1.6; border-left: 5px solid #c62828; padding-left: 25px; font-style: italic; }
            .hero-visual { flex: 1; display: flex; justify-content: center; }
            .hero-globe { width: 400px; height: 400px; border-radius: 50%; overflow: hidden; box-shadow: 0 40px 100px rgba(0,0,0,0.15); border: 1px solid rgba(0,0,0,0.05); }
            .hero-globe img { width: 100%; height: 100%; object-fit: cover; }

            /* GRELHA DE NOTÍCIAS (ESTILO SAPO) */
            .observatorio-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 40px; margin-top: 3em; margin-bottom: 6em; }
            
            .news-card { text-decoration: none; color: inherit; display: flex; flex-direction: column; transition: all 0.3s ease; border: none !important; }
            .news-card:hover { transform: translateY(-8px); opacity: 0.85; }

            .card-image-wrap { position: relative; width: 100%; height: 200px; overflow: hidden; border-radius: 16px; background: #f5f5f5; margin-bottom: 15px; }
            .card-image-wrap img { width: 100%; height: 100%; object-fit: cover; }

            /* Badges de Categoria */
            .badge-cat { position: absolute; bottom: 12px; left: 12px; background: #81c784; color: white; padding: 4px 12px; border-radius: 50px; font-size: 0.6em; font-weight: 900; text-transform: uppercase; letter-spacing: 1px; }
            .badge-cat.ar { background: #ffb74d; }
            .badge-cat.agua { background: #4fc3f7; }
            .badge-cat.energia { background: #5c6bc0; }
            .badge-cat.mineracao { background: #ef5350; }
            .badge-cat.solo { background: #8d6e63; }

            /* Meta Info (Fonte) */
            .card-meta { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; font-size: 0.7em; font-weight: 800; color: #bbb; text-transform: uppercase; }
            .source-circle { width: 20px; height: 20px; background: #333; color: white; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 9px; }

            .news-card h3 { font-size: 1.2em; line-height: 1.25; margin: 0 0 10px 0; font-weight: 700; color: #1a1a1a; }
            .news-card p { font-size: 0.9em; line-height: 1.5; color: #777; margin: 0; }

            .page-footer { padding: 4em 0 2em 0; border-top: 1px solid #f2f2f2; }

            @media screen and (max-width: 1280px) {
                #sidebar { position: relative !important; width: 100% !important; height: auto !important; }
                #wrapper { padding-left: 0 !important; }
                .hero-split { flex-direction: column; padding-top: 6em; text-align: center; gap: 3em; }
                .hero-globe { width: 300px; height: 300px; }
            }
            /* Estilos para o Botão Ver Mais e Grelha */
            .ver-mais-container { text-align: center; margin: 4em 0; }
            .btn-ver-mais { 
                background: transparent !important; 
                box-shadow: none !important; 
                border: 1px solid #eee !important; 
                color: #bbb !important; 
                border-radius: 50px; 
                padding: 0 40px; 
                font-size: 0.7em; 
                font-weight: 900; 
                letter-spacing: 2px;
                transition: all 0.3s;
                cursor: pointer;
            }
            .btn-ver-mais:hover { border-color: #333 !important; color: #333 !important; }
            .hidden-card { display: none; }

            .observatorio-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 40px; margin-top: 3em; }
            .news-card { text-decoration: none; color: inherit; display: flex; flex-direction: column; transition: all 0.3s ease; }
            .news-card:hover { transform: translateY(-8px); opacity: 0.85; }
            .card-image-wrap { position: relative; width: 100%; height: 200px; overflow: hidden; border-radius: 16px; background: #f5f5f5; margin-bottom: 15px; }
            .card-image-wrap img { width: 100%; height: 100%; object-fit: cover; }
            .badge-cat { position: absolute; bottom: 12px; left: 12px; background: #81c784; color: white; padding: 4px 12px; border-radius: 50px; font-size: 0.6em; font-weight: 900; text-transform: uppercase; letter-spacing: 1px; }
            .badge-cat.ar { background: #ffb74d; }
            .badge-cat.agua { background: #4fc3f7; }
            .badge-cat.energia { background: #5c6bc0; }
            .badge-cat.mineracao { background: #ef5350; }
            .card-meta { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; font-size: 0.7em; font-weight: 800; color: #bbb; text-transform: uppercase; }
            .source-circle { width: 20px; height: 20px; background: #333; color: white; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 9px; }
		</style>
	</head>
	<body class="is-preload">
		<div id="wrapper">
			<div id="main">
                <div class="inner">
					<header id="header" style="height: 0; margin: 0; padding: 0; overflow: hidden;"></header>
					
                    <!-- HERO -->
                    <section class="hero-split">
                        <div class="hero-text">
                            <span style="font-size: 0.65em; font-weight: 900; text-transform: uppercase; letter-spacing: 4px; color: #bbb; display: block; margin-bottom: 15px;">Observatório bioCultura</span>
                            <h1>O progresso não pode ser o fim do seu horizonte.</h1>
                            <p>Descubra os impactos e as soluções de regeneração sob os seus pés.</p>
                        </div>
                        <div class="hero-visual">
                            <div class="hero-globe">
                                <img src="https://images.unsplash.com/photo-1464822759023-fed622ff2c3b?q=80&w=1000&auto=format&fit=crop" alt="bioCultura" />
                            </div>
                        </div>
                    </section>

                    <header class="major">
                    <h2>Observatório de Impacto</h2>
                    </header>

                    <!-- Contentor Dinâmico -->
                    <div id="observatorio-dinamico" class="observatorio-grid"></div>

                    <!-- Botão Ver Mais -->
                    <div class="ver-mais-container">
                        <button id="btn-load-more" class="btn-ver-mais">Ver Mais Notícias</button>
                    </div>

                    <footer class="page-footer">
                        <div style="display: flex; align-items: center; justify-content: flex-end; gap: 10px; opacity: 0.3;">
                            <div style="text-align: right; line-height: 1;">
                                <span style="display: block; font-size: 0.85em; font-weight: 900; color: #333;">bioCultura</span>
                                <span style="display: block; font-size: 0.5em; font-weight: 700; text-transform: uppercase; letter-spacing: 1px;">Global Regeneration</span>
                            </div>
                            <svg width="22" height="22" viewBox="0 0 100 100"><path d="M50 5 L89 27.5 L89 72.5 L50 95 L11 72.5 L11 27.5 Z" fill="#333" /><path d="M50 20 C50 20 75 45 75 70 C75 85 65 85 50 85 C35 85 25 85 25 70 C25 45 50 20 50 20Z" fill="#fff" /></svg>
                        </div>
                    </footer>
				</div>
            </div>
			<div id="sidebar"></div>
		</div>

		<script src="/assets/js/jquery.min.js"></script>
        <script>
            let todasNoticias = [];
            let visiveis = 6;

            async function carregarObservatorio() {
                try {
                    const r = await fetch('/data/noticias.json');
                    todasNoticias = await r.json();
                    renderizarCards();
                } catch(e) { console.error("Erro ao carregar JSON:", e); }
            }

            function renderizarCards() {
                const container = document.getElementById('observatorio-dinamico');
                container.innerHTML = '';

                todasNoticias.forEach((n, index) => {
                    const card = document.createElement('a');
                    card.href = `/observatorio/noticia-detalhe.html?id=${n.id}`;
                    card.className = `news-card ${index >= visiveis ? 'hidden-card' : ''}`;
                    
                    const catClass = n.categoria.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "").replace(" ", "-");

                    card.innerHTML = `
                        <div class="card-image-wrap">
                            <img src="${n.imagem}" alt="${n.titulo}">
                            <span class="badge-cat ${catClass}">${n.categoria}</span>
                        </div>
                        <div class="card-meta">
                            <div class="source-circle">${n.fonte.charAt(0)}</div>
                            <span>${n.fonte}</span>
                        </div>
                        <h3>${n.titulo}</h3>
                        <p>${n.resumo_biocultura.substring(0, 110)}...</p>
                    `;
                    container.appendChild(card);
                });

                const btn = document.getElementById('btn-load-more');
                if (visiveis >= todasNoticias.length) btn.style.display = 'none';
                else btn.style.display = 'inline-block';
            }

            document.getElementById('btn-load-more').onclick = function() {
                visiveis += 6;
                renderizarCards();
            };

            // Inicializa a sidebar e depois as notícias
            fetch('/sidebar-content.html').then(r => r.text()).then(html => {
                document.getElementById('sidebar').innerHTML = html;
                var s = document.createElement('script'); s.src = '/assets/js/main.js'; document.body.appendChild(s);
                carregarObservatorio();
            });
        </script>
	</body>
</html>
