<!DOCTYPE HTML>
<html>
	<head>
		<title>bioCultura - Ecossistema Integrado</title>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
		<link rel="stylesheet" href="assets/css/main.css" />
		<style>
			/* 1. RESET E ESTRUTURA LIMPA */
			section, #header, hr, .major { border: none !important; box-shadow: none !important; padding: 0 !important; }
			#header .toggle { background: none !important; top: 2em !important; left: 2em !important; border: none !important; text-decoration: none !important; z-index: 10001; }
			#header .toggle:before { content: '\f06c' !important; font-family: "Font Awesome 5 Free" !important; font-weight: 900; color: #2e7d32 !important; font-size: 1.6em !important; }
            #header .toggle:after { display: none !important; }
            
            section { 
                padding-top: 1em !important; 
                display: flex; 
                flex-direction: column; 
                align-items: center;
                min-height: 100vh;
                background: #ffffff;
            }

            /* 2. ASSINATURA MINIMALISTA TOPO */
            .mini-banner {
                width: 100%;
                text-align: center;
                padding: 2em 0;
                margin-bottom: 2em;
            }
            .mini-banner h1 { 
                font-family: 'Source Sans Pro', sans-serif; 
                font-size: 1.8em !important; 
                font-weight: 300 !important; 
                color: #2e7d32 !important; 
                margin: 0; 
                letter-spacing: 10px; 
                text-transform: uppercase;
                opacity: 0.8;
            }

            /* 3. O ATLAS BIOCULTURA (SIMBIOSE SEM LINHAS) */
            .atlas-wrapper {
                width: 100%;
                max-width: 1000px;
                padding: 0 20px;
                margin-bottom: 4em;
            }

            .atlas-container {
                position: relative;
                width: 100%;
                height: 550px;
                /* Formato Atlas: Polos achatados e laterais curvas */
                border-radius: 50% / 15%; 
                overflow: hidden;
                box-shadow: 0 30px 70px rgba(0,0,0,0.15);
                background: #000;
            }

            /* Camadas de Imagem Vibrantes */
            .layer {
                position: absolute;
                top: 0; left: 0;
                width: 100%;
                height: 100%;
                background-size: cover;
                background-position: center;
                transition: transform 10s ease-in-out;
            }

            /* Lado Esquerdo: Flora e Terra (Verdes Vibrantes) */
            .layer-earth {
                background-image: url('https://plus.unsplash.com/premium_photo-1661843609413-873da7684616?q=80&w=2071&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D');
                z-index: 1;
            }

            /* Lado Direito: Água e Fauna Marinha (Azuis Profundos) */
            .layer-water {
                background-image: url('https://plus.unsplash.com/premium_photo-1661841439995-1706237c83dc?q=80&w=2070&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D');
                z-index: 2;
                /* Fusão Smooth: sem linhas geométricas, apenas gradiente de transparência */
                mask-image: linear-gradient(to right, transparent 0%, transparent 20%, black 80%, black 100%);
                -webkit-mask-image: linear-gradient(to right, transparent 0%, transparent 20%, black 80%, black 100%);
            }

            .atlas-container:hover .layer {
                transform: scale(1.05);
            }

            /* 4. TEXTO SUBTIL DE CONCEITO */
            .concept-text {
                text-align: center;
                max-width: 700px;
                margin-top: 2em;
                padding: 0 2em;
            }

            .concept-text h2 {
                font-family: 'Source Sans Pro', sans-serif;
                font-size: 2.5em !important;
                font-weight: 300 !important;
                color: #1b5e20 !important;
                margin-bottom: 0.5em !important;
                letter-spacing: -1px;
            }

            .concept-text p {
                font-size: 1.3em !important;
                color: #666 !important;
                font-style: italic;
                line-height: 1.6;
            }

			.footer-signature-right { width: 100%; text-align: right; padding: 6em 2em 2em 0; opacity: 0.8; }

            @media screen and (max-width: 736px) {
                .atlas-container { height: 350px; border-radius: 50% / 10%; }
                .concept-text h2 { font-size: 1.8em !important; }
            }
		</style>
	</head>
	<body class="is-preload">
		<div id="wrapper">
			<div id="main"><div class="inner">
					<header id="header" style="height: 0; margin: 0; padding: 0; overflow: hidden;"></header>
					
                    <section>
                        <!-- ASSINATURA -->
                        <div class="mini-banner">
                            <h1>bioCultura</h1>
                        </div>

                        <!-- O ATLAS: Simbiose de Terra e Água -->
                        <div class="atlas-wrapper">
                            <div class="atlas-container">
                                <div class="layer layer-earth"></div>
                                <div class="layer layer-water"></div>
                            </div>
                        </div>

                        <!-- CONCEITO -->
                        <div class="concept-text">
                            <h2>A Vida não se divide.</h2>
                            <p>Onde a tecnologia e a natureza respiram em uníssono,<br>fechando o ciclo da regeneração ética.</p>
                        </div>
					</section>

					<div class="footer-signature-right">
						<a href="index.html" style="border: none; display: inline-block; text-decoration: none;">
							<div style="font-family: 'Source Sans Pro', sans-serif; font-size: 1.4em; line-height: 1; display: flex; align-items: flex-end; justify-content: flex-end;">
                                <b style="font-weight: 700; color: #2e7d32; margin-right: -3px; position: relative; z-index: 2;">b</b>
                                <div style="width: 32px; margin: 0 -7px; position: relative; line-height: 0; transform: translateY(4px); z-index: 1;">
                                    <svg viewBox="0 0 100 120" xmlns="http://www.w3.org/2000/svg" style="width: 100%; height: auto;">
                                        <path d="M-20 110 Q50 102 120 110" stroke="#634832" stroke-width="4" fill="none" opacity="0.3" />
                                        <path d="M50 110 C50 80 35 70 50 45 C65 70 50 80 50 110" fill="#2e7d32" />
                                        <path d="M50 80 C75 75 85 50 65 40 C50 55 50 65 50 80" fill="#4CAF50" />
                                    </svg>
                                </div>
                                <b style="font-weight: 700; color: #2e7d32; margin-left: -3px; position: relative; z-index: 2;">o</b>
                                <span style="font-weight: 300; color: #444; margin-left: 2px;">Cultura</span>
                            </div>
						</a>
					</div>
				</div></div>
			<div id="sidebar"></div>
		</div>
		<script src="assets/js/jquery.min.js"></script>
        <script src="assets/js/browser.min.js"></script>
        <script src="assets/js/breakpoints.min.js"></script>
        <script src="assets/js/util.js"></script>
        <script>
            fetch('sidebar-content.html').then(response => response.text()).then(data => {
                document.getElementById('sidebar').innerHTML = data;
                var script = document.createElement('script');
                script.src = 'assets/js/main.js';
                document.body.appendChild(script);
            });
        </script>
	</body>
</html>
