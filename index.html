<!DOCTYPE HTML>
<html>
	<head>
		<title>bioCultura - Simbiose Regenerativa</title>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
		<link rel="stylesheet" href="assets/css/main.css" />
		<style>
			/* 1. RESET E ESTRUTURA LIMPA */
			section, #header, hr, .major { border: none !important; box-shadow: none !important; padding: 0 !important; }
			#header .toggle { background: none !important; top: 2em !important; left: 2em !important; border: none !important; text-decoration: none !important; z-index: 10001; }
			#header .toggle:before { content: '\f06c' !important; font-family: "Font Awesome 5 Free" !important; font-weight: 900; color: #2e7d32 !important; font-size: 1.6em !important; }
            #header .toggle:after { display: none !important; }
            
            section { 
                padding-top: 2em !important; 
                display: flex; 
                flex-direction: column; 
                align-items: center;
                min-height: 100vh;
                background: #ffffff;
            }

            /* 2. ASSINATURA MINIMALISTA (SEM LINHAS) */
            .mini-banner {
                width: 100%;
                text-align: center;
                padding: 1em 0;
                margin-bottom: 3em;
                background: transparent; /* Removida a linha/fundo que causava o corte */
            }
            .mini-banner h1 { 
                font-family: 'Source Sans Pro', sans-serif; 
                font-size: 1.5em !important; 
                font-weight: 300 !important; 
                color: #2e7d32 !important; 
                margin: 0; 
                letter-spacing: 8px; 
                text-transform: uppercase;
                opacity: 0.6;
            }

            /* 3. A SIMBIOSE (FOCO TOTAL NA IMAGEM) */
            .symbiosis-container {
                position: relative;
                width: 100%;
                max-width: 1000px;
                height: 650px;
                display: flex;
                align-items: center;
                justify-content: center;
                margin-bottom: 2em;
                /* Máscara suave para evitar bordas quadradas sem esconder a imagem */
                mask-image: radial-gradient(circle, black 40%, rgba(0,0,0,0.4) 70%, transparent 95%);
                -webkit-mask-image: radial-gradient(circle, black 40%, rgba(0,0,0,0.4) 70%, transparent 95%);
            }

            .layer {
                position: absolute;
                width: 100%;
                height: 100%;
                background-size: cover;
                background-position: center;
                mix-blend-mode: multiply; /* Permite a fusão das cores */
                opacity: 0.8;
                transition: all 2s ease;
            }

            .layer-flora {
                background-image: url('https://images.unsplash.com/photo-1503785332284-319726bb6705?q=80&w=2070&auto=format&fit=crop');
                animation: float-slow 20s infinite alternate;
            }

            .layer-water {
                background-image: url('https://images.unsplash.com/photo-1500375592092-40eb2168fd21?q=80&w=2000&auto=format&fit=crop');
                mask-image: radial-gradient(circle at 70% 40%, black 10%, transparent 70%);
                -webkit-mask-image: radial-gradient(circle at 70% 40%, black 10%, transparent 70%);
                animation: float-slow 25s infinite alternate-reverse;
            }

            .layer-fauna {
                background-image: url('https://images.unsplash.com/photo-1456348830699-7f939bc077e0?q=80&w=2070&auto=format&fit=crop');
                mask-image: radial-gradient(circle at 30% 60%, black 5%, transparent 60%);
                -webkit-mask-image: radial-gradient(circle at 30% 60%, black 5%, transparent 60%);
                opacity: 0.6;
            }

            /* 4. BOTÃO CENTRAL (ÚNICO ELEMENTO SOBREPOSTO) */
            .core-cta {
                position: relative;
                z-index: 100;
                text-align: center;
            }

            .button.primary {
                background-color: #2e7d32 !important;
                border-radius: 50px;
                padding: 0 4em;
                height: 4em;
                line-height: 4em;
                font-size: 0.9em;
                letter-spacing: 4px;
                text-transform: uppercase;
                font-weight: 700;
                box-shadow: 0 20px 40px rgba(0,0,0,0.2) !important;
                transition: all 0.3s ease;
            }
            .button.primary:hover {
                transform: translateY(-5px);
                box-shadow: 0 25px 50px rgba(46, 125, 50, 0.4) !important;
            }

            @keyframes float-slow {
                from { transform: scale(1); }
                to { transform: scale(1.15); }
            }

			.footer-signature-right { width: 100%; text-align: right; padding: 4em 2em 2em 0; opacity: 0.8; }

            @media screen and (max-width: 736px) {
                .symbiosis-container { height: 450px; }
            }
		</style>
	</head>
	<body class="is-preload">
		<div id="wrapper">
			<div id="main"><div class="inner">
					<header id="header" style="height: 0; margin: 0; padding: 0; overflow: hidden;"></header>
					
                    <section>
                        <!-- ASSINATURA LIMPA -->
                        <div class="mini-banner">
                            <h1>bioCultura</h1>
                        </div>

                        <!-- A SIMBIOSE: Sem letras, apenas o compromisso -->
                        <div class="symbiosis-container">
                            <div class="layer layer-flora"></div>
                            <div class="layer layer-water"></div>
                            <div class="layer layer-fauna"></div>

                            <div class="core-cta">
                                <a href="manifesto.html" class="button primary">O Nosso Compromisso</a>
                            </div>
                        </div>

                        <!-- TEXTO SUBTIL DE APOIO NO FUNDO -->
                        <div style="text-align: center; max-width: 600px; margin-top: 3em; padding: 0 2em;">
                            <p style="font-size: 1.1em !important; color: #888 !important; font-style: italic; letter-spacing: 1px;">
                                Onde a tecnologia e a vida respiram em uníssono.
                            </p>
                        </div>
					</section>

					<div class="footer-signature-right">
						<a href="index.html" style="border: none; display: inline-block; text-decoration: none;">
							<div style="font-family: 'Source Sans Pro', sans-serif; font-size: 1.4em; line-height: 1; display: flex; align-items: flex-end; justify-content: flex-end;">
                                <b style="font-weight: 700; color: #2e7d32; margin-right: -3px; position: relative; z-index: 2;">b</b>
                                <div style="width: 32px; margin: 0 -7px; position: relative; line-height: 0; transform: translateY(4px); z-index: 1;">
                                    <svg viewBox="0 0 100 120" xmlns="http://www.w3.org/2000/svg" style="width: 100%; height: auto;">
                                        <path d="M-20 110 Q50 102 120 110" stroke="#634832" stroke-width="4" fill="none" opacity="0.3" />
                                        <path d="M50 110 C50 80 35 70 50 45 C65 70 50 80 50 110" fill="#2e7d32" />
                                        <path d="M50 80 C75 75 85 50 65 40 C50 55 50 65 50 80" fill="#4CAF50" />
                                    </svg>
                                </div>
                                <b style="font-weight: 700; color: #2e7d32; margin-left: -3px; position: relative; z-index: 2;">o</b>
                                <span style="font-weight: 300; color: #444; margin-left: 2px;">Cultura</span>
                            </div>
						</a>
					</div>
				</div></div>
			<div id="sidebar"></div>
		</div>
		<script src="assets/js/jquery.min.js"></script>
        <script src="assets/js/browser.min.js"></script>
        <script src="assets/js/breakpoints.min.js"></script>
        <script src="assets/js/util.js"></script>
        <script>
            fetch('sidebar-content.html').then(response => response.text()).then(data => {
                document.getElementById('sidebar').innerHTML = data;
                var script = document.createElement('script');
                script.src = 'assets/js/main.js';
                document.body.appendChild(script);
            });
        </script>
	</body>
</html>
