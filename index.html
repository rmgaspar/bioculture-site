<!DOCTYPE HTML>
<html>
	<head>
		<title>bioCultura - Ecossistema Integrado</title>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
		<link rel="stylesheet" href="assets/css/main.css" />
		<style>
			/* 1. ESTRUTURA E LIMPEZA */
			section, #header, hr, .major { border: none !important; box-shadow: none !important; padding: 0 !important; }
			#header .toggle { background: none !important; top: 2em !important; left: 2em !important; border: none !important; text-decoration: none !important; z-index: 10001; }
			#header .toggle:before { content: '\f06c' !important; font-family: "Font Awesome 5 Free" !important; font-weight: 900; color: #2e7d32 !important; font-size: 1.6em !important; }
            #header .toggle:after { display: none !important; }
            section { padding-top: 1em !important; }

            /* 2. MINI-BANNER ASSINATURA */
            .mini-banner {
                width: 100%;
                text-align: center;
                padding: 2em 0;
                margin-bottom: 1em;
            }
            .mini-banner h1 { 
                font-family: 'Source Sans Pro', sans-serif; 
                font-size: 2.2em !important; 
                font-weight: 300 !important; 
                color: #2e7d32 !important; 
                margin: 0; 
                letter-spacing: 4px; 
            }
            .mini-banner b { font-weight: 700; }

            /* 3. O PUZZLE BIOCULTURA (6 PEÇAS INTERLIGADAS) */
            .puzzle-board {
                display: grid;
                grid-template-columns: repeat(3, 300px);
                grid-template-rows: repeat(2, 300px);
                justify-content: center;
                margin: 4em auto 8em auto;
                /* Gap negativo para as abas encaixarem umas nas outras */
                gap: -40px; 
            }

            .piece {
                position: relative;
                width: 380px; /* Maior que a célula da grid para permitir a aba */
                height: 380px;
                cursor: pointer;
                transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
                filter: saturate(0.6) brightness(0.9);
                z-index: 1;
            }

            .piece img {
                width: 100%;
                height: 100%;
                object-fit: cover;
                pointer-events: none;
            }

            .piece:hover {
                filter: saturate(1.2) brightness(1);
                transform: scale(1.05);
                z-index: 100 !important;
                filter: drop-shadow(0 20px 30px rgba(0,0,0,0.3));
            }

            /* MÁSCARAS DE PUZZLE (SVG CLIP-PATH) */
            /* Peça 1: Canto Superior Esquerdo (Aba Direita, Aba Baixo) */
            .p1 { 
                grid-column: 1; grid-row: 1;
                clip-path: url(#puzzle-p1);
            }
            /* Peça 2: Topo Centro (Cava Esquerda, Aba Direita, Aba Baixo) */
            .p2 { 
                grid-column: 2; grid-row: 1; margin-left: -80px;
                clip-path: url(#puzzle-p2);
            }
            /* Peça 3: Canto Superior Direito (Cava Esquerda, Aba Baixo) */
            .p3 { 
                grid-column: 3; grid-row: 1; margin-left: -160px;
                clip-path: url(#puzzle-p3);
            }
            /* Peça 4: Baixo Esquerdo (Cava Cima, Aba Direita) */
            .p4 { 
                grid-column: 1; grid-row: 2; margin-top: -80px;
                clip-path: url(#puzzle-p4);
            }
            /* Peça 5: Baixo Centro (Cava Esquerda, Cava Cima, Aba Direita) */
            .p5 { 
                grid-column: 2; grid-row: 2; margin-left: -80px; margin-top: -80px;
                clip-path: url(#puzzle-p5);
            }
            /* Peça 6: Baixo Direito (Cava Esquerda, Cava Cima) */
            .p6 { 
                grid-column: 3; grid-row: 2; margin-left: -160px; margin-top: -80px;
                clip-path: url(#puzzle-p6);
            }

            .piece-label {
                position: absolute;
                top: 40%; left: 40%;
                color: #fff; font-weight: 800; text-transform: uppercase;
                letter-spacing: 2px; font-size: 0.9em;
                text-shadow: 0 2px 10px rgba(0,0,0,0.5);
                pointer-events: none;
            }

            /* 4. TEXTO DE TRANSIÇÃO */
            .intro-text-smooth {
                text-align: center;
                padding: 0 10%;
                margin-bottom: 8em;
            }
            .intro-text-smooth h2 { color: #2e7d32; font-size: 2.2em; font-weight: 700; margin-bottom: 0.8em; }
            .intro-text-smooth p { font-size: 1.35em; line-height: 1.6; color: #555; max-width: 800px; margin: 0 auto; font-style: italic; }

			.footer-signature-right { text-align: right; padding: 4em 0 2em 0; opacity: 0.9; }

            /* Mobile: No telemóvel as peças tornam-se cartões normais */
            @media screen and (max-width: 1000px) {
                .puzzle-board { display: flex; flex-direction: column; align-items: center; gap: 20px; }
                .piece { clip-path: none !important; width: 90%; height: 250px; border-radius: 30px; margin: 0 !important; }
                .piece-label { top: 50%; left: 50%; transform: translate(-50%, -50%); }
            }
		</style>
	</head>
