<!DOCTYPE HTML>
<html>
	<head>
		<title>bioCultura - Ecossistema Integrado</title>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
		<link rel="stylesheet" href="assets/css/main.css" />
		<style>
			/* 1. ESTRUTURA E LIMPEZA */
			section, #header, hr, .major { border: none !important; box-shadow: none !important; padding: 0 !important; }
			#header .toggle { background: none !important; top: 2em !important; left: 2em !important; border: none !important; text-decoration: none !important; z-index: 10001; }
			#header .toggle:before { content: '\f06c' !important; font-family: "Font Awesome 5 Free" !important; font-weight: 900; color: #2e7d32 !important; font-size: 1.6em !important; }
            #header .toggle:after { display: none !important; }
            section { padding-top: 1em !important; }

            /* 2. ASSINATURA TOPO */
            .mini-banner { width: 100%; text-align: center; padding: 2em 0; margin-bottom: 1em; }
            .mini-banner h1 { font-family: 'Source Sans Pro', sans-serif; font-size: 2.2em !important; font-weight: 300 !important; color: #2e7d32 !important; margin: 0; letter-spacing: 4px; }
            .mini-banner b { font-weight: 700; }

            /* 3. O PUZZLE REAL (3x2) */
            .puzzle-container {
                display: flex;
                justify-content: center;
                align-items: center;
                padding: 40px 20px;
                margin-bottom: 4em;
            }

            .puzzle-grid {
                display: grid;
                grid-template-columns: repeat(3, 260px);
                grid-template-rows: repeat(2, 260px);
                gap: 0;
            }

            .piece {
                position: relative;
                width: 325px; /* Ligeiramente maior para a aba respirar */
                height: 325px;
                cursor: pointer;
                transition: all 0.3s ease;
                filter: saturate(0.8);
                z-index: 1;
            }

            .piece img {
                width: 100%;
                height: 100%;
                object-fit: cover;
                pointer-events: none;
            }

            .piece:hover {
                filter: saturate(1.2) brightness(1.1);
                transform: scale(1.03);
                z-index: 100 !important;
                filter: drop-shadow(0 15px 30px rgba(0,0,0,0.4));
            }

            /* Labels dos Elementos */
            .piece-label {
                position: absolute;
                top: 50%; left: 50%;
                transform: translate(-50%, -50%);
                color: #fff; font-weight: 800; text-transform: uppercase;
                letter-spacing: 4px; font-size: 1.1em;
                text-shadow: 0 2px 10px rgba(0,0,0,0.8);
                pointer-events: none;
                z-index: 101;
            }

            /* POSICIONAMENTO E ENCAIXE (CLIP-PATH) */
            .p-ar      { grid-column: 1; grid-row: 1; clip-path: url(#clip-p1); }
            .p-fauna   { grid-column: 2; grid-row: 1; margin-left: -65px; clip-path: url(#clip-p2); }
            .p-agua    { grid-column: 3; grid-row: 1; margin-left: -130px; clip-path: url(#clip-p3); }
            .p-flora   { grid-column: 1; grid-row: 2; margin-top: -65px; clip-path: url(#clip-p4); }
            .p-energia { grid-column: 2; grid-row: 2; margin-left: -65px; margin-top: -65px; clip-path: url(#clip-p5); }
            .p-terra   { grid-column: 3; grid-row: 2; margin-left: -130px; margin-top: -65px; clip-path: url(#clip-p6); }

            /* 4. TEXTO FINAL */
            .intro-text-smooth { text-align: center; padding: 0 10%; margin-bottom: 8em; }
            .intro-text-smooth h2 { color: #2e7d32; font-size: 2.2em; font-weight: 700; margin-bottom: 0.8em; }
            .intro-text-smooth p { font-size: 1.35em; line-height: 1.6; color: #555; max-width: 800px; margin: 0 auto; font-style: italic; }

			.footer-signature-right { text-align: right; padding: 4em 0 2em 0; opacity: 0.9; }

            @media screen and (max-width: 1000px) {
                .puzzle-grid { display: flex; flex-direction: column; align-items: center; gap: 20px; }
                .piece { clip-path: none !important; width: 90%; height: 250px; border-radius: 30px; margin: 0 !important; }
            }
		</style>
	</head>

            </defs>
        </svg>
