<!DOCTYPE HTML>
<html>
	<head>
		<title>bioCultura - Ecossistema em Comunhão</title>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
		<link rel="stylesheet" href="assets/css/main.css" />
		<style>
			/* 1. ESTRUTURA MINIMALISTA */
			section, #header, hr, .major { border: none !important; box-shadow: none !important; padding: 0 !important; }
			#header .toggle { background: none !important; top: 2em !important; left: 2em !important; border: none !important; text-decoration: none !important; z-index: 10001; }
			#header .toggle:before { content: '\f06c' !important; font-family: "Font Awesome 5 Free" !important; font-weight: 900; color: #2e7d32 !important; font-size: 1.6em !important; }
            #header .toggle:after { display: none !important; }
            section { padding-top: 1em !important; display: flex; flex-direction: column; align-items: center; }

            /* 2. ASSINATURA TOPO */
            .mini-banner {
                width: 100%;
                text-align: center;
                padding: 3em 0 1em 0;
            }
            .mini-banner h1 { 
                font-family: 'Source Sans Pro', sans-serif; 
                font-size: 2.2em !important; 
                font-weight: 300 !important; 
                color: #2e7d32 !important; 
                margin: 0; 
                letter-spacing: 6px; 
                text-transform: none;
            }
            .mini-banner b { font-weight: 700; }

            /* 3. O GLOBO DA VIDA (O MOMENTO WOW) */
            .wow-wrapper {
                position: relative;
                width: 550px;
                height: 550px;
                margin: 2em 0 5em 0;
                display: flex;
                justify-content: center;
                align-items: center;
            }

            /* Aura de Energia/Ar */
            .wow-wrapper::before {
                content: '';
                position: absolute;
                width: 110%;
                height: 110%;
                border-radius: 50%;
                background: radial-gradient(circle, rgba(46, 125, 50, 0.1) 0%, transparent 70%);
                animation: pulse 8s infinite ease-in-out;
            }

            .globe-main {
                position: relative;
                width: 100%;
                height: 100%;
                border-radius: 50%;
                overflow: hidden;
                box-shadow: 0 40px 100px rgba(0,0,0,0.2);
                background: #000;
                transition: transform 0.6s cubic-bezier(0.23, 1, 0.32, 1);
            }

            .globe-main:hover {
                transform: scale(1.02);
            }

            /* Metade Superior: Terrestre (Flora/Fauna) */
            .terrestrial {
                position: absolute;
                top: 0; width: 100%; height: 50%;
                background-image: url('https://images.unsplash.com/photo-1441974231531-c6227db76b6e?q=80&w=2071&auto=format&fit=crop');
                background-size: cover;
                background-position: center bottom;
                border-bottom: 2px solid rgba(255,255,255,0.2);
                z-index: 2;
            }

            /* Metade Inferior: Marinha (Água/Fauna) */
            .marine {
                position: absolute;
                bottom: 0; width: 100%; height: 50%;
                background-image: url('https://images.unsplash.com/photo-1518020382113-a7e8fc38eac9?q=80&w=2034&auto=format&fit=crop');
                background-size: cover;
                background-position: center top;
                z-index: 1;
            }

            /* Divisor Smooth */
            .globe-divider {
                position: absolute;
                top: 50%; left: 0; width: 100%; height: 1px;
                background: linear-gradient(to right, transparent, rgba(255,255,255,0.5), transparent);
                z-index: 3;
                transform: translateY(-50%);
            }

            @keyframes pulse {
                0%, 100% { transform: scale(1); opacity: 0.5; }
                50% { transform: scale(1.05); opacity: 0.8; }
            }

            /* 4. TEXTO DE TRANSIÇÃO */
            .intro-text-smooth {
                text-align: center;
                max-width: 800px;
                margin-bottom: 8em;
            }
            .intro-text-smooth h2 { color: #2e7d32; font-size: 2.2em; font-weight: 700; margin-bottom: 1em; letter-spacing: -1px; }
            .intro-text-smooth p { font-size: 1.4em; line-height: 1.6; color: #555; font-style: italic; }

            .button.primary {
                background-color: #2e7d32 !important;
                border-radius: 50px;
                padding: 0 3.5em;
                margin-top: 3em;
            }

			.footer-signature-right { width: 100%; text-align: right; padding: 4em 0 2em 0; opacity: 0.9; }

            /* Mobile */
            @media screen and (max-width: 736px) {
                .wow-wrapper { width: 320px; height: 320px; }
                .mini-banner h1 { font-size: 1.6em !important; }
            }
		</style>
	</head>
	<body class="is-preload">
		<div id="wrapper">
			<div id="main"><div class="inner">
					<header id="header" style="height: 0; margin: 0; padding: 0; overflow: hidden;"></header>
					
                    <section>
                        <!-- ASSINATURA NO TOPO -->
                        <div class="mini-banner">
                            <h1><b>b</b>io<b>C</b>ultura</h1>
                        </div>

                        <!-- O GLOBO: Comunhão Terrestre e Marítima -->
                        <div class="wow-wrapper">
                            <div class="globe-main">
                                <div class="terrestrial"></div>
                                <div class="globe-divider"></div>
                                <div class="marine"></div>
                            </div>
                        </div>

                        <!-- MENSAGEM FINAL -->
                        <div class="intro-text-smooth">
                            <h2>Um Ecossistema, Uma Vida.</h2>
                            <p>"Da raiz profunda ao oceano imenso, a bioCultura une a fauna, a flora e os recursos vitais num único ciclo de regeneração ética."</p>
                            <a href="manifesto.html" class="button primary">O Nosso Compromisso</a>
                        </div>
					</section>

					<div class="footer-signature-right">
						<a href="index.html" style="border: none; display: inline-block; text-decoration: none;">
							<div style="font-family: 'Source Sans Pro', sans-serif; font-size: 1.4em; line-height: 1; display: flex; align-items: flex-end; justify-content: flex-end;">
                                <b style="font-weight: 700; color: #2e7d32; margin-right: -3px; position: relative; z-index: 2;">b</b>
                                <div style="width: 32px; margin: 0 -7px; position: relative; line-height: 0; transform: translateY(4px); z-index: 1;">
                                    <svg viewBox="0 0 100 120" xmlns="http://www.w3.org/2000/svg" style="width: 100%; height: auto;">
                                        <path d="M-20 110 Q50 102 120 110" stroke="#634832" stroke-width="4" fill="none" opacity="0.3" />
                                        <path d="M50 110 C50 80 35 70 50 45 C65 70 50 80 50 110" fill="#2e7d32" />
                                        <path d="M50 80 C75 75 85 50 65 40 C50 55 50 65 50 80" fill="#4CAF50" />
                                    </svg>
                                </div>
                                <b style="font-weight: 700; color: #2e7d32; margin-left: -3px; position: relative; z-index: 2;">o</b>
                                <span style="font-weight: 300; color: #444; margin-left: 2px;">Cultura</span>
                            </div>
						</a>
					</div>
				</div></div>
			<div id="sidebar"></div>
		</div>
		<script src="assets/js/jquery.min.js"></script>
        <script src="assets/js/browser.min.js"></script>
        <script src="assets/js/breakpoints.min.js"></script>
        <script src="assets/js/util.js"></script>
        <script>
            fetch('sidebar-content.html').then(response => response.text()).then(data => {
                document.getElementById('sidebar').innerHTML = data;
                var script = document.createElement('script');
                script.src = 'assets/js/main.js';
                document.body.appendChild(script);
            });
        </script>
	</body>
</html>
