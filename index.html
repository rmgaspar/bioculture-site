<!DOCTYPE HTML>
<html>
	<head>
		<title>bioCultura - Simbiose Regenerativa</title>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
		<link rel="stylesheet" href="assets/css/main.css" />
		<style>
			/* 1. RESET E ESTRUTURA LIMPA */
			section, #header, hr, .major { border: none !important; box-shadow: none !important; padding: 0 !important; }
			#header .toggle { background: none !important; top: 2em !important; left: 2em !important; border: none !important; text-decoration: none !important; z-index: 10001; }
			#header .toggle:before { content: '\f06c' !important; font-family: "Font Awesome 5 Free" !important; font-weight: 900; color: #2e7d32 !important; font-size: 1.6em !important; }
            #header .toggle:after { display: none !important; }
            
            section { 
                padding-top: 2em !important; 
                display: flex; 
                flex-direction: column; 
                align-items: center;
                min-height: 100vh;
            }

            /* 2. MINI-BANNER ASSINATURA */
            .mini-banner {
                width: 100%;
                text-align: center;
                padding: 1em 0;
                margin-bottom: 4em;
            }
            .mini-banner h1 { 
                font-family: 'Source Sans Pro', sans-serif; 
                font-size: 1.5em !important; 
                font-weight: 300 !important; 
                color: #2e7d32 !important; 
                margin: 0; 
                letter-spacing: 8px; 
                text-transform: uppercase;
                opacity: 0.8;
            }

            /* 3. A SIMBIOSE (O CENTRO VISUAL) */
            .symbiosis-container {
                position: relative;
                width: 100%;
                max-width: 900px;
                height: 600px;
                display: flex;
                align-items: center;
                justify-content: center;
                margin-bottom: 4em;
            }

            /* As camadas de imagem que se fundem */
            .layer {
                position: absolute;
                width: 100%;
                height: 100%;
                background-size: cover;
                background-position: center;
                /* O segredo da simbiose: máscaras radiais e blend modes */
                mask-image: radial-gradient(circle, black 20%, transparent 70%);
                -webkit-mask-image: radial-gradient(circle, black 20%, transparent 70%);
                mix-blend-mode: multiply;
                opacity: 0.8;
                transition: all 2s ease-in-out;
            }

            .layer-flora {
                background-image: url('https://plus.unsplash.com/premium_photo-1661963774520-d5edf06bb573?q=80&w=3205&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D');
                animation: float-slow 10s infinite alternate;
            }

            .layer-water {
                background-image: url('https://plus.unsplash.com/premium_photo-1661841439995-1706237c83dc?q=80&w=2070&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D');
                mask-image: radial-gradient(circle at 70% 50%, black 10%, transparent 60%);
                -webkit-mask-image: radial-gradient(circle at 70% 50%, black 10%, transparent 60%);
                animation: float-slow 12s infinite alternate-reverse;
            }

            .layer-fauna {
                background-image: url('https://plus.unsplash.com/premium_photo-1661883642449-ba33bbfdf42e?q=80&w=3028&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D');
                mask-image: radial-gradient(circle at 30% 60%, black 5%, transparent 50%);
                -webkit-mask-image: radial-gradient(circle at 30% 60%, black 5%, transparent 50%);
                opacity: 0.6;
            }

            /* 4. CONTEÚDO TIPOGRÁFICO (SOBREPOSTO) */
            .core-message {
                position: relative;
                z-index: 10;
                text-align: center;
                max-width: 650px;
                padding: 2em;
            }

            .core-message h2 {
                font-family: 'Source Sans Pro', sans-serif;
                font-size: 3.5em !important;
                font-weight: 300 !important;
                color: #1b5e20 !important;
                line-height: 1.1 !important;
                margin-bottom: 0.5em !important;
                letter-spacing: -1px;
            }

            .core-message p {
                font-size: 1.4em !important;
                color: #2e7d32 !important;
                font-style: italic;
                font-weight: 400;
                opacity: 0.9;
            }

            /* Animação subtil de respiração */
            @keyframes float-slow {
                from { transform: scale(1) translate(0, 0); }
                to { transform: scale(1.1) translate(10px, 10px); }
            }

            /* 5. BOTÃO E RODAPÉ */
            .button-container {
                margin-top: 2em;
                z-index: 20;
            }
            .button.primary {
                background-color: #2e7d32 !important;
                border-radius: 50px;
                padding: 0 4em;
                height: 3.5em;
                line-height: 3.5em;
                font-size: 0.8em;
                letter-spacing: 3px;
                text-transform: uppercase;
                box-shadow: 0 10px 20px rgba(46, 125, 50, 0.2) !important;
            }

			.footer-signature-right { width: 100%; text-align: right; padding: 6em 2em 2em 0; opacity: 0.8; }

            @media screen and (max-width: 736px) {
                .core-message h2 { font-size: 2.2em !important; }
                .symbiosis-container { height: 400px; }
            }
		</style>
	</head>
	<body class="is-preload">
		<div id="wrapper">
			<div id="main"><div class="inner">
					<header id="header" style="height: 0; margin: 0; padding: 0; overflow: hidden;"></header>
					
                    <section>
                        <!-- ASSINATURA MINIMALISTA -->
                        <div class="mini-banner">
                            <h1>bioCultura</h1>
                        </div>

                        <!-- O VÓRTICE: Simbiose Imperceptível -->
                        <div class="symbiosis-container">
                            <div class="layer layer-flora"></div>
                            <div class="layer layer-water"></div>
                            <div class="layer layer-fauna"></div>

                            <div class="core-message">
                                <h2>A Vida não se divide.</h2>
                                <p>Na bioCultura, a tecnologia não imita a natureza. Ela torna-se parte dela.</p>
                                
                                <div class="button-container">
                                    <a href="manifesto.html" class="button primary">O Nosso Compromisso</a>
                                </div>
                            </div>
                        </div>

                        <!-- CONTEÚDO ADICIONAL SUBTIL -->
                        <div style="text-align: center; max-width: 700px; margin-top: 2em;">
                            <p style="font-size: 1.1em !important; color: #666 !important;">
                                Da inteligência do solo à pureza do ar, desenhamos sistemas onde a energia flui de forma ética, fechando o ciclo da regeneração.
                            </p>
                        </div>
					</section>

					<div class="footer-signature-right">
						<a href="index.html" style="border: none; display: inline-block; text-decoration: none;">
							<div style="font-family: 'Source Sans Pro', sans-serif; font-size: 1.4em; line-height: 1; display: flex; align-items: flex-end; justify-content: flex-end;">
                                <b style="font-weight: 700; color: #2e7d32; margin-right: -3px; position: relative; z-index: 2;">b</b>
                                <div style="width: 32px; margin: 0 -7px; position: relative; line-height: 0; transform: translateY(4px); z-index: 1;">
                                    <svg viewBox="0 0 100 120" xmlns="http://www.w3.org/2000/svg" style="width: 100%; height: auto;">
                                        <path d="M-20 110 Q50 102 120 110" stroke="#634832" stroke-width="4" fill="none" opacity="0.3" />
                                        <path d="M50 110 C50 80 35 70 50 45 C65 70 50 80 50 110" fill="#2e7d32" />
                                        <path d="M50 80 C75 75 85 50 65 40 C50 55 50 65 50 80" fill="#4CAF50" />
                                    </svg>
                                </div>
                                <b style="font-weight: 700; color: #2e7d32; margin-left: -3px; position: relative; z-index: 2;">o</b>
                                <span style="font-weight: 300; color: #444; margin-left: 2px;">Cultura</span>
                            </div>
						</a>
					</div>
				</div></div>
			<div id="sidebar"></div>
		</div>
		<script src="assets/js/jquery.min.js"></script>
        <script src="assets/js/browser.min.js"></script>
        <script src="assets/js/breakpoints.min.js"></script>
        <script src="assets/js/util.js"></script>
        <script>
            fetch('sidebar-content.html').then(response => response.text()).then(data => {
                document.getElementById('sidebar').innerHTML = data;
                var script = document.createElement('script');
                script.src = 'assets/js/main.js';
                document.body.appendChild(script);
            });
        </script>
	</body>
</html>
