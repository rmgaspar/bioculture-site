<!DOCTYPE HTML>
<html>
	<head>
		<title>bioCultura - Observatório da Biodiversidade</title>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
		<link rel="stylesheet" href="/assets/css/main.css" />
		<style>
            body, input, select, textarea { font-family: 'Source Sans Pro', sans-serif !important; color: #444; }
			section, #header, hr, .major { border: none !important; box-shadow: none !important; padding: 0 !important; }
            #sidebar { position: fixed !important; top: 0; left: 0; height: 100vh !important; width: 18em !important; background: #fff; border-right: 1px solid #f2f2f2 !important; z-index: 10000; }
            #wrapper { padding-left: 18em !important; }
            .inner { padding: 2.2em 4em !important; max-width: 1600px !important; margin: 0 auto; }
            .hero-split { display: flex; align-items: flex-start; justify-content: space-between; gap: 4em; margin-bottom: 2em; }
            .hero-text h1 { font-size: 4em; font-weight: 900; color: #1a1a1a; letter-spacing: -2.5px; line-height: 0.95; }
            .species-list { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 10px; }
            .species-badge { display: inline-flex; align-items: center; gap: 6px; background: #f8f9fa; color: #555; padding: 6px 14px; border-radius: 50px; font-size: 0.75em; font-weight: 700; border: 1px solid #eee; }
            .species-badge-complex { display: inline-flex; align-items: center; gap: 10px; background: #fff; padding: 8px 16px; border-radius: 50px; border: 1px solid #eee; margin-bottom: 10px; box-shadow: 0 2px 5px rgba(0,0,0,0.02); }
            .species-badge-complex img { width: 32px; height: 32px; border-radius: 50%; object-fit: cover; background: #f0f0f0; }
            .label-mini { font-size: 0.65em; font-weight: 900; text-transform: uppercase; letter-spacing: 1px; color: #bbb; display: block; margin-top: 30px; border-bottom: 1px solid #f9f9f9; padding-bottom: 5px; }
            #reg-name { text-transform: none !important; color: #1a1a1a; }
            @media screen and (max-width: 1280px) { #sidebar { position: relative !important; width: 100% !important; } #wrapper { padding-left: 0 !important; } }
		</style>
	</head>
	<body class="is-preload">
		<div id="wrapper">
			<div id="main">
                <div class="inner">
                    <section>
                        <div class="hero-split">
                            <div class="hero-text">
                                <span style="font-size: 0.65em; font-weight: 900; text-transform: uppercase; color: #bbb;">Ecossistemas</span>
                                <h1>Biodiversidade: A Teia da Vida</h1>
                                <div id="bio-dashboard" style="display:none; margin-top: 40px;">
                                    <div id="group-fauna"></div> <!-- O JS vai injetar tudo aqui -->
                                    <div id="group-flora"></div>
                                    <p>Análise regional: <strong id="reg-name">...</strong></p>
                                </div>
                                    <p style="font-size: 0.7em; color: #bbb; margin-top: 30px; border-top: 1px solid #f9f9f9; padding-top: 15px;">
                                        Análise regional: <strong id="reg-name">A carregar dados atualizados...</strong>
                                    </p>
                                </div>
                            </div>
                        </div>
                        <div id="noticias-bio-dinamico" class="news-list" style="margin-top: 4em;"></div>
                    </section>
                </div>
            </div>
			<div id="sidebar"></div>
		</div>

		<script src="/assets/js/jquery.min.js"></script>
        <script>
            let locationsDB = [], todasNoticias = [];

            async function inicializarPagina() {
                try {
                    // Cache Buster: Adiciona um timestamp para forçar o download do JSON novo
                    const v = Date.now();
                    const [rLoc, rNews] = await Promise.all([
                        fetch(`/data/bioregioes.json?v=${v}`).then(r => r.json()),
                        fetch(`/data/noticias.json?v=${v}`).then(r => r.json())
                    ]);
                    
                    locationsDB = rLoc;
                    todasNoticias = rNews.filter(n => n.categoria === 'biodiv');

                    const savedId = localStorage.getItem('biocultura_region');
                    const info = locationsDB.find(i => String(i.id) === String(savedId)) || locationsDB[0];

                    renderDashboard(info);
                    renderizarCardsBio();
                } catch(e) { 
                    console.error("Erro ao carregar dados:", e);
                }
            }

            function renderDashboard(info) {
                if(!info) return;
                document.getElementById('bio-dashboard').style.display = 'block';
                document.getElementById('reg-name').innerText = info.titulo + (info.concelho ? ', ' + info.concelho : '');

                const b = info.biomas || {};
                
                const buildSimple = (title, items) => {
                    if(!items || items.length === 0) return '';
                    return `<span class="label-mini">${title}</span><div class="species-list">${items.map(i => `<span class="species-badge">${i}</span>`).join('')}</div>`;
                };

                const buildComplex = (items) => {
                    if(!items || items.length === 0) return '<p style="color:#bbb;font-size:0.8em;">Sem registos iNaturalist.</p>';
                    return items.map(i => {
                        const nome = i.nome || i; // Se for objeto usa .nome, se for string usa i
                        const img = i.imagem || '';
                        return `
                            <div class="species-badge-complex">
                                ${img ? `<img src="${img}" onerror="this.style.display='none'">` : '🔍'}
                                <div>
                                    <b>${nome}</b>
                                    ${i.grupo ? `<small>${i.grupo}</small>` : ''}
                                </div>
                            </div>`;
                    }).join('');
                };
                document.getElementById('group-fauna').innerHTML = 
                    buildSimple('Fauna Protegida / Ameaçada', b.fauna_protegida || b.fauna_ameacada) +
                    `<span class="label-mini">Biodiversidade Local (iNaturalist)</span><div class="species-list">${buildComplex(b.fauna_comum)}</div>`;

                document.getElementById('group-flora').innerHTML = buildSimple('Flora e Invasoras', b.flora_protegida || b.flora_invasora);
            }

            function renderizarCardsBio() {
                const lang = localStorage.getItem('selected_lang') || 'pt';
                const container = document.getElementById('noticias-bio-dinamico');
                if(!container) return;
                container.innerHTML = todasNoticias.slice(0, 4).map(n => {
                    const content = n[lang] || n.pt || n;
                    return `<div class="news-item"><h3>${content.titulo}</h3></div>`;
                }).join('');
            }

            fetch('/sidebar-content.html').then(r => r.text()).then(html => {
                document.getElementById('sidebar').innerHTML = html;
                inicializarPagina();
            });
        </script>
	</body>
</html>
