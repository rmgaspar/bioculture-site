<!DOCTYPE HTML>
<html>
<head>
    <title>bioCultura - Detalhe da Espécie</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
    <link rel="stylesheet" href="/assets/css/main.css" />
    <style>
        body { font-family: 'Source Sans Pro', sans-serif; color: #444; background: #fff; }
        .detail-container { max-width: 1100px; margin: 4em auto; padding: 0 2em; }
        .hero-especie { display: flex; gap: 4em; align-items: start; margin-bottom: 3em; }
        .img-container { flex: 1; min-width: 400px; }
        .hero-especie img { width: 100%; height: 600px; object-fit: cover; border-radius: 24px; box-shadow: 0 30px 60px rgba(0,0,0,0.1); }
        .info-header { flex: 1.2; }
        .info-header h1 { font-size: 3.8em; font-weight: 900; margin: 0; letter-spacing: -2px; }
        .info-header h2 { font-size: 1.4em; color: #bbb; font-style: italic; margin: 10px 0 2em 0; font-weight: 400; }
        .data-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 30px; border-top: 1px solid #f2f2f2; padding-top: 2em; }
        .data-item b { display: block; font-size: 0.65em; text-transform: uppercase; letter-spacing: 2px; color: #5c6bc0; margin-bottom: 8px; }
        .data-item p { font-size: 1.1em; font-weight: 600; margin: 0; }
        .sintese-box { background: #f8faff; padding: 3em; border-radius: 24px; margin-top: 2em; }
        .sintese-box b { display: block; margin-bottom: 15px; font-size: 0.8em; text-transform: uppercase; color: #1a237e; }
        .sintese-box p { font-size: 1.2em; line-height: 1.8; text-align: justify; }
        .btn-voltar { display: inline-block; margin-top: 3em; font-size: 0.8em; font-weight: 800; text-transform: uppercase; color: #bbb; text-decoration: none; }
        @media screen and (max-width: 980px) { .hero-especie { flex-direction: column; } .img-container { min-width: 100%; } }
    </style>
</head>
<body>
    <div class="detail-container">
        <div id="render-especie"><p>A carregar dados...</p></div>
        <a href="javascript:history.back()" class="btn-voltar">← Voltar</a>
    </div>
    <script>
        async function carregar() {
            const id = new URLSearchParams(window.location.search).get('id');
            const res = await fetch('/data/especies_master.json?v=' + Date.now());
            const master = await res.json();
            const esp = master[id];
            if(!esp) return;

            const tax = esp.taxonomia_completa ? esp.taxonomia_completa.slice(-3).join(' > ') : esp.grupo;

            document.getElementById('render-especie').innerHTML = `
                <div class="hero-especie">
                    <div class="img-container"><img src="${esp.imagem.replace('medium', 'large')}"></div>
                    <div class="info-header">
                        <h1>${esp.nome}</h1>
                        <h2>${esp.nome_cientifico || ''}</h2>
                        <div class="data-grid">
                            <div class="data-item"><b>Grupo</b><p>${esp.grupo}</p></div>
                            <div class="data-item"><b>Conservação</b><p>${esp.estatuto || 'Nativa'}</p></div>
                            <div class="data-item"><b>Sazonalidade</b><p>${esp.sazonalidade || 'Todo o ano'}</p></div>
                            <div class="data-item"><b>Taxonomia</b><p>${tax}</p></div>
                        </div>
                    </div>
                </div>
                <div class="sintese-box">
                    <b>Sobre esta espécie (Wikipedia)</b>
                    <p>${esp.sintese}</p>
                    <small style="display:block; margin-top:20px; color:#bbb;">Fonte: iNaturalist / Wikipedia</small>
                </div>
            `;
        }
        carregar();
    </script>
</body>
</html>
