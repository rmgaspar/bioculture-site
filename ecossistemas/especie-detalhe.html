<!DOCTYPE HTML>
<html>
<head>
    <title>bioCultura - Detalhe da Espécie</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
    <link rel="stylesheet" href="/assets/css/main.css" />
    <style>
        body, input, select, textarea { font-family: 'Source Sans Pro', sans-serif !important; color: #444; }
        .detail-container { max-width: 1100px; margin: 4em auto; padding: 0 2em; }
        
        .hero-especie { display: flex; gap: 4em; align-items: start; margin-bottom: 3em; }
        .img-container { flex: 1; min-width: 400px; }
        .hero-especie img { 
            width: 100%; height: 600px; object-fit: cover; 
            border-radius: 24px; box-shadow: 0 30px 60px rgba(0,0,0,0.1);
            background: #f5f5f5;
        }
        
        .info-header { flex: 1.2; padding-top: 1em; }
        .info-header h1 { font-size: 3.8em; font-weight: 900; color: #1a1a1a; margin: 0; line-height: 1; letter-spacing: -2px; }
        .info-header h2 { font-size: 1.4em; color: #bbb; font-style: italic; margin: 10px 0 2em 0; font-weight: 400; }
        
        .data-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 30px; border-top: 1px solid #f2f2f2; padding-top: 2em; }
        .data-item b { display: block; font-size: 0.65em; text-transform: uppercase; letter-spacing: 2px; color: #5c6bc0; margin-bottom: 8px; }
        .data-item p { font-size: 1.1em; color: #444; margin: 0; font-weight: 500; }

        .sintese-box { 
            background: #f8faff; padding: 3em; border-radius: 24px; 
            margin-top: 2em; border-left: none !important;
        }
        .sintese-box b { display: block; margin-bottom: 15px; font-size: 0.8em; text-transform: uppercase; letter-spacing: 1px; color: #1a237e; }
        .sintese-box p { font-size: 1.2em; line-height: 1.8; color: #333; margin: 0; text-align: justify; }

        .btn-voltar { display: inline-block; margin-top: 3em; font-size: 0.8em; font-weight: 800; text-transform: uppercase; letter-spacing: 2px; text-decoration: none; color: #bbb; transition: 0.3s; }
        .btn-voltar:hover { color: #1a1a1a; }

        @media screen and (max-width: 980px) {
            .hero-especie { flex-direction: column; }
            .img-container { min-width: 100%; }
            .hero-especie img { height: 400px; }
        }
    </style>
</head>
<body>
    <div class="detail-container">
        <div id="render-especie">
            <p style="color:#bbb; font-style:italic;">A carregar dados da biodiversidade...</p>
        </div>
        <a href="javascript:history.back()" class="btn-voltar">← Voltar ao Observatório</a>
    </div>

    <script>
        async function carregarDetalhe() {
            const id = new URLSearchParams(window.location.search).get('id');
            if (!id) return;

            try {
                // 1. Carrega as 3 fontes de dados em paralelo
                const [rMaster, rPragas, rFlora] = await Promise.all([
                    fetch('/data/especies_master.json?v=' + Date.now()).then(r => r.json()),
                    fetch('/data/pragas.json?v=' + Date.now()).then(r => r.json()),
                    fetch('/data/flora_invasora.json?v=' + Date.now()).then(r => r.json())
                ]);

                let esp = null;

                // 2. Procura no Master (Objeto)
                if (rMaster[id]) {
                    esp = rMaster[id];
                } 
                // 3. Procura nas Pragas (Array)
                else {
                    const praga = rPragas.find(p => p.nome_cientifico.toLowerCase().replace(/ /g, '-') === id);
                    if (praga) {
                        esp = {
                            nome: praga.nome_comum,
                            nome_cientifico: praga.nome_cientifico,
                            grupo: "Sanidade Vegetal",
                            imagem: praga.imagem,
                            sintese: praga.sintomas,
                            estatuto: "Praga / Doença",
                            taxonomia: praga.nome_cientifico
                        };
                    }
                }
                // 4. Procura na Flora Invasora (Array)
                if (!esp) {
                    const invasora = rFlora.find(f => f.nome_cientifico.toLowerCase().replace(/ /g, '-') === id);
                    if (invasora) {
                        esp = {
                            nome: invasora.nome_comum,
                            nome_cientifico: invasora.nome_cientifico,
                            grupo: "Flora Invasora",
                            imagem: invasora.imagem,
                            sintese: invasora.impacto,
                            estatuto: "Espécie Invasora",
                            taxonomia: invasora.nome_cientifico
                        };
                    }
                }

                if (!esp) {
                    document.getElementById('render-especie').innerHTML = "<p>Espécie não encontrada.</p>";
                    return;
                }

                // 5. Renderização (Mantendo o teu layout atualizado)
                const taxLimpa = esp.taxonomia_completa ? esp.taxonomia_completa.slice(-3).join(' > ') : (esp.taxonomia || esp.grupo);

                document.getElementById('render-especie').innerHTML = `
                    <div class="hero-especie">
                        <div class="img-container">
                            <img src="${esp.imagem || '/assets/img/placeholder.jpg'}" alt="${esp.nome}">
                        </div>
                        <div class="info-header">
                            <h1>${esp.nome}</h1>
                            <h2><i>${esp.nome_cientifico || ''}</i></h2>
                            <div class="data-grid">
                                <div class="data-item"><b>Grupo</b><p>${esp.grupo}</p></div>
                                <div class="data-item"><b>Conservação</b><p>${esp.estatuto || 'Nativa'}</p></div>
                                <div class="data-item"><b>Sazonalidade</b><p>Observada em Portugal</p></div>
                                <div class="data-item"><b>Taxonomia</b><p>${taxLimpa}</p></div>
                            </div>
                        </div>
                    </div>
                    <div class="sintese-box">
                        <b>Descrição e Ecologia</b>
                        <p style="text-align: justify;">${esp.sintese || 'Informação técnica em processamento.'}</p>
                        <small style="display:block; margin-top:25px; color:#bbb; font-weight:800; text-transform:uppercase; letter-spacing:1px;">Fonte: bioCultura / ICNF / DGAV</small>
                    </div>
                `;
                document.title = esp.nome + " - bioCultura";

            } catch (e) {
                console.error("Erro ao carregar detalhe:", e);
            }
        }
        carregarDetalhe();
    </script>
</body>
</html>
