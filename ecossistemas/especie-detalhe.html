<!DOCTYPE HTML>
<html>
<head>
    <title>bioCultura - Detalhe da Espécie</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
    <link rel="stylesheet" href="/assets/css/main.css" />
    <style>
        .detail-container { max-width: 1000px; margin: 4em auto; padding: 0 2em; }
        .hero-especie { display: grid; grid-template-columns: 1fr 1fr; gap: 4em; align-items: center; margin-bottom: 4em; }
        .hero-especie img { width: 100%; height: 500px; object-fit: cover; border-radius: 30px; box-shadow: 0 20px 50px rgba(0,0,0,0.1); }
        .info-header h1 { font-size: 3.5em; font-weight: 900; margin: 0; line-height: 1; }
        .info-header h2 { font-size: 1.2em; color: #bbb; font-style: italic; margin-bottom: 2em; }
        .data-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 30px; }
        .data-item b { display: block; font-size: 0.6em; text-transform: uppercase; letter-spacing: 2px; color: #5c6bc0; margin-bottom: 5px; }
        .data-item p { font-size: 1.1em; color: #444; margin: 0; }
        .sintese-box { background: #f8faff; padding: 2.5em; border-radius: 20px; margin-top: 3em; border-left: 4px solid #5c6bc0; }
        .btn-voltar { display: inline-block; margin-top: 3em; font-size: 0.8em; font-weight: 800; text-transform: uppercase; letter-spacing: 2px; text-decoration: none; color: #bbb; }
        @media screen and (max-width: 736px) { .hero-especie { grid-template-columns: 1fr; } }
    </style>
</head>
<body>
    <div class="detail-container">
        <div id="render-especie">
            <p>A carregar dados da espécie...</p>
        </div>
        <a href="javascript:history.back()" class="btn-voltar">← Voltar ao Observatório</a>
    </div>

    <script>
        async function carregarDetalhe() {
            const id = new URLSearchParams(window.location.search).get('id');
            if (!id) return;

            try {
                const res = await fetch('/data/especies_master.json');
                const master = await res.json();
                const esp = master[id];

                if (!esp) return;

                document.getElementById('render-especie').innerHTML = `
                    <div class="hero-especie">
                        <img src="${esp.imagem || '/assets/img/placeholder.jpg'}" alt="${esp.nome}">
                        <div class="info-header">
                            <h1>${esp.nome}</h1>
                            <h2>${esp.nome_cientifico || 'Nome científico não disponível'}</h2>
                            <div class="data-grid">
                                <div class="data-item"><b>Grupo</b><p>${esp.grupo}</p></div>
                                <div class="data-item"><b>Taxonomia</b><p>${esp.taxonomia || 'N/A'}</p></div>
                                <div class="data-item"><b>Sazonalidade</b><p>${esp.sazonalidade || 'Todo o ano'}</p></div>
                                <div class="data-item"><b>Especies Semelhantes</b><p>${esp.semelhantes || 'Nenhuma registada'}</p></div>
                            </div>
                        </div>
                    </div>
                    <div class="sintese-box">
                        <b>Síntese e Observações</b>
                        <p>${esp.sintese || 'Sem descrição detalhada disponível.'}</p>
                        <small style="color:#bbb">Fonte: ${esp.fonte || 'iNaturalist / bioCultura'}</small>
                    </div>
                `;
            } catch (e) { console.error(e); }
        }
        carregarDetalhe();
    </script>
</body>
</html>
