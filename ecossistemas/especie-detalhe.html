<!DOCTYPE HTML>
<html>
<head>
    <title>bioCultura - Detalhe da Espécie</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
    <link rel="stylesheet" href="/assets/css/main.css" />
    <style>
        body, input, select, textarea { font-family: 'Source Sans Pro', sans-serif !important; color: #444; }
        .detail-container { max-width: 1100px; margin: 4em auto; padding: 0 2em; }
        
        /* FIX: Layout da Imagem e Info */
        .hero-especie { 
            display: flex; 
            gap: 4em; 
            align-items: start; 
            margin-bottom: 3em; 
        }
        
        .img-container { flex: 1; min-width: 400px; }
        .hero-especie img { 
            width: 100%; 
            height: 600px; 
            object-fit: cover; /* Resolve o problema da imagem desformatada */
            border-radius: 24px; 
            box-shadow: 0 30px 60px rgba(0,0,0,0.1);
            background: #f5f5f5;
        }
        
        .info-header { flex: 1.2; padding-top: 1em; }
        .info-header h1 { font-size: 3.8em; font-weight: 900; color: #1a1a1a; margin: 0; line-height: 1; letter-spacing: -2px; }
        .info-header h2 { font-size: 1.4em; color: #bbb; font-style: italic; margin: 10px 0 2em 0; font-weight: 400; }
        
        .data-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 30px; border-top: 1px solid #f2f2f2; padding-top: 2em; }
        .data-item b { display: block; font-size: 0.65em; text-transform: uppercase; letter-spacing: 2px; color: #5c6bc0; margin-bottom: 8px; }
        .data-item p { font-size: 1.1em; color: #444; margin: 0; font-weight: 500; }

        .sintese-box { 
            background: #f8faff; padding: 3em; border-radius: 24px; 
            margin-top: 2em; border-left: 6px solid #5c6bc0; 
        }
        .sintese-box b { display: block; margin-bottom: 15px; font-size: 0.8em; text-transform: uppercase; letter-spacing: 1px; color: #1a237e; }
        .sintese-box p { font-size: 1.2em; line-height: 1.8; color: #333; margin: 0; }

        .btn-voltar { display: inline-block; margin-top: 3em; font-size: 0.8em; font-weight: 800; text-transform: uppercase; letter-spacing: 2px; text-decoration: none; color: #bbb; transition: 0.3s; }
        .btn-voltar:hover { color: #1a1a1a; }

        @media screen and (max-width: 980px) {
            .hero-especie { flex-direction: column; }
            .img-container { min-width: 100%; }
            .hero-especie img { height: 400px; }
            .info-header h1 { font-size: 2.8em; }
        }
    </style>
</head>
<body>
    <div class="detail-container">
        <div id="render-especie">
            <p style="color:#bbb; font-style:italic;">A carregar dados da biodiversidade...</p>
        </div>
        <a href="javascript:history.back()" class="btn-voltar">← Voltar ao Observatório</a>
    </div>

    <script>
        async function carregarDetalhe() {
            const id = new URLSearchParams(window.location.search).get('id');
            if (!id) { window.location.href = 'biodiversidade.html'; return; }

            try {
                const res = await fetch('/data/especies_master.json');
                const master = await res.json();
                const esp = master[id];

                if (!esp) {
                    document.getElementById('render-especie').innerHTML = "<p>Espécie não encontrada no inventário.</p>";
                    return;
                }

                // Limpeza de taxonomia técnica (se for string de números)
                const taxLimpa = (esp.taxonomia && esp.taxonomia.includes('/')) ? esp.grupo : (esp.taxonomia || esp.grupo);

                document.getElementById('render-especie').innerHTML = `
                    <div class="hero-especie">
                        <div class="img-container">
                            <img src="${esp.imagem ? esp.imagem.replace('medium', 'large') : '/assets/img/placeholder.jpg'}" alt="${esp.nome}">
                        </div>
                        <div class="info-header">
                            <h1>${esp.nome}</h1>
                            <h2>${esp.nome_cientifico}</h2>
                            <div class="data-grid">
                                <div class="data-item"><b>Grupo</b><p>${esp.grupo}</p></div>
                                <div class="data-item"><b>Família / Ordem</b><p>${taxLimpa}</p></div>
                                <div class="data-item"><b>Sazonalidade</b><p>${esp.sazonalidade || 'Observada em Portugal'}</p></div>
                                <div class="data-item"><b>Estatuto</b><p>Residente / Nativa</p></div>
                            </div>
                        </div>
                    </div>
                    <div class="sintese-box">
                        <b>Observações bioCultura</b>
                        <p>${esp.sintese || `A espécie <strong>${esp.nome}</strong> (${esp.nome_cientifico}) foi registada no inventário regional. A sua presença é um indicador da saúde do ecossistema local para o grupo ${esp.grupo}.`}</p>
                        <small style="display:block; margin-top:25px; color:#bbb; font-weight:800; text-transform:uppercase; letter-spacing:1px;">Fonte: iNaturalist Open Data / ICNF</small>
                    </div>
                `;
                document.title = esp.nome + " - bioCultura";
            } catch (e) { 
                console.error("Erro no detalhe:", e);
                document.getElementById('render-especie').innerHTML = "<p>Erro ao ligar à base de dados de espécies.</p>";
            }
        }
        carregarDetalhe();
    </script>
</body>
</html>
