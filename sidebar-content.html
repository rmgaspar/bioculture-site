<link rel="stylesheet" href="/assets/css/biocultura-sidebar.css?v=2">

<div class="bio-shell">
    <a class="bio-brand" href="/index.html" aria-label="bioCulture — página inicial">
        <img class="bio-brand-mark" src="/images/bioculture-mark-v2.png" alt="" width="72" height="72">
        <span class="bio-brand-copy">
            <strong>bioCulture</strong>
            <small data-i18n="sidebar.sublogo">Regeneração Global</small>
        </span>
    </a>

    <p class="bio-shell-intro" data-i18n="sidebar.intro">Ler o planeta. Cuidar do lugar.</p>

    <div class="bio-language">
        <label for="lang-selector" data-i18n="sidebar.lang_label">Idioma / Language</label>
        <select
            id="lang-selector"
            onchange="var l=this.value==='en'?'en':'pt';if(window.BioCultureShell){BioCultureShell.setLanguage(l)}else{try{localStorage.setItem('selected_lang',l)}catch(e){};var u=new URL(location.href);if(l==='en'){u.searchParams.set('lang','en')}else{u.searchParams.delete('lang')}location.assign(u.href)}"
        >
            <option value="pt">Português</option>
            <option value="en">English</option>
        </select>
    </div>

    <nav class="bio-shell-nav" aria-label="Navegação principal">
        <div class="bio-nav-hubs">
            <a href="/observatorio/ler-territorio.html" data-i18n="sidebar.header_read">Ler o território</a>
            <a href="/recursos/vida-e-recursos.html" data-i18n="sidebar.header_life">Vida e recursos</a>
            <a href="/observatorio/pressoes-humanas.html">Vetores de pressão</a>
            <a href="/energia/energy.html" data-i18n="sidebar.item_conscious_use">Energia consciente</a>
            <a href="/calendario/conhecimento-cuidar.html" data-i18n="sidebar.header_care">Conhecimento para cuidar</a>
            <a href="/services/services.html">Projetos regenerativos</a>
        </div>

        <div class="bio-nav-about">
            <span class="bio-nav-label" data-i18n="sidebar.header_about">Sobre o projeto</span>
            <a href="/manifesto.html" data-i18n="sidebar.item_manifesto">Manifesto</a>
            <a href="/contactos.html" data-i18n="sidebar.item_contacts">Contactos</a>
        </div>
    </nav>

    <div class="bio-location">
        <span class="bio-location-label" data-i18n="sidebar.loc_label">O teu território</span>
        <div class="bio-location-control">
            <button id="btn-gps-trigger" type="button" data-i18n-title="sidebar.loc_gps" title="Usar localização atual" aria-label="Usar localização atual">
                <span aria-hidden="true">⌖</span>
            </button>
            <input id="loc-search-input" type="search" data-i18n-placeholder="sidebar.loc_placeholder" placeholder="Procurar localidade…" autocomplete="off">
        </div>
        <div id="loc-dropdown" class="bio-dropdown" role="listbox"></div>
        <p id="bio-location-status" class="bio-location-status" aria-live="polite"></p>
    </div>
</div>
