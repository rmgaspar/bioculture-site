            <i class="fas fa-location-arrow"></i> <span id="loc-text">Sincronizar Localização</span>
        </button>
    </div>

    <script>
    function detectLocation() {
        if (!navigator.geolocation) return;
        navigator.geolocation.getCurrentPosition((pos) => {
            const lat = pos.coords.latitude;
            let region = lat < 37.5 ? "algarve" : lat < 39.0 ? "alentejo" : lat < 40.8 ? "centro" : "norte";
            localStorage.setItem('biocultura_region', region);
            document.getElementById('loc-text').innerText = "Região Ativa";
            location.reload(); // Recarrega para aplicar a inteligência regional
        });
    }
    </script>
