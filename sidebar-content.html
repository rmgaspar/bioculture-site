<style>
    /* RESET TOTAL */
    #sidebar * { 
        font-family: 'Source Sans Pro', sans-serif !important; 
        border: none !important; 
        box-shadow: none !important; 
        text-decoration: none !important;
        font-weight: 400 !important; 
    }

    .menu-header { font-weight: 900 !important; font-size: 0.65em !important; text-transform: uppercase !important; letter-spacing: 2px !important; color: #bbb !important; margin-bottom: 12px !important; }

    .menu-item { font-size: 0.95em !important; color: #888 !important; padding: 5px 0 !important; display: block !important; transition: all 0.2s ease !important; }
    .menu-item:hover { color: #2e7d32 !important; padding-left: 5px !important; }

    /* LOCALIZAÇÃO INPUT */
    .loc-input-wrapper { position: relative; width: 100%; }
    .loc-input { background: none !important; color: #666 !important; font-size: 0.85em !important; font-weight: 600 !important; width: 100%; padding: 0 !important; outline: none !important; }
    .gps-mini-btn { background: none !important; color: #bbb !important; cursor: pointer !important; padding: 0 !important; }
    .gps-mini-btn:hover { color: #2e7d32 !important; }

    /* DROPDOWN - CORRIGIDO */
    .loc-results-dropdown {
        position: absolute; bottom: 100%; left: 0; width: 100%;
        background: #fff; border: 1px solid #eee !important; border-radius: 12px;
        max-height: 220px; overflow-y: auto; display: none; z-index: 1000;
        margin-bottom: 15px; box-shadow: 0 -10px 40px rgba(0,0,0,0.08) !important;
    }
    .loc-res-item { padding: 10px 15px; font-size: 0.85em; color: #666; cursor: pointer; border-bottom: 1px solid #f9f9f9 !important; }
    .loc-res-item.active, .loc-res-item:hover { background: #f1f8e9 !important; color: #2e7d32 !important; font-weight: 600 !important; }
</style>

<script>
    let locationsDB = [];
    let currentFocus = -1;

    fetch('/data/bioregioes.json').then(r => r.json()).then(data => { 
        locationsDB = data; 
        const saved = localStorage.getItem('biocultura_region');
        if(saved) {
            const info = data.find(i => i.id === saved);
            if(info) document.getElementById('loc-input-field').value = info.titulo;
        }
    });

    function handleLocSearch(e) {
        if (["ArrowUp", "ArrowDown", "Enter", "Escape"].includes(e.key)) return;
        const val = e.target.value.toLowerCase();
        const resultsBox = document.getElementById('loc-results');
        resultsBox.innerHTML = '';
        currentFocus = -1;
        if(val.length < 2) { resultsBox.style.display = 'none'; return; }
        const filtered = locationsDB.filter(i => i.titulo.toLowerCase().includes(val)).slice(0, 8);
        if(filtered.length > 0) {
            resultsBox.style.display = 'block';
            filtered.forEach((item, index) => {
                const div = document.createElement('div');
                div.className = 'loc-res-item';
                div.innerText = item.titulo;
                div.onclick = () => selectLocation(item.id);
                resultsBox.appendChild(div);
            });
        } else { resultsBox.style.display = 'none'; }
    }

    function handleKeyboardNav(e) {
        const resultsBox = document.getElementById('loc-results');
        const items = resultsBox.getElementsByClassName('loc-res-item');
        if (e.key === "ArrowDown") { currentFocus++; addActive(items); }
        else if (e.key === "ArrowUp") { currentFocus--; addActive(items); }
        else if (e.key === "Enter") {
            e.preventDefault();
            if (currentFocus > -1 && items[currentFocus]) { items[currentFocus].click(); }
            else {
                const inputVal = document.getElementById('loc-input-field').value.trim().toLowerCase();
                const match = locationsDB.find(i => i.titulo.toLowerCase() === inputVal);
                if (match) selectLocation(match.id);
            }
        }
    }

    function addActive(items) {
        if (!items || items.length === 0) return;
        for (let i = 0; i < items.length; i++) items[i].classList.remove("active");
        if (currentFocus >= items.length) currentFocus = 0;
        if (currentFocus < 0) currentFocus = items.length - 1;
        items[currentFocus].classList.add("active");
        items[currentFocus].scrollIntoView({ block: "nearest" });
    }

    function selectLocation(id) {
        localStorage.setItem('biocultura_region', id);
        sessionStorage.clear();
        location.reload();
    }

    function useGPS() {
        if (!navigator.geolocation) return;
        localStorage.clear(); sessionStorage.clear();
        navigator.geolocation.getCurrentPosition(() => location.reload(), () => location.reload());
    }

    document.addEventListener("click", (e) => {
        if (e.target.id !== 'loc-input-field') document.getElementById('loc-results').style.display = 'none';
    });
</script>
