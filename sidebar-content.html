<!-- MODAL DE SELEÇÃO DE LOCALIDADE -->
<div id="location-modal" class="modal-overlay">

        <div class="modal-actions">
            <button onclick="useGPS()" class="btn-gps"><i class="fas fa-location-arrow"></i> Detectar automaticamente</button>

<style>
    /* ESTILOS SIDEBAR */
    .custom-btn-loc { background: none; color: #888; border: none; font-size: 0.85em; font-weight: 600; cursor: pointer; display: flex; align-items: center; transition: color 0.3s; }
    .custom-btn-loc:hover { color: #2e7d32; }
    .menu-section { margin-bottom: 2.2em; display: flex; flex-direction: column; }
    .menu-header { font-size: 0.65em; font-weight: 900; text-transform: uppercase; letter-spacing: 2px; color: #bbb; margin-bottom: 12px; }
    .menu-item { font-size: 0.95em; color: #888; padding: 5px 0; text-decoration: none; transition: all 0.2s ease; }
    .menu-item:hover { color: #2e7d32; padding-left: 5px; }
    .city-label { font-size: 0.65em; color: #2e7d32; font-weight: 700; text-transform: uppercase; }

    /* ESTILOS MODAL (OVERLAY) */
    .modal-overlay { position: fixed; top:0; left:0; width:100%; height:100%; background: rgba(255,255,255,0.98); z-index: 20000; display: none; align-items: center; justify-content: center; backdrop-filter: blur(10px); }
    .modal-content { width: 90%; max-width: 600px; text-align: center; position: relative; animation: fadeIn 0.4s ease; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
    
    .close-modal { position: absolute; top: -50px; right: 0; background: none; border: none; font-size: 2em; cursor: pointer; color: #ccc; }
    .search-box { position: relative; margin: 2em 0; }
    .search-box i { position: absolute; left: 20px; top: 50%; transform: translateY(-50%); color: #bbb; }
    .search-box input { width: 100%; padding: 18px 20px 18px 50px; border-radius: 15px; border: 1px solid #eee; font-size: 1.1em; outline: none; transition: border-color 0.3s; }
    .search-box input:focus { border-color: #2e7d32; box-shadow: 0 10px 30px rgba(46,125,50,0.05); }

    .btn-gps { background: #f1f8e9; color: #2e7d32; border: 1px solid #c8e6c9; padding: 12px 25px; border-radius: 50px; font-weight: 700; cursor: pointer; font-size: 0.8em; margin-bottom: 2em; transition: all 0.3s; }
    .btn-gps:hover { background: #2e7d32; color: #fff; }

    .results-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 10px; max-height: 300px; overflow-y: auto; padding: 10px; }
    .city-btn { padding: 10px; background: #fff; border: 1px solid #f0f0f0; border-radius: 10px; font-size: 0.8em; cursor: pointer; transition: all 0.2s; color: #666; }
    .city-btn:hover { border-color: #2e7d32; color: #2e7d32; background: #f9fbf9; }
</style>

<script>
    let allData = [];

    // Carregar dados para a pesquisa
    fetch('/data/bioregioes.json').then(r => r.json()).then(data => { allData = data; });

    function openLocationModal() { document.getElementById('location-modal').style.display = 'flex'; }
    function closeLocationModal() { document.getElementById('location-modal').style.display = 'none'; }

    function filterCities() {
        const term = document.getElementById('city-search').value.toLowerCase();
        const results = document.getElementById('search-results');
        results.innerHTML = '';
        
        if (term.length < 2) return;

        const filtered = allData.filter(c => c.titulo.toLowerCase().includes(term));
        filtered.forEach(c => {
            const btn = document.createElement('button');
            btn.className = 'city-btn';
            btn.innerText = c.titulo;
            btn.onclick = () => selectCity(c);
            results.appendChild(btn);
        });
    }

    function selectCity(concelho) {
        localStorage.setItem('biocultura_region', concelho.id);
        sessionStorage.removeItem('biocultura_data_cache');
        sessionStorage.removeItem('biocultura_exploration_id');
        location.reload();
    }

    function useGPS() {
        if (!navigator.geolocation) return;
        navigator.geolocation.getCurrentPosition((pos) => {
            localStorage.removeItem('biocultura_region');
            sessionStorage.clear();
            location.reload();
        });
    }

    // Atualizar UI se houver cidade ativa
    const active = sessionStorage.getItem('biocultura_data_cache');
    if(active) {
        const info = JSON.parse(active);
        document.getElementById('city-name').innerText = info.titulo;
        document.getElementById('active-city-box').style.display = 'block';
        document.getElementById('loc-text').innerText = "Localização Ativa";
    }
</script>
