    .btn-clear:hover { background: #ffebee; color: #c62828; }
</style>

<script>
    let bioregionsData = [];
    
    // Carregar dados
    fetch('/data/bioregioes.json')
        .then(r => r.json())
        .then(data => { bioregionsData = data; updateUI(); });

    function showDistricts() {
        document.getElementById('main-nav').style.display = 'none';
        document.getElementById('location-selector').style.display = 'block';
        document.getElementById('selector-title').innerText = "Escolher Distrito";
        
        const list = document.getElementById('location-list');
        list.innerHTML = '<div class="loc-option" onclick="useGPS()"><i class="fas fa-location-arrow"></i> Usar GPS (Mais próximo)</div>';
        
        // Extrair distritos únicos
        const distritos = [...new Set(bioregionsData.map(item => item.distrito))].sort();
        distritos.forEach(d => {
            if(!d) return;
            const div = document.createElement('div');
            div.className = 'loc-option';
            div.innerText = d.charAt(0).toUpperCase() + d.slice(1);
            div.onclick = () => showCounties(d);
            list.appendChild(div);
        });
    }

    function showCounties(distrito) {
        document.getElementById('selector-title').innerText = distrito;
        const list = document.getElementById('location-list');
        list.innerHTML = '';
        
        const concelhos = bioregionsData.filter(item => item.distrito === distrito).sort((a,b) => a.titulo.localeCompare(b.titulo));
        concelhos.forEach(c => {
            const div = document.createElement('div');
            div.className = 'loc-option';
            div.innerText = c.titulo;
            div.onclick = () => selectLocation(c);
            list.appendChild(div);
        });
    }

    function showMainMenu() {
        document.getElementById('main-nav').style.display = 'block';
        document.getElementById('location-selector').style.display = 'none';
    }

    function selectLocation(concelho) {
        localStorage.setItem('biocultura_region', concelho.id);
        sessionStorage.removeItem('biocultura_data_cache');
        location.reload();
    }

    function useGPS() {
        if (!navigator.geolocation) return;
        localStorage.removeItem('biocultura_region');
        sessionStorage.clear();
        location.reload();
    }

    function clearLocation() {
        localStorage.removeItem('biocultura_region');
        sessionStorage.clear();
        location.reload();
    }

    function updateUI() {
        const cache = sessionStorage.getItem('biocultura_data_cache');
        if(cache) {
            const info = JSON.parse(cache);
            document.getElementById('city-name').innerText = info.titulo;
            document.getElementById('active-city-box').style.display = 'flex';
            document.getElementById('loc-sub').innerText = "Resultados otimizados para si.";
        }
    }
</script>
