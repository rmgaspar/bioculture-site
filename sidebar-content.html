    .results-list { position: absolute; width: 100%; background: #fff; border-radius: 0 0 15px 15px; box-shadow: 0 10px 30px rgba(0,0,0,0.05); max-height: 200px; overflow-y: auto; z-index: 20001; text-align: left; }
    .res-item { padding: 12px 25px; font-size: 0.9em; color: #666; cursor: pointer; border-bottom: 1px solid #f9f9f9; }
    .res-item:hover { background: #f1f8e9; color: #2e7d32; }

    .btn-gps-action { background: #1b5e20; color: #fff; border: none; padding: 12px 30px; border-radius: 50px; font-weight: 800; cursor: pointer; text-transform: uppercase; font-size: 0.7em; letter-spacing: 1px; }
</style>

<script>
    let db = [];
    fetch('/data/bioregioes.json').then(r => r.json()).then(data => { db = data; checkFirstVisit(); });

    function checkFirstVisit() {
        const saved = localStorage.getItem('biocultura_region');
        if(!saved) {
            // Se for a primeira visita, mostramos o modal após 1 segundo
            setTimeout(() => { openLocModal(); }, 1000);
        } else {
            const info = db.find(i => i.id === saved);
            if(info) document.getElementById('loc-display-name').innerText = info.titulo;
        }
    }

    function openLocModal() { document.getElementById('loc-modal').style.display = 'flex'; }
    function closeLocModal() { document.getElementById('loc-modal').style.display = 'none'; }

    function searchCity() {
        const val = document.getElementById('city-input').value.toLowerCase();
        const box = document.getElementById('results-box');
        box.innerHTML = '';
        if(val.length < 2) return;
        
        const filtered = db.filter(item => item.titulo.toLowerCase().includes(val));
        filtered.slice(0, 5).forEach(item => {
            const div = document.createElement('div');
            div.className = 'res-item';
            div.innerText = item.titulo;
            div.onclick = () => {
                localStorage.setItem('biocultura_region', item.id);
                sessionStorage.clear();
                location.reload();
            };
            box.appendChild(div);
        });
    }

    function useGPS() {
        if (!navigator.geolocation) return;
        navigator.geolocation.getCurrentPosition((pos) => {
            localStorage.removeItem('biocultura_region');
            sessionStorage.clear();
            location.reload();
        });
    }
</script>
