<style>

    /* DROPDOWN */
    .bio-dropdown {
        position: absolute;
        bottom: 100%;
        left: 0;
        width: 100%;
        background: #fff;
        border: 1px solid #eee !important;
        border-radius: 12px;
        max-height: 200px;
        overflow-y: auto;
        display: none;
        z-index: 99999;
        margin-bottom: 10px;
        box-shadow: 0 -10px 30px rgba(0,0,0,0.08) !important;
    }
    .bio-res-item { 
        padding: 10px 15px; 
        font-size: 0.85em; 
        color: #666; 
        cursor: pointer; 
        border-bottom: 1px solid #f9f9f9 !important;
    }
    .bio-res-item:hover { background: #f1f8e9; color: #2e7d32; }
</style>

<script>
    (function() {
        let db = [];
        const input = document.getElementById('loc-search-input');
        const dropdown = document.getElementById('loc-dropdown');

        // 1. Carregar Dados
        fetch('/data/bioregioes.json')
            .then(r => r.json())
            .then(data => { 
                db = data;
                const saved = localStorage.getItem('biocultura_region');
                if(saved) {
                    const info = data.find(i => i.id === saved);
                    if(info) input.value = info.titulo;
                }
            })
            .catch(e => console.error("Erro ao ler JSON:", e));

        // 2. Evento de Escrita
        input.addEventListener('input', function() {
            const val = this.value.toLowerCase();
            dropdown.innerHTML = '';
            
            if(val.length < 2) { dropdown.style.display = 'none'; return; }
            
            const matches = db.filter(i => i.titulo.toLowerCase().includes(val)).slice(0, 6);
            
            if(matches.length > 0) {
                dropdown.style.display = 'block';
                matches.forEach(m => {
                    const item = document.createElement('div');
                    item.className = 'bio-res-item';
                    item.innerText = m.titulo;
                    item.onclick = () => select(m.id);
                    dropdown.appendChild(item);
                });
            } else {
                dropdown.style.display = 'none';
            }
        });

        // 3. Evento de Enter
        input.addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                const val = this.value.toLowerCase().trim();
                const match = db.find(i => i.titulo.toLowerCase() === val || i.id === val);
                if(match) {
                    select(match.id);
                } else {
                    const partial = db.find(i => i.titulo.toLowerCase().includes(val));
                    if(partial) select(partial.id);
                }
            }
        });

        function select(id) {
            localStorage.setItem('biocultura_region', id);
            sessionStorage.clear();
            window.location.reload();
        }

        // Fechar dropdown ao clicar fora
        document.addEventListener('click', (e) => {
            if(e.target !== input) dropdown.style.display = 'none';
        });
    })();
</script>
