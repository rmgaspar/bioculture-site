<script>
    // Atualizar visual da cidade ativa
    const cityCache = sessionStorage.getItem('biocultura_data_cache');
    if(cityCache) {
        const info = JSON.parse(cityCache);
        document.getElementById('city-name').innerText = info.titulo;
        document.getElementById('active-city-box').style.display = 'block';
        document.getElementById('loc-text').innerText = "Localização Ativa";
    }

    function detectLocation() {
        if (!navigator.geolocation) return;
        document.getElementById('loc-text').innerText = "A localizar...";
        navigator.geolocation.getCurrentPosition((pos) => {
            sessionStorage.removeItem('biocultura_data_cache');
            localStorage.removeItem('biocultura_region');
            location.reload();
        });
    }
</script>
