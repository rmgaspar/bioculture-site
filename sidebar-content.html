<style>
    #sidebar * { font-family: 'Source Sans Pro', sans-serif !important; border: none !important; box-shadow: none !important; text-decoration: none !important; font-weight: 400 !important; }
    .menu-header { font-weight: 900 !important; font-size: 0.65em !important; text-transform: uppercase; letter-spacing: 2px; color: #bbb !important; margin-bottom: 12px !important; display: block; }

    .sugestao-item:hover { background: #f1f8e9; color: #2e7d32; }
</style>

<script>
    let dadosConcelhos = [];

    // Carregar os dados do JSON
    fetch('/data/bioregioes.json')
        .then(r => r.json())
        .then(data => { 
            dadosConcelhos = data;
            const atual = localStorage.getItem('biocultura_region');
            if(atual) {
                const info = data.find(i => i.id === atual);
                if(info) document.getElementById('loc-input').value = info.titulo;
            }
        });

    // Função que lida com a escrita e mostra sugestões
    document.getElementById('loc-input').addEventListener('input', function(e) {
        const val = e.target.value.toLowerCase();
        const box = document.getElementById('loc-sugestoes');
        box.innerHTML = '';
        
        if(val.length < 2) { box.style.display = 'none'; return; }
        
        const matches = dadosConcelhos.filter(i => i.titulo.toLowerCase().includes(val)).slice(0, 5);
        
        if(matches.length > 0) {
            box.style.display = 'block';
            matches.forEach(m => {
                const div = document.createElement('div');
                div.className = 'sugestao-item';
                div.innerText = m.titulo;
                div.onclick = () => {
                    selecionar(m.id);
                };
                box.appendChild(div);
            });
        } else {
            box.style.display = 'none';
        }
    });

    // Função que busca e recarrega ao dar Enter
    function buscarEIr(texto) {
        const t = texto.toLowerCase().trim();
        const match = dadosConcelhos.find(i => i.titulo.toLowerCase() === t || i.id === t);
        if(match) {
            selecionar(match.id);
        } else {
            // Se não for match exato, tenta o primeiro que contenha o texto
            const parcial = dadosConcelhos.find(i => i.titulo.toLowerCase().includes(t));
            if(parcial) selecionar(parcial.id);
        }
    }

    function selecionar(id) {
        localStorage.setItem('biocultura_region', id);
        sessionStorage.clear(); // Limpa caches de exploração
        location.reload();
    }
</script>
