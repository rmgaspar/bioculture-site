<script>
    // Mostrar localidade ativa se existir
    const cacheBio = sessionStorage.getItem('biocultura_data_cache');
    if(cacheBio) {
        const info = JSON.parse(cacheBio);
        document.getElementById('city-name').innerText = info.titulo;
        document.getElementById('active-city-box').style.display = 'block';
        document.getElementById('loc-text').innerText = "Localização";
        document.getElementById('loc-sub').innerText = "Resultados otimizados para si.";
    }

    function detectLocation() {
    if (!navigator.geolocation) {
        alert("O seu browser não suporta GPS.");
        return;
    }
    
    // 1. LIMPEZA ABSOLUTA DE TUDO O QUE FOI GRAVADO
    localStorage.clear(); 
    sessionStorage.clear();

    // 2. PEDIR GPS E REFRESH LIMPO
    navigator.geolocation.getCurrentPosition((pos) => {
        // Redireciona para a página atual sem o "?region=..." no link
        window.location.href = window.location.pathname;
    }, (err) => {
        alert("Por favor, ative o GPS para detetarmos a sua zona real.");
        window.location.href = window.location.pathname;
    });
}


</script>
