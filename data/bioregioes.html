<!DOCTYPE HTML>
<html>
	<head>
		<title>bioCultura - Configurar Bio-Região</title>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
		<link rel="stylesheet" href="../assets/css/main.css" />
		<style>
			/* 1. ESTRUTURA LIMPA */
			section, #header, hr, .major { border: none !important; box-shadow: none !important; padding: 0 !important; }
			#header .toggle { background: none !important; top: 2em !important; left: 2em !important; border: none !important; text-decoration: none !important; z-index: 10001; }
			#header .toggle:before { content: '\f06c' !important; font-family: "Font Awesome 5 Free" !important; font-weight: 900; color: #2e7d32 !important; font-size: 1.6em !important; }
            #header .toggle:after { display: none !important; }
            section { padding-top: 2em !important; }

            .config-container { display: flex; gap: 3em; flex-wrap: wrap; margin-bottom: 6em; }
            
            /* 2. PAINEL DE CONFIGURAÇÃO */
            .setup-panel { flex: 1; min-width: 320px; background: #f4f7fb; padding: 2.5em; border-radius: 35px; }
            .setup-panel h3 { color: #2e7d32; margin-bottom: 1.5em; font-size: 1.4em; }
            
            .control-group { margin-bottom: 2em; }
            .control-group label { display: block; font-weight: 700; text-transform: uppercase; font-size: 0.75em; letter-spacing: 1px; color: #888; margin-bottom: 0.8em; }
            
            select { background: #fff !important; border: 1px solid #ddd !important; border-radius: 15px !important; padding: 0 1em !important; height: 3em !important; }

            .btn-gps { 
                width: 100%; background-color: #2e7d32 !important; color: white !important; 
                border-radius: 50px; font-weight: 700; margin-bottom: 2em;
                display: flex; align-items: center; justify-content: center; gap: 10px;
            }

            /* 3. CARTÃO DE RESULTADO (BIO-CARD) */
            .result-panel { flex: 1.2; min-width: 320px; }
            .bio-card { 
                background: #fff; border-radius: 40px; padding: 3em; 
                box-shadow: 0 30px 60px rgba(0,0,0,0.05); border: 1px solid #f0f0f0;
                display: none; /* Só aparece após deteção/seleção */
            }
            .bio-card h2 { color: #2e7d32; font-size: 2.5em; margin-bottom: 0.5em; }
            .tag { background: #f1f8e9; color: #2e7d32; padding: 6px 16px; border-radius: 50px; font-size: 0.8em; font-weight: 700; margin: 4px; display: inline-block; }

            .status-msg { font-size: 0.9em; color: #666; font-style: italic; margin-top: 1em; text-align: center; }
		</style>
	</head>
	<body class="is-preload">
		<div id="wrapper">
			<div id="main"><div class="inner">
					<header id="header"></header>
					
                    <section>
                        <header class="major">
                            <h2 style="color: #2e7d32; text-transform: none;">Configuração de Bio-Região</h2>
                            <p>Sincronize o site com a localização e o perfil do seu terreno.</p>
                        </header>

                        <div class="config-container">
                            <!-- PAINEL DE CONTROLO -->
                            <div class="setup-panel">
                                <button class="button primary btn-gps" onclick="detectLocation()">
                                    <i class="fas fa-location-arrow"></i> Detetar Localização
                                </button>
                                <div id="gps-status" class="status-msg">Clique para detetar automaticamente</div>

                                <hr style="margin: 2em 0;">

                                <h3>Perfil do Terreno</h3>
                                <div class="control-group">
                                    <label>Tipo de Solo</label>
                                    <select id="soil-type" onchange="updateProfile()">
                                        <option value="padrao">Padrão da Região</option>
                                        <option value="arenoso">Arenoso (Leve)</option>
                                        <option value="argiloso">Argiloso (Barro/Pesado)</option>
                                        <option value="calcario">Calcário</option>
                                    </select>
                                </div>

                                <div class="control-group">
                                    <label>Exposição Solar</label>
                                    <select id="sun-exposure" onchange="updateProfile()">
                                        <option value="pleno">Sol Pleno</option>
                                        <option value="meia">Meia-sombra</option>
                                        <option value="sombra">Sombra/Norte</option>
                                    </select>
                                </div>
                            </div>

                            <!-- PAINEL DE RESULTADO -->
                            <div class="result-panel" id="result-container">
                                <div class="bio-card" id="bio-card-content">
                                    <!-- Injetado via JS -->
                                </div>
                                <div id="empty-state" style="text-align: center; padding-top: 4em; opacity: 0.5;">
                                    <i class="fas fa-seedling fa-4x" style="color: #ddd; margin-bottom: 0.5em;"></i>
                                    <p>Detete a sua localização para ver os detalhes da sua região.</p>
                                </div>
                            </div>
                        </div>
					</section>
				</div></div>
			<div id="sidebar"></div>
		</div>

		<script src="../assets/js/jquery.min.js"></script>
        <script>
            let bioregioesData = {};

            fetch('bioregioes.json')
                .then(r => r.json())
                .then(json => { 
                    bioregioesData = json; 
                    // Carregar perfil salvo se existir
                    const saved = localStorage.getItem('biocultura_region');
                    if(saved) updateUI(saved);
                });

            function detectLocation() {
                const status = document.getElementById('gps-status');
                status.innerText = "A localizar...";

                if (!navigator.geolocation) {
                    status.innerText = "GPS não suportado pelo browser.";
                    return;
                }

                navigator.geolocation.getCurrentPosition((position) => {
                    const lat = position.coords.latitude;
                    let region = "";

                    // Lógica simples de mapeamento de Latitude para Portugal
                    if (lat < 37.5) region = "algarve";
                    else if (lat < 39.0) region = "alentejo";
                    else if (lat < 39.7) region = "lisboa";
                    else if (lat < 40.8) region = "centro";
                    else region = "norte";

                    status.innerText = "Localizado com sucesso!";
                    updateUI(region);
                }, () => {
                    status.innerText = "Acesso ao GPS negado.";
                });
            }

            function updateProfile() {
                const region = localStorage.getItem('biocultura_region');
                const soil = document.getElementById('soil-type').value;
                const sun = document.getElementById('sun-exposure').value;
                
                localStorage.setItem('biocultura_soil', soil);
                localStorage.setItem('biocultura_sun', sun);
                
                if(region) updateUI(region);
            }

            function updateUI(id) {
                const reg = bioregioesData[id];
                if(!reg) return;

                localStorage.setItem('biocultura_region', id);
                document.getElementById('empty-state').style.display = 'none';
                const card = document.getElementById('bio-card-content');
                card.style.display = 'block';

                card.innerHTML = `
                    <h4 style="margin:0; opacity:0.6">A sua Bio-Região:</h4>
                    <h2>${reg.titulo}</h2>
                    <p><strong>Clima:</strong> ${reg.clima}</p>
                    <p><strong>Solo Base:</strong> ${reg.solo}</p>
                    <h4>Espécies Recomendadas</h4>
                    <div>${reg.especies.map(s => `<span class="tag">${s}</span>`).join('')}</div>
                    <hr style="margin: 2em 0">
                    <a href="../calendario/01-janeiro.html" class="button primary fit">Ver Calendário Personalizado</a>
                `;
            }

            // Sidebar
            fetch('../sidebar-content.html').then(r => r.text()).then(html => {
                document.getElementById('sidebar').innerHTML = html;
                var s = document.createElement('script'); s.src = '../assets/js/main.js'; document.body.appendChild(s);
            });
        </script>
	</body>
</html>
