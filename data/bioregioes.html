<script>
    let bioregioesData = {};

    // 1. Carregar os dados do ficheiro JSON
    fetch('/data/bioregioes.json')
        .then(response => {
            if (!response.ok) throw new Error('Erro ao carregar JSON');
            return response.json();
        })
        .then(data => {
            bioregioesData = data;
            console.log('Dados das bio-regiões carregados.');
            
            // Verificar se o utilizador já tinha escolhido uma região antes
            const savedRegion = localStorage.getItem('biocultura_region');
            if (savedRegion) {
                // Se sim, destacar no mapa e mostrar a info
                const path = document.querySelector(`path[onclick*="${savedRegion}"]`);
                if (path) showRegion(savedRegion, path);
            }
        })
        .catch(error => console.error('Erro:', error));

    // 2. Função para mostrar a região e salvar a escolha
    function showRegion(regionId, element) {
        const data = bioregioesData[regionId];
        if (!data) return;

        // Guardar a escolha no "post-it" do browser (Memória)
        localStorage.setItem('biocultura_region', regionId);

        // Atualizar o estado visual do mapa
        document.querySelectorAll('.region').forEach(r => r.classList.remove('active'));
        if (element) {
            element.classList.add('active');
        } else {
            // Caso venha do carregamento automático, procurar o elemento
            const targetPath = document.querySelector(`path[onclick*="${regionId}"]`);
            if (targetPath) targetPath.classList.add('active');
        }

        // Injetar a informação no Bio-Card com efeito Smooth
        const container = document.getElementById('region-info');
        container.style.opacity = 0; // Começa fade-out

        setTimeout(() => {
            container.innerHTML = `
                <div class="bio-card">
                    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1em;">
                        <h2 style="margin: 0;">${data.titulo}</h2>
                        <span style="font-size: 0.7em; background: #2e7d32; color: #fff; padding: 4px 10px; border-radius: 5px;">ATIVO</span>
                    </div>
                    <h4>Clima Predominante</h4>
                    <p>${data.clima}</p>
                    <h4>Tipo de Solo</h4>
                    <p>${data.solo}</p>
                    <h4>Contexto bioCultura</h4>
                    <p>${data.contexto}</p>
                    <h4>Flora Recomendada</h4>
                    <div class="species-tags">
                        ${data.especies.map(s => `<span class="tag">${s}</span>`).join('')}
                    </div>
                </div>
            `;
            container.style.opacity = 1; // Termina fade-in
        }, 200);
    }

    // Script da Sidebar (mantém o que já tinhas)
    fetch('sidebar-content.html').then(response => response.text()).then(data => {
        document.getElementById('sidebar').innerHTML = data;
        var script = document.createElement('script');
        script.src = 'assets/js/main.js';
        document.body.appendChild(script);
    });
</script>
