<!DOCTYPE HTML>
<html>
	<head>
		<title>bioCultura - Selecionar Bio-Região</title>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
		<link rel="stylesheet" href="../assets/css/main.css" />
		<style>
			section, #header, hr, .major { border: none !important; box-shadow: none !important; padding: 0 !important; }
			#header .toggle { background: none !important; top: 2em !important; left: 2em !important; border: none !important; text-decoration: none !important; z-index: 10001; }
			#header .toggle:before { content: '\f06c' !important; font-family: "Font Awesome 5 Free" !important; font-weight: 900; color: #2e7d32 !important; font-size: 1.6em !important; }
            #header .toggle:after { display: none !important; }
            section { padding-top: 2em !important; }

            .intro-box {
                background: linear-gradient(135deg, #f1f8e9 0%, #dcedc8 100%);
                padding: 2.5em; text-align: center; border-radius: 30px; margin-bottom: 3em;
                box-shadow: 0 10px 30px rgba(0,0,0,0.05);
            }

            .map-section { display: flex; gap: 4em; align-items: center; flex-wrap: wrap; margin-bottom: 6em; justify-content: center; }
            
            /* Contentor do Mapa */
            .map-container { flex: 1; min-width: 320px; text-align: center; position: relative; }
            #portugal-map { width: 100%; max-width: 380px; height: auto; filter: drop-shadow(0 10px 20px rgba(0,0,0,0.1)); }
            
            /* Estilo das Regiões */
            .region { fill: #e0e0e0; stroke: #fff; stroke-width: 1.5; cursor: pointer; transition: all 0.3s ease; outline: none; }
            .region:hover { fill: #81c784; transform: scale(1.01); }
            .region.active { fill: #2e7d32; filter: drop-shadow(0 0 8px rgba(46, 125, 50, 0.4)); }

            /* Painel de Info */
            .info-container { flex: 1.2; min-width: 320px; }
            .bio-card { 
                background: #fff; border-radius: 30px; padding: 2.5em; 
                box-shadow: 0 20px 50px rgba(0,0,0,0.05); border: 1px solid #eee;
                transition: opacity 0.3s ease;
            }
            .bio-card h2 { color: #2e7d32; font-size: 2.2em; margin-bottom: 0.5em; }
            .bio-card h4 { color: #8d6e63; text-transform: uppercase; letter-spacing: 2px; font-size: 0.75em; margin-top: 1.5em; margin-bottom: 0.5em; }
            .tag { background: #f1f8e9; color: #2e7d32; padding: 6px 14px; border-radius: 50px; font-size: 0.8em; font-weight: 700; margin: 4px; display: inline-block; }
            
            @media screen and (max-width: 736px) {
                .map-section { gap: 2em; }
                #portugal-map { max-width: 250px; }
            }
		</style>
	</head>
	<body class="is-preload">
		<div id="wrapper">
			<div id="main"><div class="inner">
					<header id="header"></header>
					<section>
                        <div class="intro-box">
                            <h2 style="color: #2e7d32; margin: 0;">Bio-Mapa de Portugal</h2>
                            <p style="margin: 0.5em 0 0 0;">Clique na sua região para sincronizar o calendário com o seu clima e solo.</p>
                        </div>

                        <div class="map-section">
                            <div class="map-container">
                                <!-- MAPA REAL DE PORTUGAL (5 REGIÕES) -->
                                <svg id="portugal-map" viewBox="0 0 350 750">
                                    <!-- Norte -->
                                    <path class="region" id="norte" d="M120,20 L230,30 L260,100 L240,220 L100,210 L80,100 Z" onclick="selectRegion('norte')" />
                                    <!-- Centro -->
                                    <path class="region" id="centro" d="M100,210 L240,220 L260,350 L200,420 L80,400 L60,300 Z" onclick="selectRegion('centro')" />
                                    <!-- Lisboa e Vale do Tejo -->
                                    <path class="region" id="lisboa" d="M80,400 L140,410 L150,480 L70,480 L50,440 Z" onclick="selectRegion('lisboa')" />
                                    <!-- Alentejo -->
                                    <path class="region" id="alentejo" d="M140,410 L200,420 L280,450 L260,650 L100,650 L150,480 Z" onclick="selectRegion('alentejo')" />
                                    <!-- Algarve -->
                                    <path class="region" id="algarve" d="M100,650 L260,650 L260,720 L100,720 Z" onclick="selectRegion('algarve')" />
                                </svg>
                            </div>

                            <div class="info-container" id="info-display">
                                <div class="bio-card">
                                    <h2 style="font-weight: 300;">Selecione o seu território</h2>
                                    <p>As dicas do calendário bioCultura serão ajustadas às características da região selecionada.</p>
                                </div>
                            </div>
                        </div>
					</section>
				</div></div>
			<div id="sidebar"></div>
		</div>

		<script src="../assets/js/jquery.min.js"></script>
        <script>
            let bioregioesData = {};

            // Carrega o JSON
            fetch('bioregioes.json')
                .then(r => r.json())
                .then(json => { 
                    bioregioesData = json; 
                    const current = localStorage.getItem('biocultura_region');
                    if(current) selectRegion(current);
                });

            function selectRegion(id) {
                const reg = bioregioesData[id];
                if(!reg) return;

                localStorage.setItem('biocultura_region', id);
                document.querySelectorAll('.region').forEach(r => r.classList.remove('active'));
                const el = document.getElementById(id);
                if(el) el.classList.add('active');

                const display = document.getElementById('info-display');
                display.style.opacity = 0;

                setTimeout(() => {
                    display.innerHTML = `
                        <div class="bio-card">
                            <h2>${reg.titulo}</h2>
                            <h4>Clima</h4>
                            <p>${reg.clima}</p>
                            <h4>Solo Predominante</h4>
                            <p>${reg.solo}</p>
                            <h4>Espécies Autóctones</h4>
                            <div style="margin-top:0.5em">
                                ${reg.especies.map(s => `<span class="tag">${s}</span>`).join('')}
                            </div>
                            <hr style="margin: 2em 0; border: none; border-top: 1px solid #eee;">
                            <a href="../calendario/01-janeiro.html" class="button primary fit">Ver Janeiro nesta Região</a>
                        </div>
                    `;
                    display.style.opacity = 1;
                }, 200);
            }

            // Sidebar
            fetch('../sidebar-content.html').then(r => r.text()).then(html => {
                document.getElementById('sidebar').innerHTML = html;
                var s = document.createElement('script'); s.src = '../assets/js/main.js'; document.body.appendChild(s);
            });
        </script>
	</body>
</html>
