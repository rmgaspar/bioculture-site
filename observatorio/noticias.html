    <body class="is-preload" data-hero-theme="news">
        <div id="wrapper">
            <main id="main">
                <div class="inner">
                    <section aria-labelledby="news-title" class="hero bio-banner-hero">
                        <div class="header-left">
                            <span class="eyebrow">Atualidade</span>
                            <h1 id="news-title">Notícias.<br /><em>Por tema, tipo e lugar.</em></h1>
                            <p class="hero-intro">
                                Decisões, estudos e acontecimentos que mudam o território, escolhidos pelo observatório.
                                Cada notícia diz de que tipo é e leva à fonte original.
                            </p>
                        </div>
                        <div aria-label="O planeta visto como uma paisagem viva" class="observatory-visual" role="img"></div>
                    </section>

                    <section aria-label="Filtros de notícias" class="news-filters" id="news-filters">
                        <div class="news-filters-top">
                            <label class="news-search"><span class="visually-hidden">Pesquisar notícias</span><input id="news-search" type="search" placeholder="Pesquisar no título e no resumo…" autocomplete="off" /></label>
                            <label class="news-order"><span>Ordenar</span>
                                <select id="news-order">
                                    <option value="relevancia">Relevância, com as mais recentes à frente</option>
                                    <option value="recentes">Mais recentes primeiro</option>
                                </select>
                            </label>
                        </div>
                        <div class="news-filter-group" data-group="ambito"><span class="news-filter-label">Onde</span><div class="news-chips" id="chips-ambito"></div></div>
                        <div class="news-filter-group" data-group="tema"><span class="news-filter-label">Tema</span><div class="news-chips" id="chips-tema"></div></div>
                        <div class="news-filter-group" data-group="tipo"><span class="news-filter-label">Tipo</span><div class="news-chips" id="chips-tipo"></div></div>
                        <div class="news-filters-foot">
                            <p aria-live="polite" id="news-count"></p>
                            <button class="news-clear" id="news-clear" type="button" hidden>Limpar filtros</button>
                        </div>
                    </section>

                    <section aria-label="Resultados" class="hub-latest news-results">
                        <div class="hub-latest-grid" id="news-grid"><p>A carregar notícias…</p></div>
                        <div class="news-controls"><button class="news-more" id="news-toggle" type="button" hidden>Ver mais</button></div>
                    </section>
