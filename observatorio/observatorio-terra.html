<section>
    <header class="main">
        <h1>Observatório da Terra v2.0</h1>
    </header>

    <div class="row">
        <!-- Dashboard Clima: CO2 vs Temperatura -->
        <div class="col-6 col-12-small">
            <div class="box">
                <h3>Atmosfera: CO2 vs Aquecimento</h3>
                <canvas id="chartAtmosfera" style="height:300px;"></canvas>
            </div>
        </div>

        <!-- Dashboard Mar: Pesca vs Qualidade Água -->
        <div class="col-6 col-12-small">
            <div class="box">
                <h3>Recursos Marinhos: Capturas vs Saúde Balnear</h3>
                <canvas id="chartMar" style="height:300px;"></canvas>
            </div>
        </div>

        <!-- Dashboard Biodiversidade -->
        <div class="col-12">
            <div class="box">
                <h3>Pressão Biológica: Área Ardida vs Pesticidas</h3>
                <canvas id="chartBio" style="height:400px;"></canvas>
            </div>
        </div>
    </div>
</section>

<script>
async function render() {
    const res = await fetch('observatorio_terra.json');
    const data = await res.json();
    const e = data.esferas;

    // 1. Atmosfera (CO2 vs Temp)
    const labelsAtmos = Object.keys(e.atmosfera.temp_anomalia).sort();
    new Chart(document.getElementById('chartAtmosfera'), {
        type: 'line',
        data: {
            labels: labelsAtmos,
            datasets: [
                { label: 'CO2 (kt)', data: labelsAtmos.map(y => e.atmosfera.co2_kt[y]), borderColor: '#95a5a6', yAxisID: 'y' },
                { label: 'Temp (ºC)', data: labelsAtmos.map(y => e.atmosfera.temp_anomalia[y]), borderColor: '#e74c3c', yAxisID: 'y1' }
            ]
        },
        options: { scales: { y1: { position: 'right' } } }
    });

    // 2. Mar (Pesca vs Qualidade)
    const labelsMar = Object.keys(e.mar.capturas_pesca_t).sort();
    new Chart(document.getElementById('chartMar'), {
        type: 'bar',
        data: {
            labels: labelsMar,
            datasets: [
                { label: 'Pesca (t)', data: labelsMar.map(y => e.mar.capturas_pesca_t[y]), backgroundColor: '#3498db' },
                { label: 'Águas Excelentes (%)', data: labelsMar.map(y => e.mar.aguas_balneares_excelentes_percent[y] || null), type: 'line', borderColor: '#2ecc71' }
            ]
        }
    });

    // 3. Bio (Incêndios vs Pesticidas)
    const labelsBio = Object.keys(e.biosfera.area_ardida_ha).sort();
    new Chart(document.getElementById('chartBio'), {
        type: 'line',
        data: {
            labels: labelsBio,
            datasets: [
                { label: 'Área Ardida (ha)', data: labelsBio.map(y => e.biosfera.area_ardida_ha[y]), borderColor: '#e67e22', fill: true },
                { label: 'Uso Pesticidas (t)', data: labelsBio.map(y => e.biosfera.pesticidas_t[y] || null), borderColor: '#8e44ad' }
            ]
        }
    });
}
render();
</script>
