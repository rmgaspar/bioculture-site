<!DOCTYPE HTML>
<html>
<head>
    <title>bioCultura - Vetores de Pressão</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
    <link rel="stylesheet" href="/assets/css/main.css" />
    <style>
        body, input, select, textarea { font-family: 'Source Sans Pro', sans-serif !important; color: #444; }
        #sidebar { position: fixed !important; top: 0; left: 0; height: 100vh !important; width: 18em !important; background: #fff; border-right: 1px solid #f2f2f2 !important; }
        #wrapper { padding-left: 18em !important; }
        .inner { padding: 2.2em 4em 0 4em !important; max-width: 1600px !important; margin: 0 auto; }
        .header-left h1 { font-size: 2.5em; font-weight: 900; color: #1a1a1a; letter-spacing: -1.5px; }
        .category-label { font-size: 0.65em; font-weight: 900; text-transform: uppercase; letter-spacing: 4px; color: #bbb; }
        .bio-impact-box { background: #fff4f4; padding: 2em; border-radius: 15px; margin: 1.5em 0; }
        .bio-impact-box p { margin: 0; color: #c62828; }
        .report-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 20px; }
        .chart-box { background: #fdfdfd; border: 1px solid #f2f2f2; padding: 1.2em; border-radius: 10px; height: 300px; }
        .chart-box h5 { font-size: 0.7em; font-weight: 800; text-transform: uppercase; color: #888; }
        .chart-source { font-size: 0.55em; font-weight: 700; color: #ccc; text-transform: uppercase; margin-top: 8px; display: block; }
        .analysis-section { margin-top: 4em; padding: 3em; background: #fdfdfd; border-radius: 12px; border: 1px solid #f2f2f2; }
    </style>
</head>
<body class="is-preload">
    <div id="wrapper">
        <div id="main">
            <div class="inner">
                <section>
                    <div class="header-left">
                        <span class="category-label">Observatório de Impacto</span>
                        <h1 id="page-title">Carregando...</h1>
                    </div>

                    <div class="bio-impact-box">
                        <p id="page-summary"></p>
                    </div>

                    <div class="report-grid">
                        <div class="chart-box">
                            <h5>Mix Renovável (%)</h5>
                            <canvas id="chartRenovaveis"></canvas>
                            <span class="chart-source" id="src-renovaveis"></span>
                        </div>
                        <div class="chart-box">
                            <h5>Dependência Energética Externa</h5>
                            <canvas id="chartDependencia"></canvas>
                            <span class="chart-source" id="src-dependencia"></span>
                        </div>
                        <div class="chart-box">
                            <h5>Produção Mineira (Índice)</h5>
                            <canvas id="chartMineria"></canvas>
                            <span class="chart-source" id="src-mineria"></span>
                        </div>
                        <div class="chart-box">
                            <h5>Concessões Ativas</h5>
                            <canvas id="chartConcessoes"></canvas>
                            <span class="chart-source" id="src-concessoes"></span>
                        </div>
                    </div>

                    <div class="analysis-section" id="analysis-content">
                        <h3>Análise Técnica de Pressão</h3>
                    </div>
                </section>
            </div>
        </div>
        <div id="sidebar"></div>
    </div>

    <script src="/assets/js/jquery.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script>
        async function init() {
            try {
                const res = await fetch('/data/pressao_vetores.json');
                const data = await res.json();

                document.getElementById('page-title').innerText = data.titulo;
                document.getElementById('page-summary').innerText = data.resumo;

                const commonOptions = {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: { legend: { display: false } },
                    scales: {
                        x: { grid: { display: false }, ticks: { font: { size: 9 } } },
                        y: { ticks: { font: { size: 9 } } }
                    }
                };

                // Chart 1: Energia Renovável
                new Chart(document.getElementById('chartRenovaveis'), {
                    type: 'line',
                    data: {
                        labels: data.estatisticas.energia_renovavel.labels,
                        datasets: [{ data: data.estatisticas.energia_renovavel.dados, borderColor: '#4caf50', tension: 0.4 }]
                    },
                    options: commonOptions
                });
                document.getElementById('src-renovaveis').innerText = `Fonte: ${data.estatisticas.energia_renovavel.fonte}`;

                // Chart 2: Dependência
                new Chart(document.getElementById('chartDependencia'), {
                    type: 'bar',
                    data: {
                        labels: data.estatisticas.dependencia_energetica.labels,
                        datasets: [{ data: data.estatisticas.dependencia_energetica.dados, backgroundColor: '#5c6bc0' }]
                    },
                    options: commonOptions
                });
                document.getElementById('src-dependencia').innerText = `Fonte: ${data.estatisticas.dependencia_energetica.fonte}`;

                // Chart 3: Mineração
                new Chart(document.getElementById('chartMineria'), {
                    type: 'line',
                    data: {
                        labels: data.estatisticas.producao_mineria.labels,
                        datasets: [{ data: data.estatisticas.producao_mineria.dados, borderColor: '#ffa726', fill: true, backgroundColor: 'rgba(255, 167, 38, 0.1)' }]
                    },
                    options: commonOptions
                });
                document.getElementById('src-mineria').innerText = `Fonte: ${data.estatisticas.producao_mineria.fonte}`;

                // Chart 4: Concessões
                new Chart(document.getElementById('chartConcessoes'), {
                    type: 'bar',
                    data: {
                        labels: data.estatisticas.concessoes_ativas.labels,
                        datasets: [{ data: data.estatisticas.concessoes_ativas.dados, backgroundColor: '#795548' }]
                    },
                    options: commonOptions
                });
                document.getElementById('src-concessoes').innerText = `Fonte: ${data.estatisticas.concessoes_ativas.fonte}`;

                // Análise Técnica
                const analysisDiv = document.getElementById('analysis-content');
                data.analise.forEach(item => {
                    const p = document.createElement('p');
                    p.innerHTML = `<b>${item.topico}:</b> ${item.texto}`;
                    analysisDiv.appendChild(p);
                });

            } catch (err) { console.error("Erro ao carregar dados:", err); }
        }

        fetch('/sidebar-content.html').then(r => r.text()).then(html => {
            document.getElementById('sidebar').innerHTML = html;
            init();
        });
    </script>
</body>
</html>
