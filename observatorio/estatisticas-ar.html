<!DOCTYPE HTML>
<html>
	<head>
		<title>bioCultura - Estatísticas do Ar Live</title>
		<meta charset="utf-8" />
		<link rel="stylesheet" href="/assets/css/main.css" />
		<style>
            body { font-family: 'Source Sans Pro', sans-serif; color: #444; }
            #wrapper { padding-left: 18em; }
            .article-container { max-width: 1000px; margin: 0 auto; padding: 4em 2em; }
            .stats-frame { width: 100%; height: 700px; border: 1px solid #eee; border-radius: 20px; overflow: hidden; background: #f9f9f9; position: relative; }
            .source-tag { position: absolute; bottom: 10px; right: 20px; font-size: 0.6em; font-weight: 900; color: #bbb; text-transform: uppercase; }
            .back-link { display: inline-block; margin-bottom: 2em; font-size: 0.7em; font-weight: 900; text-transform: uppercase; letter-spacing: 2px; color: #bbb; text-decoration: none; }
		</style>
	</head>
	<body class="is-preload">
		<div id="wrapper">
			<div id="main">
                <div class="inner">
                    <div class="article-container">
                        <a href="/recursos/ar.html" class="back-link">← Voltar ao Observatório do Ar</a>
                        <span class="category-label">Monitorização em Tempo Real</span>
                        <h1 style="font-size: 2.5em; font-weight: 300; margin-bottom: 1em;">Qualidade do Ar: Portugal Live</h1>
                        
                        <div class="stats-frame">
                            <!-- Integração do Dashboard (IQAir ou AQI.in) -->
                            <iframe src="https://www.aqi.in/pt/dashboard/portugal" style="width:100%; height:100%; border:none;" title="AQI Portugal Live"></iframe>
                            <div class="source-tag">Fonte: AQI.in / IQAir Global Monitoring</div>
                        </div>

                        <p style="margin-top: 2em; font-size: 0.9em; color: #888; font-style: italic;">
                            Nota: Este dashboard é atualizado a cada hora com dados das estações de monitorização da APA e sensores globais independentes.
                        </p>
                    </div>
                </div>
            </div>
			<div id="sidebar"></div>
		</div>
        <script>
            fetch('/sidebar-content.html').then(r => r.text()).then(html => {
                document.getElementById('sidebar').innerHTML = html;
                var s = document.createElement('script'); s.src = '/assets/js/main.js'; document.body.appendChild(s);
            });
        </script>
	</body>
</html>
