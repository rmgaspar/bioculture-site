<!DOCTYPE HTML>
<html>
	<head>
		<title>bioCultura - Detalhe da Notícia</title>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale, user-scalable=no" />
		<link rel="stylesheet" href="/assets/css/main.css" />
		<style>
            body { font-family: 'Source Sans Pro', sans-serif; color: #444; }
            #sidebar { position: fixed !important; top: 0; left: 0; height: 100vh !important; width: 18em !important; background: #fff; border-right: 1px solid #f2f2f2 !important; z-index: 10000; }
            #sidebar > .inner { padding: 2.2em 1.5em !important; }
            #wrapper { padding-left: 18em !important; }
            section { padding-top: 2em !important; min-height: 100vh; display: flex; flex-direction: column; }
            
            .article-container { max-width: 900px; margin-left: 0; padding: 2em 5em 4em 5em; }
            .category-label { font-size: 0.65em; font-weight: 900; text-transform: uppercase; letter-spacing: 3px; color: #bbb; margin-bottom: 10px; display: block; }
            
            .summary-box { background: #f4f7fb; padding: 2em; border-radius: 20px; margin: 2.5em 0; border-left: 5px solid #5c6bc0; }
            .summary-box.ar { background: #fff8f1; border-left-color: #ffb74d; }
            .summary-box h5 { font-size: 0.7em; font-weight: 900; text-transform: uppercase; color: inherit; margin-bottom: 10px; }
            .summary-box p { margin: 0; font-style: italic; font-size: 1.1em; color: #444; line-height: 1.6; }

            /* LINHA REMOVIDA AQUI (border-bottom: none) */
            .full-content { font-size: 1.15em; line-height: 1.8; color: #333; margin-bottom: 2em; padding-bottom: 2em; }
            .full-content p { margin-bottom: 1.5em; }

            .source-footer { font-size: 0.85em; color: #999; margin-top: 1em; margin-bottom: 4em; }

            .related-section { margin-top: 2em; padding-top: 3em; border-top: 1px solid #f2f2f2; }
            .related-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 30px; margin-top: 2em; }
            .related-item { text-decoration: none; color: inherit; padding: 1.5em; background: #fdfdfd; border: 1px solid #f2f2f2; border-radius: 15px; transition: transform 0.3s; }
            .related-item:hover { transform: translateY(-5px); border-color: #ddd; }
            .related-item h4 { font-size: 1em; margin: 10px 0; line-height: 1.3; }

            .back-link { display: inline-block; margin-bottom: 2em; font-size: 0.7em; font-weight: 900; text-transform: uppercase; letter-spacing: 2px; color: #bbb; text-decoration: none; transition: color 0.3s; }
            .back-link:hover { color: #1a1a1a; }

            .page-footer { margin-top: auto; padding: 4em 0 2em 0; border-top: 1px solid #f2f2f2; }

            @media screen and (max-width: 1280px) {
                #sidebar { position: relative !important; width: 100% !important; height: auto !important; }
                #wrapper { padding-left: 0 !important; }
                .article-container { padding: 2em 1.5em; }
                .related-grid { grid-template-columns: 1fr; }
            }
		</style>
	</head>
	<body class="is-preload">
		<div id="wrapper">
			<div id="main">
                <div class="inner">
                    <section>
                        <div class="article-container">
                            <a id="back-btn" href="#" class="back-link">← Voltar ao Observatório</a>
                            
                            <span id="news-category" class="category-label">...</span>
                            <h1 id="news-title" style="font-size: 3.2em; font-weight: 300; color: #1a1a1a; letter-spacing: -1.5px; line-height: 1.1; margin-bottom: 0.5em;">Carregando...</h1>

                            <div id="summary-container" class="summary-box">
                                <h5>Resumo bioCultura</h5>
                                <p id="news-summary"></p>
                            </div>

                            <div id="news-body" class="full-content"></div>

                            <div class="source-footer">
                                <div id="news-meta">Fonte: ... | Data: ...</div>
                            </div>

                            <!-- Relacionados -->
                            <div class="related-section">
                                <span class="category-label">Mais Notícias e Relacionados</span>
                                <div id="related-grid" class="related-grid"></div>
                            </div>

                            <!-- Rodapé com Logótipo -->
                            <footer class="page-footer">
                                <div style="display: flex; align-items: center; justify-content: flex-end; gap: 10px; opacity: 0.3;">
                                    <div style="text-align: right; line-height: 1;">
                                        <span style="display: block; font-size: 0.85em; font-weight: 900; color: #333;">bioCultura</span>
                                        <span style="display: block; font-size: 0.5em; font-weight: 700; text-transform: uppercase; letter-spacing: 1px;">Global Regeneration</span>
                                    </div>
                                    <svg width="22" height="22" viewBox="0 0 100 100"><path d="M50 5 L89 27.5 L89 72.5 L50 95 L11 72.5 L11 27.5 Z" fill="#333" /><path d="M50 20 C50 20 75 45 75 70 C75 85 65 85 50 85 C35 85 25 85 25 70 C25 45 50 20 50 20Z" fill="#fff" /></svg>
                                </div>
                            </footer>
                        </div>
                    </section>
                </div>
            </div>
			<div id="sidebar"></div>
		</div>

		<script src="/assets/js/jquery.min.js"></script>
        <script>
            async function carregarNoticia() {
                try {
                    const r = await fetch('/data/noticias.json');
                    if (!r.ok) throw new Error("Erro ao carregar JSON");
                    const noticias = await r.json();
                    
                    const urlParams = new URLSearchParams(window.location.search);
                    const id = urlParams.get('id');
                    
                    const artigo = noticias.find(n => n.id === id) || noticias[0];
                    
                    document.getElementById('news-title').innerText = artigo.titulo;
                    document.getElementById('news-summary').innerText = artigo.resumo_biocultura;
                    document.getElementById('news-body').innerHTML = artigo.corpo;
                    document.getElementById('news-category').innerText = artigo.categoria;
                    document.getElementById('news-meta').innerHTML = `Fonte: <strong>${artigo.fonte}</strong> | Data: <strong>${artigo.data}</strong>`;
                    
                    if(artigo.categoria === 'ar') {
                        document.getElementById('summary-container').classList.add('ar');
                        document.getElementById('back-btn').href = "/recursos/ar.html";
                    } else {
                        document.getElementById('back-btn').href = "/recursos/agua.html";
                    }

                    const grid = document.getElementById('related-grid');
                    grid.innerHTML = '';
                    noticias.filter(n => n.id !== artigo.id).slice(0, 2).forEach(rel => {
                        const item = document.createElement('a');
                        item.href = `noticia-detalhe.html?id=${rel.id}`;
                        item.className = 'related-item';
                        item.innerHTML = `
                            <span class="category-label" style="text-align:left">${rel.categoria}</span>
                            <h4>${rel.titulo}</h4>
                            <span class="news-meta" style="font-size:0.6em; color:#bbb">${rel.data}</span>
                        `;
                        grid.appendChild(item);
                    });

                } catch(e) { 
                    console.error(e); 
                    document.getElementById('news-title').innerText = "Erro ao carregar notícia.";
                }
            }

            fetch('/sidebar-content.html').then(r => r.text()).then(html => {
                document.getElementById('sidebar').innerHTML = html;
                var s = document.createElement('script'); s.src = '/assets/js/main.js'; document.body.appendChild(s);
                carregarNoticia();
            });
        </script>
	</body>
</html>
