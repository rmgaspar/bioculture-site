<!DOCTYPE HTML>
<html>
	<head>
		<title>bioCultura - Detalhe da Notícia</title>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale, user-scalable=no" />
		<link rel="stylesheet" href="/assets/css/main.css" />
		<style>
            body, input, select, textarea { font-family: 'Source Sans Pro', sans-serif !important; color: #444; }
			section, #header, hr, .major { border: none !important; box-shadow: none !important; padding: 0 !important; }
            section { padding-top: 4em !important; min-height: 100vh; }

            #sidebar { position: fixed !important; top: 0; left: 0; height: 100vh !important; width: 18em !important; overflow: hidden !important; z-index: 10000; background: #fff; border-right: 1px solid #f2f2f2 !important; }
            #wrapper { padding-left: 18em !important; }

            .noticia-container { max-width: 1000px; margin: 0 auto; width: 100%; }
            .noticia-indent { padding-left: 2.5em; padding-right: 2.5em; }

            .noticia-header { margin-bottom: 3em; }
            .noticia-cat { font-size: 0.65em; font-weight: 900; text-transform: uppercase; letter-spacing: 3px; margin-bottom: 10px; display: block; color: #bbb; }
            .noticia-titulo { font-size: 3.5em; font-weight: 900; color: #1a1a1a; letter-spacing: -2px; line-height: 1.1; margin: 0 0 20px 0; }
            
            /* Meta Topo e Fundo */
            .noticia-meta { display: flex; align-items: center; gap: 12px; font-size: 0.85em; color: #888; }
            .source-name { color: #000; font-weight: 700; }
            .source-date { font-weight: 400; }
            .source-logo-detail { width: 22px; height: 22px; object-fit: contain; }

            .noticia-hero-img { width: 100%; height: 500px; object-fit: cover; border-radius: 30px; margin: 2em 0; background: #f5f5f5; }

            .resumo-banner { background: #f4f7fb; padding: 2.5em; border-radius: 25px; border-left: 5px solid #5c6bc0; margin: 3em 0; }
            .resumo-text { font-style: italic; color: #333; font-size: 1.2em; line-height: 1.7; margin: 0; }

            .noticia-corpo { font-size: 1.15em; line-height: 1.8; color: #444; width: 100%; }
            .noticia-corpo p { margin-bottom: 1.5em; text-align: justify; }

            .noticia-meta-footer { margin-top: 3em; padding-top: 2em; border-top: 1px solid #f2f2f2; }
            .noticia-meta-footer a { text-decoration: none; color: inherit; display: flex; align-items: center; gap: 12px; transition: opacity 0.2s; }
            .noticia-meta-footer a:hover { opacity: 0.7; }

            /* Ações */
            .bottom-actions { padding: 4em 0; display: flex; align-items: center; gap: 15px; }
            .btn-voltar { 
                text-decoration: none; 
                font-size: 0.75em; 
                font-weight: 400; 
                text-transform: lowercase; 
                letter-spacing: 3px; 
                color: #bbb; 
                display: inline-flex; 
                align-items: center; 
                transition: color 0.3s; 
                cursor: pointer; 
                border: none !important; 
                background: none !important;
            }
            .btn-voltar:hover { color: #1a1a1a; text-decoration: underline; }
            .action-sep { color: #eee; font-size: 0.8em; }

            @media screen and (max-width: 1280px) {
                #sidebar { position: relative !important; width: 100% !important; height: auto !important; }
                #wrapper { padding-left: 0 !important; }
                .noticia-titulo { font-size: 2.5em; }
                .noticia-hero-img { height: 300px; }
                .noticia-indent { padding-left: 1.5em; padding-right: 1.5em; }
            }
		</style>
	</head>
	<body class="is-preload">
		<div id="wrapper">
			<div id="main">
                <div class="inner">
                    <section id="noticia-content">
                        <div id="loading" style="color: #bbb; font-style: italic; padding-left: 2.5em;">A carregar notícia...</div>

                        <div id="noticia-render" class="noticia-container" style="display:none;">
                            <!-- Header -->
                            <div class="noticia-header noticia-indent">
                                <span class="noticia-cat" id="cat">--</span>
                                <h1 class="noticia-titulo" id="titulo">--</h1>
                                <div class="noticia-meta">
                                    <img src="" class="source-logo-detail" id="source-logo" alt="">
                                    <span class="source-name" id="source-name-top">--</span>
                                    <span class="source-date" id="data">--</span>
                                </div>
                            </div>

                            <img src="" class="noticia-hero-img" id="imagem">

                            <div class="resumo-banner" id="resumo-box">
                                <p class="resumo-text" id="resumo-txt"></p>
                            </div>

                            <div class="noticia-corpo noticia-indent" id="corpo"></div>

                            <!-- Meta Fundo (Com Link) -->
                            <div class="noticia-meta-footer noticia-indent">
                                <a id="footer-source-link" href="#" target="_blank">
                                    <img src="" class="source-logo-detail" id="footer-source-logo">
                                    <span class="source-name" id="footer-source-name">--</span>
                                    <span class="source-date" id="footer-source-date">--</span>
                                </a>
                            </div>

                            <!-- Ações -->
                            <div class="bottom-actions noticia-indent">
                                <a href="javascript:history.back()" class="btn-voltar">← voltar</a>
                                <span class="action-sep">|</span>
                                <a href="#" id="link-relacionado" class="btn-voltar">relacionado</a>
                            </div>
                        </div>
                    </section>

                    <footer style="padding: 4em 0 2em 0; border-top: 1px solid #f2f2f2; opacity: 0.3; text-align: right;">
                        <span style="display: block; font-size: 0.85em; font-weight: 900; color: #333;">bioCultura</span>
                        <span style="display: block; font-size: 0.5em; font-weight: 700; text-transform: uppercase; letter-spacing: 1px;">Global Regeneration</span>
                    </footer>
                </div>
            </div>
			<div id="sidebar"></div>
		</div>

		<script src="/assets/js/jquery.min.js"></script>
        <script>
            const catColors = {
                'Energia': '#f1c40f',
                'Biodiversidade': '#2ecc71',
                'Água': '#3498db',
                'Ar': '#95a5a6',
                'Solo': '#e67e22'
            };

            async function carregarNoticia() {
                const urlParams = new URLSearchParams(window.location.search);
                const noticiaId = urlParams.get('id');

                if (!noticiaId) {
                    window.location.href = '/index.html';
                    return;
                }

                try {
                    const response = await fetch('/data/noticias.json');
                    const noticias = await response.json();
                    const n = noticias.find(item => item.id === noticiaId);

                    if (n) {
                        document.getElementById('loading').style.display = 'none';
                        document.getElementById('noticia-render').style.display = 'block';
                        
                        document.title = n.titulo + " - bioCultura";
                        
                        const catEl = document.getElementById('cat');
                        catEl.innerText = n.categoria;
                        if(catColors[n.categoria]) catEl.style.color = catColors[n.categoria];

                        document.getElementById('titulo').innerText = n.titulo;
                        
                        // Meta Topo
                        document.getElementById('source-logo').src = n.logo || '';
                        document.getElementById('source-name-top').innerText = n.fonte || '';
                        document.getElementById('data').innerText = n.data;
                        
                        document.getElementById('imagem').src = n.imagem;
                        document.getElementById('corpo').innerHTML = n.corpo;
                        
                        // Meta Fundo
                        document.getElementById('footer-source-logo').src = n.logo || '';
                        document.getElementById('footer-source-name').innerText = n.fonte || '';
                        document.getElementById('footer-source-date').innerText = n.data;
                        document.getElementById('footer-source-link').href = n.url || '#';

                        document.getElementById('link-relacionado').href = `/index.html?filter=${n.categoria}`;

                        if (n.resumo) {
                            document.getElementById('resumo-txt').innerText = `"${n.resumo}"`;
                        } else {
                            document.getElementById('resumo-box').style.display = 'none';
                        }
                    } else {
                        document.getElementById('loading').innerText = "Notícia não encontrada.";
                    }
                } catch (e) {
                    console.error("Erro no carregamento:", e);
                }
            }

            fetch('/sidebar-content.html').then(r => r.text()).then(html => {
                document.getElementById('sidebar').innerHTML = html;
                var s = document.createElement('script'); s.src = '/assets/js/main.js'; document.body.appendChild(s);
                carregarNoticia();
            });
        </script>
	</body>
</html>
