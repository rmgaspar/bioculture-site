<!DOCTYPE HTML>
<html>
	<head>
		<title>bioCultura - Detalhe da Notícia</title>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale, user-scalable=no" />
		<link rel="stylesheet" href="/assets/css/main.css" />
		<style>
            body, input, select, textarea { font-family: 'Source Sans Pro', sans-serif !important; color: #444; }
			section, #header, hr, .major { border: none !important; box-shadow: none !important; padding: 0 !important; }
            section { padding-top: 4em !important; min-height: 100vh; }

            #sidebar { position: fixed !important; top: 0; left: 0; height: 100vh !important; width: 18em !important; overflow: hidden !important; z-index: 10000; background: #fff; border-right: 1px solid #f2f2f2 !important; }
            #wrapper { padding-left: 18em !important; }

            .noticia-header { margin-bottom: 3em; }
            .noticia-cat { font-size: 0.65em; font-weight: 900; text-transform: uppercase; letter-spacing: 3px; color: #bbb; margin-bottom: 10px; display: block; }
            .noticia-titulo { font-size: 3.5em; font-weight: 900; color: #1a1a1a; letter-spacing: -2px; line-height: 1.1; margin: 0 0 20px 0; }
            
            .noticia-meta { display: flex; align-items: center; gap: 15px; font-size: 0.8em; color: #888; font-weight: 600; }
            .source-circle { width: 24px; height: 24px; background: #333; color: white; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 10px; }

            .noticia-hero-img { width: 100%; height: 500px; object-fit: cover; border-radius: 30px; margin: 2em 0; background: #f5f5f5; }

            .resumo-banner { background: #f4f7fb; padding: 2.5em; border-radius: 25px; border-left: 5px solid #5c6bc0; margin: 3em 0; }
            .resumo-text { font-style: italic; color: #333; font-size: 1.2em; line-height: 1.7; margin: 0; }

            .noticia-corpo { font-size: 1.15em; line-height: 1.8; color: #444; max-width: 800px; }
            .noticia-corpo p { margin-bottom: 1.5em; text-align: justify; }
            .noticia-corpo h3 { font-size: 1.4em; font-weight: 700; color: #1a1a1a; margin: 2em 0 1em 0; }

            /* AÇÕES NO FUNDO - BOTÃO ÚNICO */
            .bottom-actions { padding: 4em 0; border-top: 1px solid #f2f2f2; margin-top: 4em; }
            .btn-voltar { text-decoration: none; font-size: 0.75em; font-weight: 900; text-transform: uppercase; letter-spacing: 2px; color: #bbb; display: inline-flex; align-items: center; gap: 10px; transition: color 0.3s; cursor: pointer; border: none !important; background: none !important; padding: 0 !important; }
            .btn-voltar:hover { color: #1a1a1a; text-decoration: underline; }

            @media screen and (max-width: 1280px) {
                #sidebar { position: relative !important; width: 100% !important; height: auto !important; }
                #wrapper { padding-left: 0 !important; }
                .noticia-titulo { font-size: 2.5em; }
                .noticia-hero-img { height: 300px; }
            }
		</style>
	</head>
	<body class="is-preload">
		<div id="wrapper">
			<div id="main">
                <div class="inner">
                    <section id="noticia-content">
                        
                        <div id="loading" style="color: #bbb; font-style: italic;">A carregar notícia...</div>

                        <div id="noticia-render" style="display:none;">
                            <div class="noticia-header">
                                <span class="noticia-cat" id="cat">--</span>
                                <h1 class="noticia-titulo" id="titulo">--</h1>
                                <div class="noticia-meta">
                                    <div class="source-circle" id="source-letter">B</div>
                                    <span id="fonte">--</span>
                                    <span style="opacity: 0.3;">|</span>
                                    <span id="data">--</span>
                                </div>
                            </div>

                            <img src="" class="noticia-hero-img" id="imagem">

                            <div class="resumo-banner" id="resumo-box">
                                <p class="resumo-text" id="resumo-txt"></p>
                            </div>

                            <div class="noticia-corpo" id="corpo">
                                <!-- Conteúdo integral via JSON -->
                            </div>

                            <!-- BOTÃO VOLTAR APENAS NO FUNDO -->
                            <div class="bottom-actions">
                                <a href="javascript:history.back()" class="btn-voltar">← Voltar para o Observatório</a>
                            </div>
                        </div>
                    </section>

                    <footer style="padding: 4em 0; border-top: 1px solid #f2f2f2; opacity: 0.3; text-align: right;">
                        <span style="display: block; font-size: 0.85em; font-weight: 900; color: #333;">bioCultura</span>
                        <span style="display: block; font-size: 0.5em; font-weight: 700; text-transform: uppercase; letter-spacing: 1px;">Global Regeneration</span>
                    </footer>
                </div>
            </div>
			<div id="sidebar"></div>
		</div>

		<script src="/assets/js/jquery.min.js"></script>
        <script>
            async function carregarNoticia() {
                const urlParams = new URLSearchParams(window.location.search);
                const noticiaId = urlParams.get('id');

                if (!noticiaId) {
                    window.location.href = '/index.html';
                    return;
                }

                try {
                    const response = await fetch('/data/noticias.json');
                    const noticias = await response.json();
                    const n = noticias.find(item => item.id === noticiaId);

                    if (n) {
                        document.getElementById('loading').style.display = 'none';
                        document.getElementById('noticia-render').style.display = 'block';
                        
                        document.title = n.titulo + " - bioCultura";
                        document.getElementById('cat').innerText = n.categoria;
                        document.getElementById('titulo').innerText = n.titulo;
                        document.getElementById('fonte').innerText = n.fonte;
                        document.getElementById('source-letter').innerText = n.fonte.charAt(0);
                        document.getElementById('data').innerText = n.data;
                        document.getElementById('imagem').src = n.imagem;
                        
                        if (n.resumo) {
                            document.getElementById('resumo-txt').innerText = `"${n.resumo}"`;
                        } else {
                            document.getElementById('resumo-box').style.display = 'none';
                        }

                        document.getElementById('corpo').innerHTML = n.corpo;
                    } else {
                        document.getElementById('loading').innerText = "Notícia não encontrada.";
                    }
                } catch (e) {
                    console.error("Erro no carregamento:", e);
                }
            }

            fetch('/sidebar-content.html').then(r => r.text()).then(html => {
                document.getElementById('sidebar').innerHTML = html;
                var s = document.createElement('script'); s.src = '/assets/js/main.js'; document.body.appendChild(s);
                carregarNoticia();
            });
        </script>
	</body>
</html>
