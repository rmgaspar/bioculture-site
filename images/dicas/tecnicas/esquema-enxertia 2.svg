<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" role="img" font-family="Georgia, serif">
  <rect width="600" height="400" fill="#f1efe3"/>
  <defs>
    <g id="porta"><path d="M70 380V262l44-48V380z" fill="#8a6a4a"/><path d="M70 262l44-48" stroke="#a8cf78" stroke-width="5" stroke-linecap="round"/></g>
    <g id="garfo"><path d="M76 120v135l32-35V120z" fill="#7aa857"/><path d="M76 255l32-35" stroke="#a8cf78" stroke-width="5" stroke-linecap="round"/><circle cx="92" cy="152" r="5" fill="#3f6a2a"/><circle cx="92" cy="190" r="5" fill="#3f6a2a"/></g>
  </defs>
  <g stroke-linejoin="round" stroke-linecap="round">
    <!-- 1: os dois cortes com a «língua» -->
    <use href="#porta"/><path d="M92 238v40" stroke="#4b3a28" stroke-width="3.5"/>
    <g transform="translate(0 -62)"><use href="#garfo"/><path d="M92 238v-34" stroke="#4b3a28" stroke-width="3.5"/></g>
    <path d="M150 110v46M140 146l10 12 10-12" fill="none" stroke="#6a746e" stroke-width="4"/>
    <!-- 2: encaixe com o câmbio a coincidir -->
    <g transform="translate(200 0)"><use href="#porta"/><use href="#garfo"/>
      <path d="M70 262l6-7M108 220l6-6" stroke="#a8cf78" stroke-width="7"/>
      <path d="M92 238l0 0" stroke="#4b3a28"/>
    </g>
    <!-- 3: ligar e selar -->
    <g transform="translate(400 0)"><use href="#porta"/><use href="#garfo"/>
      <g fill="none" stroke="#efe9d4" stroke-width="8"><path d="M64 276l56-14M64 262l56-14M64 248l56-14M64 234l56-14M64 220l56-14M66 206l50-10"/></g>
      <circle cx="92" cy="120" r="11" fill="#c98a1a"/>
    </g>
  </g>
  <g stroke="#6a746e" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M158 330h34M182 320l10 10-10 10"/><path d="M358 330h34M382 320l10 10-10 10"/></g>
  <g font-size="22" font-weight="700" text-anchor="middle" fill="#fff">
    <circle cx="100" cy="40" r="20" fill="#4c7a34"/><text x="100" y="48">1</text>
    <circle cx="300" cy="40" r="20" fill="#4c7a34"/><text x="300" y="48">2</text>
    <circle cx="500" cy="40" r="20" fill="#4c7a34"/><text x="500" y="48">3</text>
  </g>
  <path d="M0 380h600" stroke="#c9c2ac" stroke-width="2"/>
</svg>
