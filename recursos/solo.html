<script>
    let locationsDB = [];
    function calcularDistancia(lat1, lon1, lat2, lon2) {
        const R = 6371;
        const dLat = (lat2 - lat1) * Math.PI / 180;
        const dLon = (lon2 - lon1) * Math.PI / 180;
        const a = Math.sin(dLat/2) * Math.sin(dLat/2) + Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) * Math.sin(dLon/2) * Math.sin(dLon/2);
        return R * (2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a)));
    }

    async function inicializarPagina() {
        try {
            const r = await fetch('/data/bioregioes.json');
            locationsDB = await r.json();
            const urlParams = new URLSearchParams(window.location.search);
            const regionParam = urlParams.get('region');
            const savedId = localStorage.getItem('biocultura_region');
            let info = null;
            if (regionParam) info = locationsDB.find(i => i.id === regionParam);
            if (!info && savedId) info = locationsDB.find(i => i.id === savedId);
            if (info) renderSoilDashboard(info);
            else tentarGPSOuNacional();
        } catch(e) { console.error(e); }
    }

    function tentarGPSOuNacional() {
        if (navigator.geolocation) {
            const timeout = setTimeout(() => carregarNacional(), 3000);
            navigator.geolocation.getCurrentPosition(pos => {
                clearTimeout(timeout);
                let minD = Infinity; let closest = null;
                locationsDB.forEach(c => {
                    if(c.lat && c.lon) {
                        let d = calcularDistancia(pos.coords.latitude, pos.coords.longitude, c.lat, c.lon);
                        if(d < minD) { minD = d; closest = c; }
                    }
                });
                if(closest) { localStorage.setItem('biocultura_region', closest.id); renderSoilDashboard(closest); }
            }, () => { clearTimeout(timeout); carregarNacional(); });
        } else carregarNacional();
    }

    function carregarNacional() {
        const nacional = locationsDB.find(i => i.id === "portugal-nacional");
        if (nacional) {
            renderSoilDashboard(nacional);
            document.getElementById('reg-name').innerHTML = "Portugal <span style='font-size:0.5em; color:#bbb'>(Média Nacional)</span>";
        }
    }

    function renderSoilDashboard(info) {
        if(!info) return;
        document.getElementById('no-gps-warning').style.display = 'none';
        document.getElementById('soil-dashboard').style.display = 'grid';
        document.getElementById('reg-name').innerText = info.titulo;
        if (info.biomas) {
            const ph = parseFloat(info.biomas.ph_solo) || 6.5;
            const type = info.biomas.solo || "";
            document.getElementById('val-ph').innerText = ph;
            const phCont = document.getElementById('container-ph');
            phCont.className = 'metric';
            if (ph < 6.0) phCont.classList.add('status-acid');
            else if (ph <= 7.5) phCont.classList.add('status-neutral');
            else phCont.classList.add('status-alkaline');
            document.getElementById('val-soil-type').innerText = type;
            document.getElementById('val-texture').innerText = "Textura: " + (info.biomas.textura || "N/A");
            let benefit = ""; let carbon = ""; let water = "";
            if (type.includes("Granítico")) { benefit = "Solo excelente para castanheiros e batata. Requer reforço de matéria orgânica."; carbon = "Potencial moderado. Melhora com cobertura permanente."; water = "Drenagem rápida: Evita encharcamento mas exige regas frequentes."; }
            else if (type.includes("Xistoso")) { benefit = "Mineralização profunda, ideal para vinhas de alta qualidade."; carbon = "Fixação estável. Essencial evitar a mobilização mecânica."; water = "Retenção térmica: A rocha mantém o calor no solo à noite."; }
            else if (type.includes("Calcário")) { benefit = "Rico em cálcio. Favorece leguminosas e fruteiras de caroço."; carbon = "Elevado potencial de armazenamento em forma de carbonatos."; water = "Permeabilidade alta: Risco de seca. Use Ânforas de barro."; }
            else if (type.includes("Argiloso") || type.includes("Barros")) { benefit = "Alta fertilidade natural. Ideal para cereais e hortícolas."; carbon = "Campeão do sequestro. A argila protege o carbono."; water = "Efeito esponja: Retém água por longos períodos."; }
            else { benefit = "Solo versátil. Recomendamos mulching orgânico."; carbon = "Dependente da biomassa. Mantenha o solo coberto."; water = "Resiliência moderada."; }
            document.getElementById('soil-benefits').innerText = benefit;
            document.getElementById('carbon-potential').innerText = carbon;
            document.getElementById('water-resilience').innerText = water;
        }
    }

    function setupSidebarEvents() {
        const input = document.getElementById('loc-search-input');
        const dropdown = document.getElementById('loc-dropdown');
        const gpsBtn = document.getElementById('btn-gps-trigger');
        if(!input) return;
        if(gpsBtn) {
            gpsBtn.onclick = function(e) {
                e.preventDefault();
                input.value = "A localizar...";
                localStorage.clear(); sessionStorage.clear();
                navigator.geolocation.getCurrentPosition(() => { window.location.href = window.location.pathname; }, () => { window.location.href = window.location.pathname; });
            };
        }
        input.addEventListener('input', function() {
            const val = this.value.toLowerCase();
            dropdown.innerHTML = '';
            if(val.length < 2) { dropdown.style.display = 'none'; return; }
            const matches = locationsDB.filter(i => i.titulo.toLowerCase().includes(val)).slice(0, 6);
            if(matches.length > 0) {
                dropdown.style.display = 'block';
                matches.forEach(m => {
                    const item = document.createElement('div');
                    item.className = 'bio-res-item';
                    item.innerText = m.titulo;
                    item.onclick = () => { localStorage.setItem('biocultura_region', m.id); sessionStorage.clear(); window.location.href = window.location.pathname; };
                    dropdown.appendChild(item);
                });
            } else dropdown.style.display = 'none';
        });
        input.addEventListener('keydown', function(e) {
            if (e.key === 'Enter') {
                const val = this.value.toLowerCase().trim();
                const match = locationsDB.find(i => i.titulo.toLowerCase() === val || i.id === val);
                if(match) { localStorage.setItem('biocultura_region', match.id); sessionStorage.clear(); window.location.href = window.location.pathname; }
            }
        });
    }

    fetch('/sidebar-content.html').then(r => r.text()).then(html => {
        document.getElementById('sidebar').innerHTML = html;
        var s = document.createElement('script'); s.src = '/assets/js/main.js'; document.body.appendChild(s);
        inicializarPagina();
        setTimeout(setupSidebarEvents, 1000);
    });
</script>
