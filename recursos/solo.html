<!DOCTYPE HTML>
<html>
	<head>
		<title>bioCultura - Observatório da Terra</title>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
		<link rel="stylesheet" href="/assets/css/main.css" />
		<style>
            /* --- ESTRUTURA GLOBAL --- */
            body, input, select, textarea { font-family: 'Source Sans Pro', sans-serif !important; color: #444; }
			section, #header, hr, .major { border: none !important; box-shadow: none !important; padding: 0 !important; }
            section { padding-top: 4em !important; min-height: 100vh; display: flex; flex-direction: column; }

            /* SIDEBAR FIXA */
            #sidebar { position: fixed !important; top: 0; left: 0; height: 100vh !important; width: 18em !important; overflow: hidden !important; z-index: 10000; background: #fff; border-right: 1px solid #f2f2f2 !important; }
            #sidebar > .inner { height: 100% !important; overflow: hidden !important; display: flex; flex-direction: column; }
            #wrapper { padding-left: 18em !important; }

            .category-label { font-size: 0.65em; font-weight: 900; text-transform: uppercase; letter-spacing: 3px; color: #bbb; margin-bottom: 10px; display: block; text-align: center; }
            
            /* LINHAS DE DADOS */
            .data-row { 
                display: grid; 
                grid-template-columns: 180px 1fr; 
                gap: 40px; 
                padding: 2.5em 0;
                border-bottom: 1px solid #f2f2f2;
            }
            .data-row h4 { font-size: 0.65em; font-weight: 900; text-transform: uppercase; letter-spacing: 2px; color: #bbb; margin: 0; padding-top: 5px; }

            /* ESCALA PH SOLO */
            .gauge-container { margin-bottom: 20px; width: 100%; max-width: 500px; }
            .gauge-label { display: flex; justify-content: space-between; align-items: flex-end; margin-bottom: 10px; }
            .gauge-label .current-val { font-size: 1.4em; font-weight: 700; color: #1a1a1a; }
            .gauge-label .unit { font-size: 0.7em; font-weight: 800; color: #bbb; text-transform: uppercase; }
            .gauge-bar { height: 8px; width: 100%; border-radius: 10px; position: relative; background: linear-gradient(to right, #ffd54f 0%, #81c784 50%, #4fc3f7 100%); }
            .gauge-marker { position: absolute; top: -6px; left: 0%; width: 3px; height: 20px; background: #1a1a1a; border-radius: 2px; transition: left 1.5s cubic-bezier(0.4, 0, 0.2, 1); }

            .tech-main { font-size: 1.15em; font-weight: 700; color: #1a1a1a; display: block; margin-bottom: 8px; }
            .tech-detail { font-size: 0.95em; color: #777; line-height: 1.6; margin: 0; }

            .regen-box { background: #f1f8e9; padding: 2em; border-radius: 25px; margin-top: 20px; }
            .regen-box h5 { color: #33691e; font-weight: 900; text-transform: uppercase; font-size: 0.7em; margin-bottom: 10px; }
            .regen-box p { color: #33691e; font-size: 0.9em; margin: 0; font-weight: 600; }

            .page-footer { margin-top: auto; padding: 4em 0 2em 0; border-top: 1px solid #f2f2f2; }

            @media screen and (max-width: 1280px) {
                #sidebar { position: relative !important; width: 100% !important; height: auto !important; overflow: visible !important; }
                #wrapper { padding-left: 0 !important; }
                .data-row { grid-template-columns: 1fr; gap: 15px; }
            }
		</style>
	</head>
	<body class="is-preload">
		<div id="wrapper">
			<div id="main">
                <div class="inner">
					<header id="header" style="height: 0; margin: 0; padding: 0; overflow: hidden;"></header>
                    <section>
                        <div style="text-align: center; margin-bottom: 4em;">
                            <span class="category-label">Recursos Vitais</span>
                            <h1 style="font-size: 3.5em; font-weight: 300; color: #1a1a1a; letter-spacing: -2px; margin: 0;">Solo: A Fundação da Vida</h1>
                            <p style="font-size: 0.9em; font-style: italic; color: #bbb; margin-top: 5px;">Perfil pedológico: <strong id="reg-name" style="color:#888">...</strong></p>
                        </div>

                        <div id="soil-dashboard" style="display:none;">
                            <div class="data-row">
                                <h4>Composição</h4>
                                <div style="width:100%">
                                    <div class="gauge-container">
                                        <div class="gauge-label"><span class="current-val" id="label-ph">pH --</span><span class="unit">Acidez do Solo</span></div>
                                        <div class="gauge-bar"><div id="marker-ph" class="gauge-marker"></div></div>
                                    </div>
                                    <span class="tech-main" id="val-soil-type">--</span>
                                    <p class="tech-detail" id="val-texture">--</p>
                                </div>
                            </div>

                            <div class="data-row">
                                <h4>Regeneração</h4>
                                <div style="width:100%">
                                    <p class="tech-detail" id="soil-benefits">A analisar aptidão do terreno...</p>
                                    <div class="regen-box">
                                        <h5>Potencial de Sequestro de Carbono</h5>
                                        <p id="carbon-text">--</p>
                                    </div>
                                </div>
                            </div>
                        </div>

                        <div id="no-gps-warning" style="text-align: center; padding: 4em; color: #bbb;"><p>Selecione uma localidade na barra lateral.</p></div>

                        <footer class="page-footer">
                            <div style="display: flex; align-items: center; justify-content: flex-end; gap: 10px; opacity: 0.3;">
                                <div style="text-align: right; line-height: 1;">
                                    <span style="display: block; font-size: 0.85em; font-weight: 900; color: #333;">bioCultura</span>
                                    <span style="display: block; font-size: 0.5em; font-weight: 700; text-transform: uppercase; letter-spacing: 1px;">Global Regeneration</span>
                                </div>
                                <svg width="22" height="22" viewBox="0 0 100 100"><path d="M50 5 L89 27.5 L89 72.5 L50 95 L11 72.5 L11 27.5 Z" fill="#333" /><path d="M50 20 C50 20 75 45 75 70 C75 85 65 85 50 85 C35 85 25 85 25 70 C25 45 50 20 50 20Z" fill="#fff" /></svg>
                            </div>
                        </footer>
					</section>
				</div>
            </div>
			<div id="sidebar"></div>
		</div>

		<script src="/assets/js/jquery.min.js"></script>
        <script>
            let locationsDB = [];
            async function inicializarPagina() {
                try {
                    const r = await fetch('/data/bioregioes.json');
                    locationsDB = await r.json();
                    const urlParams = new URLSearchParams(window.location.search);
                    const regionParam = urlParams.get('region');
                    const savedId = localStorage.getItem('biocultura_region');
                    let info = regionParam ? locationsDB.find(i => i.id === regionParam) : locationsDB.find(i => i.id === savedId);
                    if (info) renderDashboard(info);
                    else renderDashboard(locationsDB.find(i => i.id === "portugal-nacional"));
                } catch(e) { console.error(e); }
            }

            function renderDashboard(info) {
                if(!info) return;
                document.getElementById('no-gps-warning').style.display = 'none';
                document.getElementById('soil-dashboard').style.display = 'block';
                document.getElementById('reg-name').innerText = info.titulo;

                if (info.biomas) {
                    const ph = parseFloat(info.biomas.ph_solo) || 6.5;
                    document.getElementById('label-ph').innerText = "pH " + ph;
                    setTimeout(() => { document.getElementById('marker-ph').style.left = (ph / 14 * 100) + "%"; }, 300);

                    const type = info.biomas.solo || "";
                    document.getElementById('val-soil-type').innerText = type;
                    document.getElementById('val-texture').innerText = "Textura: " + (info.biomas.textura || "N/A");

                    let benefit = ""; let carbon = "";
                    if (type.includes("Granítico")) {
                        benefit = "Solo excelente para castanheiros e batata. Requer reforço de matéria orgânica para reter nutrientes.";
                        carbon = "Potencial moderado. Melhora significativamente com a técnica de cobertura permanente e mulching.";
                    } else if (type.includes("Xistoso")) {
                        benefit = "Mineralização profunda, ideal para vinhas de alta qualidade e oliveiras resilientes.";
                        carbon = "Fixação estável através de raízes profundas. Essencial evitar a mobilização mecânica do terreno.";
                    } else if (type.includes("Calcário")) {
                        benefit = "Naturalmente rico em cálcio. Favorece leguminosas e fruteiras de caroço. pH naturalmente equilibrado.";
                        carbon = "Elevado potencial de armazenamento estável em forma de carbonatos minerais no subsolo.";
                    } else if (type.includes("Argiloso") || type.includes("Barros")) {
                        benefit = "Alta fertilidade natural. Ideal para cereais, pastagens ricas e hortícolas de grande exigência.";
                        carbon = "O campeão do sequestro. A estrutura da argila protege a matéria orgânica da oxidação rápida.";
                    } else {
                        benefit = "Solo versátil. Recomendamos a monitorização da humidade e o uso de adubação verde.";
                        carbon = "Dependente da biomassa à superfície. Mantenha o solo sempre coberto para fixar carbono.";
                    }
                    document.getElementById('soil-benefits').innerText = benefit;
                    document.getElementById('carbon-text').innerText = carbon;
                }
                const input = document.getElementById('loc-search-input');
                if(input) input.value = info.titulo;
            }

            fetch('/sidebar-content.html').then(r => r.text()).then(html => {
                document.getElementById('sidebar').innerHTML = html;
                var s = document.createElement('script'); s.src = '/assets/js/main.js'; document.body.appendChild(s);
                inicializarPagina();
                setTimeout(() => { /* lógica sidebar igual à agua */ }, 1000);
            });
        </script>
	</body>
</html>
