<!DOCTYPE HTML>
<html>
	<head>
		<title>bioCultura - Observatório da Água</title>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
		<link rel="stylesheet" href="/assets/css/main.css" />
		<style>
            body, input, select, textarea { font-family: 'Source Sans Pro', sans-serif !important; color: #444; }
			section, #header, hr, .major { border: none !important; box-shadow: none !important; padding: 0 !important; }
            section { min-height: 100vh; display: flex; flex-direction: column; }
            #sidebar { position: fixed !important; top: 0; left: 0; height: 100vh !important; width: 18em !important; overflow: hidden !important; z-index: 10000; background: #fff; border-right: 1px solid #f2f2f2 !important; }
            #wrapper { padding-left: 18em !important; }
            .inner { padding: 2.2em 4em 0 4em !important; max-width: 1600px !important; margin: 0 auto; width: 100%; }
            .category-label { font-size: 0.65em; font-weight: 900; text-transform: uppercase; letter-spacing: 4px; color: #bbb; margin-bottom: 15px; display: block; }
            .hero-split { display: flex; align-items: flex-start; justify-content: space-between; gap: 4em; margin-bottom: 2em; }
            .hero-text { flex: 1.5; text-align: left; padding-top: 5px; }
            .hero-text h1 { font-size: 4em; font-weight: 900; color: #1a1a1a; letter-spacing: -2.5px; line-height: 0.95; margin-bottom: 20px; }
            .hero-visual { flex: 1; display: flex; justify-content: flex-end; }
            .hero-globe { position: relative; width: 480px; height: 480px; border-radius: 50%; overflow: hidden; box-shadow: 0 40px 100px rgba(0,0,0,0.12); background: #1a1a1a; }
            .hero-globe img { width: 100%; height: 100%; object-fit: cover; }
            .data-row { display: block; padding: 2.5em 0; border-bottom: 1px solid #f2f2f2; }
            .data-row h4 { font-size: 0.7em; font-weight: 900; text-transform: uppercase; letter-spacing: 2px; color: #bbb; margin: 0 0 25px 0; display: block; }
            .gauge-container { margin-bottom: 15px; width: 100%; max-width: 500px; }
            .gauge-label { display: flex; justify-content: space-between; align-items: flex-end; margin-bottom: 6px; }
            .current-val { font-size: 1.2em; font-weight: 700; color: #1a1a1a; }
            .unit { font-size: 0.6em; font-weight: 800; color: #bbb; text-transform: uppercase; }
            .gauge-bar { height: 6px; width: 100%; border-radius: 10px; position: relative; background: #eee; }
            .bar-ph { background: linear-gradient(to right, #ffd54f 0%, #81c784 50%, #4fc3f7 100%); }
            .bar-dureza { background: linear-gradient(to right, #4fc3f7 0%, #ffb74d 50%, #ef5350 100%); }
            .gauge-marker { position: absolute; top: -5px; left: 0%; width: 3px; height: 16px; background: #1a1a1a; border-radius: 2px; transition: left 1.5s cubic-bezier(0.4, 0, 0.2, 1); }
            .report-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 40px; margin-top: 10px; }
            .report-item { border-top: 1px solid #f9f9f9; padding-top: 20px; }
            .report-item h5 { font-size: 0.7em; font-weight: 900; text-transform: uppercase; letter-spacing: 1px; color: #4fc3f7; margin-bottom: 12px; }
            .report-item p { font-size: 0.95em; line-height: 1.7; color: #666; margin-bottom: 15px; text-align: justify; }
            .news-list { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 30px; margin-bottom: 4em; }
            .news-item { text-decoration: none; color: inherit; display: block; padding: 25px; background: #fdfdfd; border: 1px solid #f2f2f2; border-radius: 12px; transition: all 0.3s; }
            .news-item:hover { transform: translateY(-5px); border-color: #ddd; }
            .news-item h3 { font-size: 1.15em; font-weight: 700; color: #1a1a1a; margin-bottom: 12px; line-height: 1.3; min-height: 2.6em; }
            .page-footer { margin-top: auto; padding: 2em 0 2.5em 0; border-top: 1px solid #f2f2f2; opacity: 0.3; text-align: right; }
            @media screen and (max-width: 1280px) { #sidebar { position: relative !important; width: 100% !important; height: auto !important; } #wrapper { padding-left: 0 !important; } .hero-split { flex-direction: column-reverse; } .hero-globe { width: 350px; height: 350px; margin: 0 auto; } .report-grid { grid-template-columns: 1fr; } }
		</style>
	</head>
	<body class="is-preload">
		<div id="wrapper">
			<div id="main">
                <div class="inner">
                    <section>
                        <div class="hero-split">
                            <div class="hero-text">
                                <span class="category-label">Recursos Vitais</span>
                                <h1>Água: O Sangue da Terra</h1>
                                <p style="font-size: 0.9em; font-style: italic; color: #bbb; margin-bottom: 30px;">Análise regional: <strong id="reg-name" style="color:#888">...</strong></p>

                                <div id="water-dashboard" style="display:none;">
                                    <h4 style="font-size: 0.7em; font-weight: 900; text-transform: uppercase; letter-spacing: 2px; color: #bbb; margin-bottom: 20px;">Perfil Químico</h4>
                                    <div style="display: flex; gap: 40px; flex-wrap: wrap;">
                                        <div class="gauge-container">
                                            <div class="gauge-label"><span class="current-val" id="label-ph">pH --</span><span class="unit">Escala 0-14</span></div>
                                            <div class="gauge-bar bar-ph"><div id="marker-ph" class="gauge-marker"></div></div>
                                        </div>
                                        <div class="gauge-container">
                                            <div class="gauge-label"><span class="current-val" id="label-dureza">-- ºf</span><span class="unit">Dureza estimada</span></div>
                                            <div class="gauge-bar bar-dureza"><div id="marker-dureza" class="gauge-marker"></div></div>
                                        </div>
                                    </div>
                                </div>
                            </div>
                            <div class="hero-visual">
                                <div class="hero-globe">
                                    <img src="https://plus.unsplash.com/premium_photo-1683288081743-5161d099f16e?q=80&w=1035&auto=format&fit=crop" alt="Recursos Hídricos">
                                </div>
                            </div>
                        </div>

                        <div class="data-row">
                            <h4>Alerta Hídrico</h4>
                            <p id="alerta-texto" style="font-size: 1.1em; line-height: 1.6; color: #777; max-width: 1000px;">A carregar dados de monitorização...</p>
                        </div>

                        <div class="data-row">
                            <h4>Relatório de Stress Hídrico</h4>
                            <div id="report-grid-dynamic" class="report-grid"></div>
                        </div>

                        <h2 class="news-header">notícias</h2>
                        <div id="noticias-agua-dinamico" class="news-list"></div>

                        <footer class="page-footer">
                            <span style="display: block; font-size: 0.85em; font-weight: 900; color: #333;">bioCultura</span>
                            <span style="display: block; font-size: 0.5em; font-weight: 700; text-transform: uppercase; letter-spacing: 1px;">Global Regeneration</span>
                        </footer>
					</section>
				</div>
            </div>
			<div id="sidebar"></div>
		</div>

		<script src="/assets/js/jquery.min.js"></script>
        <script>
            let locationsDB = [], todasNoticias = [];

            function calcularDistancia(lat1, lon1, lat2, lon2) {
                const R = 6371;
                const dLat = (lat2 - lat1) * Math.PI / 180;
                const dLon = (lon2 - lon1) * Math.PI / 180;
                const a = Math.sin(dLat/2) * Math.sin(dLat/2) + Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) * Math.sin(dLon/2) * Math.sin(dLon/2);
                return R * (2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a)));
            }

            async function init() {
                try {
                    const [rLoc, rNews] = await Promise.all([
                        fetch('../data/freguesias_portugal.json').then(r => r.json()),
                        fetch('../data/noticias.json').then(r => r.json())
                    ]);
                    locationsDB = rLoc;
                    todasNoticias = rNews;

                    const savedId = localStorage.getItem('biocultura_region');
                    const info = locationsDB.find(i => String(i.id) === String(savedId)) || locationsDB[0];
                    
                    renderPageData(info);
                    renderizarNoticias();
                } catch (e) { console.error("Erro no carregamento:", e); }
            }

            function renderPageData(info) {
                if(!info) return;
                document.getElementById('reg-name').innerText = info.titulo + (info.concelho ? ', ' + info.concelho : '');
                
                // 1. Dashboard Químico
                if(info.agua_data) {
                    document.getElementById('water-dashboard').style.display = 'block';
                    const ph = info.agua_data.ph || 7;
                    const dureza = info.agua_data.dureza || 15;
                    
                    document.getElementById('label-ph').innerText = `pH ${ph}`;
                    document.getElementById('marker-ph').style.left = `${(ph / 14) * 100}%`;
                    
                    document.getElementById('label-dureza').innerText = `${dureza} ºf`;
                    document.getElementById('marker-dureza').style.left = `${Math.min((dureza / 40) * 100, 100)}%`;
                }

                // 2. Alerta
                if(info.alerta_agua) {
                    document.getElementById('alerta-texto').innerText = info.alerta_agua;
                }

                // 3. Relatórios
                const reportGrid = document.getElementById('report-grid-dynamic');
                if(reportGrid && info.relatorios_agua) {
                    reportGrid.innerHTML = info.relatorios_agua.map(r => `
                        <div class="report-item">
                            <h5>${r.titulo}</h5>
                            <p>${r.texto}</p>
                        </div>
                    `).join('');
                }
            }

            function renderizarNoticias() {
                const container = document.getElementById('noticias-agua-dinamico');
                if (!container) return;
                const lang = localStorage.getItem('selected_lang') || 'pt';
                const filtradas = todasNoticias.filter(n => n.categoria && (n.categoria.toLowerCase() === 'water' || n.categoria.toLowerCase() === 'água'));

                container.innerHTML = filtradas.map(n => {
                    const content = n[lang] || n.pt || n;
                    return `
                        <a href="/observatorio/noticia-detalhe.html?id=${n.id}" class="news-item">
                            <h3>${content.titulo}</h3>
                            <div class="news-meta"><span>${n.data}</span></div>
                        </a>`;
                }).join('');
            }

            fetch('../sidebar-content.html').then(r => r.text()).then(html => {
                document.getElementById('sidebar').innerHTML = html;
                $(document).on('click', '#btn-gps-trigger', function() {
                    if (navigator.geolocation) {
                        navigator.geolocation.getCurrentPosition(pos => {
                            let closest = locationsDB[0], minD = Infinity;
                            locationsDB.forEach(c => {
                                if (!c.lat) return;
                                const d = calcularDistancia(pos.coords.latitude, pos.coords.longitude, c.lat, c.lon);
                                if (d < minD) { minD = d; closest = c; }
                            });
                            localStorage.setItem('biocultura_region', closest.id);
                            location.reload();
                        });
                    }
                });
                $(document).on('input', '#loc-search-input', function() {
                    const val = $(this).val().toLowerCase(), dropdown = $('#loc-dropdown').empty();
                    if(val.length < 2) return dropdown.hide();
                    locationsDB.filter(i => i.titulo.toLowerCase().includes(val)).slice(0,5).forEach(m => {
                        $('<div class="bio-res-item"></div>').text(m.titulo).on('click', () => {
                            localStorage.setItem('biocultura_region', m.id);
                            location.reload();
                        }).appendTo(dropdown);
                    });
                    dropdown.show();
                });
            });

            init();
        </script>
	</body>
</html>
