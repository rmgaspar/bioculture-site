<script>
    // 1. Função Haversine para encontrar o concelho mais próximo via GPS
    function calcularDistancia(lat1, lon1, lat2, lon2) {
        const R = 6371;
        const dLat = (lat2 - lat1) * Math.PI / 180;
        const dLon = (lon2 - lon1) * Math.PI / 180;
        const a = Math.sin(dLat/2) * Math.sin(dLat/2) +
                  Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) * 
                  Math.sin(dLon/2) * Math.sin(dLon/2);
        const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
        return R * c;
    }

    // 2. Inicialização Inteligente (URL -> LocalStorage -> GPS)
    async function inicializarPagina() {
        try {
            const response = await fetch('/data/bioregioes.json');
            const data = await response.json();

            // Verificar se existe parâmetro na URL (ex: ?region=boticas)
            const urlParams = new URLSearchParams(window.location.search);
            const regionParam = urlParams.get('region');
            
            // Definir o ID a carregar (Prioridade: URL > LocalStorage)
            const targetId = regionParam || localStorage.getItem('biocultura_region');
            let info = data.find(item => item.id === targetId);

            if (regionParam && info) {
                // Se veio por link, atualizamos o sistema para esta nova região
                localStorage.setItem('biocultura_region', info.id);
                sessionStorage.removeItem('biocultura_data_cache');
                renderWaterDashboard(info);
            } else if (info) {
                // Se já existia no sistema, carrega normalmente
                renderWaterDashboard(info);
            } else if (navigator.geolocation) {
                // Se não há nada, tenta encontrar o mais próximo via GPS
                navigator.geolocation.getCurrentPosition(pos => {
                    let minD = Infinity;
                    let closest = null;
                    data.forEach(c => {
                        if(c.lat && c.lon) {
                            let d = calcularDistancia(pos.coords.latitude, pos.coords.longitude, c.lat, c.lon);
                            if(d < minD) { minD = d; closest = c; }
                        }
                    });
                    if(closest) {
                        localStorage.setItem('biocultura_region', closest.id);
                        renderWaterDashboard(closest);
                    }
                });
            }
        } catch(e) { console.error("Erro ao processar dados hídricos:", e); }
    }

    // 3. Renderização Técnica do Dashboard
    function renderWaterDashboard(info) {
        document.getElementById('no-gps-warning').style.display = 'none';
        document.getElementById('water-dashboard').style.display = 'grid';
        document.getElementById('reg-name').innerText = info.titulo;

        if (info.recursos_hidricos) {
            const ph = parseFloat(info.recursos_hidricos.ph_agua);
            const dur = parseFloat(info.recursos_hidricos.dureza_fr);
            
            // Atualizar Valores e Cores dos Barómetros
            const phEl = document.getElementById('val-ph');
            const phCont = phEl.parentElement;
            phEl.innerText = ph;
            phCont.className = 'metric';
            if (ph < 6.5) phCont.classList.add('status-acid');
            else if (ph <= 8.5) phCont.classList.add('status-neutral');
            else phCont.classList.add('status-alkaline');

            const durEl = document.getElementById('val-dureza');
            const durCont = durEl.parentElement;
            durEl.innerText = dur;
            durCont.className = 'metric';
            if (dur < 15) durCont.classList.add('status-soft');
            else if (dur <= 30) durCont.classList.add('status-medium');
            else durCont.classList.add('status-hard');

            // Lógica de Vantagens e Utilidade (Baseada no pH)
            let adv = ""; let soil = "";
            if(ph < 7) {
                adv = "Água ligeiramente ácida: Ideal para a absorção de micronutrientes como Ferro e Zinco.";
                soil = "Evita a alcalinização do solo. Perfeita para culturas como mirtilos, batatas e hortênsias.";
            } else {
                adv = "Água equilibrada/alcalina: Rica em carbonatos, excelente para neutralizar solos muito ácidos.";
                soil = "Benéfica para leguminosas e vinhas. Reduz a necessidade de calagem manual.";
            }
            document.getElementById('water-advantages').innerText = adv;
            document.getElementById('soil-utility').innerText = soil;

            // Temperatura da Água (Mês Atual)
            const mes = new Date().getMonth();
            const temp = info.recursos_hidricos.temp_media_agua ? info.recursos_hidricos.temp_media_agua[mes] : '--';
            const tempBadge = document.createElement('div');
            tempBadge.className = 'temp-badge';
            tempBadge.innerHTML = `<i class="fas fa-thermometer-half"></i> Água hoje: ${temp}ºC`;
            
            const noteContainer = document.getElementById('reg-note');
            noteContainer.innerHTML = '';
            noteContainer.appendChild(tempBadge);
            noteContainer.innerHTML += `<br><br><strong>Qualidade:</strong> ${info.recursos_hidricos.qualidade || 'Boa'}. ${info.agua?.nota || ''}`;
        }

        // 4. Detalhes de Aquíferos e Barragens
        if (info.agua) {
            document.getElementById('reg-aquifer').innerText = info.agua.aquiferos || "Informação em levantamento.";
            
            const dams = info.agua.barragens_proximas || [];
            document.getElementById('reg-dams').innerText = dams.length > 0 ? dams.join(', ') : "Sem grandes barragens num raio de 20km.";
            
            // Detalhe dinâmico de potência (Exemplo para Castelo de Bode)
            const damDetails = document.getElementById('dam-details');
            if(info.titulo.includes("Proença") || info.titulo.includes("Sertã") || info.titulo.includes("Tomar")) {
                damDetails.style.display = 'block';
                document.getElementById('val-dam-power').innerHTML = "<strong>Barragem de Castelo de Bode:</strong> 155 MW de potência instalada. Alimenta o sistema de abastecimento de Lisboa e gera energia renovável para a rede nacional.";
            } else {
                damDetails.style.display = 'none';
            }
        }
    }

    // 5. Carregar Sidebar e Iniciar
    fetch('/sidebar-content.html').then(r => r.text()).then(html => {
        document.getElementById('sidebar').innerHTML = html;
        var s = document.createElement('script'); s.src = '/assets/js/main.js'; document.body.appendChild(s);
        inicializarPagina();
    });
</script>
