<!DOCTYPE HTML>
<html>
<head>
    <title>bioCultura - Observatório da Água</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
    <link rel="stylesheet" href="/assets/css/main.css" />
    <style>
        body, input, select, textarea { font-family: 'Source Sans Pro', sans-serif !important; color: #444; }
        section, #header, hr, .major { border: none !important; box-shadow: none !important; padding: 0 !important; }
        section { min-height: 100vh; display: flex; flex-direction: column; }
        #sidebar { position: fixed !important; top: 0; left: 0; height: 100vh !important; width: 18em !important; overflow: hidden !important; z-index: 10000; background: #fff; border-right: 1px solid #f2f2f2 !important; }
        #wrapper { padding-left: 18em !important; }
        .inner { padding: 2.2em 4em 0 4em !important; max-width: 1600px !important; margin: 0 auto; width: 100%; }
        .category-label { font-size: 0.65em; font-weight: 900; text-transform: uppercase; letter-spacing: 4px; color: #bbb; margin-bottom: 15px; display: block; line-height: 1; }
        .hero-split { display: flex; align-items: flex-start; justify-content: space-between; gap: 4em; margin-bottom: 2em; }
        .hero-text { flex: 1.5; text-align: left; padding-top: 5px; }
        .hero-text h1 { font-size: 4em; font-weight: 900; color: #1a1a1a; letter-spacing: -2.5px; line-height: 0.95; margin-bottom: 20px; }
        .hero-visual { flex: 1; display: flex; justify-content: flex-end; }
        .hero-globe { position: relative; width: 480px; height: 480px; border-radius: 50%; overflow: hidden; box-shadow: 0 40px 100px rgba(0,0,0,0.12); background: #1a1a1a; }
        .hero-globe img { width: 100%; height: 100%; object-fit: cover; }
        
        /* Gauges */
        .gauge-container { margin-bottom: 25px; width: 100%; max-width: 500px; }
        .gauge-label { display: flex; justify-content: space-between; align-items: flex-end; margin-bottom: 8px; }
        .current-val { font-size: 1.2em; font-weight: 700; color: #1a1a1a; }
        .unit { font-size: 0.6em; font-weight: 800; color: #bbb; text-transform: uppercase; }
        .gauge-bar { height: 6px; width: 100%; border-radius: 10px; position: relative; background: #eee; }
        .bar-ph { background: linear-gradient(to right, #ffd54f 0%, #81c784 50%, #4fc3f7 100%); }
        .bar-dureza { background: linear-gradient(to right, #4fc3f7 0%, #ffb74d 50%, #ef5350 100%); }
        .gauge-marker { position: absolute; top: -5px; left: 0%; width: 3px; height: 16px; background: #1a1a1a; border-radius: 2px; transition: left 1.5s cubic-bezier(0.4, 0, 0.2, 1); }
        
        .chart-explanation { font-size: 0.8em; line-height: 1.6; color: #666; margin-top: 12px; text-align: justify; }
        .chart-source-subtle { font-size: 0.6em; font-weight: 700; color: #ccc; text-transform: uppercase; margin-top: 8px; display: block; }
        
        .news-list { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 30px; margin-bottom: 4em; }
        .news-item { text-decoration: none; color: inherit; display: block; padding: 25px; background: #fdfdfd; border: 1px solid #f2f2f2; border-radius: 12px; transition: all 0.3s; }
        .news-item:hover { transform: translateY(-5px); border-color: #ddd; }
        .news-item h3 { font-size: 1.15em; font-weight: 700; color: #1a1a1a; margin-bottom: 12px; line-height: 1.3; min-height: 2.6em; }
        .page-footer { margin-top: auto; padding: 2em 0 2.5em 0; border-top: 1px solid #f2f2f2; opacity: 0.3; text-align: right; }
    </style>
</head>
<body class="is-preload">
    <div id="wrapper">
        <div id="main">
            <div class="inner">
                <section>
                    <div class="hero-split">
                        <div class="hero-text">
                            <span class="category-label">Recursos Vitais</span>
                            <h1>Água: O Sangue da Terra</h1>
                            <p style="font-size: 0.9em; font-style: italic; color: #bbb; margin-bottom: 30px;">Análise regional: <strong id="reg-name" style="color:#888">...</strong></p>

                            <div id="water-dashboard" style="display:block;">
                                <h4 style="font-size: 0.7em; font-weight: 900; text-transform: uppercase; letter-spacing: 2px; color: #bbb; margin-bottom: 20px;">Perfil Químico Local</h4>
                                <div class="gauge-container">
                                    <div class="gauge-label"><span class="current-val" id="label-ph">pH --</span><span class="unit">Escala 0-14</span></div>
                                    <div class="gauge-bar bar-ph"><div id="marker-ph" class="gauge-marker"></div></div>
                                    <p class="chart-explanation" id="water-advantages">A analisar composição...</p>
                                </div>
                                <div class="gauge-container">
                                    <div class="gauge-label"><span class="current-val" id="label-dureza">-- ºf</span><span class="unit">Dureza estimada</span></div>
                                    <div class="gauge-bar bar-dureza"><div id="marker-dureza" class="gauge-marker"></div></div>
                                </div>
                            </div>
                        </div>
                        <div class="hero-visual">
                            <div class="hero-globe"><img src="https://plus.unsplash.com/premium_photo-1683288081743-5161d099f16e?q=80&w=1035&auto=format&fit=crop"></div>
                        </div>
                    </div>

                    <div id="noticias-agua-dinamico" class="news-list"></div>

                    <footer class="page-footer">
                        <span style="display: block; font-size: 0.85em; font-weight: 900; color: #333;">bioCultura</span>
                        <span style="display: block; font-size: 0.5em; font-weight: 700; text-transform: uppercase; letter-spacing: 1px;">Global Regeneration</span>
                    </footer>
                </section>
            </div>
        </div>
        <div id="sidebar"></div>
    </div>

    <script src="/assets/js/jquery.min.js"></script>
    <script>
    let locationsDB = [], todasNoticias = [];

    // 1. Cálculo de Distância Real (Haversine)
    function calcularDistancia(lat1, lon1, lat2, lon2) {
        const R = 6371;
        const dLat = (lat2 - lat1) * Math.PI / 180;
        const dLon = (lon2 - lon1) * Math.PI / 180;
        const a = Math.sin(dLat/2) * Math.sin(dLat/2) + Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) * Math.sin(dLon/2) * Math.sin(dLon/2);
        return R * (2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a)));
    }

    // 2. Lógica de Localização (Pesquisa e GPS)
    function setupLocationLogic() {
        // Pesquisa manual
        $(document).off('input', '#loc-search-input').on('input', '#loc-search-input', function() {
            const val = $(this).val().toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, ""), 
                  dropdown = $('#loc-dropdown').empty();
            if(val.length < 2) return dropdown.hide();
            
            locationsDB.filter(i => i.titulo.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "").includes(val)).slice(0,8).forEach(m => {
                $('<div class="bio-res-item"></div>').text(m.titulo).on('click', () => {
                    localStorage.setItem('biocultura_region', m.id);
                    location.reload();
                }).appendTo(dropdown);
            });
            dropdown.show();
        });

        // GPS (Seta) - Correção Crítica
        $(document).off('click', '#btn-gps-trigger').on('click', '#btn-gps-trigger', function() {
            const btn = $(this);
            btn.css('opacity', '0.5');

            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(pos => {
                    const uLat = pos.coords.latitude;
                    const uLon = pos.coords.longitude;
                    let closest = null, minD = Infinity;

                    locationsDB.forEach(c => {
                        if(!c.lat || c.lat === 0) return;
                        const d = calcularDistancia(uLat, uLon, c.lat, c.lon);
                        if(d < minD) { minD = d; closest = c; }
                    });

                    if(closest) {
                        localStorage.setItem('biocultura_region', closest.id);
                        location.reload();
                    }
                    btn.css('opacity', '1');
                }, (err) => {
                    console.error("Erro GPS:", err);
                    btn.css('opacity', '1');
                    alert("Não foi possível detetar a localização. Verifique as permissões de GPS do seu navegador.");
                }, { 
                    enableHighAccuracy: true, 
                    timeout: 10000, 
                    maximumAge: 0 
                });
            } else {
                alert("O seu navegador não suporta geolocalização.");
                btn.css('opacity', '1');
            }
        });
    }

    // 3. Renderização do Dashboard (Gauges)
    function renderDashboard(info) {
        if(!info) return;
        const regName = document.getElementById('reg-name');
        if(regName) regName.innerText = info.titulo + (info.concelho ? ', ' + info.concelho : '');
        
        const b = info.biomas || {};
        const ph = parseFloat(b.ph_solo) || 7.0;
        const solo = (b.solo || "").toLowerCase();
        let dur = solo.includes('calcário') ? 28 : solo.includes('granítico') ? 7 : 12;

        // Atualizar Labels
        if(document.getElementById('label-ph')) document.getElementById('label-ph').innerText = "pH " + ph.toFixed(1);
        if(document.getElementById('label-dureza')) document.getElementById('label-dureza').innerText = dur + " ºf";

        // Animar Marcadores
        setTimeout(() => {
            const mPh = document.getElementById('marker-ph') || document.getElementById('marker-ph-solo');
            const mDur = document.getElementById('marker-dureza');
            if(mPh) mPh.style.left = (ph / 14 * 100) + "%";
            if(mDur) mDur.style.left = Math.min(dur / 50 * 100, 100) + "%";
        }, 300);
    }

    // 4. Notícias
    function renderizarNoticias() {
        const lang = localStorage.getItem('selected_lang') || 'pt';
        const path = window.location.pathname;
        const cat = path.includes('agua') ? 'water' : path.includes('solo') ? 'soil' : path.includes('ar') ? 'air' : 'biodiv';
        const container = document.getElementById('noticias-agua-dinamico') || 
                          document.getElementById('noticias-solo-dinamico') || 
                          document.getElementById('noticias-ar-dinamico') || 
                          document.getElementById('noticias-bio-dinamico');
        
        if(!container) return;

        const filtradas = todasNoticias.filter(n => n.categoria === cat && n[lang]);
        container.innerHTML = filtradas.map(n => `
            <a href="/observatorio/noticia-detalhe.html?id=${n.id}" class="news-item">
                <h3>${n[lang].titulo}</h3>
                <div class="news-meta"><span>${n.data}</span></div>
            </a>`).join('');
    }

    // INIT
    fetch('/sidebar-content.html').then(r => r.text()).then(async html => {
        document.getElementById('sidebar').innerHTML = html;
        
        const [rLoc, rNews] = await Promise.all([
            fetch('/data/freguesias_portugal.json').then(r => r.json()),
            fetch('/data/noticias.json').then(r => r.json())
        ]);
        locationsDB = rLoc; todasNoticias = rNews;

        const savedId = localStorage.getItem('biocultura_region');
        const info = locationsDB.find(i => String(i.id) === String(savedId)) || locationsDB[0];
        
        renderDashboard(info);
        renderizarNoticias();
        setupLocationLogic();
    });
</script>
</body>
</html>
