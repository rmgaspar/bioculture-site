<script src="/assets/js/jquery.min.js"></script>
<script>
    let locationsDB = [];

    // 1. Função para calcular distância (GPS)
    function calcularDistancia(lat1, lon1, lat2, lon2) {
        const R = 6371;
        const dLat = (lat2 - lat1) * Math.PI / 180;
        const dLon = (lon2 - lon1) * Math.PI / 180;
        const a = Math.sin(dLat/2) * Math.sin(dLat/2) + Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) * Math.sin(dLon/2) * Math.sin(dLon/2);
        return R * (2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a)));
    }

    // 2. Inicialização da Página
    async function inicializarPagina() {
        try {
            const r = await fetch('/data/bioregioes.json');
            locationsDB = await r.json();
            
            const urlParams = new URLSearchParams(window.location.search);
            const regionParam = urlParams.get('region');
            const savedId = localStorage.getItem('biocultura_region');
            
            let info = regionParam ? locationsDB.find(i => i.id === regionParam) : locationsDB.find(i => i.id === savedId);
            
            if (!info) info = locationsDB.find(i => i.id === "proenca-a-nova") || locationsDB[0];
            
            renderDashboard(info);
            setupSidebarLogic(); 
        } catch(e) { console.error("Erro ao carregar dados:", e); }
    }

    // 3. Renderização do Dashboard da Água
    function renderDashboard(info) {
        if(!info) return;
        document.getElementById('no-gps-warning').style.display = 'none';
        document.getElementById('water-dashboard').style.display = 'block';
        document.getElementById('reg-name').innerText = info.titulo;

        // Perfil Químico
        if (info.recursos_hidricos) {
            const ph = parseFloat(info.recursos_hidricos.ph_agua) || 7.0;
            const dur = parseFloat(info.recursos_hidricos.dureza_fr) || 10;
            
            document.getElementById('label-ph').innerText = "pH " + ph;
            document.getElementById('label-dureza').innerText = dur + " ºf";
            
            setTimeout(() => {
                document.getElementById('marker-ph').style.left = (ph / 14 * 100) + "%";
                document.getElementById('marker-dureza').style.left = (Math.min(dur / 50 * 100, 100)) + "%";
            }, 300);

            document.getElementById('water-advantages').innerText = ph < 7 
                ? "Água ligeiramente ácida: Ideal para a absorção de micronutrientes. Favorece mirtilos e batatas." 
                : "Água equilibrada: Rica em carbonatos, excelente para neutralizar solos ácidos.";
            
            const mes = new Date().getMonth();
            const temp = (info.recursos_hidricos.temp_media_agua && info.recursos_hidricos.temp_media_agua[mes]) ? info.recursos_hidricos.temp_media_agua[mes] : '--';
            document.getElementById('temp-container').innerHTML = `<div class="temp-badge">Água hoje: ${temp}ºC</div>`;
        }

        // Disponibilidade
        if (info.agua) {
            document.getElementById('reg-aquifer').innerText = "Aquífero: " + (info.agua.aquiferos || "Em levantamento.");
            document.getElementById('reg-dams').innerText = "Barragens: " + ((info.agua.barragens_proximas && Array.isArray(info.agua.barragens_proximas)) ? info.agua.barragens_proximas.join(', ') : "Nenhuma detetada.");
        }

        // Atualiza o input da sidebar
        const input = document.getElementById('loc-search-input');
        if(input) input.value = info.titulo;
    }

    // 4. Lógica da Sidebar (Procura e GPS)
    function setupSidebarLogic() {
        const input = document.getElementById('loc-search-input');
        const gpsBtn = document.getElementById('btn-gps-trigger');
        const dropdown = document.getElementById('loc-dropdown');

        if(!input) return;

        // Procura
        input.addEventListener('input', function() {
            const val = this.value.toLowerCase();
            dropdown.innerHTML = '';
            if(val.length < 2) { dropdown.style.display = 'none'; return; }
            
            const matches = locationsDB.filter(i => i.titulo.toLowerCase().includes(val)).slice(0, 6);
            if(matches.length > 0) {
                dropdown.style.display = 'block';
                matches.forEach(m => {
                    const div = document.createElement('div');
                    div.className = 'bio-res-item';
                    div.innerText = m.titulo;
                    div.onclick = () => { 
                        localStorage.setItem('biocultura_region', m.id); 
                        renderDashboard(m); // Atualiza instantâneo
                        dropdown.style.display = 'none';
                    };
                    dropdown.appendChild(div);
                });
            } else dropdown.style.display = 'none';
        });

        // GPS
        if(gpsBtn) {
            gpsBtn.onclick = () => {
                input.value = "A localizar...";
                navigator.geolocation.getCurrentPosition(pos => {
                    const uLat = pos.coords.latitude;
                    const uLon = pos.coords.longitude;
                    let closest = locationsDB[0];
                    let minD = Infinity;
                    
                    locationsDB.forEach(c => {
                        if(c.lat && c.lon) {
                            let d = calcularDistancia(uLat, uLon, c.lat, c.lon);
                            if(d < minD) { minD = d; closest = c; }
                        }
                    });
                    
                    localStorage.setItem('biocultura_region', closest.id);
                    renderDashboard(closest);
                }, () => {
                    input.value = "Erro no GPS";
                });
            };
        }
    }

    // 5. Carregar Sidebar e Lançar scripts
    fetch('/sidebar-content.html').then(r => r.text()).then(html => {
        document.getElementById('sidebar').innerHTML = html;
        inicializarPagina();
        var s = document.createElement('script'); s.src = '/assets/js/main.js'; document.body.appendChild(s);
    });
</script>
