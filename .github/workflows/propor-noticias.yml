name: Sugerir notícias para decisão editorial

on:
  # Segundas e quintas. O filtro editorial (scripts/noticias/atualizar.py) deixa passar
  # só o que tem ligação clara aos temas do observatório; nada é publicado sem decisão
  # tua na página /revisao.
  schedule:
    - cron: "17 6 * * 1,4"
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: noticias-editorial
  cancel-in-progress: false

jobs:
  propor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Procurar sugestões relevantes
        run: python3 scripts/noticias/atualizar.py
      - name: Validar dados editoriais
        run: |
          python3 -m json.tool data/noticias_propostas.json >/dev/null
          python3 -m json.tool data/noticias.json >/dev/null
      - name: Guardar propostas sem as publicar
        id: guardar
        run: |
          if git diff --quiet -- data/noticias_propostas.json; then
            echo "Não existem sugestões novas."
            echo "mudou=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "bioCultura Notícias"
          git config user.email "actions@users.noreply.github.com"
          git add data/noticias_propostas.json
          git commit -m "Notícias: propostas para revisão"
          git pull --rebase origin main
          git push origin HEAD:main
          echo "mudou=true" >> "$GITHUB_OUTPUT"
      - name: Avisar que há propostas à espera
        if: steps.guardar.outputs.mudou == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          TOTAL="$(jq length data/noticias_propostas.json)"
          [ "$TOTAL" -gt 0 ] || exit 0
          gh label create "noticias:revisao" --color "D4A373" --force
          TEXTO="Há **$TOTAL** notícias à espera de decisão.

          [Abrir a página de revisão](https://www.bioculture.pt/revisao)"
          ABERTA="$(gh issue list --label noticias:revisao --state open --json number --jq '.[0].number // empty')"
          if [ -n "$ABERTA" ]; then
            gh issue comment "$ABERTA" --body "$TEXTO"
          else
            gh issue create --title "Notícias à espera de decisão" --label noticias:revisao --body "$TEXTO"
          fi
