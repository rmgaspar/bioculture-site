name: Propor notícias para aprovação

on:
  schedule:
    - cron: "17 7,19 * * *"
      timezone: "Europe/Lisbon"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: propor-noticias
  cancel-in-progress: false

jobs:
  propor:
    runs-on: ubuntu-latest
    steps:
      - name: Obter o site
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Recuperar propostas ainda não aprovadas
        shell: bash
        run: |
          git config user.name "bioCultura Notícias"
          git config user.email "actions@users.noreply.github.com"
          git fetch origin automatizacao/noticias:refs/remotes/origin/automatizacao/noticias || true
          if git show-ref --verify --quiet refs/remotes/origin/automatizacao/noticias; then
            git checkout -B automatizacao/noticias origin/automatizacao/noticias
            git rebase origin/main
          else
            git checkout -b automatizacao/noticias
          fi

      - name: Procurar notícias relevantes
        run: |
          python3 scripts/noticias/arquivar.py
          python3 scripts/noticias/atualizar.py

      - name: Validar o JSON
        run: |
          python3 -m json.tool data/noticias.json >/dev/null
          python3 -m json.tool data/noticias_arquivo.json >/dev/null

      - name: Criar ou atualizar a proposta
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if git diff --quiet -- data/noticias.json data/noticias_arquivo.json; then
            echo "Não existem notícias novas."
            exit 0
          fi
          git config user.name "bioCultura Notícias"
          git config user.email "actions@users.noreply.github.com"
          git add data/noticias.json data/noticias_arquivo.json
          git commit -m "Propor notícias ambientais para revisão"
          git push --force-with-lease origin HEAD:automatizacao/noticias
          if [ "$(gh pr list --state open --head automatizacao/noticias --json number --jq length)" = "0" ]; then
            gh pr create \
              --base main \
              --head automatizacao/noticias \
              --title "Notícias ambientais para aprovação" \
              --body "Propostas recolhidas de fontes autorizadas. Confirme títulos, resumo, ligação original, pontuação e imagem. A publicação só acontece quando este pedido for aprovado e integrado."
          fi
