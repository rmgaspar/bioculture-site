name: Sugerir notícias para decisão editorial

on:
  schedule:
    - cron: "17 7,19 * * *"
      timezone: "Europe/Lisbon"
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: noticias-editorial
  cancel-in-progress: false

jobs:
  propor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Procurar sugestões relevantes
        run: python3 scripts/noticias/atualizar.py
      - name: Validar dados editoriais
        run: |
          python3 -m json.tool data/noticias_propostas.json >/dev/null
          python3 -m json.tool data/noticias.json >/dev/null
      - name: Guardar propostas sem as publicar
        run: |
          if git diff --quiet -- data/noticias_propostas.json; then
            echo "Não existem sugestões novas."
            exit 0
          fi
          git config user.name "bioCultura Notícias"
          git config user.email "actions@users.noreply.github.com"
          git add data/noticias_propostas.json
          git commit -m "Adicionar sugestões de notícias para revisão"
          git pull --rebase origin main
          git push origin HEAD:main
      - name: Criar uma notificação simples por notícia
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh label create "noticia:pendente" --color "D4A373" --force
          gh label create "noticia:aprovada" --color "2E6B4C" --force
          gh label create "noticia:recusada" --color "8B3A3A" --force
          jq -c '.[]' data/noticias_propostas.json | while read -r ITEM; do
            ID="$(jq -r '.id' <<<"$ITEM")"
            URL="$(jq -r '.url' <<<"$ITEM")"
            TITLE="$(jq -r '.pt.titulo' <<<"$ITEM")"
            SOURCE="$(jq -r '.fonte // "Fonte não indicada"' <<<"$ITEM")"
            CATEGORY="$(jq -r '.categoria // "Sem categoria"' <<<"$ITEM")"
            SCORE="$(jq -r '.relevancia // 0' <<<"$ITEM")"
            SUMMARY="$(jq -r '.pt.resumo_biocultura // "Sem resumo disponível."' <<<"$ITEM")"
            if [ "$(gh issue list --state all --search "$ID in:body" --json number --jq length)" = "0" ]; then
              {
                printf '## Revisão editorial\n\n'
                printf '**Fonte:** %s  \n**Categoria:** %s  \n**Pontuação:** %s/100\n\n' "$SOURCE" "$CATEGORY" "$SCORE"
                printf '%s\n\n' "$SUMMARY"
                printf '[Abrir pré-visualização bioCulture](https://www.bioculture.net/observatorio/noticia-detalhe.html?id=%s&preview=proposal)\n\n' "$ID"
                printf '[Abrir publicação original](%s)\n\n' "$URL"
                printf 'Para decidir, comenta com `/aprovar` ou `/recusar`.\n\n'
                printf '<!-- news-id: %s -->' "$ID"
              } > "$RUNNER_TEMP/news-body.md"
              gh issue create --title "$TITLE" --body-file "$RUNNER_TEMP/news-body.md" --label "noticia:pendente"
            fi
          done
