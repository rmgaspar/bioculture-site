name: Traduzir notícias publicadas

# Dá às notícias aprovadas as duas línguas (PT/EN). Corre depois da atualização semanal de dados,
# a pedido, e é chamado também por decidir-noticias.yml logo a seguir às decisões.
on:
  workflow_dispatch:
    inputs:
      sondar:
        description: "Só verificar se o serviço de tradução responde"
        type: boolean
        default: false
  schedule:
    - cron: "37 7 * * 3"

permissions:
  contents: write

concurrency:
  group: noticias-editorial
  cancel-in-progress: false

jobs:
  traduzir:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Traduzir
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python3 scripts/noticias/traduzir.py ${{ inputs.sondar && '--probe' || '' }}
      - name: Validar
        run: python3 -m json.tool data/noticias.json >/dev/null
      - name: Guardar traduções
        run: |
          if git diff --quiet; then
            echo "Nada a guardar."
            exit 0
          fi
          git config user.name "bioCultura Notícias"
          git config user.email "actions@users.noreply.github.com"
          git add data/noticias.json
          git commit -m "Notícias: traduções PT/EN"
          git pull --rebase origin main
          git push origin HEAD:main
