name: Atualizar traduções bioCultura

on:
  workflow_dispatch:
    inputs:
      max_items:
        description: Textos novos por idioma nesta execução
        required: false
        default: "1500"
  schedule:
    - cron: "23 3 * * 2"

permissions:
  contents: write
  pull-requests: write
  models: read

concurrency:
  group: traducoes-biocultura
  cancel-in-progress: false

jobs:
  traduzir:
    runs-on: ubuntu-latest
    steps:
      - name: Obter o site
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Recuperar traduções ainda em revisão
        shell: bash
        run: |
          if git ls-remote --exit-code --heads origin automatizacao/traducoes >/dev/null 2>&1; then
            git checkout -B automatizacao/traducoes origin/automatizacao/traducoes
            git merge origin/main --no-edit
          else
            git checkout -b automatizacao/traducoes
          fi

      - name: Preparar o tradutor
        run: python -m pip install --disable-pip-version-check beautifulsoup4

      - name: Traduzir apenas textos ainda em falta
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MAX_ITEMS: ${{ inputs.max_items || '1500' }}
        shell: bash
        run: |
          for lang in en es fr de; do
            python scripts/atualizar_traducoes.py --language "$lang" --max-items "$MAX_ITEMS" --batch-size 80
          done

      - name: Validar os catálogos
        shell: bash
        run: |
          python -m json.tool assets/lang/auto/en.json >/dev/null
          python -m json.tool assets/lang/auto/es.json >/dev/null
          python -m json.tool assets/lang/auto/fr.json >/dev/null
          python -m json.tool assets/lang/auto/de.json >/dev/null

      - name: Criar ou atualizar proposta
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          if git diff --quiet; then
            echo "Não existem novos textos para traduzir."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/lang/auto
          git commit -m "Atualizar traduções multilingues"
          git push --force-with-lease origin automatizacao/traducoes
          if ! gh pr view automatizacao/traducoes >/dev/null 2>&1; then
            gh pr create \
              --base main \
              --head automatizacao/traducoes \
              --title "Traduções bioCultura para revisão" \
              --body "Traduções incrementais para inglês, espanhol, francês e alemão. Reveja a proposta antes de integrar; nada é publicado automaticamente."
          fi
