name: Atualizar dados do observatório

# Mantém atualizados os dados mundiais (água, solo, biodiversidade, ar, energia, renováveis e
# território) a partir das APIs oficiais do Banco Mundial e dos Indicadores ODS da ONU.
# Só publica se os dados passarem na validação e o site compilar; se nada mudou, não faz nada.
# O Cloudflare Pages publica automaticamente cada commit em main.
on:
  schedule:
    - cron: "43 5 * * 3"   # quartas-feiras, 05:43 UTC
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: dados-observatorio
  cancel-in-progress: false

jobs:
  atualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Ir buscar os dados às fontes oficiais
        id: fontes
        run: |
          status=0
          python3 scripts/dados/banco_mundial.py || status=1
          python3 scripts/dados/ods_onu.py || status=1
          # Clima de Portugal continental: acrescenta o ano novo quando o IPMA publica o boletim anual.
          python3 scripts/dados/ipma_clima.py || status=1
          # Emissões de gases com efeito de estufa e erosão costeira (fichas do REA da APA).
          python3 scripts/dados/apa_rea.py || status=1
          # Séries por país do relatório «Observatório da Terra» (lê os ficheiros acabados de atualizar).
          python3 scripts/dados/relatorio_terra.py || status=1
          # Séries da página «A teia»: temperatura de Portugal, aves, pesticidas (as espécies não nativas só se atualizam à mão).
          python3 scripts/dados/bioweb.py || status=1
          # Retira das listagens as notícias com prazo terminado (histórico preservado no arquivo).
          python3 scripts/noticias/arquivar.py || status=1
          echo "falhas=$status" >> "$GITHUB_OUTPUT"

      - name: Validar dados
        run: |
          python3 scripts/dados/validar.py
          for f in data/*.json; do python3 -m json.tool "$f" >/dev/null; done

      - name: Confirmar que o site compila e os testes passam
        run: |
          CF_PAGES=1 node scripts/build-pages.mjs
          for f in scripts/tests/*.test.mjs; do node --test "$f"; done

      - name: Guardar atualização
        run: |
          if git diff --quiet -- data; then
            echo "Os dados já estavam atualizados."
            exit 0
          fi
          git config user.name "bioCultura Dados"
          git config user.email "actions@users.noreply.github.com"
          git add data
          git commit -m "Dados do observatório: atualização automática ($(date -u +%F))"
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Vigiar edições novas de fontes portuguesas (sem API)
        id: vigia
        continue-on-error: true
        env:
          VIGIA_SAIDA: ${{ runner.temp }}/vigia.json
        run: python3 scripts/dados/vigia_fontes.py

      - name: Avisar quando sai uma edição nova que exige revisão manual
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          VIGIA: ${{ runner.temp }}/vigia.json
          AVISO: ${{ runner.temp }}/aviso.md
        run: |
          [ -s "$VIGIA" ] || exit 0
          [ "$(jq length "$VIGIA")" != "0" ] || exit 0
          gh label create "dados:atualizar" --color "D4A373" --force
          jq -c '.[]' "$VIGIA" | while read -r ALERTA; do
            ID="$(jq -r '.id | gsub("@"; "-")' <<<"$ALERTA")"
            FONTE="$(jq -r '.fonte' <<<"$ALERTA")"
            EDICAO="$(jq -r '.edicao' <<<"$ALERTA")"
            if [ "$(gh issue list --state all --search "vigia-$ID in:body" --json number --jq length)" != "0" ]; then
              continue
            fi
            {
              echo "A fonte **$FONTE** publicou a edição **$EDICAO**."
              echo
              echo "Ligação: $(jq -r '.url' <<<"$ALERTA")"
              echo
              echo "Ficheiros a rever: $(jq -r '.ficheiros | join(", ")' <<<"$ALERTA")"
              echo
              echo "O que rever: $(jq -r '.o_que_rever' <<<"$ALERTA")"
              echo
              echo "Valores lidos agora na ficha de qualidade do ar: $(jq -c '.valores_lidos' <<<"$ALERTA")"
              echo
              echo "Depois de atualizar os dados, subir «conhecida» em config/vigia_fontes.json para $EDICAO."
              echo
              echo "<!-- vigia-$ID -->"
            } > "$AVISO"
            gh issue create --label dados:atualizar \
              --title "Nova edição: $FONTE $EDICAO — rever os dados portugueses" \
              --body-file "$AVISO"
          done

      - name: Falhar se alguma fonte não respondeu
        if: steps.fontes.outputs.falhas != '0'
        run: |
          echo "::error::Pelo menos uma fonte falhou; os restantes dados foram guardados."
          exit 1

  avisar:
    needs: atualizar
    if: failure()
    runs-on: ubuntu-latest
    steps:
      - name: Abrir (ou atualizar) a notificação de falha
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh label create "dados:falha" --color "8B3A3A" --force --repo "$GITHUB_REPOSITORY"
          URL="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          EXISTENTE="$(gh issue list --repo "$GITHUB_REPOSITORY" --label dados:falha --state open --json number --jq '.[0].number // empty')"
          if [ -n "$EXISTENTE" ]; then
            gh issue comment "$EXISTENTE" --repo "$GITHUB_REPOSITORY" --body "Nova falha na atualização de dados: $URL"
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --label dados:falha \
              --title "Falha na atualização automática dos dados" \
              --body "A atualização automática dos dados do observatório falhou. Os dados publicados não foram alterados por esta execução (ou só parcialmente). Detalhes: $URL"
          fi
