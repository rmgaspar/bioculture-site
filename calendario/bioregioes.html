                                <div class="filter-nav" id="filter-nav">
                                    <button class="filter-btn active" onclick="filterBy('All')">Todos</button>
                                    <button class="filter-btn" onclick="filterBy('Plantae')">Plantas</button>

                                </div>
                            </div>

                            </div>
