<!DOCTYPE HTML>
<html>
	<head>
		<title>bioCultura - Calendário de Regeneração</title>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale, user-scalable=no" />
		<link rel="stylesheet" href="/assets/css/main.css" />
		<style>
            /* --- ESTRUTURA GLOBAL --- */
            body, input, select, textarea { font-family: 'Source Sans Pro', sans-serif !important; color: #444; }
			section, #header, hr, .major { border: none !important; box-shadow: none !important; padding: 0 !important; }
            section { min-height: 100vh; display: flex; flex-direction: column; }
            #sidebar { position: fixed !important; top: 0; left: 0; height: 100vh !important; width: 18em !important; overflow: hidden !important; z-index: 10000; background: #fff; border-right: 1px solid #f2f2f2 !important; }
            #wrapper { padding-left: 18em !important; }
            .inner { padding: 2.2em 4em 0 4em !important; max-width: 1600px !important; margin: 0 auto; width: 100%; }
            .category-label { font-size: 0.65em; font-weight: 900; text-transform: uppercase; letter-spacing: 4px; color: #bbb; margin-bottom: 15px; display: block; }

            /* HERO & GLOBO (CALENDÁRIO HORIZONTAL) */
            .hero-split { display: flex; align-items: flex-start; justify-content: space-between; gap: 4em; margin-bottom: 2em; }
            .hero-text { flex: 1.5; text-align: left; } 
            .hero-text h1 { font-size: 4em; font-weight: 900; color: #1a1a1a; letter-spacing: -2.5px; line-height: 0.95; margin: 0 0 20px 0; }
            .hero-globe { 
                position: relative; width: 480px; height: 480px; border-radius: 50%; overflow: hidden; 
                box-shadow: 0 40px 100px rgba(0,0,0,0.05); background: #fdfdfd; border: 1px solid #f2f2f2;
                display: flex; flex-direction: column; align-items: center; justify-content: space-between; padding: 60px 0;
            }
            .week-stack { width: 100%; display: flex; flex-direction: column; gap: 12px; margin-top: 10px; }
            .week-row { display: grid; grid-template-columns: repeat(7, 1fr); text-align: center; width: 100%; }
            .day-node { font-size: 0.85em; font-weight: 600; color: #ddd; display: flex; align-items: center; justify-content: center; height: 35px; }
            .day-node.current-week { color: #888; }
            .day-node.active { color: #2e7d32; font-weight: 900; transform: scale(1.2); }
            .day-node svg { width: 18px; height: 18px; display: block; }
            
            .globe-south { width: 60%; padding-top: 25px; border-top: 1px solid #f2f2f2; display: flex; align-items: center; justify-content: center; gap: 40px; }
            .meteo-icon-big { font-size: 2.8em; color: #fbc02d; }
            .moon-svg-big { width: 40px; height: 40px; }

            /* ORIENTAÇÃO REGIONAL */
            .advice-block { margin-top: 20px; padding: 35px; background: #fdfdfd; border-radius: 25px; border: 1px solid #f2f2f2; border-left: 5px solid #2e7d32; min-height: 180px; }
            .advice-block h5 { font-size: 0.8em; font-weight: 900; text-transform: uppercase; color: #2e7d32; margin-bottom: 15px; }
            .advice-content { font-size: 1.15em; line-height: 1.8; color: #555; text-align: justify; }

            /* SANIDADE VEGETAL */
            .sanidade-section { margin-top: 40px; }
            .disease-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 25px; margin-bottom: 10px; }
            .disease-card { background: #fff; border: 1px solid #f2f2f2; border-radius: 15px; overflow: hidden; transition: all 0.3s ease; text-decoration: none !important; display: block; }
            .disease-card:hover { transform: translateY(-5px); box-shadow: 0 10px 25px rgba(0,0,0,0.05); border-color: #2e7d32; }
            .disease-img { width: 100%; height: 180px; object-fit: cover; }
            .disease-body { padding: 20px; }
            .disease-body b { color: #c62828; font-style: italic; font-size: 0.95em; display: block; margin-bottom: 5px; line-height: 1.3; }
            .disease-body p { font-size: 0.85em; color: #777; line-height: 1.4; margin: 0; height: 2.8em; overflow: hidden; }

            /* BOTÕES TOGGLE LIMPOS */
            .toggle-container { text-align: left; margin: 0 0 40px 0; }
            .btn-toggle { background: none !important; border: none !important; color: #bbb !important; padding: 0 !important; cursor: pointer; font-size: 2.5em; font-weight: 300; line-height: 1; outline: none; }
            .btn-toggle:hover { color: #2e7d32 !important; }
            .hidden-item { display: none; }

            /* SÍNTESE */
            .report-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 50px; margin-top: 20px; }
            .report-item h5 { font-size: 0.7em; font-weight: 900; text-transform: uppercase; color: #2e7d32; margin-bottom: 10px; }
            .report-source { font-size: 0.65em; font-weight: 700; color: #bbb; text-transform: uppercase; }
		</style>
	</head>
	<body class="is-preload">
		<div id="wrapper">
			<div id="main">
                <div class="inner">
                    <section>
                        <!-- 1. HERO & CALENDÁRIO -->
                        <div class="hero-split">
                            <div class="hero-text">
                                <span class="category-label">Agricultura bioCultura</span>
                                <h1>Calendário de Regeneração</h1>
                                <div class="advice-block">
                                    <h5>Orientação Semanal: <span id="reg-name">Funchal</span></h5>
                                    <div id="advice-content" class="advice-content"></div>
                                </div>
                            </div>
                            <div class="hero-visual">
                                <div class="hero-globe">
                                    <div class="month-year-label">Julho 2026</div>
                                    <div class="week-stack" id="week-stack"></div>
                                    <div class="globe-south">
                                        <div class="south-part"><i class="fas fa-sun meteo-icon-big"></i></div>
                                        <div class="v-sep"></div>
                                        <div class="south-part" id="lunar-icon-container"></div>
                                    </div>
                                </div>
                            </div>
                        </div>

                        <!-- 2. SANIDADE VEGETAL (22 ITENS) -->
                        <div class="sanidade-section">
                            <h4>Sanidade Vegetal: Diagnóstico Bio</h4>
                            <h5>Combater as pragas da sua horta</h5>
                            <div class="disease-grid" id="grid-pragas"></div>
                            <div class="toggle-container"><button class="btn-toggle" id="btn-pragas" onclick="toggleGrid('pragas')">+</button></div>

                            <h5>Combater as plantas invasoras</h5>
                            <div class="disease-grid" id="grid-invasoras"></div>
                            <div class="toggle-container"><button class="btn-toggle" id="btn-invasoras" onclick="toggleGrid('invasoras')">+</button></div>
                        </div>

                        <!-- 3. SÍNTESE -->
                        <div class="data-row" style="margin-top: 4em;">
                            <span class="category-label">Síntese e Avisos Agrícolas 2026</span>
                            <h2 style="font-weight: 300; font-size: 2.5em; margin-bottom: 30px;">Inteligência Fitossanitária Nacional</h2>
                            <div id="report-grid-agri" class="report-grid"></div>
                        </div>
					</section>
				</div>
            </div>
			<div id="sidebar"></div>
		</div>

		<script src="/assets/js/jquery.min.js"></script>
        <script>
            let infoGlobal = { titulo: "Funchal" };

            // DADOS COMPLETOS
            const pragasData = [
                { id: "PRG-001", nome: "Cydia pomonella", comum: "Bichado", img: "https://fitosistema.com/wp-content/uploads/2022/09/ctt_8x8.png", desc: "Aplicação de bioinseticidas virais ou nemátodos no tronco." },
                { id: "PRG-002", nome: "Thaumetopoea pityocampa", comum: "Processionária", img: "https://florestas.pt/wp-content/uploads/2020/05/processionaria.jpg", desc: "Uso de Bacillus thuringiensis e armadilhas de cinta." },
                { id: "PRG-003", nome: "Panonychus ulmi", comum: "Aranhiço Vermelho", img: "https://www.koppert.pt/content/_processed_/csm_aranhico_vermelho_teaser.png", desc: "Largada inundativa de ácaros predadores (Spidex)." },
                { id: "PRG-004", nome: "Trialeurodes vaporariorum", comum: "Mosca Branca", img: "https://www.pulverocha.pt/pt/pragas-comuns", desc: "Parasitismo por Encarsia formosa e placas amarelas." },
                { id: "DNC-001", nome: "Venturia inaequalis", comum: "Pedrado", img: "https://www.syngenta.pt/sites/g/files/zhg216/f/styles/syngenta_large/public/media/image/2021/04/pedrado.jpg", desc: "Bicarbonato de Potássio e Bacillus subtilis." },
                { id: "PRG-005", nome: "Cacopsylla pyri", comum: "Psila da Pereira", img: "https://www.koppert.pt/content/_processed_/csm_psila_teaser.png", desc: "Uso de percevejos predadores Anthocoris nemoralis." },
                { id: "PRG-006", nome: "Tomicus piniperda", comum: "Escolitídeo", img: "https://florestas.pt/wp-content/uploads/2020/05/escolitideo.jpg", desc: "Armadilhas de cairomonas e remoção de madeira." },
                { id: "DNC-002", nome: "Bursaphelenchus xylophilus", comum: "Nematodo", img: "https://florestas.pt/wp-content/uploads/2020/05/nematodo.jpg", desc: "Interrupção do ciclo do inseto vetor Monochamus." }
            ];

            const invasorasData = [
                { id: "INV-001", nome: "Acacia dealbata", comum: "Mimosa", img: "https://invasoras.pt/sites/default/files/styles/especie_detalhe/public/acacia_dealbata_0.jpg", desc: "Inseto galhador Eurytoma acaciae." },
                { id: "INV-002", nome: "Acacia longifolia", comum: "Acácia-de-espigas", img: "https://invasoras.pt/sites/default/files/styles/especie_detalhe/public/acacia_longifolia_1.jpg", desc: "Vespa Trichilogaster acaciaelongifoliae." },
                { id: "INV-003", nome: "Acacia saligna", comum: "Acácia-folha-estreita", img: "https://invasoras.pt/sites/default/files/styles/especie_detalhe/public/acacia_saligna_0.jpg", desc: "Fungo Uromycladium tepperianum." },
                { id: "INV-004", nome: "Eichhornia crassipes", comum: "Jacinto-de-água", img: "https://invasoras.pt/sites/default/files/styles/especie_detalhe/public/eichhornia_crassipes_2.jpg", desc: "Herbivoria por Megamelus scutellaris." },
                { id: "INV-005", nome: "Azolla filiculoides", comum: "Pinheirinha", img: "https://invasoras.pt/sites/default/files/styles/especie_detalhe/public/azolla_filiculoides_0.jpg", desc: "Escaravelho Stenopelmus rufinasus." },
                { id: "INV-006", nome: "Ailanthus altissima", comum: "Ailanto", img: "https://invasoras.pt/sites/default/files/styles/especie_detalhe/public/ailanthus_altissima_0.jpg", desc: "Fungo Verticillium nonalfalfae." },
                { id: "INV-007", nome: "Hakea sericea", comum: "Haquea-picante", img: "https://invasoras.pt/sites/default/files/styles/especie_detalhe/public/hakea_sericea_0.jpg", desc: "Traça Carposina autologa." },
                { id: "INV-008", nome: "Baccharis halimifolia", comum: "Baccharis", img: "https://invasoras.pt/sites/default/files/styles/especie_detalhe/public/baccharis_halimifolia_0.jpg", desc: "Besouro Trirhabda bacharidis." },
                { id: "INV-009", nome: "Cortaderia selloana", comum: "Erva-das-pampas", img: "https://invasoras.pt/sites/default/files/styles/especie_detalhe/public/cortaderia_selloana_0.jpg", desc: "Ensombramento por nativas clímax." },
                { id: "INV-010", nome: "Oxalis pes-caprae", comum: "Azedas", img: "https://invasoras.pt/sites/default/files/styles/especie_detalhe/public/oxalis_pes_caprae_0.jpg", desc: "Pastoreio intensivo com ovinos." },
                { id: "INV-011", nome: "Carpobrotus edulis", comum: "Chora-das-praias", img: "https://invasoras.pt/sites/default/files/styles/especie_detalhe/public/carpobrotus_edulis_0.jpg", desc: "Cochonilha Pulvinariella mesembryanthemi." },
                { id: "INV-012", nome: "Robinia pseudoacacia", comum: "Acácia-bastarda", img: "https://invasoras.pt/sites/default/files/styles/especie_detalhe/public/robinia_pseudoacacia_0.jpg", desc: "Mosca Obolodiplosis robiniae." },
                { id: "INV-013", nome: "Phytolacca americana", comum: "Tintureira", img: "https://invasoras.pt/sites/default/files/styles/especie_detalhe/public/phytolacca_americana_0.jpg", desc: "Arranque manual e mulching denso." },
                { id: "INV-014", nome: "Elodea canadensis", comum: "Elódea", img: "https://invasoras.pt/sites/default/files/styles/especie_detalhe/public/elodea_canadensis_0.jpg", desc: "Carpa capim em sistemas fechados." }
            ];

            function renderSanidade(data, containerId, limit = 4) {
                const container = document.getElementById(containerId);
                container.innerHTML = data.map((item, index) => `
                    <a href="sanidade-detalhe.html?id=${item.id}" class="disease-card ${index >= limit ? 'hidden-item' : ''}">
                        <img src="${item.img}" class="disease-img" onerror="this.src='/assets/img/placeholder.jpg'">
                        <div class="disease-body"><b>${item.nome} (${item.comum})</b><p>${item.desc}</p></div>
                    </a>`).join('');
            }

            function toggleGrid(type) {
                const gridId = type === 'pragas' ? '#grid-pragas' : '#grid-invasoras';
                const btnId = type === 'pragas' ? '#btn-pragas' : '#btn-invasoras';
                const hiddenItems = $(gridId).find('.hidden-item');
                if (hiddenItems.length > 0) { hiddenItems.removeClass('hidden-item'); $(btnId).text('-'); }
                else { $(gridId).find('a').slice(4).addClass('hidden-item'); $(btnId).text('+'); }
            }

            // CALENDÁRIO (RESTAURADO)
            const moonSVGs = {
                ming: '<svg viewBox="0 0 24 24"><path fill="#bdbdbd" d="M12,2A10,10 0 0,0 12,22A10,10 0 0,0 12,2M12,4A8,8 0 0,1 12,20V4Z"/></svg>',
                new: '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10" stroke="#9e9e9e" stroke-width="2" fill="none"/></svg>',
                cres: '<svg viewBox="0 0 24 24"><path fill="#616161" d="M12,2V20A8,8 0 0,0 12,4M12,22A10,10 0 0,1 12,2A10,10 0 0,1 12,22Z"/></svg>',
                full: '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10" fill="#f9a825"/></svg>'
            };
            const lunarPhases = { 7: moonSVGs.ming, 14: moonSVGs.new, 21: moonSVGs.cres, 29: moonSVGs.full };

            function renderGlobe() {
                const stack = document.getElementById('week-stack');
                stack.innerHTML = '';
                let today = new Date();
                let monday = new Date(today); monday.setDate(today.getDate() - today.getDay() + (today.getDay() === 0 ? -6 : 1));
                [-1, 0, 1].forEach(w => {
                    let row = document.createElement('div'); row.className = 'week-row';
                    for(let j=0; j<7; j++) {
                        let cur = new Date(monday); cur.setDate(monday.getDate() + (w*7) + j);
                        let moon = (cur.getMonth() === 6 && lunarPhases[cur.getDate()]) ? lunarPhases[cur.getDate()] : cur.getDate();
                        row.innerHTML += `<div class="day-node ${w===0?'current-week':''} ${today.toDateString()===cur.toDateString()?'active':''}">${moon}</div>`;
                    }
                    stack.appendChild(row);
                });
            }

            async function inicializar() {
                renderGlobe();
                renderSanidade(pragasData, 'grid-pragas', 4);
                renderSanidade(invasorasData, 'grid-invasoras', 4);
                
                const reports = [
                    { t: "AVISOS DRAP 2026", s: "FONTE: DRAP NORTE/ALGARVE", p: "Alertas para pressão do Oídio na vinha devido às noites quentes." },
                    { t: "INOVAÇÃO BIOLÓGICA", s: "FONTE: BASF / PLANTIX", p: "Diagnóstico por imagem identifica carências de Magnésio precocemente." },
                    { t: "SANIDADE VEGETAL", s: "FONTE: INIAV.PT", p: "Contenção da Trioza erytreae. Barreira biológica com sebes nativas." },
                    { t: "RESILIÊNCIA HÍDRICA", s: "FONTE: AGROPORTAL.PT", p: "Gestão da água via retenção no solo com biochar e mulching." }
                ];
                document.getElementById('report-grid-agri').innerHTML = reports.map(r => `<div class="report-item"><h5>${r.t}</h5><p>${r.p}</p><span class="report-source">${r.s}</span></div>`).join('');
                
                document.getElementById('advice-content').innerHTML = "<p><b>Manutenção em Funchal:</b> Foco na rega gota-a-gota e monda manual.</p><p><b>Tendência:</b> Céu limpo exige proteção solar das culturas.</p>";
                fetch('/sidebar-content.html').then(r => r.text()).then(html => { document.getElementById('sidebar').innerHTML = html; });
            }
            inicializar();
        </script>
	</body>
</html>
