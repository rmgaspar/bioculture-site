<!DOCTYPE HTML>
<html>
	<head>
		<title>bioCultura - Calendário de Regeneração</title>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale, user-scalable=no" />
		<link rel="stylesheet" href="/assets/css/main.css" />
		<style>
            /* --- ESTRUTURA GLOBAL --- */
            body, input, select, textarea { font-family: 'Source Sans Pro', sans-serif !important; color: #444; }
			section, #header, hr, .major { border: none !important; box-shadow: none !important; padding: 0 !important; }
            section { min-height: 100vh; display: flex; flex-direction: column; }

            #sidebar { position: fixed !important; top: 0; left: 0; height: 100vh !important; width: 18em !important; overflow: hidden !important; z-index: 10000; background: #fff; border-right: 1px solid #f2f2f2 !important; }
            #wrapper { padding-left: 18em !important; }

            .inner { padding: 2.2em 4em 0 4em !important; max-width: 1600px !important; margin: 0 auto; width: 100%; }
            .category-label { font-size: 0.65em; font-weight: 900; text-transform: uppercase; letter-spacing: 4px; color: #bbb; margin-bottom: 15px; display: block; }

            /* HERO SPLIT */
            .hero-split { display: flex; align-items: flex-start; justify-content: space-between; gap: 4em; margin-bottom: 2em; }
            .hero-text { flex: 1.5; text-align: left; padding-top: 5px; } 
            .hero-text h1 { font-size: 4em; font-weight: 900; color: #1a1a1a; letter-spacing: -2.5px; line-height: 0.95; margin: 0 0 20px 0; }
            
            /* GLOBO DE TEMPO */
            .hero-visual { flex: 1; display: flex; justify-content: flex-end; }
            .hero-globe { 
                position: relative; width: 480px; height: 480px; 
                border-radius: 50%; overflow: hidden; 
                box-shadow: 0 40px 100px rgba(0,0,0,0.05); 
                background: #fdfdfd; border: 1px solid #f2f2f2;
                display: flex; flex-direction: column; align-items: center; justify-content: space-between; padding: 60px 0;
            }

            .month-year-label { font-size: 0.8em; font-weight: 900; text-transform: uppercase; color: #bbb; letter-spacing: 3px; }
            .week-stack { width: 100%; display: flex; flex-direction: column; gap: 12px; margin-top: 10px; }
            .week-row { display: grid; grid-template-columns: repeat(7, 1fr); text-align: center; width: 100%; }
            .day-node { font-size: 0.85em; font-weight: 600; color: #ddd; display: flex; align-items: center; justify-content: center; height: 35px; }
            .day-node.current-week { color: #888; }
            .day-node.active { color: #2e7d32; font-weight: 900; transform: scale(1.2); }
            .day-node svg { width: 18px; height: 18px; display: block; }

            .globe-south { width: 60%; padding-top: 25px; border-top: 1px solid #f2f2f2; display: flex; align-items: center; justify-content: center; gap: 40px; }
            .meteo-icon-big { font-size: 2.8em; color: #fbc02d; }
            .moon-svg-big { width: 40px; height: 40px; }

            /* ORIENTAÇÃO REGIONAL */
            .advice-block { margin-top: 20px; padding: 35px; background: #fdfdfd; border-radius: 25px; border: 1px solid #f2f2f2; border-left: 5px solid #2e7d32; }
            .advice-block h5 { font-size: 0.8em; font-weight: 900; text-transform: uppercase; color: #2e7d32; margin-bottom: 15px; }
            .advice-content { font-size: 1.15em; line-height: 1.8; color: #555; text-align: justify; }

            /* SANIDADE VEGETAL - GRID QUADRADO */
            .sanidade-section { margin-top: 40px; }
            .sanidade-section h5 { font-size: 1.2em; color: #888; margin-bottom: 20px; font-weight: 300; }
            
            .disease-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 25px; margin-bottom: 10px; }
            .disease-card { background: #fff; border: 1px solid #f2f2f2; border-radius: 15px; overflow: hidden; transition: all 0.3s ease; text-decoration: none !important; display: block; }
            .disease-card:hover { transform: translateY(-5px); box-shadow: 0 10px 25px rgba(0,0,0,0.05); border-color: #2e7d32; }
            .disease-img { width: 100%; height: 180px; object-fit: cover; }
            .disease-body { padding: 20px; }
            .disease-body b { color: #c62828; font-style: italic; font-size: 0.95em; display: block; margin-bottom: 5px; line-height: 1.3; }
            .disease-body p { font-size: 0.85em; color: #777; line-height: 1.4; margin: 0; height: 2.8em; overflow: hidden; }

            /* BOTÕES TOGGLE CINZENTOS SIMPLES */
            .toggle-container { text-align: left; margin: 5px 0 40px 0; }
            .btn-toggle { background: transparent; border: none; color: #bbb; padding: 0; cursor: pointer; font-size: 2.2em; font-weight: 300; line-height: 1; transition: color 0.2s; }
            .btn-toggle:hover { color: #2e7d32; }
            .hidden-item { display: none; }

            /* SÍNTESE */
            .report-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 50px; margin-top: 20px; }
            .report-item { padding-bottom: 20px; }
            .report-item h5 { font-size: 0.7em; font-weight: 900; text-transform: uppercase; color: #2e7d32; margin-bottom: 15px; letter-spacing: 1px; }
            .report-item p { font-size: 1em; line-height: 1.7; color: #555; margin-bottom: 10px; text-align: justify; }
            .report-source { font-size: 0.65em; font-weight: 700; color: #bbb; text-transform: uppercase; }

            .page-footer { margin-top: auto; padding: 2em 0 2.5em 0; border-top: 1px solid #f2f2f2; opacity: 0.3; text-align: right; }
		</style>
	</head>
	<body class="is-preload">
		<div id="wrapper">
			<div id="main">
                <div class="inner">
                    <section>
                        <!-- 1. HERO & CALENDÁRIO -->
                        <div class="hero-split">
                            <div class="hero-text">
                                <span class="category-label">Agricultura bioCultura</span>
                                <h1>Calendário de Regeneração</h1>
                                <div class="advice-block">
                                    <h5>Orientação Semanal: <span id="reg-name">...</span></h5>
                                    <div id="advice-content" class="advice-content"></div>
                                </div>
                            </div>
                            <div class="hero-visual">
                                <div class="hero-globe">
                                    <div class="month-year-label">Julho 2026</div>
                                    <div class="week-stack" id="week-stack"></div>
                                    <div class="globe-south">
                                        <div class="south-part"><i class="fas fa-sun meteo-icon-big"></i></div>
                                        <div class="v-sep"></div>
                                        <div class="south-part" id="lunar-icon-container"></div>
                                    </div>
                                </div>
                            </div>
                        </div>

                        <!-- 2. SANIDADE VEGETAL -->
                        <div class="sanidade-section">
                            <h4>Sanidade Vegetal: Diagnóstico Bio</h4>
                            
                            <h5>Combater as pragas da sua horta</h5>
                            <div class="disease-grid" id="grid-pragas"></div>
                            <div class="toggle-container"><button class="btn-toggle" id="btn-pragas" onclick="toggleGrid('pragas')">+</button></div>

                            <h5>Combater as plantas invasoras</h5>
                            <div class="disease-grid" id="grid-invasoras"></div>
                            <div class="toggle-container"><button class="btn-toggle" id="btn-invasoras" onclick="toggleGrid('invasoras')">+</button></div>
                        </div>

                        <!-- 3. SÍNTESE AUTORIDADES -->
                        <div class="data-row" style="border-bottom: none; margin-top: 4em;">
                            <span class="category-label">Síntese e Avisos Agrícolas 2026</span>
                            <h2 style="font-weight: 300; font-size: 2.5em; margin: 0 0 30px 0;">Inteligência Fitossanitária Nacional</h2>
                            <div id="report-grid-agri" class="report-grid"></div>
                        </div>

                        <footer class="page-footer">
                            <span style="display: block; font-size: 0.85em; font-weight: 900; color: #333;">bioCultura</span>
                            <span style="display: block; font-size: 0.5em; font-weight: 700; text-transform: uppercase;">Global Regeneration</span>
                        </footer>
					</section>
				</div>
            </div>
			<div id="sidebar"></div>
		</div>

		<script src="/assets/js/jquery.min.js"></script>
        <script>
            let locationsDB = [];
            let infoGlobal = null;

            // Dados Sanidade (Dinamismo JSON)
            const pragasData = [
                { id: "PRG-001", nome: "Cydia pomonella", comum: "Bichado", img: "https://fitosistema.com/wp-content/uploads/2022/09/ctt_8x8.png", desc: "Lepidóptero que ataca pomóideas, causando queda prematura." },
                { id: "PRG-002", nome: "Panonychus ulmi", comum: "Aranhiço Vermelho", img: "https://www.koppert.pt/content/_processed_/csm_aranhico_vermelho_teaser.png", desc: "Ácaro que causa descoloração foliar e perda de vigor." },
                { id: "PRG-003", nome: "Dysaphis plantaginea", comum: "Piolho Cinzento", img: "https://www.syngenta.pt/sites/g/files/zhg216/f/styles/syngenta_large/public/media/image/2021/04/afideo.jpg", desc: "Afídeo que deforma rebentos e folhas em macieiras." },
                { id: "PRG-004", nome: "Cacopsylla pyri", comum: "Psila da Pereira", img: "https://www.koppert.pt/content/_processed_/csm_psila_teaser.png", desc: "Inseto que produz melada e favorece a fumagina." },
                { id: "PRG-005", nome: "Ceratitis capitata", comum: "Mosca do Mediterrâneo", img: "https://www.koppert.pt/content/_processed_/csm_ceratitis_capitata_teaser.png", desc: "Ataca frutos na fase de maturação." }
            ];

            const invasorasData = [
                { id: "INV-001", nome: "Acacia dealbata", comum: "Mimosa", img: "https://invasoras.pt/sites/default/files/styles/especie_detalhe/public/acacia_dealbata_0.jpg", desc: "Invasora agressiva que altera a química do solo." },
                { id: "INV-002", nome: "Acacia longifolia", comum: "Acácia-de-espigas", img: "https://invasoras.pt/sites/default/files/styles/especie_detalhe/public/acacia_longifolia_1.jpg", desc: "Coloniza dunas e áreas florestais." },
                { id: "INV-003", nome: "Eichhornia crassipes", comum: "Jacinto-de-água", img: "https://invasoras.pt/sites/default/files/styles/especie_detalhe/public/eichhornia_crassipes_2.jpg", desc: "Planta aquática que asfixia ecossistemas." },
                { id: "INV-004", nome: "Cortaderia selloana", comum: "Erva-das-pampas", img: "https://invasoras.pt/sites/default/files/styles/especie_detalhe/public/cortaderia_selloana_0.jpg", desc: "Dispersa-se facilmente pelo vento." }
            ];

            const agriReports = [
                { titulo: "AVISOS DRAP 2026", fonte: "FONTE: DRAP NORTE/ALGARVE", texto: "As Direções Regionais alertam para a pressão do Oídio na vinha devido às noites quentes. Recomenda-se o enrelvamento das entrelinhas." },
                { titulo: "INOVAÇÃO BIOLÓGICA", fonte: "FONTE: BASF / PLANTIX", texto: "Novas ferramentas de diagnóstico identificam carências de Magnésio. O uso de feromonas reduziu em 60% os tratamentos." },
                { titulo: "SANIDADE VEGETAL", fonte: "FONTE: INIAV.PT", texto: "Foco na contenção da Trioza erytreae. A bioCultura recomenda sebes vivas nativas como barreira biológica." },
                { titulo: "RESILIÊNCIA HÍDRICA", fonte: "FONTE: AGROPORTAL.PT", texto: "A gestão da água em 2026 passa pela retenção no solo. O uso de biochar e mulching denso é obrigatório." }
            ];

            // Renderização das Grids
            function renderSanidade(data, containerId, limit = 4) {
                const container = document.getElementById(containerId);
                container.innerHTML = data.map((item, index) => `
                    <a href="sanidade-detalhe.html?id=${item.id}" class="disease-card ${index >= limit ? 'hidden-item' : ''}">
                        <img src="${item.img}" class="disease-img">
                        <div class="disease-body">
                            <b>${item.nome} <span>(${item.comum})</span></b>
                            <p>${item.desc}</p>
                        </div>
                    </a>`).join('');
            }

            function toggleGrid(type) {
                const gridId = type === 'pragas' ? '#grid-pragas' : '#grid-invasoras';
                const btnId = type === 'pragas' ? '#btn-pragas' : '#btn-invasoras';
                const hiddenItems = $(gridId).find('.hidden-item');

                if (hiddenItems.length > 0) {
                    hiddenItems.removeClass('hidden-item');
                    $(btnId).text('-');
                } else {
                    $(gridId).find('a').slice(4).addClass('hidden-item');
                    $(btnId).text('+');
                }
            }

            // Lógica Calendário e Orientação
            const moonSVGs = {
                ming: '<svg viewBox="0 0 24 24"><path fill="#bdbdbd" d="M12,2A10,10 0 0,0 12,22A10,10 0 0,0 12,2M12,4A8,8 0 0,1 12,20V4Z"/></svg>',
                new: '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10" stroke="#9e9e9e" stroke-width="2" fill="none"/></svg>',
                cres: '<svg viewBox="0 0 24 24"><path fill="#616161" d="M12,2V20A8,8 0 0,0 12,4M12,22A10,10 0 0,1 12,2A10,10 0 0,1 12,22Z"/></svg>',
                full: '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10" fill="#f9a825"/></svg>'
            };
            const lunarPhases = { 7: {svg: moonSVGs.ming, label: 'Minguante'}, 14: {svg: moonSVGs.new, label: 'Nova'}, 21: {svg: moonSVGs.cres, label: 'Crescente'}, 29: {svg: moonSVGs.full, label: 'Cheia'} };

            function renderGlobeCalendar() {
                const stack = document.getElementById('week-stack');
                stack.innerHTML = '';
                let today = new Date();
                let monday = new Date(today);
                monday.setDate(today.getDate() - today.getDay() + (today.getDay() === 0 ? -6 : 1));

                [-1, 0, 1].forEach(weekIdx => {
                    let row = document.createElement('div');
                    row.className = 'week-row';
                    for(let j=0; j<7; j++) {
                        let cur = new Date(monday); cur.setDate(monday.getDate() + (weekIdx * 7) + j);
                        let isToday = today.toDateString() === cur.toDateString();
                        let moon = (cur.getMonth() === 6 && lunarPhases[cur.getDate()]) ? lunarPhases[cur.getDate()] : null;
                        row.innerHTML += `<div class="day-node ${weekIdx===0?'current-week':''} ${isToday?'active':''}">${moon ? moon.svg : cur.getDate()}</div>`;
                        if (isToday) updateState(moon);
                    }
                    stack.appendChild(row);
                });
            }

            function updateState(moon) {
                const iconBox = document.getElementById('lunar-icon-container');
                const advice = document.getElementById('advice-content');
                const region = infoGlobal?.titulo || "sua região";
                iconBox.innerHTML = `<div class="moon-svg-big">${moon ? moon.svg : moonSVGs.ming}</div>`;
                advice.innerHTML = `<p><b>Manutenção Geral em ${region}:</b> Fase de transição hídrica. Foco na rega gota-a-gota e monda manual.</p><p><b>Tendência:</b> Céu limpo exige proteção solar das culturas sensíveis.</p>`;
            }

            async function inicializar() {
                try {
                    const rLoc = await fetch('/data/bioregioes.json');
                    locationsDB = await rLoc.json();
                    const savedId = localStorage.getItem('biocultura_region') || "funchal";
                    infoGlobal = locationsDB.find(i => i.id === savedId);
                    if(infoGlobal) document.getElementById('reg-name').innerText = infoGlobal.titulo;
                    
                    renderGlobeCalendar();
                    renderSanidade(pragasData, 'grid-pragas', 4);
                    renderSanidade(invasorasData, 'grid-invasoras', 4);
                    document.getElementById('report-grid-agri').innerHTML = agriReports.map(r => `
                        <div class="report-item"><h5>${r.titulo}</h5><p>${r.texto}</p><span class="report-source">${r.fonte}</span></div>`).join('');
                } catch(e) { console.error(e); }
            }

            fetch('/sidebar-content.html').then(r => r.text()).then(html => {
                document.getElementById('sidebar').innerHTML = html;
                inicializar();
            });
        </script>
	</body>
</html>
