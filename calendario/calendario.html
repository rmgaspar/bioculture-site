<!DOCTYPE HTML>
<html>
	<head>
		<title>bioCultura - Calendário de Regeneração</title>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
		<link rel="stylesheet" href="/assets/css/main.css" />
		<style>
            /* --- ESTRUTURA GLOBAL --- */
            body, input, select, textarea { font-family: 'Source Sans Pro', sans-serif !important; color: #444; }
			section, #header, hr, .major { border: none !important; box-shadow: none !important; padding: 0 !important; }
            section { min-height: 100vh; display: flex; flex-direction: column; }

            #sidebar { position: fixed !important; top: 0; left: 0; height: 100vh !important; width: 18em !important; overflow: hidden !important; z-index: 10000; background: #fff; border-right: 1px solid #f2f2f2 !important; }
            #wrapper { padding-left: 18em !important; }

            .inner { padding: 2.2em 4em 0 4em !important; max-width: 1600px !important; margin: 0 auto; width: 100%; }
            .category-label { font-size: 0.65em; font-weight: 900; text-transform: uppercase; letter-spacing: 4px; color: #bbb; margin-bottom: 15px; display: block; }

            /* HERO SPLIT */
            .hero-split { display: flex; align-items: flex-start; justify-content: space-between; gap: 4em; margin-bottom: 2em; }
            .hero-text { flex: 1.5; text-align: left; padding-top: 5px; } 
            .hero-text h1 { font-size: 4em; font-weight: 900; color: #1a1a1a; letter-spacing: -2.5px; line-height: 0.95; margin: 0 0 20px 0; }
            
            /* GLOBO DE TEMPO */
            .hero-visual { flex: 1; display: flex; justify-content: flex-end; }
            .hero-globe { 
                position: relative; width: 480px; height: 480px; 
                border-radius: 50%; overflow: hidden; 
                box-shadow: 0 40px 100px rgba(0,0,0,0.05); 
                background: #fdfdfd; display: flex; flex-direction: column; align-items: center; justify-content: space-between;
                padding: 60px 0; border: 1px solid #f2f2f2;
            }

            .month-year-label { font-size: 0.8em; font-weight: 900; text-transform: uppercase; color: #bbb; letter-spacing: 3px; }

            .week-stack { width: 100%; display: flex; flex-direction: column; gap: 15px; margin-top: 20px; }
            .week-row { display: grid; grid-template-columns: repeat(7, 1fr); text-align: center; width: 100%; }
            .day-node { font-size: 0.85em; font-weight: 600; color: #ddd; display: flex; align-items: center; justify-content: center; height: 30px; }
            .day-node.current-week { color: #888; }
            .day-node.active { color: #2e7d32; font-weight: 900; transform: scale(1.2); }
            .day-node.weekend-red { color: #ef5350 !important; }
            .day-node svg { width: 16px; height: 16px; display: block; }

            .globe-south { width: 60%; padding-top: 25px; border-top: 1px solid #f2f2f2; display: flex; align-items: center; justify-content: center; gap: 40px; }
            .meteo-icon-big { font-size: 2.8em; color: #fbc02d; }
            .moon-svg-big { width: 35px; height: 35px; }
            .v-sep { width: 1px; height: 40px; background: #eee; }

            /* ORIENTAÇÃO REGIONAL */
            .advice-block { margin-top: 20px; padding: 35px; background: #fdfdfd; border-radius: 25px; border: 1px solid #f2f2f2; border-left: 5px solid #2e7d32; min-height: 180px; }
            .advice-block h5 { font-size: 0.8em; font-weight: 900; text-transform: uppercase; color: #2e7d32; margin-bottom: 15px; }
            .advice-content { font-size: 1.15em; line-height: 1.8; color: #555; text-align: justify; }

            /* DATA ROW & ESPAÇAMENTO */
            .data-row { display: block; padding: 5em 0; border-bottom: 1px solid #f2f2f2; }
            .data-row h4 { font-size: 0.7em; font-weight: 900; text-transform: uppercase; letter-spacing: 2px; color: #bbb; margin: 0 0 35px 0; }

            /* GRID DE PRAGAS E FLORA */
            .info-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 30px; margin-bottom: 20px; }
            .info-card { background: #fff; border: 1px solid #f2f2f2; border-radius: 20px; overflow: hidden; display: block; text-decoration: none !important; transition: all 0.3s ease; }
            .info-card:hover { transform: translateY(-5px); border-color: #2e7d32; }
            .info-img { width: 100%; height: 180px; object-fit: cover; background: #f9f9f9; }
            .info-body { padding: 25px; }
            .info-body b { color: #c62828; font-style: italic; font-size: 1.05em; display: block; margin-bottom: 5px; }
            .info-body p { font-size: 0.9em; color: #777; line-height: 1.5; margin: 0; }
            .bio-sol { background: #f1f8e9; color: #2e7d32; padding: 12px; border-radius: 10px; font-size: 0.85em; font-weight: 600; border-left: 3px solid #2e7d32; margin-top: 15px; }

            /* BOTÕES TOGGLE */
            .btn-toggle { background: none !important; border: none !important; color: #bbb !important; cursor: pointer; font-size: 2.5em; font-weight: 300; line-height: 1; margin-bottom: 20px; }
            .btn-toggle:hover { color: #2e7d32 !important; }
            .hidden-item { display: none; }

            /* RELATÓRIOS */
            .report-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 50px; margin-top: 20px; }
            .report-item { border-top: 1px solid #f9f9f9; padding-top: 20px; }
            .report-item h5 { font-size: 0.75em; font-weight: 900; text-transform: uppercase; color: #2e7d32; margin-bottom: 12px; }
            .report-item p { font-size: 1em; line-height: 1.7; color: #555; margin-bottom: 10px; text-align: justify; }
            .report-source { font-size: 0.65em; color: #bbb; text-transform: uppercase; font-weight: 400; }

            .page-footer { margin-top: auto; padding: 2em 0 2.5em 0; border-top: 1px solid #f2f2f2; opacity: 0.3; text-align: right; }

            @media screen and (max-width: 1280px) {
                #sidebar { position: relative !important; width: 100% !important; height: auto !important; }
                #wrapper { padding-left: 0 !important; }
                .hero-split, .report-grid, .info-grid { grid-template-columns: 1fr; }
                .hero-globe { width: 350px; height: 350px; margin: 0 auto; }
            }
		</style>
	</head>
	<body class="is-preload">
		<div id="wrapper">
			<div id="main">
                <div class="inner">
                    <section>
                        <!-- 1. HERO & TIME GLOBE -->
                        <div class="hero-split">
                            <div class="hero-text">
                                <span class="category-label">Agricultura bioCultura</span>
                                <h1>Calendário de Regeneração</h1>
                                
                                <div class="advice-block">
                                    <h5>Orientação Semanal: <span id="reg-name">...</span></h5>
                                    <div id="advice-content" class="advice-content"></div>
                                </div>
                            </div>

                            <div class="hero-visual">
                                <div class="hero-globe">
                                    <div class="month-year-label">Julho 2026</div>
                                    <div class="week-stack" id="week-stack"></div>
                                    <div class="globe-south">
                                        <div class="south-part"><i class="fas fa-sun meteo-icon-big"></i></div>
                                        <div class="v-sep"></div>
                                        <div class="south-part" id="lunar-icon-container"></div>
                                    </div>
                                </div>
                            </div>
                        </div>

                        <!-- 2. SANIDADE VEGETAL -->
                        <div class="data-row">
                            <h4>Sanidade Vegetal: Diagnóstico Bio</h4>
                            <h5 style="font-size: 0.8em; color: #888; margin-bottom: 20px;">Combater as pragas da sua horta</h5>
                            <div id="pragas-container" class="info-grid"></div>
                            <button class="btn-toggle" id="btn-pragas" onclick="toggleGrid('pragas')">+</button>

                            <h5 style="font-size: 0.8em; color: #888; margin: 40px 0 20px 0;">Combater as plantas invasoras</h5>
                            <div id="flora-container" class="info-grid"></div>
                            <button class="btn-toggle" id="btn-invasoras" onclick="toggleGrid('flora')">+</button>
                        </div>

                        <!-- 3. SÍNTESE AUTORIDADES -->
                        <div class="data-row" style="border-bottom: none;">
                            <span class="category-label">Síntese e Avisos Agrícolas 2026</span>
                            <h2 style="font-weight: 300; font-size: 2.5em; margin-bottom: 30px;">Inteligência Fitossanitária Nacional</h2>
                            <div id="report-grid-agri" class="report-grid"></div>
                        </div>

                        <footer class="page-footer">
                            <span style="display: block; font-size: 0.85em; font-weight: 900; color: #333;">bioCultura</span>
                            <span style="display: block; font-size: 0.5em; font-weight: 700; text-transform: uppercase; letter-spacing: 1px;">Global Regeneration</span>
                        </footer>
					</section>
				</div>
            </div>
			<div id="sidebar"></div>
		</div>

		<script src="/assets/js/jquery.min.js"></script>
        <script>
            let locationsDB = [], infoGlobal = null;

            const moonSVGs = {
                ming: '<svg viewBox="0 0 24 24" class="moon-svg-big"><path fill="#bdbdbd" d="M12,2A10,10 0 0,0 12,22A10,10 0 0,0 12,2M12,4A8,8 0 0,1 12,20V4Z"/></svg>',
                new: '<svg viewBox="0 0 24 24" class="moon-svg-big"><circle cx="12" cy="12" r="10" stroke="#9e9e9e" stroke-width="2" fill="none"/></svg>',
                cres: '<svg viewBox="0 0 24 24" class="moon-svg-big"><path fill="#616161" d="M12,2V20A8,8 0 0,0 12,4M12,22A10,10 0 0,1 12,2A10,10 0 0,1 12,22Z"/></svg>',
                full: '<svg viewBox="0 0 24 24" class="moon-svg-big"><circle cx="12" cy="12" r="10" fill="#f9a825"/></svg>'
            };

            const lunarPhases = {
                7: { svg: moonSVGs.ming, label: 'Quarto Minguante', task: 'Energia nas raízes. Ideal para podas de limpeza e controlo de pragas.' },
                14: { svg: moonSVGs.new, label: 'Lua Nova', task: 'Fase de repouso. Prepare o solo com composto orgânico e mulching.' },
                21: { svg: moonSVGs.cres, label: 'Quarto Crescente', task: 'Vigor ascendente. Semear hortícolas de folha e fruto.' },
                29: { svg: moonSVGs.full, label: 'Lua Cheia', task: 'Máxima vitalidade hídrica. Ideal para colheita de medicinais.' }
            };

            const agriReports = [
                { 
                    titulo: "Diretrizes PEPAC 2026", 
                    texto: "O Plano Estratégico da PAC foca-se na autonomia do pequeno agricultor. Prioridade à instalação de charcas de biodiversidade e sistemas de rega solar inteligente para mitigar o stress hídrico severo no interior.", 
                    fonte: "agricultura.gov.pt" 
                },
                { 
                    titulo: "Vigilância Fitossanitária INIAV", 
                    texto: "O Laboratório de Fitobacteriologia reforça a contenção da Xylella fastidiosa. A recomendação técnica exige a diversificação de cultivares nativas e o uso de barreiras biológicas vivas (sebes nativas).", 
                    fonte: "iniav.pt" 
                },
                { 
                    titulo: "Inovação BASF/Plantix", 
                    texto: "Novas ferramentas de diagnóstico por imagem permitem identificar carências de Magnésio que mimetizam doenças virais. O uso de feromonas de confusão sexual reduziu em 60% os tratamentos invasivos.", 
                    fonte: "Plantix Library" 
                },
                { 
                    titulo: "Rede de Hortas Biológicas PT", 
                    texto: "A monitorização comunitária revela que consociações estratégicas (ex: Tomate + Manjericão) reduziram a incidência de pragas em 35%. Foco na produção de sementes próprias para soberania alimentar.", 
                    fonte: "hortasbiologicas.pt" 
                }
            ];

            function renderGlobeCalendar() {
                const stack = document.getElementById('week-stack');
                stack.innerHTML = '';
                let today = new Date();
                let monday = new Date(today); monday.setDate(today.getDate() - today.getDay() + (today.getDay() === 0 ? -6 : 1));

                [-1, 0, 1].forEach(w => {
                    let row = document.createElement('div'); row.className = 'week-row';
                    for(let j=0; j<7; j++) {
                        let cur = new Date(monday); cur.setDate(monday.getDate() + (w*7) + j);
                        let isToday = today.toDateString() === cur.toDateString();
                        let isWeekend = (j >= 5);
                        let moon = (cur.getMonth() === 6 && lunarPhases[cur.getDate()]) ? lunarPhases[cur.getDate()] : null;
                        
                        let content = moon ? moon.svg : cur.getDate();
                        row.innerHTML += `<div class="day-node ${w===0?'current-week':''} ${isToday?'active':''} ${isWeekend?'weekend-red':''}">
                            ${content}
                        </div>`;
                        if (isToday) updateState(moon);
                    }
                    stack.appendChild(row);
                });
            }

            function updateState(moon) {
                const iconBox = document.getElementById('lunar-icon-container');
                const advice = document.getElementById('advice-content');
                const region = infoGlobal?.titulo || "sua região";
                
                if (moon) {
                    iconBox.innerHTML = moon.svg;
                    advice.innerHTML = `<p><b>Influência Lunar:</b> Sob a <b>${moon.label}</b>, ${moon.task}</p>
                                        <p><b>Ação em ${region}:</b> O solo exige atenção à evapotranspiração. Aplique mulching denso e monitorize o stress hídrico. A estabilidade térmica favorece tratamentos bio ao crepúsculo.</p>`;
                } else {
                    iconBox.innerHTML = moonSVGs.ming;
                    advice.innerHTML = `<p><b>Manutenção Geral em ${region}:</b> Fase de transição hídrica. Foco na rega gota-a-gota e monda manual para preservar nutrientes.</p>
                                        <p><b>Tendência Meteorológica:</b> Céu limpo e radiação intensa. Proteja as culturas mais sensíveis com sombreamento parcial.</p>`;
                }
            }

            function renderGrid(data, containerId, limit = 4) {
                const container = document.getElementById(containerId);
                container.innerHTML = data.map((item, index) => `
                    <div class="info-card ${index >= limit ? 'hidden-item' : ''}">
                        <img src="${item.imagem || item.img}" class="info-img" onerror="this.src='/assets/img/placeholder.jpg'">
                        <div class="info-body">
                            <b>${item.nome_latim || item.nome} <span>(${item.nome_comum || item.comum})</span></b>
                            <p>${item.sintomas || item.impacto || item.desc}</p>
                            <div class="bio-sol">${item.cura_bio || item.controlo_bio}</div>
                        </div>
                    </div>`).join('');
            }

            function toggleGrid(type) {
                const containerId = type === 'pragas' ? 'pragas-container' : 'flora-container';
                const btnId = type === 'pragas' ? 'btn-pragas' : 'btn-invasoras';
                const hiddenItems = document.getElementById(containerId).querySelectorAll('.hidden-item');
                
                if (hiddenItems.length > 0) {
                    hiddenItems.forEach(el => el.classList.remove('hidden-item'));
                    document.getElementById(btnId).innerText = '-';
                } else {
                    renderAgriData(); // Reset
                    document.getElementById(btnId).innerText = '+';
                }
            }

            async function renderAgriData() {
                try {
                    const [rPragas, rFlora] = await Promise.all([
                        fetch('/data/pragas.json').then(r => r.json()),
                        fetch('/data/flora_invasora.json').then(r => r.json())
                    ]);
                    renderGrid(rPragas, 'pragas-container', 4);
                    renderGrid(rFlora, 'flora-container', 4);
                } catch(e) { console.error(e); }
            }

            async function inicializarPagina() {
                try {
                    const rLoc = await fetch('/data/bioregioes.json');
                    locationsDB = await rLoc.json();
                    infoGlobal = locationsDB.find(i => i.id === (localStorage.getItem('biocultura_region') || "proenca-a-nova"));
                    if(infoGlobal) document.getElementById('reg-name').innerText = infoGlobal.titulo;
                    
                    renderGlobeCalendar();
                    renderAgriData();
                    document.getElementById('report-grid-agri').innerHTML = agriReports.map(r => `
                        <div class="report-item"><h5>${r.titulo}</h5><p>${r.texto}</p><span class="report-source">Fonte: ${r.fonte}</span></div>`).join('');
                    setupLocationLogic();
                } catch(e) { console.error(e); }
            }

            function setupLocationLogic() {
                $(document).off('input', '#loc-search-input').on('input', '#loc-search-input', function() {
                    const val = $(this).val().toLowerCase(), dropdown = $('#loc-dropdown').empty();
                    if(val.length < 2) return dropdown.hide();
                    locationsDB.filter(i => i.titulo.toLowerCase().includes(val)).slice(0,5).forEach(m => {
                        $('<div class="bio-res-item"></div>').text(m.titulo).on('click', () => {
                            localStorage.setItem('biocultura_region', m.id); location.reload();
                        }).appendTo(dropdown);
                    });
                    dropdown.show();
                });
                $(document).off('click', '#btn-gps-trigger').on('click', '#btn-gps-trigger', function() {
                    navigator.geolocation.getCurrentPosition(pos => {
                        let closest = locationsDB[0], minD = Infinity;
                        locationsDB.forEach(c => {
                            let d = Math.sqrt(Math.pow(pos.coords.latitude - c.lat, 2) + Math.pow(pos.coords.longitude - c.lon, 2));
                            if(d < minD) { minD = d; closest = c; }
                        });
                        localStorage.setItem('biocultura_region', closest.id); location.reload();
                    });
                });
            }

            fetch('/sidebar-content.html').then(r => r.text()).then(html => {
                document.getElementById('sidebar').innerHTML = html;
                inicializarPagina();
            });
        </script>
	</body>
</html>
