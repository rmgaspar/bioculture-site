<!DOCTYPE HTML>
<html>
	<head>
		<title>bioCultura - Calendário Hortícola & Observatório Climático</title>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
		<link rel="stylesheet" href="/assets/css/main.css" />
		<style>
            /* --- ESTRUTURA & TIPOGRAFIA --- */
            body, input, select, textarea { font-family: 'Source Sans Pro', sans-serif !important; color: #444; }
			section, #header, hr, .major { border: none !important; box-shadow: none !important; padding: 0 !important; }
            section { padding-top: 4em !important; min-height: 100vh; display: flex; flex-direction: column; }

            #sidebar { position: fixed !important; top: 0; left: 0; height: 100vh !important; width: 18em !important; overflow: hidden !important; z-index: 10000; background: #fff; border-right: 1px solid #f2f2f2 !important; }
            #sidebar > .inner { height: 100% !important; display: flex; flex-direction: column; }
            #wrapper { padding-left: 18em !important; }

            /* CORES DOS ÍCONES */
            .fa-sun, .fa-cloud-sun { color: #fbc02d !important; } /* Amarelo Carregado */
            .fa-seedling { color: #4caf50 !important; } /* Verde bioCultura */
            
            /* TEXTO DAS NOTAS A PRETO */
            .val, .task-detail, .lunar-advice, #climate-alert, .task-main { color: #1a1a1a !important; }

            .calendar-hero { display: flex; justify-content: space-between; align-items: center; gap: 4em; margin-bottom: 4em; }
            .hero-left { flex: 1; text-align: left; }
            .hero-right { flex: 1.2; }

            .mini-calendar { 
                background: #fdfdfd; 
                border-radius: 25px; 
                padding: 1.5em; 
                mask-image: linear-gradient(to bottom, transparent, black 15%, black 85%, transparent);
                -webkit-mask-image: linear-gradient(to bottom, transparent, black 15%, black 85%, transparent);
            }
            .cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 5px; text-align: center; }
            .cal-day-label { font-size: 0.55em; font-weight: 900; text-transform: uppercase; color: #ccc; margin-bottom: 10px; }
            
            .cal-date { font-size: 0.85em; font-weight: 600; padding: 10px 0; border-radius: 12px; color: #bbb; min-height: 45px; display: flex; align-items: center; justify-content: center; }
            .cal-date.today { background: #f1f8e9; color: #1b5e20; border: 1px solid #dcedc8; }
            .cal-date i { font-size: 1.1em; }

            /* WEATHER UNIFICADO & ALINHADO */
            .weather-unified { 
                background: #fcfdfc; 
                padding: 2.5em; 
                border-radius: 35px; 
                border: 1px solid #f0f0f0; 
                display: flex;
                align-items: center;
                justify-content: space-between;
                gap: 4em;
                margin-bottom: 4em;
            }
            .weather-section { flex: 1; display: flex; align-items: center; gap: 25px; }
            .weather-divider { background: #eee; height: 60px; width: 1px; }
            .alert-section { flex: 1.5; padding-left: 10px; }

            .info-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 20px; margin-bottom: 3em; }
            .info-card { padding: 1em 0; display: flex; align-items: center; gap: 20px; border-bottom: 1px solid #f2f2f2; }
            .info-card .label { font-size: 0.6em; text-transform: uppercase; font-weight: 800; color: #bbb; display: block; }
            .lunar-advice { font-size: 0.75em; font-style: italic; display: block; margin-top: 4px; line-height: 1.4; }

            /* TAREFAS AGRÍCOLAS */
            .tasks-grid { display: grid; grid-template-columns: 1fr; gap: 30px; margin-bottom: 4em; }
            .task-row { display: grid; grid-template-columns: 150px 1fr; gap: 30px; padding: 1.5em 0; border-left: 3px solid #eee; padding-left: 2em; }
            .task-row h4 { font-size: 0.65em; font-weight: 900; text-transform: uppercase; letter-spacing: 2px; color: #bbb; margin: 0; padding-top: 5px; }
            
            .row-pomar { border-left-color: #ff9800; }
            .row-vinha { border-left-color: #9c27b0; }
            .row-jardim { border-left-color: #e91e63; }
            .row-adega { border-left-color: #795548; }
            .row-sementeiras { border-left-color: #4caf50; }

            @media screen and (max-width: 1280px) {
                #sidebar { position: relative !important; width: 100% !important; height: auto !important; }
                #wrapper { padding-left: 0 !important; }
                .weather-unified { flex-direction: column; gap: 2em; text-align: center; }
                .weather-section { justify-content: center; }
                .weather-divider { display: none; }
                .task-row { grid-template-columns: 1fr; gap: 10px; }
            }
		</style>
	</head>
	<body class="is-preload">
		<div id="wrapper">
			<div id="main">
                <div class="inner">
                    <section>
                        <div class="calendar-hero">
                            <div class="hero-left">
                                <span style="font-size: 0.7em; font-weight: 900; text-transform: uppercase; letter-spacing: 4px; color: #bbb;" id="display-month">Julho</span>
                                <h1 style="font-size: 3.5em; font-weight: 300; color: #1a1a1a; letter-spacing: -2px; margin: 0;">O Ritmo da Terra</h1>
                                <p style="font-size: 0.9em; font-style: italic; color: #bbb; margin-top: 5px;">Orientação regional: <strong id="reg-name" style="color:#888">...</strong></p>
                            </div>
                            <div class="hero-right"><div class="mini-calendar"><div class="cal-grid" id="calendar-week-grid"></div></div></div>
                        </div>

                        <div class="info-row">
                            <div class="info-card" id="soil-card">
                                <i class="fas fa-seedling"></i>
                                <div><span class="label">Solo local</span><span id="soil-type" class="val">Xistoso/Granítico</span></div>
                            </div>
                            <div class="info-card">
                                <i class="fas fa-moon" id="main-lunar-icon"></i>
                                <div>
                                    <span class="label" id="lunar-phase-name">Fase da Lua</span>
                                    <span id="lunar-tip" class="val">...</span>
                                    <span id="lunar-advice" class="lunar-advice"></span>
                                </div>
                            </div>
                        </div>

                        <div class="weather-unified">
                            <div class="weather-section">
                                <i class="fas fa-cloud-sun" style="font-size: 2.5em;"></i>
                                <div>
                                    <span style="font-size: 0.6em; font-weight: 800; text-transform: uppercase; color: #bbb; letter-spacing: 1px;">Previsão Local</span>
                                    <h2 style="margin:0; font-weight: 300; font-size: 1.8em; color: #1a1a1a;">28°C / 16°C</h2>
                                    <p style="margin:0; font-size: 0.8em; color: #bbb;">Céu limpo, vento moderado NW</p>
                                </div>
                            </div>
                            <div class="weather-divider"></div>
                            <div class="alert-section">
                                <span style="font-size: 0.6em; font-weight: 900; text-transform: uppercase; color: #bbb; letter-spacing: 1px;">Observação Climática</span>
                                <p id="climate-alert" style="font-size: 0.95em; margin-top: 8px; line-height: 1.5;">A carregar alertas...</p>
                            </div>
                        </div>

                        <div class="tasks-grid" id="tasks-container">
                            <!-- Injetado via JS -->
                        </div>

					</section>
				</div>
            </div>
			<div id="sidebar"></div>
		</div>

		<script src="/assets/js/jquery.min.js"></script>
        <script>
            let locationsDB = [];
            const mesesMap = ["jan", "fev", "mar", "abr", "mai", "jun", "jul", "ago", "set", "out", "nov", "dez"];
            
            const agroIntelligence = {
                "jul": { 
                    "alerta": "SOL EXTREMO: Evite regas nas horas de maior calor para não queimar as folhas.",
                    "pomar": ["Colheita de Pêssego e Ameixa", "Instale armadilhas biológicas para a mosca da fruta."],
                    "vinha": ["Poda em verde", "Remova rebentos ladrões para concentrar energia na maturação."],
                    "jardim": ["Controlo de Stress hídrico", "Use mulching para manter a frescura e regue apenas ao amanhecer."],
                    "adega": ["Higiene de cubas", "Lave o vasilhame e prepare os equipamentos para a vindima."],
                    "sementeiras": ["Couves de inverno", "Semear brócolos e couve-flor em local sombreado."]
                }
            };

            function getLunarData(date = new Date()) {
                const lp = 2551443; 
                const new_moon = new Date(1970, 0, 7, 20, 35, 0);
                const phase = ((date.getTime() - new_moon.getTime()) / 1000) % lp;
                const day = Math.floor(phase / (24 * 3600)) + 1;
                
                // Configurações exatas pedidas pelo Gaspar
                if (day <= 1 || day >= 29) return { name: "Lua Nova", icon: "fa-circle-notch", color: "#263238", tip: "Recolhimento e limpeza.", advice: "Aconselhável: Colher raízes, retirar ervas daninhas e reduzir regas." };
                if (day >= 7 && day <= 8) return { name: "Lua Crescente", icon: "fa-moon", color: "#fb8c00", tip: "Vigor e crescimento.", advice: "Aconselhável: Semear plantas acima do solo e aplicar adubos." };
                if (day >= 14 && day <= 15) return { name: "Lua Cheia", icon: "fa-circle", color: "#fbc02d", tip: "Máxima energia hídrica.", advice: "Aconselhável: Colher frutos/folhas, aumentar regas e transplantes." };
                if (day >= 21 && day <= 22) return { name: "Lua Minguante", icon: "fa-moon", color: "#7b1fa2", tip: "Enraizamento e poda.", advice: "Aconselhável: Semear raízes, podar e controlar pragas." };
                
                return null;
            }

            function buildMiniCalendar() {
                const grid = document.getElementById('calendar-week-grid');
                if(!grid) return;
                grid.innerHTML = '';
                const days = ['S','T','Q','Q','S','S','D'];
                const today = new Date();
                days.forEach(d => grid.innerHTML += `<div class="cal-day-label">${d}</div>`);
                
                let start = new Date();
                let dayOffset = today.getDay() === 0 ? 6 : today.getDay() - 1;
                start.setDate(today.getDate() - dayOffset - 7);

                for(let i=0; i<21; i++) {
                    let current = new Date(start);
                    current.setDate(start.getDate() + i);
                    const isToday = current.toDateString() === today.toDateString() ? 'today' : '';
                    const moon = getLunarData(current);
                    
                    const content = moon ? `<i class="fas ${moon.icon}" style="color: ${moon.color}"></i>` : current.getDate();
                    grid.innerHTML += `<div class="cal-date ${isToday}">${content}</div>`;
                }
            }

            function renderTasks() {
                const container = document.getElementById('tasks-container');
                const intel = agroIntelligence["jul"];
                const types = [
                    { id: 'pomar', label: 'Pomar', class: 'row-pomar' },
                    { id: 'vinha', label: 'Vinha', class: 'row-vinha' },
                    { id: 'jardim', label: 'Jardim', class: 'row-jardim' },
                    { id: 'adega', label: 'Adega', class: 'row-adega' },
                    { id: 'sementeiras', label: 'Sementeiras', class: 'row-sementeiras' }
                ];

                container.innerHTML = types.map(t => `
                    <div class="task-row ${t.class}">
                        <h4>${t.label}</h4>
                        <div class="task-content">
                            <span class="task-main">${intel[t.id][0]}</span>
                            <p class="task-detail">${intel[t.id][1]}</p>
                        </div>
                    </div>
                `).join('');
            }

            function renderDashboard(info) {
                if(!info) return;
                document.getElementById('reg-name').innerText = info.titulo;
                document.getElementById('soil-type').innerText = info.biomas?.solo || "Misto";
                
                const moon = getLunarData() || { name: "Fase de Transição", tip: "Equilíbrio hídrico.", advice: "Aconselhável: Manutenção geral do solo.", color: "#ddd", icon: "fa-moon" };
                document.getElementById('lunar-phase-name').innerText = moon.name;
                document.getElementById('lunar-tip').innerText = moon.tip;
                document.getElementById('lunar-advice').innerText = moon.advice;
                document.getElementById('main-lunar-icon').style.color = moon.color;
                document.getElementById('main-lunar-icon').className = `fas ${moon.icon}`;

                document.getElementById('climate-alert').innerText = agroIntelligence["jul"].alerta;
                renderTasks();
            }

            async function inicializar() {
                try {
                    const r = await fetch('/data/bioregioes.json');
                    locationsDB = await r.json();
                    const savedId = localStorage.getItem('biocultura_region') || "portugal-nacional";
                    renderDashboard(locationsDB.find(i => i.id === savedId));
                } catch(e) { console.error(e); }
            }

            fetch('/sidebar-content.html').then(r => r.text()).then(html => {
                document.getElementById('sidebar').innerHTML = html;
                buildMiniCalendar();
                inicializar();
            });
        </script>
	</body>
</html>
