<!DOCTYPE HTML>
<html>
	<head>
		<title>bioCultura - Calendário Hortícola & Lunar</title>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
		<link rel="stylesheet" href="/assets/css/main.css" />
		<style>
            /* --- ESTRUTURA GLOBAL & TIPOGRAFIA --- */
            body, input, select, textarea { font-family: 'Source Sans Pro', sans-serif !important; color: #444; }
			section, #header, hr, .major { border: none !important; box-shadow: none !important; padding: 0 !important; }
            section { padding-top: 4em !important; min-height: 100vh; display: flex; flex-direction: column; }

            /* SIDEBAR FIXA E SEM SCROLL */
            #sidebar { 
                position: fixed !important; 
                top: 0; left: 0; 
                height: 100vh !important; 
                width: 18em !important; 
                overflow: hidden !important; /* REMOVE O SCROLL */
                z-index: 10000; 
                background: #fff; 
                border-right: 1px solid #f2f2f2 !important; 
            }
            #sidebar > .inner { height: 100% !important; overflow: hidden !important; display: flex; flex-direction: column; }
            #wrapper { padding-left: 18em !important; }

            /* CABEÇALHOS */
            .category-label { font-size: 0.65em; font-weight: 900; text-transform: uppercase; letter-spacing: 3px; color: #bbb; margin-bottom: 10px; display: block; text-align: center; }
            .month-badge { display: inline-block; background: #2e7d32; color: #fff; padding: 10px 30px; border-radius: 50px; font-weight: 800; text-transform: uppercase; letter-spacing: 3px; font-size: 0.8em; margin-bottom: 1.5em; }

            /* INFO CARDS (SOLO E LUA) */
            .info-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 20px; margin-bottom: 3em; }
            .info-card { background: #fff; padding: 1.5em 2em; border-radius: 25px; display: flex; align-items: center; gap: 20px; border: 1px solid #f0f0f0; }
            .info-card.soil { border-left: 6px solid #d4a373; background: #fdfaf5; }
            .info-card.lunar { border-left: 6px solid #5c6bc0; background: #f5f6ff; }
            .info-card i { font-size: 2em; }
            .info-card .label { font-size: 0.6em; text-transform: uppercase; font-weight: 800; color: #bbb; display: block; }
            .info-card .val { font-size: 0.95em; color: #333; font-weight: 700; }

            /* TASKS GRID */
            .tasks-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 25px; margin-bottom: 4em; }
            .task-card { background: #fff; border-radius: 30px; padding: 2.2em; border: 1px solid #f2f2f2; box-shadow: 0 10px 30px rgba(0,0,0,0.02); border-top: 8px solid #eee; }
            .task-card i { font-size: 1.8em; margin-bottom: 15px; display: block; }
            .task-card h4 { font-size: 0.7em; text-transform: uppercase; letter-spacing: 1.5px; color: #bbb; margin-bottom: 15px; font-weight: 900; }
            .task-text { font-size: 0.95em; color: #444; line-height: 1.6; font-weight: 600; }

            /* CORES CATEGORIAS */
            .card-pomar { border-top-color: #ff9800 !important; } .card-pomar i { color: #ff9800; }
            .card-vinha { border-top-color: #9c27b0 !important; } .card-vinha i { color: #9c27b0; }
            .card-jardim { border-top-color: #e91e63 !important; } .card-jardim i { color: #e91e63; }
            .card-adega { border-top-color: #795548 !important; } .card-adega i { color: #795548; }
            .card-sementeiras { border-top-color: #4caf50 !important; } .card-sementeiras i { color: #4caf50; }

            .page-footer { margin-top: auto; padding: 4em 0 2em 0; border-top: 1px solid #f2f2f2; }

            @media screen and (max-width: 1280px) {
                #sidebar { position: relative !important; width: 100% !important; height: auto !important; overflow: visible !important; }
                #wrapper { padding-left: 0 !important; }
            }
		</style>
	</head>
	<body class="is-preload">
		<div id="wrapper">
			<div id="main">
                <div class="inner">
					<header id="header" style="height: 0; margin: 0; padding: 0; overflow: hidden;"></header>
                    <section>
                        <div style="text-align: center; margin-bottom: 4em;">
                            <div class="month-badge" id="display-month">...</div>
                            <h1 style="font-size: 3.5em; font-weight: 300; color: #1a1a1a; letter-spacing: -2px;">O Ritmo da Terra</h1>
                            <p style="font-style: italic; color: #999;">Orientação para a região de: <strong id="reg-name" style="color:#2e7d32">...</strong></p>
                        </div>

                        <div class="info-row">
                            <div class="info-card soil" id="soil-card" style="display:none;">
                                <i class="fas fa-seedling" style="color: #d4a373;"></i>
                                <div><span class="label">Aptidão do Terreno</span><span class="val" id="soil-type">...</span></div>
                            </div>
                            <div class="info-card lunar">
                                <i id="lunar-icon" class="fas fa-moon" style="color: #5c6bc0;"></i>
                                <div><span class="label" id="lunar-phase-name">Fase da Lua</span><span class="val" id="lunar-tip">A calcular...</span></div>
                            </div>
                        </div>

                        <div class="tasks-grid" id="tasks-container" style="display:none;">
                            <div class="task-card card-pomar"><i class="fas fa-apple-alt"></i><h4>Pomar</h4><p class="task-text" id="task-pomar">--</p></div>
                            <div class="task-card card-vinha"><i class="fas fa-wine-glass-alt"></i><h4>Vinha</h4><p class="task-text" id="task-vinha">--</p></div>
                            <div class="task-card card-jardim"><i class="fas fa-spa"></i><h4>Jardim</h4><p class="task-text" id="task-jardim">--</p></div>
                            <div class="task-card card-adega"><i class="fas fa-dungeon"></i><h4>Adega</h4><p class="task-text" id="task-adega">--</p></div>
                            <div class="task-card card-sementeiras"><i class="fas fa-seedling"></i><h4>Sementeiras</h4><p class="task-text" id="task-sementeiras">--</p></div>
                        </div>

                        <div id="no-gps-warning" style="text-align: center; padding: 4em; background: #f4f7fb; border-radius: 40px;">
                            <p>Sincronize a sua localização para carregar o calendário.</p>
                        </div>

                        <footer class="page-footer">
                            <div style="display: flex; align-items: center; justify-content: flex-end; gap: 10px; opacity: 0.3;">
                                <div style="text-align: right; line-height: 1;">
                                    <span style="display: block; font-size: 0.85em; font-weight: 900; color: #333;">bioCultura</span>
                                    <span style="display: block; font-size: 0.5em; font-weight: 700; text-transform: uppercase; letter-spacing: 1px;">Global Regeneration</span>
                                </div>
                                <svg width="22" height="22" viewBox="0 0 100 100">
                                    <path d="M50 5 L89 27.5 L89 72.5 L50 95 L11 72.5 L11 27.5 Z" fill="#333" />
                                    <path d="M50 20 C50 20 75 45 75 70 C75 85 65 85 50 85 C35 85 25 85 25 70 C25 45 50 20 50 20Z" fill="#fff" />
                                </svg>
                            </div>
                        </footer>
					</section>
				</div>
            </div>
			<div id="sidebar"></div>
		</div>

		<script src="/assets/js/jquery.min.js"></script>
        <script>
            let locationsDB = [];
            const mesesMap = ["jan", "fev", "mar", "abr", "mai", "jun", "jul", "ago", "set", "out", "nov", "dez"];
            const mesesFull = ["Janeiro", "Fevereiro", "Março", "Abril", "Maio", "Junho", "Julho", "Agosto", "Setembro", "Outubro", "Novembro", "Dezembro"];
            const mesKey = mesesMap[new Date().getMonth()];
            document.getElementById('display-month').innerText = mesesFull[new Date().getMonth()];

            function getLunarPhase() {
                const lp = 2551443; const new_moon = new Date(1970, 0, 7, 20, 35, 0);
                const phase = ((new Date().getTime() - new_moon.getTime()) / 1000) % lp;
                const res = Math.floor(phase / (24 * 3600)) + 1;
                if (res <= 7) return { name: "Quarto Crescente", tip: "Crescimento: Semear flores e frutos." };
                if (res <= 14) return { name: "Lua Cheia", tip: "Força: Ideal para colher e podar." };
                if (res <= 21) return { name: "Quarto Minguante", tip: "Raiz: Plantar batatas e limpar mato." };
                return { name: "Lua Nova", tip: "Repouso: Evitar sementeiras." };
            }
            const moon = getLunarPhase();
            document.getElementById('lunar-phase-name').innerText = moon.name;
            document.getElementById('lunar-tip').innerText = moon.tip;

            async function inicializarPagina() {
                try {
                    const r = await fetch('/data/bioregioes.json');
                    locationsDB = await r.json();
                    const urlParams = new URLSearchParams(window.location.search);
                    const regionParam = urlParams.get('region');
                    const savedId = localStorage.getItem('biocultura_region');
                    let info = null;
                    if (regionParam) info = locationsDB.find(i => i.id === regionParam);
                    if (!info && savedId) info = locationsDB.find(i => i.id === savedId);
                    if (info) renderCalendar(info);
                    else {
                        const nacional = locationsDB.find(i => i.id === "portugal-nacional");
                        if (nacional) renderCalendar(nacional);
                    }
                } catch(e) { console.error(e); }
            }

            function renderCalendar(info) {
                if(!info) return;
                document.getElementById('no-gps-warning').style.display = 'none';
                document.getElementById('tasks-container').style.display = 'grid';
                document.getElementById('soil-card').style.display = 'flex';
                document.getElementById('reg-name').innerText = info.titulo;
                document.getElementById('soil-type').innerText = info.biomas?.solo || "N/A";
                if (info.calendario) {
                    document.getElementById('task-pomar').innerText = info.calendario.pomar[mesKey] || "Manutenção.";
                    document.getElementById('task-vinha').innerText = info.calendario.vinha[mesKey] || "Acompanhar.";
                    document.getElementById('task-jardim').innerText = info.calendario.jardim[mesKey] || "Rega.";
                    document.getElementById('task-adega').innerText = info.calendario.adega[mesKey] || "Preparação.";
                    document.getElementById('task-sementeiras').innerText = info.calendario.sementeiras[mesKey] || "Semear.";
                }
            }

            function setupSidebarEvents() {
                const input = document.getElementById('loc-search-input');
                const dropdown = document.getElementById('loc-dropdown');
                const gpsBtn = document.getElementById('btn-gps-trigger');
                if(!input) return;
                if(gpsBtn) {
                    gpsBtn.onclick = function(e) {
                        e.preventDefault();
                        localStorage.clear(); sessionStorage.clear();
                        navigator.geolocation.getCurrentPosition(() => { window.location.href = window.location.pathname; }, () => { window.location.href = window.location.pathname; });
                    };
                }
                input.addEventListener('input', function() {
                    const val = this.value.toLowerCase();
                    dropdown.innerHTML = '';
                    if(val.length < 2) { dropdown.style.display = 'none'; return; }
                    const matches = locationsDB.filter(i => i.titulo.toLowerCase().includes(val)).slice(0, 6);
                    if(matches.length > 0) {
                        dropdown.style.display = 'block';
                        matches.forEach(m => {
                            const item = document.createElement('div');
                            item.className = 'bio-res-item';
                            item.innerText = m.titulo;
                            item.onclick = () => { localStorage.setItem('biocultura_region', m.id); sessionStorage.clear(); window.location.href = window.location.pathname; };
                            dropdown.appendChild(item);
                        });
                    } else dropdown.style.display = 'none';
                });
            }

            fetch('/sidebar-content.html').then(r => r.text()).then(html => {
                document.getElementById('sidebar').innerHTML = html;
                var s = document.createElement('script'); s.src = '/assets/js/main.js'; document.body.appendChild(s);
                inicializarPagina();
                setTimeout(setupSidebarEvents, 1000);
            });
        </script>
	</body>
</html>
