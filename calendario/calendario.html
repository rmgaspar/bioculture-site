<!DOCTYPE HTML>
<html>
	<head>
		<title>bioCultura - Calendário Hortícola & Lunar</title>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
		<link rel="stylesheet" href="/assets/css/main.css" />
		<style>
			section, #header, hr, .major { border: none !important; box-shadow: none !important; padding: 0 !important; }
			#header .toggle { background: none !important; top: 2em !important; left: 2em !important; border: none !important; text-decoration: none !important; z-index: 10001; }
			#header .toggle:before { content: '\f06c' !important; font-family: "Font Awesome 5 Free" !important; font-weight: 900; color: #2e7d32 !important; font-size: 1.6em !important; }
            #header .toggle:after { display: none !important; }
            section { padding-top: 2em !important; }

            /* HEADER */
            .calendar-header { text-align: center; margin-bottom: 3em; }
            .month-badge { 
                display: inline-block; background: linear-gradient(135deg, #2e7d32 0%, #1b5e20 100%); color: #fff; 
                padding: 12px 35px; border-radius: 50px; font-weight: 800; 
                text-transform: uppercase; letter-spacing: 3px; font-size: 0.9em;
                margin-bottom: 1.5em; box-shadow: 0 10px 25px rgba(46, 125, 50, 0.2);
            }

            /* SOIL & LUNAR SUMMARY */
            .info-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 20px; margin-bottom: 3em; }
            .info-card { background: #fff; padding: 1.5em 2em; border-radius: 25px; display: flex; align-items: center; gap: 20px; border: 1px solid #f0f0f0; }
            .info-card.soil { border-left: 6px solid #d4a373; background: #fdfaf5; }
            .info-card.lunar { border-left: 6px solid #5c6bc0; background: #f5f6ff; }
            .info-card i { font-size: 2em; }
            .info-card .label { font-size: 0.65em; text-transform: uppercase; font-weight: 800; color: #aaa; display: block; }
            .info-card .val { font-size: 1em; color: #333; font-weight: 700; }

            /* TASKS GRID */
            .tasks-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 20px; margin-bottom: 4em; }
            .task-card { 
                background: #fff; border-radius: 30px; padding: 2em; 
                border: 1px solid #f0f4f0; box-shadow: 0 15px 35px rgba(0,0,0,0.03);
                transition: all 0.3s ease;
            }
            .task-card:hover { transform: translateY(-5px); border-color: #2e7d32; box-shadow: 0 20px 40px rgba(0,0,0,0.06); }
            .task-card i { font-size: 1.8em; color: #2e7d32; margin-bottom: 15px; display: block; }
            .task-card h4 { font-size: 0.75em; text-transform: uppercase; letter-spacing: 1px; color: #999; margin-bottom: 10px; font-weight: 800; }
            .task-text { font-size: 0.95em; color: #444; line-height: 1.6; font-weight: 600; }

			.footer-signature-right { text-align: right; padding: 4em 2em 2em 0; opacity: 0.8; }
		</style>
	</head>
	<body class="is-preload">
		<div id="wrapper">
			<div id="main">
                <div class="inner">
					<header id="header" style="height: 0; margin: 0; padding: 0; overflow: hidden;"></header>
					
                    <section>
                        <div class="calendar-header">
                            <div class="month-badge" id="display-month">...</div>
                            <h1 style="font-size: 3.5em; font-weight: 300; color: #1b5e20; letter-spacing: -2px;">O Ritmo da Terra</h1>
                            <p style="font-style: italic; color: #888;">Orientação para a região de: <strong id="reg-name" style="color:#2e7d32">...</strong></p>
                        </div>

                        <div class="info-row">
                            <!-- CARD SOLO -->
                            <div class="info-card soil" id="soil-card" style="display:none;">
                                <i class="fas fa-seedling" style="color: #d4a373;"></i>
                                <div>
                                    <span class="label">Aptidão do Terreno</span>
                                    <span class="val" id="soil-type">...</span>
                                </div>
                            </div>
                            <!-- CARD LUNAR -->
                            <div class="info-card lunar">
                                <i id="lunar-icon" class="fas fa-moon" style="color: #5c6bc0;"></i>
                                <div>
                                    <span class="label" id="lunar-phase-name">Fase da Lua</span>
                                    <span class="val" id="lunar-tip">A calcular influência...</span>
                                </div>
                            </div>
                        </div>

                        <!-- TAREFAS -->
                        <div class="tasks-grid" id="tasks-container" style="display:none;">
                            <div class="task-card"><i class="fas fa-apple-alt"></i><h4>Pomar</h4><p class="task-text" id="task-pomar">--</p></div>
                            <div class="task-card"><i class="fas fa-wine-glass-alt"></i><h4>Vinha</h4><p class="task-text" id="task-vinha">--</p></div>
                            <div class="task-card"><i class="fas fa-spa"></i><h4>Jardim</h4><p class="task-text" id="task-jardim">--</p></div>
                            <div class="task-card"><i class="fas fa-dungeon"></i><h4>Adega</h4><p class="task-text" id="task-adega">--</p></div>
                            <div class="task-card"><i class="fas fa-seedling"></i><h4>Sementeiras</h4><p class="task-text" id="task-sementeiras">--</p></div>
                        </div>

                        <div id="no-gps-warning" style="text-align: center; padding: 4em; background: #f4f7fb; border-radius: 40px; margin-bottom: 4em;">
                            <p>Sincronize a sua localização na barra lateral para carregar o calendário personalizado.</p>
                        </div>
					</section>

					<div class="footer-signature-right">
						<a href="/index.html" style="border: none; display: inline-block; text-decoration: none;">
							<div style="font-family: 'Source Sans Pro', sans-serif; font-size: 1.4em; line-height: 1; display: flex; align-items: flex-end; justify-content: flex-end;">
                                <b style="font-weight: 700; color: #2e7d32; margin-right: -3px; position: relative; z-index: 2;">b</b>
                                <div style="width: 32px; margin: 0 -7px; position: relative; line-height: 0; transform: translateY(4px); z-index: 1;">
                                    <svg viewBox="0 0 100 120" xmlns="http://www.w3.org/2000/svg" style="width: 100%; height: auto;"><path d="M-20 110 Q50 102 120 110" stroke="#634832" stroke-width="4" fill="none" opacity="0.3" /><path d="M50 110 C50 80 35 70 50 45 C65 70 50 80 50 110" fill="#2e7d32" /><path d="M50 80 C75 75 85 50 65 40 C50 55 50 65 50 80" fill="#4CAF50" /></svg>
                                </div>
                                <b style="font-weight: 700; color: #2e7d32; margin-left: -3px; position: relative; z-index: 2;">o</b>
                                <span style="font-weight: 300; color: #444; margin-left: 2px;">Cultura</span>
                            </div>
						</a>
					</div>
				</div>
            </div>
			<div id="sidebar"></div>
		</div>

		<script src="/assets/js/jquery.min.js"></script>
        <script>
            // Configuração dos meses do JSON (chaves abreviadas)
            const mesesMap = ["jan", "fev", "mar", "abr", "mai", "jun", "jul", "ago", "set", "out", "nov", "dez"];
            const mesesFull = ["Janeiro", "Fevereiro", "Março", "Abril", "Maio", "Junho", "Julho", "Agosto", "Setembro", "Outubro", "Novembro", "Dezembro"];
            
            const dataAtual = new Date();
            const mesIndex = dataAtual.getMonth();
            const mesKey = mesesMap[mesIndex];

            document.getElementById('display-month').innerText = mesesFull[mesIndex];

            // 1. Lógica Lunar Simples (Aproximação)
            function getLunarPhase() {
                const lp = 2551443; 
                const new_moon = new Date(1970, 0, 7, 20, 35, 0);
                const phase = ((dataAtual.getTime() - new_moon.getTime()) / 1000) % lp;
                const res = Math.floor(phase / (24 * 3600)) + 1;
                
                if (res <= 7) return { name: "Quarto Crescente", tip: "Ideal para semear frutos e flores.", icon: "fa-moon" };
                if (res <= 14) return { name: "Lua Cheia", tip: "Fase de colheita e podas de crescimento.", icon: "fa-circle" };
                if (res <= 21) return { name: "Quarto Minguante", tip: "Semear raízes (batata, cenoura) e limpar ervas.", icon: "fa-moon" };
                return { name: "Lua Nova", tip: "Evitar sementeiras; bom para adubar a terra.", icon: "fa-moon" };
            }

            const moon = getLunarPhase();
            document.getElementById('lunar-phase-name').innerText = moon.name;
            document.getElementById('lunar-tip').innerText = moon.tip;

            async function inicializarPagina() {
                const savedRegionId = localStorage.getItem('biocultura_region');
                const cachedData = sessionStorage.getItem('biocultura_data_cache');

                if (cachedData && JSON.parse(cachedData).id === savedRegionId) {
                    renderCalendar(JSON.parse(cachedData));
                } else {
                    try {
                        const r = await fetch('/data/bioregioes.json');
                        const data = await r.json();
                        let info = data.find(item => item.id === savedRegionId);
                        if (info) renderCalendar(info);
                    } catch(e) { console.error("Erro ao carregar", e); }
                }
            }

            function renderCalendar(info) {
                document.getElementById('no-gps-warning').style.display = 'none';
                document.getElementById('tasks-container').style.display = 'grid';
                document.getElementById('soil-card').style.display = 'flex';
                document.getElementById('reg-name').innerText = info.titulo;
                document.getElementById('soil-type').innerText = info.biomas?.solo || "N/A";

                if (info.calendario) {
                    // Aqui está a correção: usamos mesKey (ex: "jul") em vez de "julho"
                    document.getElementById('task-pomar').innerText = info.calendario.pomar[mesKey] || "Sem tarefas específicas.";
                    document.getElementById('task-vinha').innerText = info.calendario.vinha[mesKey] || "Sem tarefas específicas.";
                    document.getElementById('task-jardim').innerText = info.calendario.jardim[mesKey] || "Sem tarefas específicas.";
                    document.getElementById('task-adega').innerText = info.calendario.adega[mesKey] || "Sem tarefas específicas.";
                    document.getElementById('task-sementeiras').innerText = info.calendario.sementeiras[mesKey] || "Sem tarefas específicas.";
                }
            }

            fetch('/sidebar-content.html').then(r => r.text()).then(html => {
                document.getElementById('sidebar').innerHTML = html;
                var s = document.createElement('script'); s.src = '/assets/js/main.js'; document.body.appendChild(s);
                inicializarPagina();
            });
        </script>
	</body>
</html>
