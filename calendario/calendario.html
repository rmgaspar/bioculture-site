<!DOCTYPE HTML>
<html>
	<head>
		<title>bioCultura - Calendário Hortícola</title>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
		<link rel="stylesheet" href="/assets/css/main.css" />
		<style>
            /* --- ESTILO GLOBAL --- */
            body, input, select, textarea { font-family: 'Source Sans Pro', sans-serif !important; color: #444; }
			section, #header, hr, .major { border: none !important; box-shadow: none !important; padding: 0 !important; }
            section { padding-top: 4em !important; min-height: 100vh; display: flex; flex-direction: column; }

            /* SIDEBAR FIXA E SEM SCROLL */
            #sidebar { position: fixed !important; top: 0; left: 0; height: 100vh !important; width: 18em !important; overflow: hidden !important; z-index: 10000; background: #fff; border-right: 1px solid #f2f2f2 !important; }
            #sidebar > .inner { height: 100% !important; overflow: hidden !important; display: flex; flex-direction: column; }
            #wrapper { padding-left: 18em !important; }

            .month-badge { display: inline-block; background: #1b5e20; color: #fff; padding: 10px 30px; border-radius: 50px; font-weight: 800; text-transform: uppercase; letter-spacing: 3px; font-size: 0.8em; margin-bottom: 1.5em; }
            
            .info-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 20px; margin-bottom: 3em; }
            .info-card { background: #fff; padding: 1.5em 2em; border-radius: 25px; display: flex; align-items: center; gap: 20px; border: 1px solid #f0f0f0; }
            .info-card.soil { border-left: 6px solid #d4a373; background: #fdfaf5; }
            .info-card.lunar { border-left: 6px solid #5c6bc0; background: #f5f6ff; }

            .tasks-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 25px; margin-bottom: 4em; }
            .task-card { background: #fff; border-radius: 35px; padding: 2.5em; box-shadow: 0 15px 45px rgba(0,0,0,0.03); border: 1px solid #f8f8f8; border-top: 8px solid #eee; }
            .task-card h4 { font-size: 0.7em; font-weight: 900; text-transform: uppercase; color: #bbb; margin-bottom: 1.5em; }
            .task-main { font-size: 1.1em; font-weight: 700; color: #1a1a1a; display: block; margin-bottom: 10px; }
            .task-detail { font-size: 0.9em; color: #777; line-height: 1.6; }

            .card-pomar { border-top-color: #ff9800 !important; }
            .card-vinha { border-top-color: #9c27b0 !important; }
            .card-jardim { border-top-color: #e91e63 !important; }
            .card-adega { border-top-color: #795548 !important; }
            .card-sementeiras { border-top-color: #4caf50 !important; }

            .page-footer { margin-top: auto; padding: 4em 0 2em 0; border-top: 1px solid #f2f2f2; }
            @media screen and (max-width: 1280px) { #sidebar { position: relative !important; width: 100% !important; height: auto !important; overflow: visible !important; } #wrapper { padding-left: 0 !important; } }
		</style>
	</head>
	<body class="is-preload">
		<div id="wrapper">
			<div id="main">
                <div class="inner">
					<header id="header" style="height: 0; margin: 0; padding: 0; overflow: hidden;"></header>
                    <section>
                        <div style="text-align: center; margin-bottom: 4em;">
                            <div class="month-badge" id="display-month">...</div>
                            <h1 style="font-size: 3.5em; font-weight: 300; color: #1a1a1a; letter-spacing: -2px;">O Ritmo da Terra</h1>
                            <p style="font-style: italic; color: #999;">Calendário regenerativo: <strong id="reg-name" style="color:#2e7d32">...</strong></p>
                        </div>

                        <div class="info-row">
                            <div class="info-card soil" id="soil-card" style="display:none;"><i class="fas fa-seedling" style="color: #d4a373;"></i><div><span style="font-size:0.6em;text-transform:uppercase;color:#bbb;font-weight:800;display:block;">Solo</span><span id="soil-type" style="font-weight:700;">...</span></div></div>
                            <div class="info-card lunar"><i class="fas fa-moon" style="color: #5c6bc0;"></i><div><span id="lunar-phase-name" style="font-size:0.6em;text-transform:uppercase;color:#bbb;font-weight:800;display:block;">Fase da Lua</span><span id="lunar-tip" style="font-weight:700;">A calcular...</span></div></div>
                        </div>

                        <div class="tasks-grid" id="tasks-container" style="display:none;">
                            <div class="task-card card-pomar"><h4>Pomar</h4><span class="task-main" id="task-pomar-main">--</span><p class="task-detail" id="task-pomar-detail">--</p></div>
                            <div class="task-card card-vinha"><h4>Vinha</h4><span class="task-main" id="task-vinha-main">--</span><p class="task-detail" id="task-vinha-detail">--</p></div>
                            <div class="task-card card-jardim"><h4>Jardim</h4><span class="task-main" id="task-jardim-main">--</span><p class="task-detail" id="task-jardim-detail">--</p></div>
                            <div class="task-card card-adega"><h4>Adega</h4><span class="task-main" id="task-adega-main">--</span><p class="task-detail" id="task-adega-detail">--</p></div>
                            <div class="task-card card-sementeiras"><h4>Sementeiras</h4><span class="task-main" id="task-sementeiras-main">--</span><p class="task-detail" id="task-sementeiras-detail">--</p></div>
                        </div>

                        <div id="no-gps-warning" style="text-align: center; padding: 4em; background: #f4f7fb; border-radius: 40px;"><p>Sincronize a sua localização para carregar o calendário.</p></div>

                        <footer class="page-footer">
                            <div style="display: flex; align-items: center; justify-content: flex-end; gap: 10px; opacity: 0.3;">
                                <div style="text-align: right; line-height: 1;"><span style="display: block; font-size: 0.85em; font-weight: 900; color: #333;">bioCultura</span><span style="display: block; font-size: 0.5em; font-weight: 700; text-transform: uppercase; letter-spacing: 1px;">Global Regeneration</span></div>
                                <svg width="22" height="22" viewBox="0 0 100 100"><path d="M50 5 L89 27.5 L89 72.5 L50 95 L11 72.5 L11 27.5 Z" fill="#333" /><path d="M50 20 C50 20 75 45 75 70 C75 85 65 85 50 85 C35 85 25 85 25 70 C25 45 50 20 50 20Z" fill="#fff" /></svg>
                            </div>
                        </footer>
					</section>
				</div>
            </div>
			<div id="sidebar"></div>
		</div>

		<script src="/assets/js/jquery.min.js"></script>
        <script>
            let locationsDB = [];
            const mesesMap = ["jan", "fev", "mar", "abr", "mai", "jun", "jul", "ago", "set", "out", "nov", "dez"];
            const mesesFull = ["Janeiro", "Fevereiro", "Março", "Abril", "Maio", "Junho", "Julho", "Agosto", "Setembro", "Outubro", "Novembro", "Dezembro"];
            const mesKey = mesesMap[new Date().getMonth()];
            document.getElementById('display-month').innerText = mesesFull[new Date().getMonth()];

            // 1. Base de Dados de Conteúdo
            const agroIntelligence = {
                "jul": { "pomar": "Colheita de Pêssego e Ameixa.", "pomar_detail": "Instale armadilhas para a mosca da fruta. Regue ao entardecer.", "vinha": "Poda em verde.", "vinha_detail": "Remova rebentos ladrões para concentrar energia nos cachos.", "jardim": "Stress hídrico.", "jardim_detail": "Use mulching para manter a frescura. Regue ao amanhecer.", "adega": "Higiene de cubas.", "adega_detail": "Lave o vasilhame com água quente antes da vindima.", "sementeiras": "Couves de inverno.", "sementeiras_detail": "Semear brócolos e couve-flor em local sombreado." },
                "ago": { "pomar": "Colheita de Pêra Rocha e Figos.", "pomar_detail": "Prepare a colheita da amêndoa. Rega controlada.", "vinha": "Acompanhamento maturação.", "vinha_detail": "As uvas ganham cor. Evite regas excessivas.", "jardim": "Recolha de sementes.", "jardim_detail": "Colher sementes de flores secas. Podar sebes.", "adega": "Preparação final.", "adega_detail": "Verifique prensas e desengaçadores.", "sementeiras": "Morangueiros.", "sementeiras_detail": "Plantar novos morangueiros para o próximo ano." }
            };

            function getLunarPhase() {
                const lp = 2551443; const new_moon = new Date(1970, 0, 7, 20, 35, 0);
                const phase = ((new Date().getTime() - new_moon.getTime()) / 1000) % lp;
                const res = Math.floor(phase / (24 * 3600)) + 1;
                if (res <= 7) return { name: "Quarto Crescente", tip: "Semear flores e frutos." };
                if (res <= 14) return { name: "Lua Cheia", tip: "Ideal para colher e podar." };
                if (res <= 21) return { name: "Quarto Minguante", tip: "Plantar batatas e raízes." };
                return { name: "Lua Nova", tip: "Preparar o solo." };
            }
            const moon = getLunarPhase();
            document.getElementById('lunar-phase-name').innerText = moon.name;
            document.getElementById('lunar-tip').innerText = moon.tip;

            // 2. Renderização
            function renderDashboard(info) {
                if(!info) return;
                document.getElementById('no-gps-warning').style.display = 'none';
                document.getElementById('tasks-container').style.display = 'grid';
                document.getElementById('soil-card').style.display = 'flex';
                document.getElementById('reg-name').innerText = info.titulo;
                document.getElementById('soil-type').innerText = info.biomas?.solo || "Misto";
                
                const intel = agroIntelligence[mesKey] || agroIntelligence["jul"];
                document.getElementById('task-pomar-main').innerText = intel.pomar;
                document.getElementById('task-pomar-detail').innerText = intel.pomar_detail;
                document.getElementById('task-vinha-main').innerText = intel.vinha;
                document.getElementById('task-vinha-detail').innerText = intel.vinha_detail;
                document.getElementById('task-jardim-main').innerText = intel.jardim;
                document.getElementById('task-jardim-detail').innerText = intel.jardim_detail;
                document.getElementById('task-adega-main').innerText = intel.adega;
                document.getElementById('task-adega-detail').innerText = intel.adega_detail;
                document.getElementById('task-sementeiras-main').innerText = intel.sementeiras;
                document.getElementById('task-sementeiras-detail').innerText = intel.sementeiras_detail;
            }

            async function inicializarPagina() {
                try {
                    const r = await fetch('/data/bioregioes.json');
                    locationsDB = await r.json();
                    const savedId = localStorage.getItem('biocultura_region');
                    let info = locationsDB.find(i => i.id === savedId);
                    if (info) renderDashboard(info);
                    else {
                        const nac = locationsDB.find(i => i.id === "portugal-nacional");
                        if(nac) renderDashboard(nac);
                    }
                } catch(e) { console.error(e); }
            }

            function setupSidebarLogic() {
                const input = document.getElementById('loc-search-input');
                const dropdown = document.getElementById('loc-dropdown');
                const gpsBtn = document.getElementById('btn-gps-trigger');
                if(!input) return;

                gpsBtn.onclick = () => {
                    localStorage.clear(); sessionStorage.clear();
                    location.reload();
                };

                input.addEventListener('input', function() {
                    const val = this.value.toLowerCase();
                    dropdown.innerHTML = '';
                    if(val.length < 2) { dropdown.style.display = 'none'; return; }
                    const matches = locationsDB.filter(i => i.titulo.toLowerCase().includes(val)).slice(0, 6);
                    if(matches.length > 0) {
                        dropdown.style.display = 'block';
                        matches.forEach(m => {
                            const div = document.createElement('div');
                            div.className = 'bio-res-item';
                            div.innerText = m.titulo;
                            div.onclick = () => { localStorage.setItem('biocultura_region', m.id); location.reload(); };
                            dropdown.appendChild(div);
                        });
                    } else dropdown.style.display = 'none';
                });
            }

            fetch('/sidebar-content.html').then(r => r.text()).then(html => {
                document.getElementById('sidebar').innerHTML = html;
                var s = document.createElement('script'); s.src = '/assets/js/main.js'; document.body.appendChild(s);
                inicializarPagina();
                setTimeout(setupSidebarLogic, 1000);
            });
        </script>
	</body>
</html>
