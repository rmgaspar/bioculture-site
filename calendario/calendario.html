		<title>bioCultura - Calendário Hortícola</title>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
		<link rel="stylesheet" href="../assets/css/main.css" />
		<style>
			/* 1. LIMPEZA E ESTRUTURA PARA "NO SCROLL" */
			section, #header, .major, hr, article { border: none !important; box-shadow: none !important; }
			
			#header {
                border: none !important;
                background: transparent !important;
                height: 2em !important; 
                margin: 0 !important;
                padding: 0 !important;
            }

			/* Botão do Menu (Folha Verde) */
			#header .toggle {
				background: none !important;
				top: 1.5em !important; 
				left: 1.5em !important;
                border: none !important;
                text-decoration: none !important;
                z-index: 10001;
			}
			#header .toggle:before {
				content: '\f06c' !important; 
				font-family: "Font Awesome 5 Free";
				font-weight: 900;
				color: #2e7d32 !important;
				font-size: 1.5em;
			}
            #header .toggle:after { display: none !important; }

			/* Subir o conteúdo ao máximo */
			section { padding: 1em 0 0 0 !important; }

			/* 2. GRELHA COMPACTA (4 colunas x 3 linhas) */
			.month-grid { 
                display: grid; 
                grid-template-columns: repeat(4, 1fr); 
                gap: 10px; 
                width: 100%;
                height: auto;
            }

			.month-card { 
                position: relative !important;
                background: #f4f4f4; 
                border-radius: 20px !important; 
                overflow: hidden !important; 
                text-decoration: none !important; 
                transition: transform 0.3s ease; 
                height: 26vh !important; /* Altura baseada na altura da janela */
                min-height: 150px;
                display: block !important;
                box-shadow: 0 4px 10px rgba(0,0,0,0.05) !important;
            }

			.month-card:hover { 
                transform: scale(1.02);
                box-shadow: 0 10px 20px rgba(46, 125, 50, 0.15) !important;
            }

			.month-card img { 
                width: 100%; 
                height: 100%; 
                object-fit: cover; 
                display: block;
            }

            .month-card::after {
                content: '';
                position: absolute;
                bottom: 0; left: 0; right: 0;
                height: 50%;
                background: linear-gradient(to top, rgba(0,0,0,0.5), transparent);
            }

            /* Nome do mês mais pequeno e subido */
			.month-card h3 { 
                position: absolute !important;
                bottom: 15px !important;
                left: 0;
                right: 0;
                text-align: center !important; 
                margin: 0 !important; 
                color: #ffffff !important; 
                letter-spacing: 3px !important; 
                text-transform: uppercase !important; 
                font-size: 0.75em !important; 
                font-weight: 700 !important;
                z-index: 10;
                text-shadow: 0 2px 4px rgba(0,0,0,0.4) !important;
            }

            /* Ajuste para ecrãs pequenos (Tablets) */
            @media screen and (max-width: 1280px) {
                .month-grid { grid-template-columns: repeat(3, 1fr); }
                .month-card { height: 22vh !important; }
            }

            /* Ajuste para Telemóvel (onde o scroll é inevitável) */
            @media screen and (max-width: 736px) {
                .month-grid { grid-template-columns: repeat(2, 1fr); }
                .month-card { height: 180px !important; }
                section { padding-top: 4em !important; }
            }
		</style>
	</head>
