<!DOCTYPE HTML>
<html>
<head>
    <title>bioCultura - Calendário de Regeneração</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
    <link rel="stylesheet" href="/assets/css/main.css" />
    <style>
        body, input, select, textarea { font-family: 'Source Sans Pro', sans-serif !important; color: #444; }
        section, #header, hr, .major { border: none !important; box-shadow: none !important; padding: 0 !important; }
        section { min-height: 100vh; display: flex; flex-direction: column; }
        #sidebar { position: fixed !important; top: 0; left: 0; height: 100vh !important; width: 18em !important; overflow: hidden !important; z-index: 10000; background: #fff; border-right: 1px solid #f2f2f2 !important; }
        #wrapper { padding-left: 18em !important; }
        .inner { padding: 2.2em 4em 0 4em !important; max-width: 1600px !important; margin: 0 auto; width: 100%; box-sizing: border-box; }
        
        .category-label { font-size: 0.65em; font-weight: 900; text-transform: uppercase; letter-spacing: 4px; color: #bbb; margin-bottom: 15px; display: block; }
        .hero-split { display: flex; align-items: flex-start; justify-content: space-between; gap: 4em; margin-bottom: 2em; }
        .hero-text { flex: 1.5; text-align: left; padding-top: 5px; } 
        .hero-text h1 { font-size: 4em; font-weight: 900; color: #1a1a1a; letter-spacing: -2.5px; line-height: 0.95; margin: 0 0 15px 0; }
        .reg-info-top { font-size: 0.9em; font-style: italic; color: #888; margin-bottom: 30px; display: block; }

        /* HERO GLOBE (A RODINHA) */
        .hero-visual { flex: 1; display: flex; justify-content: flex-end; }
        .hero-globe {
            position: relative; width: 480px; height: 480px;
            border-radius: 50%; overflow: hidden;
            box-shadow: 0 40px 100px rgba(0,0,0,0.05);
            background: #fdfdfd; display: flex; flex-direction: column;
            align-items: center; border: 1px solid #f2f2f2;
            padding: 50px 0;
        }

        .globe-top { margin-bottom: auto; display: flex; flex-direction: column; align-items: center; gap: 2px; z-index: 10; }
        .globe-year { font-size: 0.75em; font-weight: 900; color: #2e7d32; letter-spacing: 5px; text-transform: uppercase; }
        .globe-weekday { font-size: 0.65em; font-weight: 900; color: #bbb; text-transform: uppercase; letter-spacing: 2px; }
        .globe-day-month { font-size: 1.5em; font-weight: 900; color: #2e7d32; line-height: 1; }

        .week-stack { 
            position: absolute; top: 50%; transform: translateY(-50%);
            width: 100%; display: flex; flex-direction: column; gap: 12px; 
            mask-image: linear-gradient(to right, transparent, black 15%, black 85%, transparent); 
        }
        .week-row { display: grid; grid-template-columns: repeat(7, 1fr); text-align: center; width: 100%; }
        .day-node { font-size: 0.85em; font-weight: 600; color: #e5e5e5; display: flex; align-items: center; justify-content: center; height: 32px; }
        .day-node.current-week { color: #1a1a1a; font-weight: 700; }
        .today-num { display: inline-flex; align-items: center; justify-content: center; width: 26px; height: 26px; background: #1a1a1a; color: #fff !important; border-radius: 50%; font-size: 0.8em; font-weight: 900; }

        /* ALINHAMENTO globe-south */
        .globe-south { margin-top: auto; width: 50%; display: flex; justify-content: space-between; align-items: center; z-index: 10; }
        .south-col { display: flex; flex-direction: column; align-items: center; gap: 4px; flex: 1; }
        .v-sep { width: 1px; height: 40px; background: #eee; margin: 0 10px; }
        .meteo-icon-big { font-size: 1.8em; color: #fbc02d; line-height: 1; }
        .moon-svg-small { width: 30px; height: 30px; display: block; fill: #2e7d32; }
        .temp-range-label { font-size: 0.75em; font-weight: 800; color: #1a1a1a; }
        .moon-phase-name { font-size: 0.5em; font-weight: 900; color: #2e7d32; text-transform: uppercase; letter-spacing: 1px; text-align: center; }

        /* CONTEÚDO */
        .advice-content { font-size: 1.1em; line-height: 1.7; color: #555; text-align: left; margin-top: 20px; }
        .advice-content p { margin-bottom: 25px !important; }
        .species-list { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 20px; }
        .species-badge { display: inline-flex; align-items: center; gap: 8px; background: #fcfcfc; color: #666; padding: 5px 12px; border-radius: 50px; font-size: 0.8em; font-weight: 600; border: 1px solid #f2f2f2; cursor: pointer; transition: 0.2s; }
        .species-badge img { width: 18px; height: 18px; border-radius: 50%; object-fit: cover; }
        .btn-clean { background: none !important; border: none !important; box-shadow: none !important; color: #bbb !important; font-size: 0.7em; font-weight: 800; text-transform: uppercase; letter-spacing: 2px; cursor: pointer; padding: 10px 0; outline: none !important; }
        .data-row { display: block; padding: 3.5em 0; border-bottom: 1px solid #f2f2f2; }
        .data-row h4 { font-size: 0.75em; font-weight: 900; text-transform: uppercase; letter-spacing: 2px; color: #bbb; margin-bottom: 25px; }
        .info-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 20px; }
        .info-card-compact { background: #fdfdfd; border: 1px solid #f2f2f2; border-radius: 12px; padding: 15px; }
        .info-card-compact img { width: 100%; height: 120px; object-fit: cover; border-radius: 8px; margin-bottom: 12px; }
        .page-footer { padding: 5em 0 4em 0; text-align: right; opacity: 0.3; }
        .logo-footer { display: block; font-size: 0.85em; font-weight: 900; color: #333; }

        @media screen and (max-width: 1280px) { .hero-split { flex-direction: column-reverse; } .hero-globe { width: 350px; height: 350px; margin: 0 auto 30px auto; } }
    </style>
</head>
<body class="is-preload">
    <div id="wrapper">
        <div id="main">
            <div class="inner">
                <section>
                    <div id="calendar-main-view">
                        <div class="hero-split">
                            <div class="hero-text">
                                <span class="category-label">Agricultura bioCultura</span>
                                <h1>Calendário de Regeneração</h1>
                                <span class="reg-info-top">Orientação para: <strong id="reg-name" style="color:#444">...</strong></span>
                                
                                <div class="advice-content" id="advice-content"></div>

                                <button class="btn-clean" id="link-sugestoes" onclick="mostrarSugestoes()">+ Sugestões de plantio para esta região</button>
                                <p id="nota-solo" style="display:none; font-size: 0.75em; color: #bbb; margin-top: 15px; font-style: italic;">
                                    Nota: As sugestões acima são baseadas no tipo de solo e pH específico da sua zona.
                                </p>
                                <div id="sugestoes-container" class="species-list" style="display: none;"></div>
                            </div>

                            <div class="hero-visual">
                                <div class="hero-globe">
                                    <div class="globe-top">
                                        <span class="globe-year" id="globe-year">2026</span>
                                        <span class="globe-weekday" id="globe-weekday">...</span>
                                        <span class="globe-day-month" id="globe-day-month">...</span>
                                    </div>
                                    <div class="week-stack" id="week-stack"></div>
                                    <div class="globe-south">
                                        <div class="south-col">
                                            <div id="meteo-icon-container"><i class="fas fa-sun meteo-icon-big"></i></div>
                                            <span class="temp-range-label" id="temp-range">--º / --º</span>
                                        </div>
                                        <div class="v-sep"></div>
                                        <div class="south-col">
                                            <div id="lunar-icon-container">
                                                <svg viewBox="0 0 24 24" class="moon-svg-small"><circle cx="12" cy="12" r="10" stroke="#eee" fill="none"/></svg>
                                            </div>
                                            <span class="moon-phase-name" id="moon-phase-name">...</span>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>

                        <div class="data-row">
                            <h4>Sanidade Vegetal: Diagnóstico Bio</h4>
                            <div id="pragas-container" class="info-grid"></div>
                        </div>
                    </div>

                    <footer class="page-footer">
                        <span class="logo-footer">bioCultura</span>
                    </footer>
                </section>
            </div>
        </div>
        <div id="sidebar"></div>
    </div>

    <script src="/assets/js/jquery.min.js"></script>
    <script>
        let locationsDB = [], horticolasMaster = {}, infoGlobal = null;
        const weekdaysPT = ['Domingo','Segunda-feira','Terça-feira','Quarta-feira','Quinta-feira','Sexta-feira','Sábado'];
        const monthsPT = ['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];

        async function inicializarPagina() {
            try {
                const [rLoc, rPragas, rHorta] = await Promise.all([
                    fetch('/data/bioregioes.json').then(r => r.json()),
                    fetch('/data/pragas.json').then(r => r.json()),
                    fetch('/data/horticolas_master.json').then(r => r.json())
                ]);
                
                locationsDB = rLoc; horticolasMaster = rHorta;
                const savedId = localStorage.getItem('biocultura_region');
                infoGlobal = locationsDB.find(i => String(i.id) === String(savedId)) || locationsDB[0];
                
                if(infoGlobal) {
                    const concelhoUpper = (infoGlobal.concelho || "").toUpperCase();
                    document.getElementById('reg-name').innerText = `${infoGlobal.titulo}, ${concelhoUpper}`;
                }
                
                renderGlobe();
                renderGrid(rPragas, 'pragas-container', 4);
                setupLocationLogic();
            } catch(e) { console.error("Erro bioCultura:", e); }
        }

        function renderGlobe() {
            const stack = document.getElementById('week-stack');
            stack.innerHTML = '';
            const today = new Date();
            
            document.getElementById('globe-year').innerText = today.getFullYear();
            document.getElementById('globe-weekday').innerText = weekdaysPT[today.getDay()];
            document.getElementById('globe-day-month').innerText = `${today.getDate()} de ${monthsPT[today.getMonth()]}`;

            const monday = new Date(today);
            monday.setDate(today.getDate() - today.getDay() + (today.getDay() === 0 ? -6 : 1));

            [-1, 0, 1].forEach(w => {
                const row = document.createElement('div');
                row.className = 'week-row';
                for(let j=0; j<7; j++) {
                    const cur = new Date(monday);
                    cur.setDate(monday.getDate() + (w*7) + j);
                    const isToday = today.toDateString() === cur.toDateString();
                    const cls = `day-node ${w===0?'current-week':''}`;
                    const content = isToday ? `<span class="today-num">${cur.getDate()}</span>` : cur.getDate();
                    row.innerHTML += `<div class="${cls}">${content}</div>`;
                }
                stack.appendChild(row);
            });

            document.getElementById('temp-range').innerText = "18º / 29º";
            document.getElementById('moon-phase-name').innerText = 'Transição';
            
            updateState();
        }

        function updateState() {
            const advice = document.getElementById('advice-content');
            const solo = (infoGlobal?.biomas?.solo || "").toLowerCase();
            const ph = parseFloat(infoGlobal?.biomas?.ph_solo || "6.5");

            let soilText = "Mantenha a fertilização biológica equilibrada.";
            if (solo.includes('xistoso') || solo.includes('granítico')) soilText = "Em terrenos de rápida drenagem, reforce o mulching para preservar a humidade microbiana.";
            else if (solo.includes('argiloso')) soilText = "Evite a compactação e garanta o arejamento das raízes.";
            if (ph < 6.0) soilText += " Aplique correções orgânicas para equilibrar a acidez natural.";

            const mesAtual = new Date().toLocaleString('pt-PT', { month: 'long' }).toUpperCase();
            
            advice.innerHTML = `
                <p>${soilText}</p>
                <p>CICLO ATUAL: ${mesAtual}. Deve semear couve-galega e brócolos, e focar na colheita de tomate, pimento e beringela.</p>
                <p>CLIMA E LUA. Humidade estável: vigie o aparecimento de fungos. Sob transição, a recomendação técnica é a manutenção geral e observação atenta do ecossistema.</p>
            `;
        }

        function mostrarSugestoes() {
            const container = document.getElementById('sugestoes-container');
            const ph = parseFloat(infoGlobal?.biomas?.ph_solo || "6.5");
            let ids = ph < 6.0 ? ['batata', 'mirtilo', 'castanha', 'morango'] : 
                      ph > 7.2 ? ['azeitona', 'alfarroba', 'fava', 'grao-de-bico'] : 
                      ['tomate', 'alface', 'cenoura', 'couve-galega'];

            container.innerHTML = ids.map(id => {
                const item = horticolasMaster[id];
                if(!item || !item.imagem) return '';
                return `
                    <div class="species-badge" onclick="window.location.href='horticola-detalhe.html?id=${id}'">
                        <img src="${item.imagem}">
                        ${item.nome}
                    </div>`;
            }).join('');
            $(container).slideDown();
            document.getElementById('nota-solo').style.display = 'block';
            document.getElementById('link-sugestoes').style.display = 'none';
        }

        function renderGrid(data, containerId, limit) {
            const container = document.getElementById(containerId);
            container.innerHTML = data.slice(0, limit).map(item => `
                <div class="info-card-compact">
                    <img src="${item.imagem || '/assets/img/placeholder.jpg'}">
                    <b>${item.nome_cientifico}</b>
                    <span>${item.nome_comum}</span>
                </div>`).join('');
        }

        function setupLocationLogic() {
            $(document).on('click', '#btn-gps-trigger', function() {
                if (navigator.geolocation) {
                    navigator.geolocation.getCurrentPosition(pos => {
                        let closest = locationsDB[0], minD = Infinity;
                        locationsDB.forEach(c => {
                            if(!c.lat || c.lat === 0) return;
                            const d = Math.sqrt(Math.pow(pos.coords.latitude - c.lat, 2) + Math.pow(pos.coords.longitude - c.lon, 2));
                            if(d < minD) { minD = d; closest = c; }
                        });
                        localStorage.setItem('biocultura_region', closest.id);
                        location.reload();
                    });
                }
            });
        }

        fetch('/sidebar-content.html').then(r => r.text()).then(html => {
            document.getElementById('sidebar').innerHTML = html;
            inicializarPagina();
        });
    </script>
</body>
</html>
