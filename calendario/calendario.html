<!DOCTYPE HTML>
<html>
	<head>
		<title>bioCultura - Calendário de Regeneração</title>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
		<link rel="stylesheet" href="/assets/css/main.css" />
		<style>
            /* --- ESTRUTURA GLOBAL (PARIDADE TOTAL INDEX) --- */
            body, input, select, textarea { font-family: 'Source Sans Pro', sans-serif !important; color: #444; }
			section, #header, hr, .major { border: none !important; box-shadow: none !important; padding: 0 !important; }
            section { min-height: 100vh; display: flex; flex-direction: column; }

            #sidebar { position: fixed !important; top: 0; left: 0; height: 100vh !important; width: 18em !important; overflow: hidden !important; z-index: 10000; background: #fff; border-right: 1px solid #f2f2f2 !important; }
            #wrapper { padding-left: 18em !important; }

            .inner { padding: 2.2em 4em 0 4em !important; max-width: 1600px !important; margin: 0 auto; width: 100%; }
            .category-label { font-size: 0.65em; font-weight: 900; text-transform: uppercase; letter-spacing: 4px; color: #bbb; margin-bottom: 15px; display: block; }

            /* HERO SPLIT */
            .hero-split { display: flex; align-items: flex-start; justify-content: space-between; gap: 4em; margin-bottom: 2em; }
            .hero-text { flex: 1.5; text-align: left; padding-top: 5px; } 
            .hero-text h1 { font-size: 4em; font-weight: 900; color: #1a1a1a; letter-spacing: -2.5px; line-height: 0.95; margin: 0 0 20px 0; }
            
            /* GLOBO DE TEMPO */
            .hero-visual { flex: 1; display: flex; justify-content: flex-end; }
            .hero-globe { 
                position: relative; width: 480px; height: 480px; 
                border-radius: 50%; overflow: hidden; 
                box-shadow: 0 40px 100px rgba(0,0,0,0.05); 
                background: #fdfdfd; display: flex; flex-direction: column; align-items: center; justify-content: space-between;
                padding: 60px 0; border: 1px solid #f2f2f2;
            }

            .month-year-label { font-size: 0.8em; font-weight: 900; text-transform: uppercase; color: #bbb; letter-spacing: 3px; }

            .week-stack { 
                width: 100%; display: flex; flex-direction: column; gap: 15px; margin-top: 20px; 
                mask-image: linear-gradient(to right, transparent, black 20%, black 80%, transparent);
            }
            .week-row { display: grid; grid-template-columns: repeat(7, 1fr); text-align: center; width: 100%; }
            .day-node { font-size: 0.85em; font-weight: 600; color: #ddd; display: flex; align-items: center; justify-content: center; height: 30px; }
            .day-node.current-week { color: #1a1a1a; }
            .day-node.active { color: #2e7d32; font-weight: 900; transform: scale(1.2); }
            .day-node.weekend-red { color: #ef5350 !important; }
            .day-node svg { width: 22px; height: 22px; display: block; }

            .globe-south { width: 60%; padding-top: 25px; display: flex; align-items: center; justify-content: center; gap: 40px; }
            .meteo-icon-big { font-size: 2.8em; color: #fbc02d; }
            .moon-svg-big { width: 40px; height: 40px; }
            .v-sep { width: 1px; height: 40px; background: #eee; }

            /* ORIENTAÇÃO REGIONAL */
            .advice-block { margin-top: 20px; padding: 35px; background: #fdfdfd; border-radius: 25px; border: 1px solid #f2f2f2; border-left: 5px solid #2e7d32; min-height: 180px; }
            .advice-block h5 { font-size: 0.8em; font-weight: 900; text-transform: uppercase; color: #2e7d32; margin-bottom: 15px; }
            .advice-content { font-size: 1.15em; line-height: 1.8; color: #555; text-align: justify; }

            /* DATA ROW & GRIDS */
            .data-row { display: block; padding: 5em 0; border-bottom: 1px solid #f2f2f2; }
            .data-row h4 { font-size: 0.7em; font-weight: 900; text-transform: uppercase; letter-spacing: 2px; color: #bbb; margin: 0 0 35px 0; }

            .info-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 20px; }
            .info-card-compact { 
                background: #fdfdfd; border: 1px solid #f2f2f2; border-radius: 12px; padding: 15px; 
                cursor: pointer; transition: all 0.3s; display: block; text-decoration: none !important;
            }
            .info-card-compact:hover { transform: translateY(-5px); border-color: #2e7d32; }
            .compact-img { width: 100%; height: 120px; object-fit: cover; border-radius: 8px; margin-bottom: 12px; background: #f9f9f9; }
            .info-card-compact b { display: block; font-size: 0.95em; color: #c62828; font-style: italic; margin-bottom: 2px; }
            .info-card-compact span { display: block; font-size: 0.85em; color: #1a1a1a; font-weight: 700; margin-bottom: 8px; }
            .info-card-compact p { font-size: 0.8em; color: #777; line-height: 1.4; margin: 0; height: 2.8em; overflow: hidden; }

            /* VISTA DE DETALHE (BIO-BÍBLIA) */
            #sanity-detail-view { display: none; padding-bottom: 4em; }
            .tech-sheet { display: grid; grid-template-columns: 1.2fr 1fr; gap: 4em; }
            .btn-back { color: #bbb; font-size: 0.75em; font-weight: 800; text-transform: uppercase; cursor: pointer; display: inline-block; margin-bottom: 20px; }
            .btn-back:hover { color: #2e7d32; }
            .bio-box { background: #f1f8e9; color: #2e7d32; padding: 20px; border-radius: 15px; border-left: 4px solid #2e7d32; margin-top: 15px; }

            /* BOTÕES CLEAN */
            .btn-clean { background: none !important; border: none !important; box-shadow: none !important; color: #bbb !important; cursor: pointer; font-size: 0.7em; font-weight: 800; text-transform: uppercase; letter-spacing: 1px; padding: 15px 0; outline: none; }
            .btn-clean:hover { color: #2e7d32 !important; text-decoration: underline; }
            .hidden-item { display: none; }

            .report-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 50px; margin-top: 20px; }
            .report-item { border-top: 1px solid #f9f9f9; padding-top: 20px; }
            .report-item h5 { font-size: 0.75em; font-weight: 900; text-transform: uppercase; color: #2e7d32; margin-bottom: 12px; }
            .report-item p { font-size: 1em; line-height: 1.7; color: #555; margin-bottom: 10px; text-align: justify; }

            .page-footer { margin-top: auto; padding: 2em 0 2.5em 0; border-top: 1px solid #f2f2f2; opacity: 0.3; text-align: right; }

            @media screen and (max-width: 1280px) {
                #sidebar { position: relative !important; width: 100% !important; height: auto !important; }
                #wrapper { padding-left: 0 !important; }
                .hero-split, .tech-sheet, .report-grid, .info-grid { grid-template-columns: 1fr; }
                .hero-globe { width: 350px; height: 350px; margin: 0 auto; }
            }
		</style>
	</head>
	<body class="is-preload">
		<div id="wrapper">
			<div id="main">
                <div class="inner">
                    <section id="main-section">
                        
                        <!-- VISTA DE DETALHE -->
                        <div id="sanity-detail-view">
                            <span class="btn-back" onclick="hideDetail()">← voltar ao calendário</span>
                            <div id="detail-content"></div>
                        </div>

                        <!-- VISTA PRINCIPAL -->
                        <div id="calendar-main-view">
                            <div class="hero-split">
                                <div class="hero-text">
                                    <span class="category-label">Agricultura bioCultura</span>
                                    <h1>Calendário de Regeneração</h1>
                                    <p style="font-size: 0.9em; font-style: italic; color: #bbb; margin-bottom: 25px;">Orientação para: <strong id="reg-name" style="color:#2e7d32">...</strong></p>
                                    <div class="advice-block"><div id="advice-content" class="advice-content"></div></div>
                                </div>

                                <div class="hero-visual">
                                    <div class="hero-globe">
                                        <div class="month-year-label">Julho 2026</div>
                                        <div class="week-stack" id="week-stack"></div>
                                        <div class="globe-south">
                                            <div class="south-part"><i class="fas fa-sun meteo-icon-big"></i></div>
                                            <div class="v-sep"></div>
                                            <div class="south-part" id="lunar-icon-container"></div>
                                        </div>
                                    </div>
                                </div>
                            </div>

                            <div class="data-row">
                                <h4>Sanidade Vegetal: Diagnóstico Bio</h4>
                                <div id="pragas-container" class="info-grid"></div>
                                <button class="btn-clean" id="btn-pragas" onclick="toggleGrid('pragas')">+ ver todas as pragas</button>
                            </div>

                            <div class="data-row">
                                <h4>Flora Invasora Regional</h4>
                                <div id="flora-container" class="info-grid"></div>
                                <button class="btn-clean" id="btn-invasoras" onclick="toggleGrid('flora')">+ ver todas as invasoras</button>
                            </div>

                            <div class="data-row" style="border-bottom: none;">
                                <h4>Síntese das Autoridades 2026</h4>
                                <div id="report-grid-agri" class="report-grid"></div>
                            </div>
                        </div>

                        <footer class="page-footer">
                            <span style="display: block; font-size: 0.85em; font-weight: 900; color: #333;">bioCultura</span>
                            <span style="display: block; font-size: 0.5em; font-weight: 700; text-transform: uppercase; letter-spacing: 1px;">Global Regeneration</span>
                        </footer>
					</section>
				</div>
            </div>
			<div id="sidebar"></div>
		</div>

		<script src="/assets/js/jquery.min.js"></script>
        <script>
            let locationsDB = [], pragasDB = [], floraDB = [], infoGlobal = null;

            const moonSVGs = {
                ming: '<svg viewBox="0 0 24 24"><path fill="#bdbdbd" d="M12,2A10,10 0 0,0 12,22A10,10 0 0,0 12,2M12,4A8,8 0 0,1 12,20V4Z"/></svg>',
                new: '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10" stroke="#9e9e9e" stroke-width="2" fill="none"/></svg>',
                cres: '<svg viewBox="0 0 24 24"><path fill="#616161" d="M12,2V20A8,8 0 0,0 12,4M12,22A10,10 0 0,1 12,2A10,10 0 0,1 12,22Z"/></svg>',
                full: '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10" fill="#f9a825"/></svg>'
            };

            const lunarPhases = {
                7: { svg: moonSVGs.ming, label: 'Quarto Minguante', task: 'fase de energia radicular (ideal para controlo de pragas do solo).' },
                14: { svg: moonSVGs.new, label: 'Lua Nova', task: 'fase de repouso (foco em preparação de solo e mulching).' },
                21: { svg: moonSVGs.cres, label: 'Quarto Crescente', task: 'fase de vigor ascendente (ideal para sementeiras de folha).' },
                29: { svg: moonSVGs.full, label: 'Lua Cheia', task: 'fase de vitalidade máxima (ideal para colheita de medicinais).' }
            };

            const agriReports = [
                { t: "Diretrizes PEPAC 2026", p: "O Plano Estratégico prioriza o apoio à biodiversidade no talhão e sistemas de rega solar inteligente para mitigar o stress hídrico severo no interior.", s: "agricultura.gov.pt" },
                { t: "Vigilância Fitossanitária", p: "O INIAV alerta para focos de Xylella fastidiosa. A recomendação técnica exige a diversificação de cultivares nativas e o uso de sebes vivas como barreira biológica.", s: "iniav.pt" },
                { t: "Mercados Agroportal", p: "O consumo de produtos biológicos cresceu 18%. A agricultura de sequeiro regenerativo com mulching denso apresenta-se como a única via viável.", s: "agroportal.pt" },
                { t: "Hortas Bio PT", p: "Monitorização comunitária revela que consociações estratégicas (ex: Tomate + Manjericão) reduziram pragas em 35% sem uso de pesticidas sintéticos.", s: "hortasbiologicas.pt" }
            ];

            function renderGlobe() {
                const stack = document.getElementById('week-stack');
                stack.innerHTML = '';
                let today = new Date();
                let monday = new Date(today); monday.setDate(today.getDate() - today.getDay() + (today.getDay() === 0 ? -6 : 1));

                [-1, 0, 1].forEach(w => {
                    let row = document.createElement('div'); row.className = 'week-row';
                    for(let j=0; j<7; j++) {
                        let cur = new Date(monday); cur.setDate(monday.getDate() + (w*7) + j);
                        let isToday = today.toDateString() === cur.toDateString();
                        let moon = (cur.getMonth() === 6 && lunarPhases[cur.getDate()]) ? lunarPhases[cur.getDate()] : null;
                        row.innerHTML += `<div class="day-node ${w===0?'current-week':''} ${isToday?'active':''} ${j>=5?'weekend-red':''}">
                            ${moon ? moon.svg : cur.getDate()}
                        </div>`;
                        if (isToday) updateState(moon);
                    }
                    stack.appendChild(row);
                });
            }

            function updateState(moon) {
                const iconBox = document.getElementById('lunar-icon-container');
                const advice = document.getElementById('advice-content');
                const region = infoGlobal?.titulo || "sua região";
                const solo = infoGlobal?.biomas?.solo || "misto";
                
                iconBox.innerHTML = moon ? `<div class="moon-svg-big">${moon.svg}</div>` : moonSVGs.ming;
                advice.innerHTML = `
                    <p><b>Estratégia Regenerativa:</b> ${moon ? `Sob a influência da <b>${moon.label}</b>, ${moon.task}` : "Fase de transição lunar: manutenção geral e observação recomendada."}</p>
                    <p>Com solo regional predominantemente <b>${solo}</b>, a prioridade absoluta desta semana em <b>${region}</b> é a gestão da evapotranspiração. Aplique mulching denso para proteger a microvida do solo da radiação solar intensa.</p>
                `;
            }

            function renderGrid(data, containerId, limit = 4) {
                const container = document.getElementById(containerId);
                container.innerHTML = data.map((item, index) => `
                    <div class="info-card-compact ${index >= limit ? 'hidden-item' : ''}" onclick="showDetail('${item.nome_cientifico}', '${containerId.includes('pragas') ? 'praga' : 'flora'}')">
                        <img src="${item.imagem || item.img || '/assets/img/placeholder.jpg'}" class="compact-img">
                        <div class="info-body">
                            <b>${item.nome_cientifico}</b>
                            <span>${item.nome_comum}</span>
                            <p>${(item.sintomas || item.impacto || "").substring(0, 60)}...</p>
                        </div>
                    </div>`).join('');
            }

            function toggleGrid(type) {
                const containerId = type === 'pragas' ? 'pragas-container' : 'flora-container';
                const btnId = type === 'pragas' ? 'btn-pragas' : 'btn-invasoras';
                const container = document.getElementById(containerId);
                const hidden = container.querySelectorAll('.hidden-item');

                if (hidden.length > 0) {
                    hidden.forEach(el => el.classList.remove('hidden-item'));
                    document.getElementById(btnId).innerText = `- recolher ${type}`;
                } else {
                    renderAgriData();
                    document.getElementById(btnId).innerText = `+ ver todas as ${type}`;
                }
            }

            function showDetail(name, type) {
                const db = type === 'praga' ? pragasDB : floraDB;
                const item = db.find(i => i.nome_cientifico === name);
                const detailView = document.getElementById('sanity-detail-view');
                const mainView = document.getElementById('calendar-main-view');

                let bioHtml = '';
                if(type === 'praga') {
                    bioHtml = `
                        <div><h4 style="font-size:0.7em; color:#bbb">Solução Biológica</h4>
                        <div class="bio-box">${item.solucao_biologica.metodo}</div></div>
                        <div><h4 style="font-size:0.7em; color:#bbb; margin-top:20px">Prevenção</h4>
                        <p><b>Estratégia:</b> ${item.prevencao_biologica.estrategia}</p>
                        <p><b>Quando:</b> ${item.prevencao_biologica.quando_aplicar}</p></div>`;
                } else {
                    bioHtml = `
                        <div><h4 style="font-size:0.7em; color:#bbb">Controlo Biológico</h4>
                        <div class="bio-box">${item.solucao_biologica.metodo}</div></div>
                        <div><h4 style="font-size:0.7em; color:#bbb; margin-top:20px">Implementação</h4>
                        <p><b>Como:</b> ${item.solucao_biologica.como}</p>
                        <p><b>Impacto:</b> ${item.observatorio_impacto}</p></div>`;
                }

                document.getElementById('detail-content').innerHTML = `
                    <div class="hero-split">
                        <div class="hero-text">
                            <span class="category-label">${type === 'praga' ? 'Fitossanidade' : 'Flora Invasora'}</span>
                            <h1 style="font-style:italic">${item.nome_cientifico}</h1>
                            <h2 style="margin-top:-15px; color:#666">${item.nome_comum}</h2>
                            <div class="tech-sheet" style="margin-top:30px">
                                <div><h4 style="font-size:0.7em; color:#bbb">Diagnóstico / Impacto</h4>
                                <p>${item.sintomas || item.impacto}</p></div>
                                ${bioHtml}
                            </div>
                        </div>
                        <div class="hero-visual"><div class="hero-globe"><img src="${item.imagem || item.img || '/assets/img/placeholder.jpg'}" style="width:100%; height:100%; object-fit:cover"></div></div>
                    </div>`;
                
                mainView.style.display = 'none';
                detailView.style.display = 'block';
                window.scrollTo(0, 0);
            }

            function hideDetail() { 
                document.getElementById('calendar-main-view').style.display = 'block'; 
                document.getElementById('sanity-detail-view').style.display = 'none'; 
            }

            async function renderAgriData() {
                try {
                    const [rPragas, rFlora] = await Promise.all([
                        fetch('/data/pragas.json').then(r => r.json()),
                        fetch('/data/flora_invasora.json').then(r => r.json())
                    ]);
                    pragasDB = rPragas; floraDB = rFlora;
                    renderGrid(pragasDB, 'pragas-container', 4);
                    renderGrid(floraDB, 'flora-container', 4);
                } catch(e) { console.error(e); }
            }

            async function inicializarPagina() {
                try {
                    const rLoc = await fetch('/data/bioregioes.json');
                    locationsDB = await rLoc.json();
                    infoGlobal = locationsDB.find(i => i.id === (localStorage.getItem('biocultura_region') || "proenca-a-nova"));
                    if(infoGlobal) document.getElementById('reg-name').innerText = infoGlobal.titulo;
                    renderGlobe();
                    await renderAgriData();
                    document.getElementById('report-grid-agri').innerHTML = agriReports.map(r => `<div class="report-item"><h5>${r.t}</h5><p>${r.p}</p><span class="report-source">Fonte: ${r.s}</span></div>`).join('');
                    setupLocationLogic();
                } catch(e) { console.error(e); }
            }

            function setupLocationLogic() {
                $(document).off('input', '#loc-search-input').on('input', '#loc-search-input', function() {
                    const val = $(this).val().toLowerCase(), dropdown = $('#loc-dropdown').empty();
                    if(val.length < 2) return dropdown.hide();
                    locationsDB.filter(i => i.titulo.toLowerCase().includes(val)).slice(0,5).forEach(m => {
                        $('<div class="bio-res-item"></div>').text(m.titulo).on('click', () => { localStorage.setItem('biocultura_region', m.id); location.reload(); }).appendTo(dropdown);
                    });
                    dropdown.show();
                });
                $(document).off('click', '#btn-gps-trigger').on('click', '#btn-gps-trigger', function() {
                    navigator.geolocation.getCurrentPosition(pos => {
                        let closest = locationsDB[0], minD = Infinity;
                        locationsDB.forEach(c => {
                            let d = Math.sqrt(Math.pow(pos.coords.latitude - c.lat, 2) + Math.pow(pos.coords.longitude - c.lon, 2));
                            if(d < minD) { minD = d; closest = c; }
                        });
                        localStorage.setItem('biocultura_region', closest.id); location.reload();
                    });
                });
            }

            fetch('/sidebar-content.html').then(r => r.text()).then(html => {
                document.getElementById('sidebar').innerHTML = html;
                inicializarPagina();
            });
        </script>
	</body>
</html>
