<!DOCTYPE HTML>
<html>
<head>
    <title>bioCultura - Ficha Técnica Hortícola</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
    <link rel="stylesheet" href="/assets/css/main.css" />
    <style>
        body { font-family: 'Source Sans Pro', sans-serif; color: #444; }
        .detail-container { max-width: 1100px; margin: 4em auto; padding: 0 2em; }
        .hero-horta { display: flex; gap: 4em; align-items: start; margin-bottom: 3em; }
        .img-container { flex: 1; min-width: 400px; }
        .hero-horta img { width: 100%; height: 550px; object-fit: cover; border-radius: 24px; box-shadow: 0 20px 50px rgba(0,0,0,0.08); }
        .info-header { flex: 1.2; }
        .info-header h1 { font-size: 3.5em; font-weight: 900; margin: 0; letter-spacing: -2px; color: #1b4332; }
        .info-header h2 { font-size: 1.3em; color: #bbb; font-style: italic; margin: 10px 0 2em 0; }
        .data-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 30px; border-top: 1px solid #eee; padding-top: 2em; }
        .data-item b { display: block; font-size: 0.65em; text-transform: uppercase; letter-spacing: 2px; color: #2e7d32; margin-bottom: 8px; }
        .data-item p { font-size: 1.1em; font-weight: 600; margin: 0; }
        .sintese-box { background: #f6fff8; padding: 3em; border-radius: 24px; margin-top: 2em; }
        .sintese-box b { display: block; margin-bottom: 15px; font-size: 0.8em; text-transform: uppercase; color: #1b4332; }
        .sintese-box p { font-size: 1.15em; line-height: 1.8; text-align: justify; color: #444; }
        .btn-voltar { display: inline-block; margin-top: 3em; font-size: 0.75em; font-weight: 800; text-transform: uppercase; color: #bbb; text-decoration: none; letter-spacing: 2px; }
        @media screen and (max-width: 980px) { .hero-horta { flex-direction: column; } .img-container { min-width: 100%; } }
    </style>
</head>
<body>
    <div class="detail-container">
        <div id="render-horta"><p>A carregar ficha técnica...</p></div>
        <a href="javascript:history.back()" class="btn-voltar">← Voltar</a>
    </div>
    <script>
        async function carregar() {
            const id = new URLSearchParams(window.location.search).get('id');
            const res = await fetch('/data/horticolas_master.json?v=' + Date.now());
            const master = await res.json();
            const item = master[id];
            if(!item) return;

            document.getElementById('render-horta').innerHTML = `
                <div class="hero-horta">
                    <div class="img-container"><img src="${item.imagem}"></div>
                    <div class="info-header">
                        <h1>${item.nome}</h1>
                        <h2>${item.nome_cientifico}</h2>
                        <div class="data-grid">
                            <div class="data-item"><b>Categoria</b><p>${item.grupo}</p></div>
                            <div class="data-item"><b>Terreno Ideal</b><p>Rico em matéria orgânica</p></div>
                            <div class="data-item"><b>Irrigação</b><p>Regular / Gota-a-gota</p></div>
                            <div class="data-item"><b>Fonte</b><p>${item.fonte}</p></div>
                        </div>
                    </div>
                </div>
                <div class="sintese-box">
                    <b>Notas de Cultivo e Ecologia</b>
                    <p>${item.sintese}</p>
                </div>
            `;
            document.title = item.nome + " - bioCultura";
        }
        carregar();
    </script>
</body>
</html>
