<!DOCTYPE HTML>
<html>
<head>
    <title>bioCultura - Ficha Técnica Hortícola</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
    <link rel="stylesheet" href="/assets/css/main.css" />
    <style>
        body, input, select, textarea { font-family: 'Source Sans Pro', sans-serif !important; color: #444; }
        .detail-container { max-width: 1100px; margin: 4em auto; padding: 0 2em; }
        
        .hero-horta { display: flex; gap: 4em; align-items: start; margin-bottom: 3em; }
        .img-container { flex: 1; min-width: 400px; }
        .hero-horta img { 
            width: 100%; height: 550px; object-fit: cover; 
            border-radius: 24px; box-shadow: 0 20px 50px rgba(0,0,0,0.08); 
        }
        
        /* Alinhamento da coluna de texto com a altura da imagem */
        .info-header { 
            flex: 1.2; 
            display: flex; 
            flex-direction: column; 
            height: 550px; /* Mesma altura da imagem */
            justify-content: flex-start;
        }
        
        .info-header h1 { font-size: 3.5em; font-weight: 900; margin: 0; letter-spacing: -2px; color: #1b4332; line-height: 1; }
        .info-header h2 { font-size: 1.3em; color: #bbb; font-style: italic; margin: 10px 0 2em 0; font-weight: 400; }
        
        .data-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 30px; border-top: 1px solid #f2f2f2; padding-top: 2em; }
        .data-item b { display: block; font-size: 0.65em; text-transform: uppercase; letter-spacing: 2px; color: #2e7d32; margin-bottom: 8px; }
        .data-item p { font-size: 1.1em; color: #444; margin: 0; font-weight: 600; }

        /* Link Voltar alinhado à base da foto */
        .btn-voltar-base { 
            margin-top: auto; 
            display: inline-block; 
            font-size: 0.75em; 
            font-weight: 800; 
            text-transform: uppercase; 
            letter-spacing: 2px; 
            text-decoration: none; 
            color: #bbb !important; 
            transition: 0.3s; 
        }
        .btn-voltar-base:hover { color: #1b4332 !important; }

        .sintese-box { background: #f6fff8; padding: 3em; border-radius: 24px; margin-top: 2em; }
        .sintese-box b { display: block; margin-bottom: 15px; font-size: 0.8em; text-transform: uppercase; color: #1b4332; letter-spacing: 1px; }
        .sintese-box p { font-size: 1.15em; line-height: 1.8; text-align: justify; color: #444; margin: 0; }
        
        .source-footer { font-size: 0.65em; color: #bbb !important; text-transform: uppercase; margin-top: 4em; display: block; letter-spacing: 1px; }

        @media screen and (max-width: 980px) {
            .hero-horta { flex-direction: column; }
            .img-container { min-width: 100%; }
            .hero-horta img { height: 400px; }
            .info-header { height: auto; }
            .btn-voltar-base { margin-top: 2em; }
        }

        .page-footer { padding: 5em 0 4em 0; text-align: right; opacity: 0.4; border-top: 1px solid #f2f2f2; margin-top: 4em; }
        .logo-footer { display: block; font-size: 0.85em; font-weight: 900; color: #333; text-transform: uppercase; letter-spacing: 1px; }
        .sublogo-footer { display: block; font-size: 0.5em; font-weight: 700; text-transform: uppercase; letter-spacing: 1px; color: #bbb; }

    </style>
</head>
<body>
    <div class="detail-container">
        <div id="render-horta">
            <p style="color:#bbb; font-style:italic;">A carregar ficha técnica...</p>
        </div>
    </div>

    <footer class="page-footer">
        <span class="logo-footer">bioCultura</span>
        <span class="sublogo-footer">Global Regeneration</span>
    </footer>

    <script>
        async function carregar() {
            const id = new URLSearchParams(window.location.search).get('id');
            if (!id) { window.location.href = 'calendario.html'; return; }

            try {
                const res = await fetch('/data/horticolas_master.json?v=' + Date.now());
                const master = await res.json();
                const item = master[id];

                if(!item) {
                    document.getElementById('render-horta').innerHTML = "<p>Produto não encontrado.</p>";
                    return;
                }

                document.getElementById('render-horta').innerHTML = `
                    <div class="hero-horta">
                        <div class="img-container">
                            <img src="${item.imagem}" alt="${item.nome}">
                        </div>
                        <div class="info-header">
                            <div>
                                <h1>${item.nome}</h1>
                                <h2><i>${item.nome_cientifico || ''}</i></h2>
                                <div class="data-grid">
                                    <div class="data-item"><b>Categoria</b><p>${item.grupo}</p></div>
                                    <div class="data-item"><b>Terreno Ideal</b><p>Rico em matéria orgânica</p></div>
                                    <div class="data-item"><b>Irrigação</b><p>Regular / Gota-a-gota</p></div>
                                    <div class="data-item"><b>Fonte</b><p>${item.fonte || 'Wikipedia'}</p></div>
                                </div>
                            </div>
                            <a href="javascript:history.back()" class="btn-voltar-base">← VOLTAR</a>
                        </div>
                    </div>
                    <div class="sintese-box">
                        <b>Notas de Cultivo e Ecologia</b>
                        <p>${item.sintese}</p>
                    </div>
                    <span class="source-footer">FONTE: BIOCULTURA / WIKIPEDIA</span>
                `;
                document.title = item.nome + " - bioCultura";
            } catch (e) {
                console.error("Erro ao carregar detalhe:", e);
            }
        }
        carregar();
    </script>
</body>
</html>
