<!DOCTYPE HTML>
<html>
	<head>
		<title>bioCultura - Contacto e Consultoria</title>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
		<link rel="stylesheet" href="/assets/css/main.css" />
		<style>
            /* --- ESTRUTURA GLOBAL & TIPOGRAFIA --- */
            body, input, select, textarea { font-family: 'Source Sans Pro', sans-serif !important; color: #444; }
			section, #header, hr, .major { border: none !important; box-shadow: none !important; padding: 0 !important; }
            section { padding-top: 4em !important; min-height: 100vh; display: flex; flex-direction: column; }

            /* SIDEBAR FIXA */
            #sidebar { position: fixed !important; top: 0; left: 0; height: 100vh !important; width: 18em !important; overflow: hidden !important; z-index: 10000; background: #fff; border-right: 1px solid #f2f2f2 !important; }
            #sidebar > .inner { height: 100% !important; overflow: hidden !important; display: flex; flex-direction: column; }
            #wrapper { padding-left: 18em !important; }

            /* CABEÇALHOS CINZENTOS */
            .category-label { font-size: 0.65em; font-weight: 900; text-transform: uppercase; letter-spacing: 3px; color: #bbb; margin-bottom: 10px; display: block; text-align: center; }

            /* CONTENT */
            .contact-wrap { max-width: 700px; margin: 0 auto 5em auto; width: 100%; }
            .contact-intro { text-align: center; margin-bottom: 4em; }
            .contact-intro h1 { font-size: 3.5em; font-weight: 300; color: #1a1a1a; letter-spacing: -2px; margin: 0; }
            .contact-intro p { font-size: 1.1em; color: #999; font-style: italic; margin-top: 10px; }

            /* FORMULÁRIO CLEAN */
            .field-group { margin-bottom: 2em; }
            .field-group label { font-size: 0.65em; font-weight: 900; text-transform: uppercase; letter-spacing: 2px; color: #bbb; margin-bottom: 10px; display: block; }
            
            input[type="text"], input[type="email"], select, textarea {
                background: #f9fbf9 !important;
                border: 1px solid #f0f0f0 !important;
                border-radius: 12px !important;
                padding: 15px !important;
                width: 100%;
                outline: none !important;
                box-shadow: none !important;
                transition: all 0.3s ease;
            }
            input:focus, textarea:focus { border-color: #2e7d32 !important; background: #fff !important; }

            .btn-submit {
                background: #555 !important;
                color: #fff !important;
                border: none !important;
                border-radius: 12px !important;
                padding: 15px 40px !important;
                font-weight: 700 !important;
                text-transform: uppercase !important;
                letter-spacing: 1px !important;
                cursor: pointer;
                width: 100%;
                transition: background 0.3s ease;
            }
            .btn-submit:hover { background: #1b5e20 !important; }

            .page-footer { margin-top: auto; padding: 4em 0 2em 0; border-top: 1px solid #f2f2f2; }

            @media screen and (max-width: 1280px) {
                #sidebar { position: relative !important; width: 100% !important; height: auto !important; overflow: visible !important; }
                #wrapper { padding-left: 0 !important; }
                .contact-intro h1 { font-size: 2.5em; }
            }
		</style>
        <!-- Google tag (gtag.js) -->
        <script async src="https://www.googletagmanager.com/gtag/js?id=G-6PV0FD8PXC"></script>
        <script>
            window.dataLayer = window.dataLayer || [];
            function gtag(){dataLayer.push(arguments);}
            gtag('js', new Date());
            gtag('config', 'G-6PV0FD8PXC');
        </script>
	</head>
	<body class="is-preload">
		<div id="wrapper">
			<div id="main">
                <div class="inner">
					<header id="header" style="height: 0; margin: 0; padding: 0; overflow: hidden;"></header>
                    <section>
                        <div class="contact-wrap">
                            <div class="contact-intro">
                                <span class="category-label">Comunicação Direta</span>
                                <h1>Fale connosco.</h1>
                                <p>Esclareça dúvidas sobre o seu território ou solicite um estudo de viabilidade personalizado.</p>
                            </div>

                            <!-- Substitui MQKVJYQZ pelo teu ID do Formspree -->
                            <form action="https://formspree.io/f/MQKVJYQZ" method="POST">
                                <div class="field-group">
                                    <label>Nome Completo</label>
                                    <input type="text" name="name" placeholder="Como o devemos tratar?" required>
                                </div>
                                <div class="field-group">
                                    <label>Endereço de Email</label>
                                    <input type="email" name="_replyto" placeholder="exemplo@email.com" required>
                                </div>
                                <div class="field-group">
                                    <label>Assunto</label>
                                    <select name="subject">
                                        <option value="duvida_tecnica">Dúvida Técnica (Solo/Água/Ar)</option>
                                        <option value="estudo_viabilidade">Solicitar Estudo de Viabilidade</option>
                                        <option value="alerta_ambiental">Denúncia / Alerta Ambiental</option>
                                        <option value="app_feedback">Sugestão para a App bioCultura</option>
                                    </select>
                                </div>
                                <div class="field-group">
                                    <label>Mensagem</label>
                                    <textarea name="message" rows="6" placeholder="Descreva o seu projeto ou dúvida..." required></textarea>
                                </div>
                                <button type="submit" class="btn-submit">Enviar Mensagem</button>
                            </form>
                        </div>

                        <footer class="page-footer">
                            <div style="display: flex; align-items: center; justify-content: flex-end; gap: 10px; opacity: 0.3;">
                                <div style="text-align: right; line-height: 1;">
                                    <span style="display: block; font-size: 0.85em; font-weight: 900; color: #333;">bioCultura</span>
                                    <span style="display: block; font-size: 0.5em; font-weight: 700; text-transform: uppercase; letter-spacing: 1px;">Global Regeneration</span>
                                </div>
                                <svg width="22" height="22" viewBox="0 0 100 100">
                                    <path d="M50 5 L89 27.5 L89 72.5 L50 95 L11 72.5 L11 27.5 Z" fill="#333" />
                                    <path d="M50 20 C50 20 75 45 75 70 C75 85 65 85 50 85 C35 85 25 85 25 70 C25 45 50 20 50 20Z" fill="#fff" />
                                </svg>
                            </div>
                        </footer>
					</section>
				</div>
            </div>
			<div id="sidebar"></div>
		</div>

		<script src="/assets/js/jquery.min.js"></script>
        <script>
            // Lógica para carregar a sidebar e sincronizar a pesquisa
            fetch('/sidebar-content.html').then(r => r.text()).then(html => {
                document.getElementById('sidebar').innerHTML = html;
                var s = document.createElement('script'); s.src = '/assets/js/main.js'; document.body.appendChild(s);
                
                // Preencher o input da sidebar se houver localidade
                setTimeout(() => {
                    const savedId = localStorage.getItem('biocultura_region');
                    const input = document.getElementById('loc-search-input');
                    if(savedId && input) {
                        fetch('/data/bioregioes.json').then(r => r.json()).then(data => {
                            const info = data.find(i => i.id === savedId);
                            if(info) input.value = info.titulo;
                        });
                    }
                }, 1000);
            });
         // 1. Tracking de cliques em links e botões
            $(document).on('click', 'a, button', function() {
                const label = $(this).text().trim() || $(this).attr('id') || 'unnamed';
                const destination = $(this).attr('href') || 'action';
                if (typeof gtag === 'function') {
                    gtag('event', 'click', {
                        'event_category': 'engagement',
                        'event_label': label,
                        'value': destination
                    });
                }
            });

            // 2. Função para tracking de mudança de localidade
            function trackRegionChange(regionId) {
                if (typeof gtag === 'function') {
                    gtag('event', 'region_change', {
                        'event_category': 'localization',
                        'event_label': regionId
                    });
                }
            }      
        </script>
	</body>
</html>
