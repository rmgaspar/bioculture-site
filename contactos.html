<!DOCTYPE HTML>
<html>
	<head>
		<title>bioCultura - Contacto e Consultoria</title>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
		<link rel="stylesheet" href="/assets/css/main.css" />
		<style>
			section, #header { border: none !important; box-shadow: none !important; padding: 0 !important; }
            section { padding-top: 6em !important; max-width: 800px; margin: 0 auto; }
            
            .contact-container { background: #fff; padding: 3em; border-radius: 40px; border: 1px solid #f0f7f0; box-shadow: 0 20px 50px rgba(0,0,0,0.03); }
            .contact-container h1 { font-size: 3em; color: #1b5e20; font-weight: 300; margin-bottom: 0.5em; text-align: center; }
            .contact-container p { text-align: center; color: #666; margin-bottom: 3em; }

            form .field { margin-bottom: 1.5em; }
            form label { color: #2e7d32; font-weight: 800; font-size: 0.7em; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 10px; display: block; }
            form input, form textarea, form select { background: #f9fbf9; border: 1px solid #e0eadd; border-radius: 15px; padding: 15px; width: 100%; color: #444; }
            form input:focus, form textarea:focus { border-color: #2e7d32; outline: none; background: #fff; }

            .btn-send { background: #2e7d32; color: #fff !important; border: none; border-radius: 50px; padding: 0 40px; height: 3.5em; line-height: 3.5em; font-weight: 800; cursor: pointer; width: 100%; transition: background 0.3s ease; }
            .btn-send:hover { background: #1b5e20; }
		</style>
	</head>
	<body class="is-preload">
		<div id="wrapper">
			<div id="main"><div class="inner">
                <header id="header" style="height: 0; margin: 0; padding: 0; overflow: hidden;"></header>
                <section>
                    <div class="contact-container">
                        <h1>Fale connosco.</h1>
                        <p>Dúvidas sobre o seu território ou interesse em projetos premium? Envie-nos uma mensagem.</p>
                        
                        <!-- Substitui o ID "G-XXXXX" pelo teu ID do Formspree após te registares lá -->
                        <form action="https://formspree.io/f/SEU_ID_AQUI" method="POST">
                            <div class="field">
                                <label>Nome</label>
                                <input type="text" name="name" placeholder="O seu nome" required>
                            </div>
                            <div class="field">
                                <label>Email</label>
                                <input type="email" name="_replyto" placeholder="exemplo@email.com" required>
                            </div>
                            <div class="field">
                                <label>Assunto / Interesse</label>
                                <select name="subject">
                                    <option value="duvida_geral">Dúvida Geral</option>
                                    <option value="projeto_biofossa">Projeto Biofossa</option>
                                    <option value="projeto_agua">Aproveitamento de Água</option>
                                    <option value="projeto_solar">Energia Solar Ética</option>
                                    <option value="alerta_mineracao">Denúncia de Mineração</option>
                                </select>
                            </div>
                            <div class="field">
                                <label>Mensagem</label>
                                <textarea name="message" rows="5" placeholder="Como podemos ajudar?" required></textarea>
                            </div>
                            <button type="submit" class="btn-send">Enviar Mensagem</button>
                        </form>
                    </div>
                </section>
            </div></div>
            <div id="sidebar"></div>
		</div>
		<script src="/assets/js/jquery.min.js"></script>
        <script>
            fetch('/sidebar-content.html').then(r => r.text()).then(html => {
                document.getElementById('sidebar').innerHTML = html;
                var s = document.createElement('script'); s.src = '/assets/js/main.js'; document.body.appendChild(s);
            });
        </script>
	</body>
</html>
